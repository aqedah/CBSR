<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2027·2028 시험 날</title><meta name="robots" content="noindex"><style>.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.two{grid-template-columns:1fr}}.pv{border-top:1px dashed #e3dccf;padding-top:8px}.pv.ok{background:#f3faf5}h3{font-size:15px;margin:4px 0}h3 small{font-weight:400;color:#8a6d3b}dl{font-size:13.5px;margin:6px 0}dt{font-weight:700;color:#5a3d12;margin-top:4px}dd{margin:0 0 0 8px}body{font:15px/1.6 system-ui,sans-serif;margin:0 auto;max-width:760px;padding:16px;background:#f7f4ee;color:#222}h1{font-size:22px}section{background:#fff;border:1px solid #e3dccf;border-radius:12px;padding:14px 16px;margin:12px 0}section.ok{border-color:#2e7d4f;background:#f3faf5}h2{font-size:17px;margin:0 0 6px}h2 small{font-weight:400;color:#8a6d3b;margin-left:6px}.sp{font-weight:700;color:#5a3d12;margin:4px 0 8px}ol{margin:0;padding-left:22px}li{margin:2px 0;font-size:14px}li b{color:#8a6d3b;font-weight:600;margin-right:4px}.kq{font-size:14px;color:#555}.act{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}.act a{padding:7px 10px}.act button{padding:7px 14px;border-radius:8px;border:1px solid #2e7d4f;background:#fff;color:#2e7d4f;font-weight:700}.pv.ok .act button{background:#2e7d4f;color:#fff}textarea{flex:1;min-width:220px;min-height:38px;border:1px solid #ddd;border-radius:8px;padding:6px}#bar{position:sticky;top:0;background:#f7f4ee;padding:8px 0;display:flex;gap:8px;align-items:center}#bar button{padding:8px 12px;border-radius:8px;border:0;background:#5a3d12;color:#fff;font-weight:700}</style></head><body><h1>2027판·2028판 시험 날</h1><p>같은 본문을 2027년(1년차)과 2028년(2년차)에 서로 다른 이야기와 QT로 읽게 하는 시험입니다. 날마다 두 판을 나란히 보고, '카드로 보기'로 실제 화면을 엽니다. 카드 위쪽 ✎를 누르면 읽던 그 카드에 바로 메모를 남깁니다. 카드를 다 넘긴 뒤 'QT로 이어가기'를 누르면 같은 관점의 QT가 이어집니다.</p><div id="bar"><span id="cnt"></span><span id="cnt2"></span><button id="cp">메모 복사</button></div><script>const K="cbsr-review",S=(()=>{try{return JSON.parse(localStorage.getItem(K)||"{}")}catch(e){return{}}})(),sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const cnt=()=>{const n=document.querySelectorAll(".pv").length,o=document.querySelectorAll(".pv.ok").length;document.getElementById("cnt").textContent="승인 "+o+" / "+n;};
document.querySelectorAll(".pv").forEach(s=>{const d=s.dataset.id,r=S[d]||{},t=s.querySelector("textarea"),b=s.querySelector("[data-ok]");t.value=r.n||"";if(r.ok)s.classList.add("ok");
b.onclick=()=>{r.ok=!r.ok;S[d]=r;s.classList.toggle("ok",r.ok);sv();cnt();};t.oninput=()=>{r.n=t.value;S[d]=r;sv();};});
const CF=()=>{try{const o=JSON.parse(localStorage.getItem("v2:cbsr-cardfb")||"{}");return Object.keys(o).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).map(k=>{const r=o[k],m=k.match(/^(rj:)?(\d+)([AB]?)#(.+)$/);if(!m)return"";const n=+m[2];return (m[1]?"리딩지저스 "+(Math.floor((n-1)/7)+1)+"주차 "+((n-1)%7+1)+"일째":"365 "+n+"일"+(m[3]==="A"?" 2027판":m[3]==="B"?" 2028판":""))+" · "+(m[4]==="qt"?"QT":(+m[4]+1)+"번째 카드")+(r.lab?" ("+r.lab+")":"")+": "+r.n}).filter(Boolean)}catch(e){return[]}};
document.getElementById("cnt2").textContent="카드 메모 "+CF().length+"개";
document.getElementById("cp").onclick=()=>{const L0=CF();const L=Object.entries(S).filter(([d,r])=>r.ok||r.n).map(([d,r])=>d.replace(/A:/,"일 2027판 ").replace(/B:/,"일 2028판 ").replace(/^(\d+):/,"$1일 ")+": "+(r.ok?"승인":"수정")+(r.n?" — "+r.n:"")).join("\n");const ALL=[L,L0.join("\n")].filter(Boolean).join("\n");navigator.clipboard.writeText(ALL||"(메모 없음)").then(()=>alert("복사했습니다. 대화에 붙여 넣어 주세요."));};cnt();</script></body></html>
