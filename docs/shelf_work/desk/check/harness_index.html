<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>body{margin:0;background:#eee;height:2000px}</style></head><body><button id="go">열기</button><script src="shelf.js"></script><script>
const OVS=[];let OVskip=0;const ovPush=()=>history.pushState({n:OVS.length},"");
function ovOpen(f){if(OVS.includes(f))return;OVS.push(f);ovPush();}
function ovDone(f){const i=OVS.lastIndexOf(f);if(i<0)return;OVS.splice(i,1);OVskip++;history.back();}
addEventListener("popstate",()=>{if(OVskip>0){OVskip--;return;}const f=OVS.pop();if(f)f(true);});
function shelfClose(pop){if(CBSR_SHELF.isOpen())CBSR_SHELF.close(true);if(pop!==true)ovDone(shelfClose);}
function shelfOpen(o){const ok=CBSR_SHELF.open({book:o&&o.book,today:+(new URLSearchParams(location.search).get("today")||0),todays:(new URLSearchParams(location.search).get("todays")||"").split(",").filter(Boolean).map(Number),prog:(function(q){ var L=function(k){ return (q.get(k)||"").split(",").filter(Boolean).map(Number); }; return {acts:L("acts"),fin:L("fin"),ot:q.get("ot")==="1",nb:+(q.get("nb")||0),today:q.get("td")||"2027-03-01"}; })(new URLSearchParams(location.search)),nick:new URLSearchParams(location.search).get("nick")||"",scene:o&&o.scene,solo:o&&o.solo,mix:o&&o.mix,back:o&&o.back,plan:{get:M=>{ const months=["2026-9","2026-10","2026-11"]; if(!months.includes(M)) M="2026-10"; const [Y,Mo]=M.split("-").map(Number), nd=new Date(Y,Mo+1,0).getDate(), days=[]; let n=0,r=0; for(let dd=1;dd<=nd;dd++){ const st=Mo<10?"on":Mo>10?"fut":dd<20?"on":dd<24?"miss":dd===24?"me":"fut"; if(Mo===11&&dd>25){ days.push(null); continue; } n++; if(st==="on") r++; days.push({w:40+Math.floor(dd/7),d:dd%7,st,me:st==="me",lab:dd%3?"롬"+dd+"–"+(dd+2):"고전"+dd+"–"+(dd+3),full:"로마서 "+dd+"장"}); } return {M,Y,Mo,mi:months.indexOf(M),months,lead:new Date(Y,Mo,1).getDay(),nd,days,n,r,nowK:"2026-10",hasNow:true}; },go:(w,d)=>{ window.__log.push("go:"+w+"-"+d); CBSR_SHELF.close(true,true); ovDone(shelfClose); }},card:{year:2027,had:()=>!!window.__had,show:()=>{window.__log.push("show");CBSR_SHELF.close(true);ovDone(shelfClose);},pick:()=>({r:"43-3-16",c:"사랑"}),reveal:(v,ret)=>{window.__log.push("reveal:"+v.r+":"+ret);CBSR_SHELF.close(true);ovDone(shelfClose);}},push:ovOpen,done:ovDone,toast:t=>console.log("TOAST",t),onClose:()=>ovDone(shelfClose)});if(ok)ovOpen(shelfClose);}
document.getElementById("go").onclick=()=>shelfOpen();window.__ovs=()=>OVS.length;window.__log=[];window.shelfOpen=shelfOpen;
</script></body></html>
