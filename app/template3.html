<title>이야기 통독 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 휴대폰 한 손 통독. 요약 → 어려운 말 → 지도 → 본문(접힘) → 한 문제씩 넘기는 퀴즈 순서로 짧게 흐른다 */
:root{
  --paper:#F3F5F1; --card:#FFFFFF; --ink:#1B2420; --muted:#5B6862; --line:#D9E0DA;
  --accent:#2C5C52; --accent-ink:#FFFFFF; --accent-soft:#E2ECE7;
  --gold:#9A6417; --gold-soft:#F5E9D2; --ok:#2F7A4F; --ok-soft:#E1F1E7; --bad:#A4412F; --bad-soft:#F7E4DF;
  --sea:#DCE8EE; --land:#F7F4EC; --coast:#B9C6C0; --water:#6E9DB5;
  --f-text:"Gowun Batang","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --bible-size:17px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111714; --card:#18201C; --ink:#E4EAE6; --muted:#97A49D; --line:#2A3430;
  --accent:#8FC4B5; --accent-ink:#0E1513; --accent-soft:#1C2A26;
  --gold:#E2B562; --gold-soft:#2C2416; --ok:#7FCB9C; --ok-soft:#18291F; --bad:#E58C78; --bad-soft:#2E1C18;
  --sea:#14222A; --land:#1F2723; --coast:#3A4842; --water:#5E8FA8; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111714; --card:#18201C; --ink:#E4EAE6; --muted:#97A49D; --line:#2A3430;
  --accent:#8FC4B5; --accent-ink:#0E1513; --accent-soft:#1C2A26;
  --gold:#E2B562; --gold-soft:#2C2416; --ok:#7FCB9C; --ok-soft:#18291F; --bad:#E58C78; --bad-soft:#2E1C18;
  --sea:#14222A; --land:#1F2723; --coast:#3A4842; --water:#5E8FA8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 40px}
.wrap{max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible,.g:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-text);text-wrap:balance;margin:0}

.top{padding-block:24px 8px;display:grid;gap:4px}
.brand{font-size:12px;letter-spacing:.12em;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.date{font-family:var(--f-text);font-size:27px;font-weight:700;line-height:1.3}
.where{color:var(--muted);font-size:15px}
.where b{color:var(--accent);font-weight:600}
.notice{background:var(--gold-soft);border-radius:8px;padding:9px 12px;font-size:14px;margin-top:6px}
.weeknav{display:flex;align-items:center;gap:8px;margin-top:12px}
.weeknav .wk{flex:1;min-width:0;font-weight:600;font-size:15px}
.weeknav .wk small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;min-width:40px;height:40px;padding:0 10px}
.iconbtn:disabled{opacity:.4}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:10px}
.day{border:0;background:none;border-radius:12px;padding:8px 2px 9px;color:inherit;font:inherit;text-align:center;display:grid;gap:0;position:relative}
.day .dn{font-size:12px;color:var(--muted)}
.day .dd{font-size:17px;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums}
.day .ds{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:16px}
.day.today:not(.sel) .dd{color:var(--accent);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.day.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day.sel .dn,.day.sel .ds{color:var(--accent-ink);opacity:.9}
.day.done .ds{color:var(--ok);font-weight:600}
.day.sel.done .ds{color:var(--accent-ink)}
.tabs{display:flex;gap:4px;margin-top:16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{display:grid;gap:22px;padding-top:18px}
.sec{display:grid;gap:10px}
.label{font-size:12px;letter-spacing:.1em;color:var(--accent);font-weight:600}
.sec h2{font-size:22px}
.lead{color:var(--muted);font-size:14px;margin:0}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.step.on{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:600}
.summary{font-family:var(--f-text);font-size:17px;line-height:1.85;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--card)}
button.chip:hover{border-color:var(--accent)}
.chip.term{border-style:dashed;border-color:var(--gold);color:var(--ink)}
.chip small{color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.g{border-bottom:1.5px dotted var(--gold);cursor:pointer}
.g:hover{background:var(--gold-soft)}

/* map */
.mapbox{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#lmap{height:min(62vh,440px);background:#A8C6D6}
.mapbox .cap{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.mlbl{font-family:var(--f-ui);font-size:13px;font-weight:700;color:#1B2420;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff;cursor:pointer;transform:translate(8px,-9px);display:inline-block}
.mlbl.reg{font-weight:500;font-style:italic;letter-spacing:.06em;color:#4b4033;transform:translate(-50%,-50%)}
.mlbl.wat{font-weight:500;font-style:italic;color:#2f6582;font-size:12px;transform:translate(-50%,-50%);cursor:default}
.leaflet-container{font-family:var(--f-ui)}
.leaflet-div-icon{background:none;border:0}
.prog{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.prog .bar{height:10px;background:var(--line);border-radius:99px;position:relative}
.prog .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.prog .bar u{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--gold);border-radius:2px}
.prog .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.prog .top b{font-family:var(--f-text);font-size:24px;font-variant-numeric:tabular-nums}
.done-card{background:var(--ok-soft);border-radius:14px;padding:16px;display:grid;gap:8px;text-align:center}
.done-card b{font-family:var(--f-text);font-size:34px;color:var(--ok);font-variant-numeric:tabular-nums}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.qcard .k{font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.06em}
.qcard p{margin:0}
.clue{font-size:13.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.stage{display:flex;align-items:center;gap:8px;margin:6px 0 2px}.stage b{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;flex:none}.stage span{font-weight:700;font-size:17px}.stage small{color:var(--muted);font-size:13px}
.trait{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.trait b{color:var(--accent)}
.trait q{font-family:var(--f-text);quotes:none}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:64px;resize:vertical}
.keyv{font-family:var(--f-text);background:var(--gold-soft);border-radius:10px;padding:12px 14px;font-size:16.5px;line-height:1.8}
.keyv small{display:block;font-family:var(--f-ui);font-size:12px;color:var(--gold);font-weight:600}
.prayer{font-family:var(--f-text);font-size:16px;line-height:1.85;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0}
.pmini{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);cursor:pointer}
.pmini b{color:var(--accent);font-variant-numeric:tabular-nums}
.pmini .bar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.pmini .bar i{display:block;height:100%;background:var(--accent)}
.pmini .more{font-size:12px}
.kw{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:12px}
.kw-title{font-size:13px;font-weight:600;color:var(--muted)}
.kwrow{display:grid;gap:6px}
.kwrow p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
.kwrow p b{color:var(--accent);margin-right:6px}
.chip.lw{border-color:var(--accent);color:var(--accent);font-weight:600}
.chip.em{border-color:var(--bad);color:var(--bad)}
.rleg{display:flex;flex-wrap:wrap;gap:4px 12px}
.rleg span{display:inline-flex;align-items:center;gap:5px}
.rleg i{display:inline-block;width:20px;border-top:3px dashed}
.rarrow{display:inline-block;width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:10px solid;transform-origin:50% 50%}
.mlbl.rte{font-size:11.5px;font-weight:600;color:#3a2c4a}
.chip.inc{border-color:var(--gold);color:var(--gold);font-weight:600}
.sheet .vq{font-family:var(--f-text);background:var(--paper);border-radius:8px;padding:10px 12px}
.sheet .vq b{font-family:var(--f-ui);font-size:12px;color:var(--gold)}
.chip.nm{border-color:var(--accent);border-style:dotted}
.g.nm{border-bottom-color:var(--accent)}
.chip.cl{border-color:#7A5AA8;color:#6a4a98}
.arc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.arc>b{font-family:var(--f-text);font-size:19px}
.arcflow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14.5px}
.arcflow span{background:var(--accent-soft);border-radius:8px;padding:6px 10px;flex:1 1 140px;min-width:0}
.arcflow i{font-style:normal;color:var(--accent);font-weight:700}
.arc .vq{font-family:var(--f-text);background:var(--paper);border-radius:8px;padding:10px 12px;margin:0;font-size:15px}
.arc .vq b,.gapq .k{font-family:var(--f-ui);font-size:12px;color:var(--gold)}
.gapq{border-color:var(--gold)}
.acct{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.acct p{margin:0}
.acctform{display:flex;gap:8px;flex-wrap:wrap}
.acctform input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px;flex:1 1 120px;min-width:0}
.acctform #acctPin{flex:0 1 110px;letter-spacing:.3em}
.church{font-size:14px;color:var(--ok);font-weight:600}
/*LEAFLETCSS*/

/* bible */
.openbtn{width:100%;border:0;background:var(--accent);color:var(--accent-ink,#fff);border-radius:14px;padding:17px;font-weight:700;font-size:17px;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 30%,transparent);cursor:pointer}
.bible{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px 16px}
.bible-tools{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.bible-tools .grp{display:flex;gap:6px}
.chap{margin-top:14px;scroll-margin-top:12px}
.chap h3{font-size:18px;color:var(--accent);margin-bottom:6px}
.vtext{font-family:var(--f-text);font-size:var(--bible-size);line-height:1.95}
.v sup{font-family:var(--f-ui);font-size:.62em;color:var(--muted);margin-right:3px;font-variant-numeric:tabular-nums}
.v.hl{background:var(--gold-soft);border-radius:4px;box-shadow:0 0 0 3px var(--gold-soft)}
.loading{color:var(--muted);padding:20px 0}

/* quiz */
.quiz{background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:16px;display:grid;gap:12px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dots{display:flex;gap:5px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.cur{background:var(--accent)}
.dots i.ok{background:var(--ok)}
.dots i.no{background:var(--bad)}
.kind{font-size:12px;font-weight:600;color:var(--gold);letter-spacing:.06em}
.qtext{font-size:16.5px;font-weight:600;margin:0}
.quote{font-family:var(--f-text);font-size:16.5px;line-height:1.85;background:var(--paper);border-radius:10px;padding:12px 14px;margin:0;white-space:pre-line}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;font-size:16px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.opt:disabled{cursor:default}
.ox{grid-template-columns:1fr 1fr}
.ox .opt{text-align:center;font-family:var(--f-text);font-size:30px;font-weight:700;padding:10px}
.feedback{border-radius:10px;padding:12px 14px;font-size:15px;display:grid;gap:8px}
.feedback.hint{background:var(--gold-soft)}
.feedback.hint b{color:var(--gold)}
.feedback.good{background:var(--ok-soft)}
.feedback.good b{color:var(--ok)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:12px 18px;font-weight:600;font-size:15px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:7px 12px;font-size:13.5px;border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.score{display:grid;gap:6px;text-align:center;padding:8px 0}
.score .big{font-family:var(--f-text);font-size:44px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.score .big small{font-size:20px;color:var(--muted)}
.badge{justify-self:center;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 14px}

/* review & record */
.tbl{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 14px}
.trow{display:grid;grid-template-columns:4.5em 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.trow:first-child{border-top:0}
.trow .d{font-size:13px;color:var(--muted)}
.trow .r{font-size:14.5px;min-width:0}
.trow .s{font-variant-numeric:tabular-nums;font-weight:600;font-size:14.5px}
.trow .s.none{color:var(--muted);font-weight:400;font-size:13px}
.meter{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.meter{height:7px}
.meter i{display:block;height:100%;background:var(--ok)}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:12px 0 6px;border-top:2px solid var(--ink);margin-top:4px}
.total .big{font-family:var(--f-text);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:2px}
.stat b{font-family:var(--f-text);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
details.flow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.flow summary{cursor:pointer;font-weight:600}
details.flow p{margin:8px 0 0;font-family:var(--f-text);font-size:15.5px}
.sumlist{display:grid;gap:8px}
.sumlist details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.sumlist summary{cursor:pointer;font-weight:500}
.sumlist p{font-family:var(--f-text);margin:8px 0 0}
.guide ol,.guide ul{margin:0;padding-left:20px;display:grid;gap:6px}
.confirm{background:var(--gold-soft);border-radius:10px;padding:12px;display:grid;gap:8px}
input[type=date]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}

/* popup sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:10000}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;max-height:75vh;overflow:auto}
.sheet h3{font-size:21px}
.sheet p{margin:0;font-size:16px;line-height:1.7}
.sheet .src{font-size:13px;color:var(--muted)}

footer{margin-top:44px;border-top:1px solid var(--line);padding-top:18px;font-size:13px;color:var(--muted);display:grid;gap:4px}
footer .maker{font-size:15px;color:var(--ink);font-weight:600}
@media (max-width:420px){.date{font-size:23px}.summary{padding:14px}.bible{padding:12px 14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.totop{position:fixed;right:max(16px,calc(50vw - 380px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:9300;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s,transform .2s}
.totop.show{opacity:.92;transform:none;pointer-events:auto}
.totop svg{width:22px;height:22px}
.instcard{background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.instcard p{margin:0}.insthead{display:flex;justify-content:space-between;align-items:center}.insthead b{color:var(--accent)}
.instx{border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer;padding:2px 6px}
.inst{margin:0;padding-left:20px;display:grid;gap:4px}
.qtdone{background:var(--ok-soft);border-radius:14px;padding:18px 16px;display:grid;gap:12px;text-align:center}
.qtdone.pop{animation:qtpop .45s ease-out}
@keyframes qtpop{0%{transform:scale(.92);opacity:0}70%{transform:scale(1.02);opacity:1}100%{transform:none}}
.qtd-seal{width:56px;height:56px;border-radius:50%;background:var(--ok);color:var(--ok-soft);display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:28px;font-weight:700}
.qtd-title{font-family:var(--f-text);font-size:22px;font-weight:700;color:var(--ok)}
.qtd-msg{margin:0;font-size:15px;line-height:1.6}
.qtd-stats{display:flex;justify-content:center;gap:28px}
.qtd-stats div{display:grid}.qtd-stats b{font-family:var(--f-text);font-size:28px;color:var(--ok);font-variant-numeric:tabular-nums}.qtd-stats span{font-size:12.5px;color:var(--muted)}
.stamps{display:flex;justify-content:center;gap:8px}
.stamp{width:36px;height:36px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);font-weight:600}
.stamp.on{border:2px solid var(--ok);background:var(--ok);color:var(--ok-soft)}
.stamp.me{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--gold)}

.tdh{position:relative;margin:8px -16px 0;min-height:430px;overflow:hidden;background:linear-gradient(165deg,#3a2c1f,#15110d);color:#f6efe4;display:flex}
.tdh .tdbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.62) saturate(.9)}
.tdh::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,.05) 35%,rgba(10,7,4,.85) 100%)}
.tdin{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px 18px 30px}
.tdtop{align-self:stretch;display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:.9;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.tdtoday{border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.25);color:#fff;border-radius:999px;padding:4px 10px;font-size:12.5px}
.tdring{margin-top:auto;width:96px;height:96px;border-radius:50%;padding:3px;border:0;background:conic-gradient(#e2b874,#ff5b45,#e2b874);position:relative;cursor:pointer}
.tdring.seen{background:rgba(255,255,255,.35)}
.tdring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #15110d;display:block}
.tdring i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;color:#fff;font-size:26px;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.tdk{margin:16px 0 4px;font-size:12.5px;letter-spacing:.14em;color:#e2b874}
.tdh h1{font:900 clamp(26px,7.6vw,32px)/1.25 "Noto Serif KR","Gowun Batang",serif;color:#fff;margin:0;word-break:keep-all;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.tdsub{font-size:13.5px;color:#d9cdbb;margin:10px 0 0}
.tdcr{position:absolute;right:10px;bottom:6px;z-index:3;font-size:10px;color:rgba(255,255,255,.5);text-decoration:none}
.tdsteps{display:grid;gap:8px}
.tdh{cursor:pointer;min-height:min(72vh,560px)}
.tdgo{margin-top:22px;border:0;border-radius:999px;padding:13px 26px;background:#e2b874;color:#1b130b;font:700 16px var(--f-ui);box-shadow:0 6px 20px rgba(0,0,0,.35)}
.tdstep{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px;color:var(--ink)}
.tdstep b{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold);font-size:14px}
.tdstep span{flex:1;font-weight:700;font-size:15.5px}.tdstep small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:1px}
.tdstep i{font-style:normal;color:var(--muted);font-size:18px}.tdstep.ok b{background:var(--accent);color:var(--accent-ink)}.tdstep.ok i{color:var(--accent);font-weight:700}
.wcard{position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(165deg,#3a2c1f,#15110d);color:#fff;min-height:170px;display:flex;align-items:flex-end}
.wcard.big{min-height:300px}
.wcard .wcbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.5) saturate(.85)}
.wcin{position:relative;padding:18px 18px 16px}
.wcin q{display:block;font:700 19px/1.6 "Noto Serif KR","Gowun Batang",serif;word-break:keep-all;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.wcin q::before{content:"“";display:block;font-size:44px;line-height:.5;color:#e2b874;margin-bottom:4px}.wcin q::after{content:""}
.wcin small{display:block;margin-top:8px;color:#e2b874;font-size:12.5px}
.wcin p{margin:10px 0 0;font-size:14px;color:#d9cdbb;border-left:2px solid #e2b874;padding-left:10px}
.tdnext{position:relative;border-radius:16px;overflow:hidden;background:#15110d;color:#fff}
.tdnext .tdnbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(3px) brightness(.4) saturate(.7);transform:scale(1.06)}
.tdnin{position:relative;padding:20px 18px;display:grid;gap:4px;text-align:center}
.tdnin small{color:#e2b874;font-size:12.5px;letter-spacing:.08em}.tdnin b{font:700 21px/1.35 "Noto Serif KR","Gowun Batang",serif}.tdnin span{font-size:13.5px;color:#d9cdbb}
.tdcd{font:700 40px/1 var(--f-ui);font-variant-numeric:tabular-nums;letter-spacing:.05em;margin-top:12px}
.tdnin em{font-style:normal;font-size:12.5px;color:#e2b874}
.tdnin .btn{justify-self:center;margin-top:8px}
.gord,.gopts{display:grid;gap:8px;margin:6px 0 10px}.gopt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 12px;font-size:15px;line-height:1.55}
.gopt b{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);font-size:13px}.gopt.on b{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.gopt small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.gopt.ok{border-color:var(--ok,#2e7d4f);background:color-mix(in srgb,var(--ok,#2e7d4f) 10%,var(--card))}.gopt.no{border-color:#c0563f;background:color-mix(in srgb,#c0563f 8%,var(--card))}
.gq{font-family:var(--f-text);font-size:17px;line-height:1.7;margin:4px 0 8px}.gres{font-weight:700;font-size:17px;margin:4px 0 8px}
.chsoon{display:grid;gap:8px}.chs{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;opacity:.75}.chs b{display:block;font-size:15px}.chs span{font-size:13px;color:var(--muted)}
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wtile{position:relative;aspect-ratio:3/4;border:0;border-radius:10px;overflow:hidden;background:linear-gradient(165deg,#3a2c1f,#15110d);padding:0;color:#fff}
.wtile .wtbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.65)}
.wtile span{position:absolute;left:6px;right:6px;bottom:6px;font-size:12px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.8);text-align:left}
/* ===== 이야기 카드 (스토리) ===== */
/* v2 가독성: 회색 안내 글을 진하게, 작은 글씨를 키우고, 명조체를 Noto Serif KR 500으로 (v1은 그대로) */
html.v2{--muted:#3F4A45;--gold:#7A4C0C;--f-text:"Noto Serif KR","Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif}
@media (prefers-color-scheme: dark){html.v2:not([data-theme="light"]){--muted:#B8C4BD;--gold:#EBC27A}}
html.v2[data-theme="dark"]{--muted:#B8C4BD;--gold:#EBC27A}
html.v2 .lead{font-size:15px}html.v2 .fieldhint,html.v2 .lookhint{font-size:14px}html.v2 .lookbtn .lref{font-size:13px}
html.v2 .top{padding-block:calc(env(safe-area-inset-top,0px) + 8px) 0;gap:0}html.v2 .top>:empty{display:none}html.v2 main{padding-top:8px}html.v2 .brand{min-height:40px}html.v2 .day .dn,html.v2 .day .ds{font-size:12.5px}html.v2 .brand{font-size:12.5px}
html.v2 textarea::placeholder{color:#66706B;opacity:1}
html.v2 .rg.fut b,html.v2 .rg.fut small{opacity:.85}
html.v2 .k-quote .sph::after{background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,.5),rgba(0,0,0,.8))}
html.v2 .k-line .sph::after{background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.55) 30%,rgba(0,0,0,.65) 70%,rgba(10,7,4,.9))}
html.v2 #storyRoot{--ssub:#EFE6D8}
html.v2 .chap+.chap{margin-top:40px}html.v2 .chap h3{font-size:21px;font-weight:800;color:#1F4A41;margin-bottom:12px}html.v2 .chsub{margin-top:5px;font-weight:600}
@media (prefers-color-scheme: dark){html.v2:not([data-theme="light"]) .chap h3{color:#A6D6C8}}html.v2[data-theme="dark"] .chap h3{color:#A6D6C8}
.sptag{position:absolute;z-index:700;background:rgba(20,15,10,.92);color:#f6efe4;border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:10px 12px;box-shadow:0 6px 22px rgba(0,0,0,.5);animation:sptIn .18s ease}
.sptag b{font-size:16px}.sptag small{margin-left:6px;font-size:12px;color:#e2b874}.sptag p{margin:6px 0 0;font-size:14px;line-height:1.6;word-break:keep-all}
@keyframes sptIn{from{opacity:0;transform:translateY(4px) scale(.96)}to{opacity:1;transform:none}}
.sphint{position:absolute;z-index:650;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 62px);background:rgba(0,0,0,.55);color:#fff;font-size:12.5px;padding:5px 12px 5px 28px;border-radius:999px;pointer-events:none;white-space:nowrap}
.sphint:before{content:"";position:absolute;left:11px;top:50%;width:9px;height:9px;margin-top:-5px;border-radius:50%;background:#ff5b45;box-shadow:0 0 0 0 rgba(255,91,69,.7);animation:sphp 1.6s infinite}
@keyframes sphp{0%{box-shadow:0 0 0 0 rgba(255,91,69,.7)}70%{box-shadow:0 0 0 8px rgba(255,91,69,0)}100%{box-shadow:0 0 0 0 rgba(255,91,69,0)}}
#readRoot{position:fixed;inset:0;z-index:9500;background:#0d0b09;color:#f3ece0;animation:siIn .2s ease}
#readRoot .rdfr{position:absolute;inset:0;max-width:520px;margin:0 auto;overflow:hidden;background:linear-gradient(170deg,#2b2219,#14100c)}
#readRoot .rdhead{position:absolute;left:0;right:0;top:0;z-index:5;padding:10px 12px 6px;background:linear-gradient(#000a,#0000)}
#readRoot .sbars{display:flex;gap:3px}#readRoot .sbars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.25)}#readRoot .sbars i.on,#readRoot .sbars i.cur{background:#fff}
#readRoot .rdbar{height:3px;background:rgba(255,255,255,.25);border-radius:2px}#readRoot .rdbar i{display:block;height:100%;background:#fff;border-radius:2px}
#readRoot .rdtop{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}#readRoot .rdtop b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#readRoot .rdav{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#8a6a45;font-size:13px;font-weight:700;flex:none}
#readRoot .rdpg{font-size:12px;color:#cbbfae}
#readRoot .rdbtn{background:none;border:0;color:#fff;font:inherit;font-size:14px;padding:6px 5px;cursor:pointer;position:relative;z-index:6}#readRoot .rdx{font-size:18px}
#readRoot .rdpage{position:absolute;inset:0;padding:96px 22px 40px}
.rdtext{font-family:"Noto Serif KR","Gowun Batang",serif;line-height:1.85;color:#f3ece0;word-break:keep-all}
.rdtext p{margin:0 0 .7em}.rdtext sup{font-size:.58em;color:#e2b874;margin-right:3px;font-family:system-ui,sans-serif}
.rdtext .rdch{font-size:1.2em;color:#e2b874;margin:0 0 .7em;line-height:1.4}.rdtext .rdch small{display:block;font-size:.66em;color:#d9cdbb;font-weight:400;margin-top:3px;font-family:system-ui,sans-serif}
.rdtext .rdch2{font-size:.72em;color:#a99a86;margin:0 0 .6em;font-weight:500;font-family:system-ui,sans-serif}
#readRoot .rdref{position:absolute;left:22px;bottom:16px;font-size:12px;color:#a99a86}
#readRoot .rdcover{position:absolute;inset:0;background-size:cover;background-color:#2b2219}
#readRoot .rdcover:after{content:"";position:absolute;inset:0;background:linear-gradient(#0003 30%,#000d 75%)}
#readRoot .rdcov{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 24px 48px}
#readRoot .rdk{display:inline-block;font-size:13px;color:#e2b874;letter-spacing:.04em;margin-bottom:8px}
#readRoot .rdcov h1{font-family:"Noto Serif KR",serif;font-size:32px;margin:0 0 6px;line-height:1.3}#readRoot .rdcov p{margin:4px 0;color:#d9cdbb;font-size:15px}
#readRoot .rdfind{margin-top:14px!important;padding:10px 12px;border-left:3px solid #e2b874;background:#0006;border-radius:6px;line-height:1.6}#readRoot .rdfind span{display:block;font-size:12px;color:#e2b874}
#readRoot .rdhint{font-size:13px!important;color:#bfb2a0!important;margin-top:16px!important}
#readRoot .rdend{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:stretch;padding:0 28px;gap:10px;text-align:center}
#readRoot .rdend h2{font-family:"Noto Serif KR",serif;font-size:24px;margin:0 0 14px}#readRoot .rdbig{padding:15px;font-size:16px}#readRoot .btn.ghost{color:#fff;border-color:#fff8}#readRoot .linkbtn{color:#d9cdbb;margin-top:8px}
#readRoot .rdtap{position:absolute;top:80px;bottom:0;z-index:3}#readRoot .rdl{left:0;width:30%}#readRoot .rdr{right:0;width:70%}
#storyRoot{position:fixed;inset:0;z-index:9500;touch-action:manipulation;background:#0d0b09;color:#f6efe4;animation:siIn .2s ease;--sgold:#e2b874;--ssub:#d9cdbb;--sred:#ff5b45;--sline:rgba(255,255,255,.18);--sser:"Noto Serif KR","Gowun Batang",serif}
#storyRoot .sfr{position:absolute;inset:0;max-width:520px;margin:0 auto;overflow:hidden;background:linear-gradient(165deg,var(--sg1,#3a2c1f),var(--sg2,#15110d))}
html.story-on .bnav,html.story-on .totop{display:none!important}
.sbars2{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;right:10px;display:flex;gap:3px;z-index:30}
.sbars2 span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden}.sbars2 span i{display:block;height:100%;width:0;background:#fff}
.sbars2 span.done i{width:100%}.sbars2 span.run i{animation:sfill linear forwards}
@keyframes sfill{from{width:0}to{width:100%}}
.stop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);left:14px;right:8px;display:flex;align-items:center;gap:8px;z-index:30;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.stop .sdot{width:28px;height:28px;flex:none;border-radius:50%;background:linear-gradient(135deg,#e2b874,#9c5b2e);display:grid;place-items:center;font:700 12px var(--sser);color:#1b130b;text-shadow:none}
.stop b{font-size:13px}.stop span{opacity:.75;font-size:12.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sfb{font-size:18px;position:relative}.sfb.has::after{content:"";position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%;background:#e2b874}
.fbov{position:absolute;inset:0;z-index:900;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}#main .fbov,body>.fbov{position:fixed;z-index:9900}
.fbbox{width:100%;max-width:520px;background:#fffdf8;color:#1b2420;border-radius:16px 16px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 14px);display:grid;gap:10px;font-family:var(--f-ui,system-ui)}
.fbbox b{font-size:15px}.fbbox textarea{width:100%;font:15px/1.6 var(--f-ui,system-ui);border:1px solid #d9e0da;border-radius:10px;padding:10px;min-height:110px;color:#1b2420;background:#fff}
.fbrow{display:flex;gap:8px}.fbrow button{flex:1;padding:11px;border-radius:10px;border:1px solid #d9e0da;background:#fff;font-weight:700;color:#1b2420}.fbrow .pri{background:#2c5c52;color:#fff;border-color:#2c5c52}
.fbn{margin:0;font-size:12px;color:#5b6862}
.sfbcopy{margin-top:12px;width:100%;border:1px dashed rgba(255,255,255,.4);background:none;color:#e2b874;border-radius:12px;padding:10px;font:600 13.5px var(--f-ui)}
.qtfbn{background:var(--gold-soft);border-radius:10px;padding:10px 12px;margin:6px 0;white-space:pre-wrap}
.sx{border:0;background:none;color:#fff;font-size:20px;padding:4px 8px}.sps{font-size:14px;letter-spacing:-2px}
.sph{position:absolute;inset:0;overflow:hidden}
.sph img{width:100%;height:100%;object-fit:cover;transform:scale(1.04);filter:saturate(.92) contrast(1.04)}
.sph.v1 img{transform:scale(1.14)}.sph.v2 img{transform:scale(1.16)}
.sph img{transition:filter .9s ease}
#storyRoot .sfr{z-index:1}#storyRoot .sfr.sfirst{animation:sfin .45s ease}@keyframes sfin{from{opacity:.4}to{opacity:1}}
#storyRoot .sfr.snew{opacity:0;transition:opacity .75s ease}#storyRoot .sfr.snew.in{opacity:1}
#storyRoot .sfr.sghost{z-index:0;pointer-events:none}.sghost .sbox,.sghost .stapnote,.sghost .spanel{transition:opacity .25s ease;opacity:0}
.sph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 42%,rgba(10,7,4,.9) 100%)}
.scr{position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);font-size:10px;color:rgba(255,255,255,.55);z-index:25;text-decoration:none;max-width:72%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sstage{position:absolute;inset:0;z-index:10;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.sbox{position:absolute;left:18px;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);z-index:5}
.sbox>*{animation:sup .7s both}.sbox>*:nth-child(2){animation-delay:.15s}.sbox>*:nth-child(3){animation-delay:.3s}.sbox>*:nth-child(4){animation-delay:.45s}.sbox>*:nth-child(5){animation-delay:.6s}
@keyframes sup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.slab{display:inline-block;font-size:11.5px;letter-spacing:.12em;color:var(--sgold);font-weight:700;margin-bottom:8px}
.sbox h1{font:900 clamp(28px,8.6vw,36px)/1.22 var(--sser);letter-spacing:-.02em;text-shadow:0 2px 14px rgba(0,0,0,.5);color:#fff;white-space:pre-line;word-break:keep-all}
.sbox h2{word-break:keep-all;font:700 clamp(22px,6.4vw,26px)/1.3 var(--sser);letter-spacing:-.01em;margin:0 0 10px;text-shadow:0 2px 10px rgba(0,0,0,.45);color:#fff}
.sbox p{font-size:16px;line-height:1.7;color:var(--ssub);margin:6px 0 0;word-break:keep-all;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.sbox p b{color:#fff}
.sq2{font:500 18px/1.6 var(--sser);color:#fff;border-left:3px solid var(--sgold);padding:2px 0 2px 12px;margin-top:12px;word-break:keep-all}
.sq2 small{display:block;font:400 12px var(--f-ui);color:var(--sgold);margin-top:4px}

.trnote{font-size:12.5px;color:var(--muted);margin:4px 0 0}.strnote{margin-top:18px;font-size:11.5px;color:rgba(255,255,255,.6);letter-spacing:.04em}
.k-cover .skick{font-size:13px;letter-spacing:.2em;color:var(--sgold);margin-bottom:12px}
.k-cover .ssubt{font-size:15.5px;color:var(--ssub);margin-top:14px;line-height:1.6;white-space:pre-line}
.k-cover .sph::after{background:radial-gradient(ellipse at center,rgba(0,0,0,.55) 0%,rgba(0,0,0,.25) 55%,rgba(0,0,0,.7) 100%)}
.k-split .sph{bottom:44%}
.k-split .sph::after{background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,0) 25%,rgba(0,0,0,0) 70%,#1b150f 100%)}

.k-split .sbox{top:54%;bottom:auto}
.k-quote .sph img{filter:brightness(.42) saturate(.7)}

.k-quote .sbox,.k-line .sbox{bottom:auto;top:50%;transform:translateY(-50%)}
.sbigq{font:700 clamp(22px,6.6vw,27px)/1.55 var(--sser);color:#fff;word-break:keep-all;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.sbigq::before{content:"“";display:block;font-size:64px;line-height:.6;color:var(--sgold);margin-bottom:6px}

<script>
(function(){
const DAYN=["주일","월","화","수","목","금","토"];
const TRY=!!window.CBSR_TRY; if(TRY) document.documentElement.classList.add("try");
const MODE=window.CBSR_MODE||"rj", PI=PLAN_INFO[MODE];
/* 미리 보기 날짜(시험용): ?now=2027-01-01 로 오늘을 바꿔 보고, ?now=0 으로 되돌립니다(이 탭에서만) */
const NOWOFF=(()=>{ try{ const u=new URLSearchParams(location.search).get("now"); if(u==="0") sessionStorage.removeItem("cbsr-now"); else if(u&&/^\d{4}-\d{2}-\d{2}$/.test(u)) sessionStorage.setItem("cbsr-now",u); const s=sessionStorage.getItem("cbsr-now"); if(!s) return 0; const [y,m,d]=s.split("-").map(Number), n=new Date(); return new Date(y,m-1,d,n.getHours(),n.getMinutes(),n.getSeconds())-n; }catch(e){ return 0; } })();
const NOW=()=>new Date(Date.now()+NOWOFF);
/* 미리 보기 중에는 이 탭의 모든 저장(통독·QT·형광펜·프로필·메모)을 따로 둡니다: 읽을 때는 진짜 값을 보되, 쓰기는 now:세션: 아래에만 */
if(NOWOFF){ try{ const L0=window.localStorage, SS=sessionStorage; let id=SS.getItem("cbsr-now-id");
  const fresh=new URLSearchParams(location.search).get("now"); if(fresh&&fresh!=="0"||!id){ id=Date.now().toString(36); SS.setItem("cbsr-now-id",id); }
  /* 지난 미리 보기 사본(12시간 지난 것)은 지웁니다 */
  const old=[]; for(let i=0;i<L0.length;i++){ const k=L0.key(i)||""; const m=k.match(/^now:([0-9a-z]+):/); if(m&&m[1]!==id&&Date.now()-parseInt(m[1],36)>12*3600e3) old.push(k); } old.forEach(k=>L0.removeItem(k));
  const P="now:"+id+":", DEL="\u0000";
  const W={getItem:k=>{ const v=L0.getItem(P+k); if(v===DEL) return null; return v!==null?v:L0.getItem(k); }, setItem:(k,v)=>L0.setItem(P+k,String(v)), removeItem:k=>L0.setItem(P+k,DEL), clear:()=>{}, key:i=>L0.key(i), get length(){ return L0.length; }};
  Object.defineProperty(window,"localStorage",{value:W,configurable:true}); }catch(e){} }
/* 미리 보기 중에는 계정 연동·서버 기록을 모두 막습니다 */
function guardSync(){ if(!NOWOFF||!window.SYNC||SYNC.__g) return; SYNC.__g=1; const no=async()=>null; for(const m of ["login","logout","push","pull","markDone","feedback"]) if(typeof SYNC[m]==="function") SYNC[m]=no; SYNC.loggedIn=()=>false; SYNC.loginEnabled=false; }
guardSync(); window.addEventListener("load",guardSync);
/* 365 통독의 회차(판): 해마다 1월 1일에 새 회차. 2026 = 첫 회차, 2027 = 2027판 */
const ED_Y=Math.max(2026,NOW().getFullYear()), ED=MODE==="y365"?ED_Y:2026;
const DEFAULT_START=MODE==="y365"?ED+"-01-01":PI.start;
/* 새 회차가 되면 지난 회차의 기록(통독·QT·퀴즈)은 hist[해]에 옮겨 보관하고 새로 시작합니다 */
function rollY(m,to){ to=to||ED_Y; if(!m) return m; const e=m.ed||2026; if(e>=to) { if(!m.ed) m.ed=to; return m; }
  const arc={start:m.start,done:m.done||{},dT:m.dT||{},qt:m.qt||{},q:m.q||{},wq:m.wq||{}};
  const has=["done","dT","qt","q","wq"].some(f=>Object.keys(arc[f]).length);
  m.hist ||= {}; if(has) m.hist[e]=m.hist[e]?mergeMem(m.hist[e],arc):arc;
  m.start=to+"-01-01"; m.done={}; m.dT={}; m.qt={}; m.q={}; m.wq={}; m.counted={}; m.ed=to; return m; }
const KEY=MODE==="y365"?"rjnote:y365":"rjnote:v2";
/* 처음 온 사람은 '간단 보기'로 시작합니다 */
try{ if(!localStorage.getItem("rjnote:v2")&&!localStorage.getItem("rjnote:y365")&&localStorage.getItem("cbsr-simple")===null) localStorage.setItem("cbsr-simple","1"); }catch(e){}
const SIMPLE=()=>{ try{ return localStorage.getItem("cbsr-simple")==="1"; }catch(e){ return false; } };
let mem={start:DEFAULT_START,q:{},wq:{},done:{},qt:{},size:17};
try{const s=localStorage.getItem(KEY);if(s)mem=Object.assign(mem,JSON.parse(s));}catch(e){}
mem.done ||= {}; mem.qt ||= {};
if(MODE==="y365"){ const e0=mem.ed; mem=rollY(mem); if(e0!==mem.ed) try{ localStorage.setItem(KEY,JSON.stringify(mem)); }catch(e){} }
/* 2027판 통독표: 경계가 바뀐 여섯 날(69·70·235·236·262·263)을 고치고, 예전 표에 맞춘 요약·안내·퀴즈는 비웁니다 */
if(MODE==="y365"&&ED>=2027&&typeof P365_27!=="undefined"){ for(const no in P365_27){ const n=+no-1, w=Math.floor(n/7)+1, d=n%7, c=PLAN.plan[w-1]&&PLAN.plan[w-1][d]; if(!c) continue; Object.assign(c,P365_27[no]); if(SUMMARY[w-1]) SUMMARY[w-1][d]=""; delete GUIDE[w+"-"+d]; delete EYE[w+"-"+d]; delete CURATED[w+"-"+(d+1)]; } }
/* 예전 '주일~금 읽기' 설정을 쓰던 분은 월요일 시작으로 되돌립니다 */
if(MODE==="rj"){ const d0=new Date(DEFAULT_START+"T00:00:00"); d0.setDate(d0.getDate()-1); const p2=n=>String(n).padStart(2,"0"); if(mem.start===d0.getFullYear()+"-"+p2(d0.getMonth()+1)+"-"+p2(d0.getDate())) mem.start=DEFAULT_START; }
/* 날짜는 모두 이 기기 시간(한국시간) 기준으로 셉니다 */
const todayStr=()=>{const d=NOW();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
/* 합류한 날: 이 통독표를 처음 쓴 날. 기록이 있으면 가장 이른 기록 날짜를 씁니다(기기를 바꿔도 연동하면 가장 이른 날로 합쳐짐) */
if(!mem.joinAt){ const ds=[...Object.values(mem.done||{}),...Object.values(mem.qt||{}).map(q=>q&&q.doneAt),...Object.values(mem.q||{}).map(r=>r&&r.first&&r.first.at)].filter(v=>/^\d{4}-\d{2}-\d{2}$/.test(v||"")).sort();
  mem.joinAt=ds[0]&&ds[0]<todayStr()?ds[0]:todayStr(); try{localStorage.setItem(KEY,JSON.stringify(mem));}catch(e){} }
/* 고친 시각 표시: 여러 기기의 기록을 합칠 때 나중에 고친 쪽을 따릅니다(완료 취소·글 고침도 전해짐) */
function touchDone(k){ (mem.dT ||= {})[k]=Date.now(); }
function touchQ(q,...f){ q.ft ||= {}; const t=Date.now(); for(const x of f) q.ft[x]=t; }
function save(){try{localStorage.setItem(KEY,JSON.stringify(mem));}catch(e){} if(typeof syncSoon==="function") syncSoon();}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* 날짜 */
const parseD=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const today0=()=>{const n=NOW();return new Date(n.getFullYear(),n.getMonth(),n.getDate());};
const dayDiff=(a,b)=>Math.round((b-a)/86400000);
const NW=PLAN.plan.length, READ_DAYS=PLAN.plan.flat().length, TOTAL_DAYS=MODE==="y365"?READ_DAYS:NW*7;
const isRev=d=>MODE==="rj"&&d===6;
const nd=w=>PLAN.plan[w-1]?PLAN.plan[w-1].length:0;
const dayNo=(w,d)=>(w-1)*7+d+1;
const dayName=(w,d)=>MODE==="y365"?`${dayNo(w,d)}일째`:`${w}주차 ${d+1}일째`;
const syncKey=k=>MODE==="y365"?"y-"+k:k;
/* 함께 읽기 숫자: 한 사람이 한 본문을 처음 완료할 때 한 번만 셉니다(완료 취소 후 다시 눌러도 다시 세지 않음) */
function countDone(k){ mem.counted ||= {}; if(mem.counted[k]) return; mem.counted[k]=1; save(); if(window.SYNC&&SYNC.available) SYNC.markDone(syncKey(k),syncKey(todayStr())); }
const dateOf=(w,d)=>{const s=parseD(mem.start);s.setDate(s.getDate()+(w-1)*7+d);return s;};
/* 화면의 한 주: 리딩지저스 월~주일, 365 주일~토요일. 통독표 날짜(w,d)는 그대로 두고 보여 주는 묶음만 달력 주로 맞춥니다. */
/* 리딩지저스는 월요일~주일, 365는 주일~토요일 */
const S0=()=>{const s=parseD(mem.start); s.setDate(s.getDate()-(MODE==="rj"?(s.getDay()+6)%7:s.getDay())); return s;};

function cellOf(W,i){ const dt=S0(); dt.setDate(dt.getDate()+(W-1)*7+i); const n=dayDiff(parseD(mem.start),dt);
  if(n<0) return {dt,pre:true}; if(n>=TOTAL_DAYS) return {dt,after:true}; return {dt,w:Math.floor(n/7)+1,d:n%7}; }
const weekOfDay=(w,d)=>Math.floor(dayDiff(S0(),dateOf(w,d))/7)+1;
function dispW(){ if(view.pre) return 1; if(view.revW) return view.revW; return weekOfDay(view.w,view.d); }
const hasPre=()=>MODE==="rj"&&cellOf(1,0).pre&&dayDiff(parseD(mem.start),cellOf(1,0).dt)===-1;
function weekDays(W){ const L=[]; for(let i=0;i<7;i++){ const c=cellOf(W,i); if(c.w&&!isRev(c.d)) L.push([c.w,c.d]); } return L; }
function dispTitle(W){
  if(MODE==="rj") return W<=NW?`${W}주차 · ${WEEKS[W-1].t}`:`${NW}주차 돌아보기`;
  const L=weekDays(W); if(!L.length) return `${W}주차`;
  const a=dayPlan(...L[0]).ch[0], z=dayPlan(...L[L.length-1]).ch.slice(-1)[0];
  return `${W}주차 · `+(a[0]===z[0]?`${PLAN.abbr[a[0]-1]} ${a[1]}–${z[1]}`:`${PLAN.abbr[a[0]-1]} ${a[1]} – ${PLAN.abbr[z[0]-1]} ${z[1]}`);
}
function posOfToday(){
  const diff=dayDiff(parseD(mem.start),today0());
  if(diff<0) return {w:1,d:0,state:"before",diff};
  if(diff>=TOTAL_DAYS){ const L=TOTAL_DAYS-1; return {w:Math.floor(L/7)+1,d:L%7,state:"after",diff}; }
  return {w:Math.floor(diff/7)+1,d:diff%7,state:"in",diff};

const fmt=(dt,o)=>dt.toLocaleDateString("ko-KR",o);

/* 데이터 준비 */

function nextQ(mode){

function weekTotalsList(L){ let s=0,t=0,n=0; for(const [w,d] of L){const f=dayScore(w,d); if(f){s+=f.s;t+=f.t;n++;}} return {s,t,n}; }
function weekTotals(w){
  let s=0,t=0,n=0; for(let d=0;d<nd(w);d++){const f=dayScore(w,d); if(f){s+=f.s;t+=f.t;n++;}} return {s,t,n};
}

/* ===== 여러 기기 기록 잇기: 이름+숫자 4자리 열쇠 하나에 두 통독표·형광펜·프로필을 함께 저장 ===== */
const LKEYS={rj:"rjnote:v2",y365:"rjnote:y365"};
function localBundle(){ const g=k=>{ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } };
  return {v:2,rj:MODE==="rj"?mem:g(LKEYS.rj),y365:MODE==="y365"?mem:g(LKEYS.y365),hl:HL,hld:HLDEL,prof:PROF}; }
function mergeBundle(L,R){ if(!R||!Object.keys(R).length) return L; if(!R.v) R={v:2,rj:R};
  const o={v:2};
  { const to=Math.max(ED_Y,(L.y365&&L.y365.ed)||0,(R.y365&&R.y365.ed)||0); if(L.y365) L.y365=rollY(L.y365,to); if(R.y365) R.y365=rollY(R.y365,to); }
  for(const k of ["rj","y365"]) o[k]=L[k]&&R[k]?mergeMem(L[k],R[k]):(L[k]||R[k]||null);
  /* 형광펜: 절마다 칠한 시각과 지운 시각 가운데 나중 것을 따릅니다 */
  { const a=L.hl||{}, b=R.hl||{}, da=L.hld||{}, db=R.hld||{}; o.hl={}; o.hld={};
    for(const id of new Set([...Object.keys(a),...Object.keys(b),...Object.keys(da),...Object.keys(db)])){
      const x=a[id], y=b[id], tx=x?(x[1]||0):-1, ty=y?(y[1]||0):-1, td=Math.max(da[id]||0,db[id]||0);
      const best=tx>=ty?x:y, tb=Math.max(tx,ty);
      if(td&&td>=tb) o.hld[id]=td; else if(best) o.hl[id]=best; } }
  const a=L.prof||{}, b=R.prof||{}; o.prof=Object.assign({},b,a); if(!a.photo&&b.photo) o.prof.photo=b.photo; if(!a.nick&&b.nick) o.prof.nick=b.nick;
  if(a.since&&b.since) o.prof.since=a.since<b.since?a.since:b.since;
  return o; }
function applyBundle(B){ const before=JSON.stringify([mem,HL,PROF]);
  for(const k of ["rj","y365"]) if(B[k]){ try{ localStorage.setItem(LKEYS[k],JSON.stringify(B[k])); }catch(e){} }
  if(B[MODE]) mem=Object.assign(mem,B[MODE]);
  /* 다른 기기가 이미 새 회차라면 이 탭도 새 회차로 다시 엽니다 */
  if(MODE==="y365"&&mem.ed&&mem.ed>ED_Y){ try{ localStorage.setItem(KEY,JSON.stringify(mem)); }catch(e){} setTimeout(()=>location.reload(),300); }
  HL=B.hl||HL; HLDEL=B.hld||HLDEL; PROF=B.prof||PROF;
  try{ localStorage.setItem(HLKEY,JSON.stringify(HL)); localStorage.setItem("cbsr-hl-del",JSON.stringify(HLDEL)); localStorage.setItem(PROFKEY,JSON.stringify(PROF)); }catch(e){}
  return before!==JSON.stringify([mem,HL,PROF]); }
let syncT=null, syncBusy=false;
function syncSoon(ms){ if(NOWOFF||!(window.SYNC&&SYNC.loggedIn())) return; clearTimeout(syncT); syncT=setTimeout(syncNow,ms==null?2500:ms); }
async function syncNow(){ if(NOWOFF||!(window.SYNC&&SYNC.loggedIn())||syncBusy) return; syncBusy=true;
  try{ const remote=await SYNC.pull(); const B=mergeBundle(localBundle(),remote||{}); const changed=applyBundle(B);
    SYNC.push(B,0);
    if(changed){ Object.assign(here,posOfToday()); const a=document.activeElement; if(!(a&&/INPUT|TEXTAREA/.test(a.tagName))&&!document.getElementById("sheetRoot").innerHTML) render(); }
  }catch(e){ console.warn("sync",e); } finally{ syncBusy=false; } }
