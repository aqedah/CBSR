<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0}
body{width:1200px;height:630px;background:#3A2418;position:relative;overflow:hidden;font-family:"Noto Sans CJK KR";color:#F7F4EC}
.glow{position:absolute;right:-160px;top:-200px;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle,#5A3822 0%,#3A2418 70%)}
.wrap{position:absolute;inset:0;display:flex;align-items:center;gap:56px;padding:0 90px}
.book{width:300px;height:300px;flex:none;border-radius:64px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.t{display:grid;gap:22px}
.kick{font-size:30px;font-weight:700;color:#F2B83F;letter-spacing:.04em}
h1{margin:0;font-family:"Noto Serif CJK KR";font-weight:700;font-size:92px;white-space:nowrap;line-height:1.05;letter-spacing:-.01em}
.sub{font-size:34px;color:#EADCC8;line-height:1.45}
.tags{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.tags span{font-size:24px;font-weight:600;border:2px solid rgba(247,244,236,.45);border-radius:99px;padding:5px 16px}
.foot{margin-top:18px;font-size:24px;color:#C9B39A;letter-spacing:.02em}
</style></head><body><div class="glow"></div>
<div class="wrap"><img class="book" src="icon-512.png">
<div class="t"><div class="kick">성경통독 · 묵상</div><h1>이야기통독</h1>
<div class="sub">성경의 이야기를 따라 읽습니다</div>
<div class="foot">중앙성서교회</div></div></div></body></html>
