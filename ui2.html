<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>CBSR v2 2차 UI 샘플</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 2차 샘플: 국내 QT 앱 UX 검토에서 고른 두 가지. ① 마친 순간 화면 ② 묵상 노트 한 장씩. 색·서체는 지금 v2 그대로 */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#F3F5F1; --card:#FFFFFF; --ink:#1B2420; --muted:#56615B; --line:#DCE3DE;
  --accent:#2C5C52; --accent-ink:#FFFFFF; --soft:#E2ECE7; --gold:#7A4C0C; --gold-soft:#F3E6CF;
  --stage:#E7EBE8;
  --f-disp:"Noto Serif KR","Gowun Batang",serif; --f-text:"Noto Serif KR","Gowun Batang",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111714; --card:#18201C; --ink:#E4EAE6; --muted:#A9B6AF; --line:#2A3430;
  --accent:#8FC4B5; --accent-ink:#0E1513; --soft:#1C2A26; --gold:#EBC27A; --gold-soft:#3A2E1C; --stage:#0B0F0D; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111714; --card:#18201C; --ink:#E4EAE6; --muted:#A9B6AF; --line:#2A3430;
  --accent:#8FC4B5; --accent-ink:#0E1513; --soft:#1C2A26; --gold:#EBC27A; --gold-soft:#3A2E1C; --stage:#0B0F0D; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--stage);color:var(--ink);margin:0}
body{font-family:var(--f-ui);font-size:15px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:16px}
.head h1{margin:0;font:700 22px/1.35 var(--f-disp);text-wrap:balance}
.head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.nav button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.states{display:flex;gap:6px;flex-wrap:wrap}
.states button{border:0;background:transparent;border-bottom:2px solid transparent;padding:5px 4px;font-size:13.5px;color:var(--muted)}
.states button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.stage{display:grid;grid-template-columns:minmax(0,390px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.stage{grid-template-columns:minmax(0,1fr)}}
.side{display:grid;gap:14px;min-width:0}
.box{background:var(--card);border-radius:16px;padding:16px 18px}
.box h2{margin:0 0 8px;font:700 16px var(--f-ui)}
.box ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.box p{margin:0;font-size:14px}
.pick{display:grid;gap:8px;margin-top:8px}
.pick label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:13.5px;background:var(--paper);cursor:pointer}
.pick input{margin-top:4px;accent-color:var(--accent)}
.pick small{display:block;color:var(--muted);font-size:12.5px}

/* 휴대폰 */
.phone{position:relative;width:100%;max-width:390px;height:780px;max-height:calc(100dvh - 40px);min-height:640px;border-radius:34px;background:var(--paper);box-shadow:0 0 0 10px #1b201d,0 18px 40px -10px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 18px 20px;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.foot{padding:10px 18px 18px;background:var(--paper)}
.big{display:block;width:100%;border:0;border-radius:14px;padding:15px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px}
.big.light{background:transparent;color:var(--muted);font-weight:600;font-size:14px;padding:10px}

/* 마친 순간 */
.done{display:grid;justify-items:center;text-align:center;gap:6px;padding-top:26px}
.x{position:absolute;right:14px;top:14px;border:0;background:transparent;padding:8px;display:grid;color:var(--muted)}
.x svg{width:22px;height:22px}
.ck{width:76px;height:76px;border-radius:50%;background:var(--accent);display:grid;place-items:center;margin-bottom:10px}
.ck svg{width:40px;height:40px;stroke:var(--accent-ink);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:0}
.play .ck{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.play .ck path{animation:draw .5s .25s ease-out both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.play .ck,.play .ck path{animation:none}}
.done h2{margin:0;font:700 22px/1.4 var(--f-disp);text-wrap:balance}
.done .sub{font-size:13.5px;color:var(--muted)}
.kept{width:100%;text-align:left;background:var(--card);border-radius:16px;padding:14px 16px;margin-top:14px;display:grid;gap:6px}
.kept small{font-size:12px;color:var(--muted);font-weight:600}
.kept q{quotes:"“" "”";font:500 16px/1.75 var(--f-text)}
.kept span{font-size:12.5px;font-weight:700;color:var(--gold)}
.cal{width:100%;background:var(--card);border-radius:16px;padding:14px 14px 12px;margin-top:12px;text-align:left}
.cal h3{margin:0 0 10px;font-size:13px;font-weight:700;display:flex;justify-content:space-between}
.cal h3 span{font-weight:500;color:var(--muted)}
.cg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px 4px;justify-items:center}
.cg .wd{font-size:11px;color:var(--muted);font-weight:600}
.cg i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cg i.r{background:var(--soft);color:var(--accent);font-weight:700}
.cg i.t{background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--gold)}
.play .cg i.t{animation:pop .4s .55s both}
.cg i.f{opacity:.45}
.cal p{margin:10px 2px 0;font-size:13px;color:var(--ink)}
.cal p b{color:var(--accent)}
.with{width:100%;display:flex;align-items:center;gap:10px;background:var(--gold-soft);border-radius:14px;padding:11px 14px;margin-top:12px;font-size:13.5px;text-align:left}
.with .dots{display:flex}
.with .dots i{width:18px;height:18px;border-radius:50%;background:var(--gold);opacity:.85;border:2px solid var(--gold-soft);margin-left:-6px}
.with .dots i:first-child{margin-left:0}
.with .dots i:nth-child(2){opacity:.6}.with .dots i:nth-child(3){opacity:.4}
.with>span:nth-child(2){min-width:0}.with em{white-space:nowrap;font-style:normal;font-size:11px;color:var(--muted);margin-left:auto}

/* 묵상 노트 한 장씩 */
.ntop{display:flex;align-items:center;gap:8px;padding:12px 14px 0}
.ntop button{border:0;background:transparent;padding:6px;display:grid;color:var(--ink)}
.ntop button svg{width:22px;height:22px}
.ntop b{font:700 16px var(--f-ui)}
.ntop span{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-right:6px}
.bars{display:flex;gap:4px;padding:8px 18px 0}
.bars i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.bars i.on{background:var(--accent)}
.st{display:grid;gap:14px;padding-top:12px}
.st .lab{font-size:13px;font-weight:700;color:var(--gold)}
.st h2{margin:-8px 0 0;font:700 21px/1.45 var(--f-disp);text-wrap:balance}
.st .q{font:500 17px/1.8 var(--f-text);margin:0}
.lnk{justify-self:start;border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:14px}
.ta{width:100%;min-height:96px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px 14px;font:16px/1.65 var(--f-ui);resize:none}
.ta::placeholder{color:var(--muted);opacity:.8}
.trait{background:var(--card);border-radius:16px;padding:16px;display:grid;gap:8px}
.trait b{font-size:15px}
.trait q{quotes:"“" "”";font:500 17px/1.75 var(--f-text)}
.trait .tf{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.amen{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:5px 16px;font-weight:700;font-size:13.5px}
.amen[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pray{font:500 16.5px/1.85 var(--f-text);margin:0;background:var(--card);border-radius:16px;padding:16px}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin:0 0 8px}
/* 지금(한 화면) 비교용 */
.long .sec{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px;display:grid;gap:8px}
.long .num{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px}
.long .num i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:12px}
.long p{margin:0;font:500 15px/1.75 var(--f-text)}
.long .ta{min-height:56px;font-size:14.5px}
.long .trait{background:var(--paper);padding:12px}
</style></head>
<body>
<div class="wrap">
  <div class="head"><h1>CBSR v2 2차 UI 샘플</h1><p>국내 QT 앱 화면을 보고 고른 두 가지입니다. 11월 2일, 사도행전 16–18장 날로 보여 드립니다. 휴대폰 안 단추는 실제로 눌러 볼 수 있습니다.</p></div>
  <div class="nav" role="tablist" id="nav"></div>
  <div class="states" role="tablist" id="states"></div>
  <div class="stage">
    <div class="phone" id="phone"></div>
    <div class="side" id="side"></div>
  </div>
</div>
<script>
const IMG="img/g/g42_10.jpg";
const SV={x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  ck:'<svg viewBox="0 0 40 40"><path d="M10 21l7 7 13-15"/></svg>'};
const V31={t:"이르되 주 예수를 믿으라 그리하면 너와 네 집이 구원을 받으리라 하고",r:"행 16:31"};
const PAGES=[
 {k:"done",t:"① 마친 순간",states:[["read","통독을 마쳤을 때"],["note","묵상 노트까지 마쳤을 때"]]},
 {k:"note",t:"② 묵상 노트 한 장씩",states:[["step","한 장씩 (새 안)"],["long","지금 (한 화면)"]]}
];
const st={p:"done",s:"read",step:0,amen:false,with:true,txt:{}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* 최근 4주(월–토). 지난날 안 읽은 칸은 앞으로의 칸과 똑같이 그냥 숫자만: 빠진 날이 드러나지 않게 */
function calHTML(){
  const weeks=[[12,13,14,15,16,17,"10"],[19,20,21,22,23,24,"10"],[26,27,28,29,30,31,"10"],[2,3,4,5,6,7,"11"]];
  const miss=new Set(["10-15","10-22","10-23"]);
  let n=0, cells=["월","화","수","목","금","토"].map(d=>`<span class="wd">${d}</span>`).join("");
  weeks.forEach(w=>{ const m=w[6]; w.slice(0,6).forEach(d=>{ const k=m+"-"+d; let c="";
    if(m==="11"&&d===2){ c="t"; n++; } else if(m==="11"&&d>2) c="f"; else if(!miss.has(k)){ c="r"; n++; }
    cells+=`<i class="${c}">${d}</i>`; }); });
  return `<div class="cal"><h3>최근 4주<span>10월 12일 – 11월 7일</span></h3><div class="cg">${cells}</div><p>이 4주 동안 <b>${n}일</b> 말씀을 읽었습니다.</p></div>`; }
const withHTML=()=>st.with?`<div class="with"><span class="dots"><i></i><i></i><i></i></span><span>오늘 <b>23명</b>이 함께 읽었습니다</span><em>예시</em></div>`:"";

function doneHTML(kind){
  if(kind==="read") return `<button class="x" aria-label="닫기" data-x>${SV.x}</button>
   <div class="scr"><div class="done">
    <div class="ck">${SV.ck}</div>
    <h2>사도행전 16–18장을<br>읽었습니다</h2>
    <span class="sub">11월 2일 · 리딩지저스 217일째</span>
    ${withHTML()}
    ${calHTML()}
   </div></div>
   <div class="foot"><button class="big" data-go="story">스토리로 이어 보기</button><button class="big light" data-x>오늘 화면으로</button></div>`;
  return `<button class="x" aria-label="닫기" data-x>${SV.x}</button>
   <div class="scr"><div class="done">
    <div class="ck">${SV.ck}</div>
    <h2>오늘 묵상 노트를<br>마쳤습니다</h2>
    <span class="sub">11월 2일 · 사도행전 16–18장</span>
    <div class="kept"><small>오늘 붙잡은 말씀</small><q>${esc(V31.t)}</q><span>${V31.r}</span></div>
    ${withHTML()}
    ${calHTML()}
   </div></div>
   <div class="foot"><button class="big" data-x>오늘 화면으로</button></div>`; }

const STEPS=[
 {lab:"본문 관찰", body:()=>`<p class="q">옥문이 열린 뒤 바울은 간수에게 무엇이라 외칩니까? 그 뒤 간수는 무엇을 묻고 무엇을 했습니까?</p>
   <button class="lnk">본문 열기 · 행 16:25–34 ›</button>
   <textarea class="ta" data-t="obs" placeholder="한 줄로 적어 보세요" aria-label="나의 답">${esc(st.txt.obs||"")}</textarea>`},
 {lab:"하나님의 성품", body:()=>`<p class="q">빌립보 강가에서 주께서는 루디아의 마음을 여셨고(16:14), 고린도에서는 두려워하는 바울에게 침묵하지 말고 말하라고 하십니다(18:9–10).</p>
   <div class="trait"><b>구원하시는 하나님</b><q>${esc(V31.t)}</q><div class="tf"><span>${V31.r}</span><button class="amen" data-amen aria-pressed="${st.amen}">${st.amen?"아멘 ✓":"아멘"}</button></div></div>`},
 {lab:"오늘 붙잡을 한 구절", body:()=>`<div class="trait"><q>${esc(V31.t)}</q><div class="tf"><span>${V31.r}</span><button class="lnk">구절 바꾸기 ›</button></div></div>
   <p class="q">말씀을 듣고 바로 판단하기보다, 베뢰아 사람들처럼 성경을 직접 살펴보는 시간을 어떻게 마련할 수 있을까요?</p>
   <textarea class="ta" data-t="app" placeholder="오늘 말씀 앞에서 내가 기억할 한 가지" aria-label="기억할 한 가지">${esc(st.txt.app||"")}</textarea>`},
 {lab:"오늘의 기도", body:()=>`<p class="pray">주님, 읽은 말씀을 지나치지 않고 살피게 하소서. 말씀 앞에서 두려움과 성급한 판단보다 믿음으로 반응하게 하소서. 예수님의 이름으로 기도합니다. 아멘.</p>
   <textarea class="ta" data-t="pr" placeholder="내 기도 더하기" aria-label="내 기도">${esc(st.txt.pr||"")}</textarea>`}
];
function stepHTML(){
  if(st.step>=STEPS.length) return doneHTML("note");
  const i=st.step, S=STEPS[i];
  return `<div class="ntop"><button aria-label="${i?"앞 장":"닫기"}" data-prev>${i?SV.back:SV.x}</button><b>묵상 노트</b><span>${i+1} / ${STEPS.length}</span></div>
   <div class="bars">${STEPS.map((_,j)=>`<i class="${j<=i?"on":""}"></i>`).join("")}</div>
   <div class="scr"><div class="st"><span class="lab">${S.lab}</span>${S.body()}</div></div>
   <div class="foot"><button class="big" data-next>${i===STEPS.length-1?"묵상 노트 마치기":"다음"}</button></div>`; }
function longHTML(){
  return `<div class="ntop"><button aria-label="닫기">${SV.back}</button><b>묵상 노트</b></div>
   <div class="scr long">${STEPS.map((S,i)=>`<div class="sec"><span class="num"><i>${i+1}</i>${S.lab}</span>${S.body().replace(/class="q"/g,"")}</div>`).join("")}
   <button class="big" data-golong>묵상 노트 마치기</button></div>`; }

const SIDE={
 done:()=>`<div class="box"><h2>무엇이 바뀌나</h2><ul>
   <li>지금은 '읽음'을 누르면 작은 줄 하나만 바뀝니다. 새 안은 <b>한 화면 전체</b>로 끝냈다는 순간을 줍니다(비블레시아 '출석 완료'에서 가져옴).</li>
   <li>큰 ✓가 한 번 그려지고, 달력의 오늘 칸이 채워지는 움직임 하나만 둡니다. 휴대폰에서 움직임 줄이기를 켠 사람에게는 움직이지 않습니다.</li>
   <li>달력은 <b>최근 4주</b>. 읽은 날만 초록으로 채우고, 안 읽은 지난날은 앞으로의 날처럼 숫자만 둡니다. 빠진 날이 경고처럼 보이지 않게.</li>
   <li>아래 단추는 다음 할 일 하나(스토리로 이어 보기)와 돌아가기 하나뿐.</li>
   <li>묵상 노트까지 마치면 오늘 붙잡은 말씀이 맨 위에 다시 나옵니다.</li></ul></div>
  <div class="box"><h2>정할 것</h2>
   <p>'함께 읽은 사람 수' 줄</p>
   <div class="pick">
    <label><input type="radio" name="with" value="1" ${st.with?"checked":""}><span>넣기<small>이름·순위 없이 숫자만. 교회 전체 숫자를 모으는 작은 저장 공간이 필요합니다(로그인 없이 가능한지 따로 확인).</small></span></label>
    <label><input type="radio" name="with" value="0" ${st.with?"":"checked"}><span>빼기<small>내 기록만 보여 줍니다.</small></span></label>
   </div>
   <p style="margin-top:12px">달력 범위</p>
   <div class="pick"><label><input type="radio" name="cal" checked><span>최근 4주 (샘플)<small>달이 바뀌어도 빈 달력이 나오지 않습니다.</small></span></label><label><input type="radio" name="cal"><span>이번 달<small>매달 1일에는 거의 빈 달력이 됩니다.</small></span></label></div>
  </div>
  <div class="box"><button class="big" id="replay">마친 순간 다시 보기</button></div>`,
 note:()=>`<div class="box"><h2>무엇이 바뀌나</h2><ul>
   <li>지금은 관찰·성품·한 구절·기도가 <b>한 화면에 길게</b> 이어집니다. 새 안은 <b>한 장에 하나</b>, 맨 아래 큰 '다음' 단추 하나(비블레시아·성경톡톡에서 가져옴).</li>
   <li>위에 네 칸 막대와 '1 / 4'로 얼마나 남았는지 보입니다(스토리 카드와 같은 모양).</li>
   <li>빈칸이어도 '다음'은 눌립니다. 따로 안내 글은 두지 않았습니다.</li>
   <li>마지막 장의 '묵상 노트 마치기'를 누르면 ① 마친 순간 화면으로 이어집니다.</li>
   <li>'더 깊이 관찰하기'와 '다른 부분도 살펴보기'는 이번 샘플에서 뺐습니다. 넣는다면 첫 장 아래 접힌 링크로.</li></ul></div>
  <div class="box"><h2>살펴볼 점</h2><ul>
   <li>위 '지금 (한 화면)'을 눌러 같은 내용을 지금 방식으로 견주어 보세요.</li>
   <li>한 장씩은 쓰기에 집중되지만, 앞 장을 다시 보려면 ‹ 를 눌러야 합니다.</li></ul></div>`
};

function render(){
  const P=PAGES.find(x=>x.k===st.p);
  document.getElementById("nav").innerHTML=PAGES.map(x=>`<button role="tab" aria-selected="${x.k===st.p}" data-p="${x.k}">${x.t}</button>`).join("");
  document.getElementById("states").innerHTML=P.states.map(([k,t])=>`<button role="tab" aria-selected="${k===st.s}" data-s="${k}">${t}</button>`).join("");
  const ph=document.getElementById("phone");
  ph.classList.remove("play");
  if(st.p==="done") ph.innerHTML=doneHTML(st.s);
  else ph.innerHTML=st.s==="long"?longHTML():stepHTML();
  if(st.p==="done"||(st.p==="note"&&st.step>=STEPS.length)) requestAnimationFrame(()=>ph.classList.add("play"));
  document.getElementById("side").innerHTML=SIDE[st.p]();
  bind(); }
function bind(){
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ st.p=b.dataset.p; st.s=PAGES.find(x=>x.k===st.p).states[0][0]; st.step=0; render(); });
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ st.s=b.dataset.s; st.step=0; render(); });
  const ph=document.getElementById("phone");
  ph.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>{ st.step++; render(); });
  ph.querySelectorAll("[data-prev]").forEach(b=>b.onclick=()=>{ if(st.step>0){ st.step--; render(); } });
  ph.querySelectorAll("[data-golong]").forEach(b=>b.onclick=()=>{ st.s="step"; st.step=STEPS.length; render(); });
  ph.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{ if(st.p==="note"){ st.step=0; render(); } else { ph.classList.remove("play"); void ph.offsetWidth; ph.classList.add("play"); } });
  ph.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ st.p="note"; st.s="step"; st.step=0; render(); });
  ph.querySelectorAll("[data-amen]").forEach(b=>b.onclick=()=>{ st.amen=!st.amen; b.setAttribute("aria-pressed",st.amen); b.textContent=st.amen?"아멘 ✓":"아멘"; });
  ph.querySelectorAll("[data-t]").forEach(t=>t.oninput=()=>{ st.txt[t.dataset.t]=t.value; });
  document.querySelectorAll('input[name="with"]').forEach(r=>r.onchange=()=>{ st.with=r.value==="1"; render(); });
  const rp=document.getElementById("replay"); if(rp) rp.onclick=()=>{ ph.classList.remove("play"); void ph.offsetWidth; ph.classList.add("play"); };
}
render();
</script>
</body></html>
