<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>체험판 점검표 · 이야기통독</title>
<meta name="robots" content="noindex">
<!-- 2026-11-23 목사님: 종이 체험판(2026 가이드북) 테스터가 휴대폰으로 답하는 점검표. 답은 Firestore trialcheck에 쌓이고 관리자만 읽습니다(firestore.rules). 결과 보기: check.html?admin -->
<style>
:root{--ink:#2b2b2b;--sub:#6b6560;--red:#c8323c;--redL:#fbeaea;--line:#e4ddd2;--paper:#fbf8f2;--band:#3f3f3f;--ok:#2f6b4f}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);font-size:16px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding:0 0 120px}
.top{background:var(--band);color:#fff;padding:26px 20px 22px}
.top .k{font-size:12.5px;opacity:.75;letter-spacing:.04em}
.top h1{font-size:26px;font-weight:800;margin-top:4px}
.top p{font-size:14.5px;opacity:.92;margin-top:8px}
.how{margin:16px 16px 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14.5px}
.how b{color:var(--red)}
.how li{margin:4px 0 0 18px}
.field{margin:16px 16px 0}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
input[type=text],textarea,input[type=password]{width:100%;font:inherit;font-size:16px;border:1px solid #cfc7bb;border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.sec{margin:26px 16px 0}
.sec h2{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:800;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.sec h2 .n{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font-size:14px;align-items:center;justify-content:center;flex:none}
.sec h2 .n.d{width:10px;height:10px;background:var(--ink);margin:0 8px}
.sec h2 small{font-size:12.5px;font-weight:400;color:var(--sub);margin-left:auto;text-align:right}
.sub{font-size:14px;font-weight:800;color:var(--red);margin:16px 0 0;display:flex;align-items:center;gap:7px}
.sub i{font-style:normal;width:18px;height:18px;border:1.4px solid var(--red);font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.q{padding:14px 0;border-bottom:1px dashed var(--line)}
.q .t{font-size:15.5px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips button{font:inherit;font-size:15px;border:1.5px solid #cfc7bb;background:#fff;color:var(--ink);border-radius:999px;padding:8px 16px;min-height:42px;cursor:pointer}
.chips button.on{border-color:var(--red);background:var(--red);color:#fff;font-weight:700}
.chips.sc button{width:46px;padding:8px 0}
.q textarea{margin-top:10px}
.memo{margin-top:8px;font-size:13.5px;color:var(--sub);background:none;border:0;padding:4px 0;font-family:inherit;text-decoration:underline;cursor:pointer}
.scl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin-top:4px;max-width:270px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);box-shadow:0 -4px 12px rgba(0,0,0,.06);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:528px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .st{font-size:13px;color:var(--sub);flex:1}
.bar button{font:inherit;font-size:16px;font-weight:800;background:var(--band);color:#fff;border:0;border-radius:12px;padding:13px 22px;cursor:pointer}
.bar button:disabled{opacity:.5}
.done{margin:40px 20px;text-align:center}
.done h2{font-size:22px;margin:12px 0 8px}
.done p{color:var(--sub);font-size:15px}
.done .ic{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;font-size:34px;display:inline-flex;align-items:center;justify-content:center}
.err{color:var(--red);font-size:14px;margin:10px 16px 0}
/* 결과 보기 */
.adm .card{margin:14px 16px 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.adm .cnt{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.adm .cnt span{font-size:13.5px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.adm .cnt span b{color:var(--red)}
.adm .mm{margin-top:8px;font-size:14px;border-left:3px solid var(--line);padding:2px 0 2px 10px}
.adm .mm small{color:var(--sub)}
.adm .tools{display:flex;gap:8px;margin:14px 16px 0;flex-wrap:wrap}
.adm .tools button{font:inherit;font-size:14px;border:1px solid #cfc7bb;background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer}
</style>
</head><body><div class="wrap" id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
"use strict";
/* 물음 목록. 종류: yn(예·조금·아니요 + 메모), ch(고르기 + 메모), tx(글), sc(1–5). id는 결과를 모을 때 씁니다(바꾸지 않습니다). */
const YN=["예","조금","아니요"];
const S=[
 {h:"하루를 쓰는 흐름",n:"",q:[
  {id:"time",t:"하루치(성경 읽기와 쓰기)에 몇 분쯤 걸렸습니까?",k:"ch",o:["20분 안쪽","20–40분","40–60분","1시간 넘게"]},
  {id:"order",t:"①부터 ⑤까지의 차례가 자연스러웠습니까?",k:"yn",m:"어디에서 멈칫했습니까?"},
  {id:"desk",t:"성경책과 가이드북을 함께 펴 놓고 쓰기에 불편한 점이 있었습니까?",k:"ch",o:["있었다","없었다"],m:"어떤 점이었습니까?"}]},
 {h:"읽기 전",n:"1",s:"오늘의 흐름 · 읽기 도구 · 말뜻",q:[
  {id:"flow",t:"오늘의 흐름을 먼저 읽고 성경을 읽으니 이야기의 흐름이 잡혔습니까?",k:"yn"},
  {id:"tool",t:"오늘의 읽기 도구가 찾으라는 것을 성경에서 찾아 표시할 수 있었습니까?",k:"yn",m:"찾기 어려웠던 날이 있으면 적어 주세요."},
  {id:"word",t:"말뜻 풀이가 도움이 되었습니까?",k:"yn",m:"더 풀어 주면 좋겠던 낱말이 있었습니까?"}]},
 {h:"읽은 뒤",n:"3",s:"눈여겨볼 것 · 지도 · 성경 전체로",q:[
  {id:"look",t:"눈여겨볼 것을 읽고 본문에서 새로 보인 것이 있었습니까?",k:"yn"},
  {id:"map",t:"지도나 그림이 본문을 이해하는 데 도움이 되었습니까?",k:"yn"},
  {id:"christ",t:"성경 전체로를 읽고 오늘 본문이 성경의 다른 곳과 어떻게 이어지는지 알 수 있었습니까?",k:"yn"}]},
 {h:"나의 묵상",n:"4",s:"손으로 쓰는 자리",q:[
  {sub:"1",sh:"본문 관찰"},
  {id:"obs1",t:"질문이 무엇을 묻는지 바로 알 수 있었습니까?",k:"yn"},
  {id:"obs2",t:"답을 성경에서 찾을 수 있었습니까? 왜 그것을 보는지 알 수 있었습니까?",k:"yn"},
  {sub:"2",sh:"하나님의 성품"},
  {id:"god1",t:"무엇을 써야 할지 알 수 있었습니까?",k:"yn"},
  {id:"god2",t:"써 보면서 하나님에 대해 새로 알게 된 것이 있었습니까?",k:"yn"},
  {sub:"3",sh:"적용"},
  {id:"app1",t:"내 삶에 와닿는 질문이었습니까?",k:"yn",m:"너무 크거나 막연했던 날은 언제였습니까?"},
  {id:"app2",t:"적용한 것을 실제로 해 본 일이 있습니까?",k:"yn"},
  {sub:"4",sh:"오늘의 기도"},
  {id:"pray",t:"기도를 직접 써 보셨습니까?",k:"yn",m:"쓰기 어려웠다면 무엇 때문이었습니까?"}]},
 {h:"쓴 뒤에 읽기",n:"5",s:"해설과 기도",q:[
  {id:"when",t:"해설을 언제 읽으셨습니까?",k:"ch",o:["다 쓴 뒤에","쓰기 전에","읽지 않을 때가 많았다"]},
  {id:"cmp",t:"내가 쓴 묵상과 해설을 비교하며 새로 알게 된 것이 있었습니까?",k:"yn"},
  {id:"hard",t:"해설이 어렵거나 길게 느껴진 날이 있었습니까?",k:"ch",o:["있었다","없었다"],m:"어느 날이었습니까?"}]},
 {h:"종이책",n:"",q:[
  {id:"font",t:"글자 크기와 줄 간격은 읽기 편했습니까?",k:"yn"},
  {id:"lines",t:"쓰는 줄은 넉넉했습니까?",k:"yn",m:"모자라거나 남았던 칸은 어디였습니까?"},
  {id:"paper",t:"종이에 펜으로 쓰기 좋았습니까? (번짐, 뒷면 비침)",k:"yn"}]},
 {h:"전체",n:"",q:[
  {id:"best",t:"가장 좋았던 하루와 그 까닭은 무엇입니까?",k:"tx"},
  {id:"worst",t:"가장 힘들었던 하루와 그 까닭은 무엇입니까?",k:"tx"},
  {id:"one",t:"한 가지만 바꾼다면 무엇을 바꾸겠습니까?",k:"tx"},
  {id:"rec",t:"다른 성도에게 권하고 싶은 마음은 어느 정도입니까?",k:"sc"},
  {id:"etc",t:"그 밖에 나누고 싶은 이야기가 있으면 적어 주세요.",k:"tx"}]}
];
const QS=S.flatMap(s=>s.q.filter(q=>q.id));
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DK="cbsr-check26-draft", SK="cbsr-check26-sent";
const ls={get(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let A=ls.get(DK)||{name:"",a:{}};
let fbReady=null;
function fb(){ if(fbReady) return fbReady;
  fbReady=(async()=>{ const cfg=window.CBSR_FIREBASE_CONFIG; if(!cfg||!window.firebase) throw new Error("서버에 닿지 않습니다.");
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    const auth=firebase.auth(); if(!auth.currentUser) await new Promise((res,rej)=>{const off=auth.onAuthStateChanged(u=>{if(u){off();res();}}); auth.signInAnonymously().catch(rej);});
    return firebase.firestore(); })(); return fbReady; }

/* ── 답하기 ── */
function qHtml(q){ const v=A.a[q.id]||{}; let h=`<div class="q" data-id="${q.id}"><div class="t">${esc(q.t)}</div>`;
  if(q.k==="yn"||q.k==="ch"){ const o=q.k==="yn"?YN:q.o; h+=`<div class="chips">${o.map(x=>`<button type="button" data-v="${esc(x)}" class="${v.c===x?"on":""}">${esc(x)}</button>`).join("")}</div>`;
    const open=!!(v.m||q.m); h+= open?`<textarea data-m placeholder="${esc(q.m||"덧붙일 말이 있으면 날짜와 함께 적어 주세요")}">${esc(v.m||"")}</textarea>`:`<button type="button" class="memo" data-open>덧붙일 말 적기</button>`; }
  else if(q.k==="sc"){ h+=`<div class="chips sc">${[1,2,3,4,5].map(x=>`<button type="button" data-v="${x}" class="${String(v.c)===String(x)?"on":""}">${x}</button>`).join("")}</div><div class="scl"><span>권하지 않음</span><span>꼭 권함</span></div>`; }
  else h+=`<textarea data-m placeholder="날짜와 함께 적어 주시면 더 좋습니다">${esc(v.m||"")}</textarea>`;
  return h+`</div>`; }
function form(){
  app.innerHTML=`<div class="top"><div class="k">2026 이야기통독 가이드북 체험판</div><h1>체험 점검표</h1><p>가이드북으로 하루하루 묵상하며 느낀 점을 나눠 주세요. 나눠 주신 이야기는 2027 가이드북을 만드는 데 그대로 쓰입니다.</p></div>
  <div class="how"><ul><li>덧붙일 말에는 <b>날짜</b>를 함께 적어 주세요. 예) 11/18 질문이 무엇을 묻는지 바로 알기 어려웠습니다.</li><li><b>좋았던 점</b>도 꼭 적어 주세요. 다음 판에서 지킬 것이 됩니다.</li><li>해당되는 항목만 골라 답하시면 됩니다. 적던 내용은 이 휴대폰에 남아 있어서 나중에 이어 쓸 수 있습니다.</li></ul></div>
  <div class="field"><label for="nm">이름</label><input type="text" id="nm" maxlength="30" placeholder="이름 또는 별명" value="${esc(A.name)}"></div>
  ${S.map(s=>`<div class="sec"><h2>${s.n?`<span class="n">${s.n}</span>`:`<span class="n d"></span>`}${esc(s.h)}${s.s?`<small>${esc(s.s)}</small>`:""}</h2>${s.q.map(q=>q.sub?`<div class="sub"><i>${q.sub}</i>${esc(q.sh)}</div>`:qHtml(q)).join("")}</div>`).join("")}
  <div class="err" id="err"></div>
  <div class="bar"><div class="in"><span class="st" id="st"></span><button id="send">보내기</button></div></div>`;
  stat();
  app.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; const q=b.closest(".q");
    if(b.id==="send") return send();
    if(!q) return; const id=q.dataset.id; A.a[id]=A.a[id]||{};
    if(b.hasAttribute("data-open")){ const t=document.createElement("textarea"); t.setAttribute("data-m",""); t.placeholder="덧붙일 말이 있으면 날짜와 함께 적어 주세요"; b.replaceWith(t); t.focus(); return; }
    if(b.dataset.v!=null){ const v=b.dataset.v; A.a[id].c = A.a[id].c===v?undefined:v; q.querySelectorAll(".chips button").forEach(x=>x.classList.toggle("on",x.dataset.v===A.a[id].c)); save(); } });
  app.addEventListener("input",e=>{ const t=e.target; if(t.id==="nm"){ A.name=t.value; return save(); }
    if(t.hasAttribute("data-m")){ const id=t.closest(".q").dataset.id; A.a[id]=A.a[id]||{}; A.a[id].m=t.value; save(); } });
}
let svT=null; function save(){ clearTimeout(svT); svT=setTimeout(()=>{ ls.set(DK,A); stat(); },300); }
function filled(){ return QS.filter(q=>{const v=A.a[q.id]; return v&&(v.c||(v.m&&v.m.trim()));}).length; }
function stat(){ const s=$("#st"); if(s) s.textContent=`${QS.length}개 가운데 ${filled()}개 답함`; }
async function send(){ const err=$("#err"), b=$("#send"); err.textContent="";
  if(!filled()){ err.textContent="한 가지 이상 답해 주세요."; return; }
  b.disabled=true; b.textContent="보내는 중…";
  try{ const db=await fb(); const clean={}; for(const q of QS){ const v=A.a[q.id]; if(!v) continue; const o={}; if(v.c) o.c=String(v.c).slice(0,40); if(v.m&&v.m.trim()) o.m=v.m.trim().slice(0,2000); if(o.c||o.m) clean[q.id]=o; }
    await Promise.race([db.collection("trialcheck").add({name:String(A.name||"").trim().slice(0,30),a:JSON.stringify(clean),v:1,at:firebase.firestore.FieldValue.serverTimestamp()}),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),20000))]);
    ls.set(SK,Date.now()); ls.del(DK); A={name:A.name,a:{}};
    app.innerHTML=`<div class="done"><span class="ic">✓</span><h2>보내 주셔서 감사합니다</h2><p>나눠 주신 이야기는 2027 가이드북을 만드는 데 그대로 쓰겠습니다.<br>체험하며 더 생각나는 것이 있으면 다시 보내 주세요.</p><div class="chips" style="justify-content:center;margin-top:22px"><button type="button" onclick="form()">다시 쓰기</button></div></div>`;
  }catch(e){ console.warn(e); b.disabled=false; b.textContent="보내기";
    err.textContent = /permission/i.test(e&&e.code||e&&e.message||"") ? "아직 받을 준비가 되지 않았습니다. 목사님께 알려 주세요. (적은 내용은 이 휴대폰에 남아 있습니다.)" : "보내지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요. (적은 내용은 이 휴대폰에 남아 있습니다.)"; } }

/* ── 결과 보기(관리자) ── */
function admin(){
  app.innerHTML=`<div class="adm"><div class="top"><div class="k">체험판 점검표</div><h1>받은 답 보기</h1><p>관리자 비밀번호로 들어갑니다.</p></div>
  <div class="field"><label for="pw">관리자 비밀번호</label><input type="password" id="pw" autocomplete="current-password"></div>
  <div class="tools"><button id="go">들어가기</button></div><div class="err" id="err"></div><div id="out"></div></div>`;
  $("#go").onclick=async()=>{ const err=$("#err"); err.textContent="";
    try{ const cfg=window.CBSR_FIREBASE_CONFIG; if(!firebase.apps.length) firebase.initializeApp(cfg);
      await firebase.auth().signInWithEmailAndPassword(window.CBSR_ADMIN_EMAIL,$("#pw").value);
      const snap=await firebase.firestore().collection("trialcheck").orderBy("at","desc").get();
      const R=snap.docs.map(d=>{const x=d.data(); let a={}; try{a=JSON.parse(x.a||"{}")}catch(e){} return {id:d.id,name:x.name||"(이름 없음)",at:x.at&&x.at.toDate?x.at.toDate():null,a};});
      show(R);
    }catch(e){ console.warn(e); err.textContent=/permission/i.test(e.code||"")?"읽을 권한이 없습니다. 서버 규칙(firestore.rules)이 올라갔는지 확인해 주세요.":/password|credential|user/i.test(e.code||"")?"비밀번호가 맞지 않습니다.":"불러오지 못했습니다: "+(e.code||e.message); } };
}
function fmt(d){ return d?`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`:""; }
function show(R){ const out=$("#out");
  let h=`<div class="tools"><button id="csv">표 파일로 받기(CSV)</button><span style="align-self:center;font-size:14px;color:var(--sub)">받은 답 ${R.length}개 · 보낸 사람: ${esc([...new Set(R.map(r=>r.name))].join(", "))}</span></div>`;
  for(const s of S){ h+=`<div class="sec"><h2>${s.n?`<span class="n">${s.n}</span>`:`<span class="n d"></span>`}${esc(s.h)}</h2></div>`;
    for(const q of s.q){ if(!q.id) continue; const cnt={}; const mm=[];
      R.forEach(r=>{const v=r.a[q.id]; if(!v) return; if(v.c) cnt[v.c]=(cnt[v.c]||0)+1; if(v.m) mm.push({n:r.name,m:v.m});});
      const opts=q.k==="yn"?YN:q.k==="ch"?q.o:q.k==="sc"?["1","2","3","4","5"]:[];
      h+=`<div class="card"><div style="font-weight:700;font-size:15px">${esc(q.t)}</div>${opts.length?`<div class="cnt">${opts.map(o=>`<span>${esc(o)} <b>${cnt[o]||0}</b></span>`).join("")}</div>`:""}${mm.map(x=>`<div class="mm">${esc(x.m)} <small>— ${esc(x.n)}</small></div>`).join("")}</div>`; } }
  out.innerHTML=h;
  $("#csv").onclick=()=>{ const head=["보낸 때","이름",...QS.flatMap(q=>q.k==="tx"?[q.t]:[q.t,q.t+" (덧붙임)"])];
    const rows=R.map(r=>[fmt(r.at),r.name,...QS.flatMap(q=>{const v=r.a[q.id]||{}; return q.k==="tx"?[v.m||""]:[v.c||"",v.m||""];})]);
    const c=s=>`"${String(s).replace(/"/g,'""')}"`; const csv="﻿"+[head,...rows].map(r=>r.map(c).join(",")).join("\r\n");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download="체험판_점검표_답.csv"; a.click(); };
}
if(new URLSearchParams(location.search).has("admin")) admin(); else form();
</script>
</body></html>
