<style>
/* Layout: 휴대폰 한 손 통독. 요약 → 어려운 말 → 지도 → 본문(접힘) → 한 문제씩 넘기는 퀴즈 순서로 짧게 흐른다 */
:root{
  --paper:#F3F5F1; --card:#FFFFFF; --ink:#1B2420; --muted:#5B6862; --line:#D9E0DA;
  --accent:#2C5C52; --accent-ink:#FFFFFF; --accent-soft:#E2ECE7;
  --gold:#9A6417; --gold-soft:#F5E9D2; --ok:#2F7A4F; --ok-soft:#E1F1E7; --bad:#A4412F; --bad-soft:#F7E4DF;
  --sea:#DCE8EE; --land:#F7F4EC; --coast:#B9C6C0; --water:#6E9DB5;
  --f-text:"Gowun Batang","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --bible-size:17px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111714; --card:#18201C; --ink:#E4EAE6; --muted:#97A49D; --line:#2A3430;
  --accent:#8FC4B5; --accent-ink:#0E1513; --accent-soft:#1C2A26;
  --gold:#E2B562; --gold-soft:#2C2416; --ok:#7FCB9C; --ok-soft:#18291F; --bad:#E58C78; --bad-soft:#2E1C18;
  --sea:#14222A; --land:#1F2723; --coast:#3A4842; --water:#5E8FA8; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111714; --card:#18201C; --ink:#E4EAE6; --muted:#97A49D; --line:#2A3430;
  --accent:#8FC4B5; --accent-ink:#0E1513; --accent-soft:#1C2A26;
  --gold:#E2B562; --gold-soft:#2C2416; --ok:#7FCB9C; --ok-soft:#18291F; --bad:#E58C78; --bad-soft:#2E1C18;
  --sea:#14222A; --land:#1F2723; --coast:#3A4842; --water:#5E8FA8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 40px}
.wrap{max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible,.g:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-text);text-wrap:balance;margin:0}

.top{padding-block:24px 8px;display:grid;gap:4px}
.brand{font-size:12px;letter-spacing:.12em;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.date{font-family:var(--f-text);font-size:27px;font-weight:700;line-height:1.3}
.where{color:var(--muted);font-size:15px}
.where b{color:var(--accent);font-weight:600}
.notice{background:var(--gold-soft);border-radius:8px;padding:9px 12px;font-size:14px;margin-top:6px}
.weeknav{display:flex;align-items:center;gap:8px;margin-top:12px}
.weeknav .wk{flex:1;min-width:0;font-weight:600;font-size:15px}
.weeknav .wk small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;min-width:40px;height:40px;padding:0 10px}
.iconbtn:disabled{opacity:.4}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:10px}
.day{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 2px 6px;text-align:center;display:grid;gap:0;position:relative}
.day .dn{font-size:12px;color:var(--muted)}
.day .dd{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.day .ds{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:16px}
.day.today{border-color:var(--accent)}
.day.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day.sel .dn,.day.sel .ds{color:var(--accent-ink);opacity:.9}
.day.done .ds{color:var(--ok);font-weight:600}
.day.sel.done .ds{color:var(--accent-ink)}
.tabs{display:flex;gap:4px;margin-top:16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{display:grid;gap:22px;padding-top:18px}
.sec{display:grid;gap:10px}
.label{font-size:12px;letter-spacing:.1em;color:var(--accent);font-weight:600}
.sec h2{font-size:22px}
.lead{color:var(--muted);font-size:14px;margin:0}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.step.on{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:600}
.summary{font-family:var(--f-text);font-size:17px;line-height:1.85;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--card)}
button.chip:hover{border-color:var(--accent)}
.chip.term{border-style:dashed;border-color:var(--gold);color:var(--ink)}
.chip small{color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.g{border-bottom:1.5px dotted var(--gold);cursor:pointer}
.g:hover{background:var(--gold-soft)}

/* map */
.mapbox{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#lmap{height:min(62vh,440px);background:#A8C6D6}
.mapbox .cap{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.mlbl{font-family:var(--f-ui);font-size:13px;font-weight:700;color:#1B2420;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff;cursor:pointer;transform:translate(8px,-9px);display:inline-block}
.mlbl.reg{font-weight:500;font-style:italic;letter-spacing:.06em;color:#4b4033;transform:translate(-50%,-50%)}
.mlbl.wat{font-weight:500;font-style:italic;color:#2f6582;font-size:12px;transform:translate(-50%,-50%);cursor:default}
.leaflet-container{font-family:var(--f-ui)}
.leaflet-div-icon{background:none;border:0}
.prog{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.prog .bar{height:10px;background:var(--line);border-radius:99px;position:relative}
.prog .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.prog .bar u{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--gold);border-radius:2px}
.prog .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.prog .top b{font-family:var(--f-text);font-size:24px;font-variant-numeric:tabular-nums}
.done-card{background:var(--ok-soft);border-radius:14px;padding:16px;display:grid;gap:8px;text-align:center}
.done-card b{font-family:var(--f-text);font-size:34px;color:var(--ok);font-variant-numeric:tabular-nums}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.qcard .k{font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.06em}
.qcard p{margin:0}
.clue{font-size:13.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.trait{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.trait b{color:var(--accent)}
.trait q{font-family:var(--f-text);quotes:none}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:64px;resize:vertical}
.keyv{font-family:var(--f-text);background:var(--gold-soft);border-radius:10px;padding:12px 14px;font-size:16.5px;line-height:1.8}
.keyv small{display:block;font-family:var(--f-ui);font-size:12px;color:var(--gold);font-weight:600}
.prayer{font-family:var(--f-text);font-size:16px;line-height:1.85;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0}
.pmini{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);cursor:pointer}
.pmini b{color:var(--accent);font-variant-numeric:tabular-nums}
.pmini .bar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.pmini .bar i{display:block;height:100%;background:var(--accent)}
.pmini .more{font-size:12px}
.kw{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:12px}
.kw-title{font-size:13px;font-weight:600;color:var(--muted)}
.kwrow{display:grid;gap:6px}
.kwrow p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
.kwrow p b{color:var(--accent);margin-right:6px}
.chip.lw{border-color:var(--accent);color:var(--accent);font-weight:600}
.chip.em{border-color:var(--bad);color:var(--bad)}
.rleg{display:flex;flex-wrap:wrap;gap:4px 12px}
.rleg span{display:inline-flex;align-items:center;gap:5px}
.rleg i{display:inline-block;width:20px;border-top:3px dashed}
.rarrow{display:inline-block;width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:10px solid;transform-origin:50% 50%}
.mlbl.rte{font-size:11.5px;font-weight:600;color:#3a2c4a}
.chip.inc{border-color:var(--gold);color:var(--gold);font-weight:600}
.sheet .vq{font-family:var(--f-text);background:var(--paper);border-radius:8px;padding:10px 12px}
.sheet .vq b{font-family:var(--f-ui);font-size:12px;color:var(--gold)}
.chip.nm{border-color:var(--accent);border-style:dotted}
.g.nm{border-bottom-color:var(--accent)}
.chip.cl{border-color:#7A5AA8;color:#6a4a98}
.arc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.arc>b{font-family:var(--f-text);font-size:19px}
.arcflow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14.5px}
.arcflow span{background:var(--accent-soft);border-radius:8px;padding:6px 10px;flex:1 1 140px;min-width:0}
.arcflow i{font-style:normal;color:var(--accent);font-weight:700}
.arc .vq{font-family:var(--f-text);background:var(--paper);border-radius:8px;padding:10px 12px;margin:0;font-size:15px}
.arc .vq b,.gapq .k{font-family:var(--f-ui);font-size:12px;color:var(--gold)}
.gapq{border-color:var(--gold)}
.acct{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.acct p{margin:0}
.acctform{display:flex;gap:8px;flex-wrap:wrap}
.acctform input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px;flex:1 1 120px;min-width:0}
.acctform #acctPin{flex:0 1 110px;letter-spacing:.3em}
.church{font-size:14px;color:var(--ok);font-weight:600}
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;

  for(const n of PEOPLE) if(!map.has(n)) map.set(n,{name:n,type:"person"});
  const names=[...map.keys()].sort((a,b)=>b.length-a.length);
  const re=new RegExp("(?<![가-힣])("+names.map(escRe).join("|")+")(?="+PARTICLE+"?(?![가-힣]))","g");
  return {map,re};
}
function buildGlossIndex(GLOSSARY){
  const items=GLOSSARY.map(([t,d,scope],i)=>({t,d,scope,i}));
  const terms=items.map(x=>x.t).sort((a,b)=>b.length-a.length);
  const re=new RegExp("(?<![가-힣])("+terms.map(escRe).join("|")+")(?="+PARTICLE+"?(?![가-힣])|하[는며고여]|하던|하신|하라|하면|하였)","g");
  const by=new Map(items.map(x=>[x.t,x]));
  return {re,by};
}
function inScope(item,b){
  if(!item.scope) return true;
  for(let i=0;i<item.scope.length;i+=2) if(b>=item.scope[i]&&b<=item.scope[i+1]) return true;
  return false;
}


/* 받침에 맞춰 조사 고치기 */
const JOSA=[["이","가"],["은","는"],["을","를"],["과","와"],["으로","로"],["이여","여"],["아","야"],["이라","라"],["이요","요"],["이며","며"],["이니","니"],["이나","나"]];
const JOSA_RE="(이여|이라|이요|이며|이니|이나|으로|이|가|은|는|을|를|과|와|로|여|아|야|라|요|며|니|나)?";
const hasB=w=>{const c=w.charCodeAt(w.length-1)-0xAC00;return c>=0&&c<11172&&c%28!==0;};
function fixJosa(newName,j){ if(!j) return ""; for(const [a,b] of JOSA){ if(j===a||j===b) return hasB(newName)?a:b; } return j; }
function blankJosa(j){ if(!j) return ""; for(const [a,b] of JOSA){ if(j===a||j===b) return a+"/"+b; } return j; }
function swapName(text,name,newName){ return text.replace(new RegExp("(?<![가-힣])"+escRe(name)+JOSA_RE+"(?![가-힣])","g"),(m,j)=>newName+fixJosa(newName,j)); }
function blankName(text,name){ return text.replace(new RegExp("(?<![가-힣])"+escRe(name)+JOSA_RE+"(?![가-힣])","g"),(m,j)=>"(　　)"+blankJosa(j)); }
const honor=(t,e)=>t.slice(e.idx+e.name.length).startsWith("께");

/* 하루 본문 분석 */
function analyzeDay(chs, BIBLE, EI){
  const verses=[];
  for(const [b,c] of chs) BIBLE[b-1][c-1].forEach((t,i)=>verses.push({b,c,v:i+1,t,ents:[]}));
  const people=new Map(), places=new Map();
  for(const vs of verses){
    EI.re.lastIndex=0; let m;
    while((m=EI.re.exec(vs.t))){
      const e=EI.map.get(m[1]); vs.ents.push({name:m[1],type:e.type,idx:m.index});
      const tgt=e.type==="person"?people:places;
      if(!tgt.has(m[1])) tgt.set(m[1],{name:m[1],n:0,refs:[]});
      const r=tgt.get(m[1]); r.n++; if(r.refs.length<8) r.refs.push([vs.b,vs.c,vs.v]);
    }
  }
  return {verses,people,places,text:verses.map(v=>v.t).join(" ")};
}

/* 난수 */
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
function shuffle(r,arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const ALIAS=[["아브람","아브라함"],["사래","사라"],["시몬","베드로"],["사울","바울"]];
const sameish=(a,b)=>a===b||ALIAS.some(g=>g.includes(a)&&g.includes(b));
const FALLBACK_OT=["모세","다윗","아브라함","솔로몬","엘리야","사무엘","여호수아","이삭","요셉","야곱","사울","이사야"];
const FALLBACK_NT=["베드로","요한","야고보","바울","바나바","빌립","도마","마태","안드레","디모데","실라","마리아"];
const FALLBACK_PL=["예루살렘","베들레헴","애굽","바벨론","갈릴리","사마리아","여리고","가버나움","다메섹","니느웨","헤브론","벧엘"];

function chapLabel(b,c){return b===19?`${c}편`:`${c}장`;}
function refStr(PLANINFO,b,c,v){return `${PLANINFO.abbr[b-1]} ${c}:${v}`;}

/* 문장 자르기 */
function snippetAround(t,idx,max){
  if(t.length<=max) return t;
  const words=t.split(" "); let pos=0, wi=0;
  for(;wi<words.length;wi++){ if(pos+words[wi].length>=idx) break; pos+=words[wi].length+1; }
  let s=wi, e=wi+1, len=words[wi].length;
  while(true){
    let grew=false;
    if(e<words.length && len+words[e].length+1<=max){len+=words[e].length+1;e++;grew=true;}
    if(s>0 && len+words[s-1].length+1<=max){s--;len+=words[s].length+1;grew=true;}
    if(!grew) break;
  }
  return (s>0?"… ":"")+words.slice(s,e).join(" ")+(e<words.length?" …":"");
}
function trimTail(q){
  return q.replace(/\s(하니|하시니|하매|하시매|하거늘|하시거늘|하더라|하시더라|하고|하시고|하므로|하시므로|하였더니|하였으나|하는지라|하시는지라)$/,"").trim();
}

/* ── 문제 만들기 ── */
function makeQuiz(day, ctx, seed, opts={}){
  const r=rng(seed), A=day, b0=day.verses[0].b;
  const NT=b0>=40;
  const used=new Set();
  const nOX=opts.nOX??3, nMC=opts.nMC??3;
  const peopleDay=[...A.people.values()].sort((x,y)=>y.n-x.n).map(x=>x.name);
  const placesDay=[...A.places.values()].sort((x,y)=>y.n-x.n).map(x=>x.name);
  const bookPeople=ctx.bookPeople(b0), bookPlaces=ctx.bookPlaces(b0);
  function distract(answer, pool1, pool2, pool3, n=3){
    const out=[];
    for(const pool of [shuffle(r,pool1),shuffle(r,pool2),shuffle(r,pool3)])
      for(const x of pool){ if(out.length>=n) break; if(!sameish(x,answer)&&!out.some(o=>sameish(o,x))) out.push(x); }
    return out.length===n?out:null;
  }
  const C=(b,c)=>chapLabel(b,c);
  const gens={
    speaker(){
      const cands=[];
      const VERB="(이르되|이르시되|대답하되|대답하여 이르되|대답하여 이르시되|말하되|여짜오되|이르기를|대답하기를|가로되)";
      for(const vs of A.verses) for(const e of vs.ents){ if(e.type!=="person") continue;
        const after=vs.t.slice(e.idx+e.name.length);
        const m=after.match(new RegExp("^(이|가|께서|은|는)\\s(?:[^\\s]+\\s){0,3}?"+VERB+"\\s(.+)$"));
        if(!m) continue;
        let q=trimTail(m[3]); if(q.length<10) continue;
        if(q.includes(e.name)) continue;
        if(q.length>70){ q=snippetAround(q,0,66); }
        cands.push({vs,name:e.name,q});
      }
      if(!cands.length) return null;
      const c=pick(r,cands); if(used.has(c.vs)) return null;
      const speakers=[...new Set(cands.map(x=>x.name))];
      const ds=distract(c.name,speakers,peopleDay,bookPeople.concat(NT?FALLBACK_NT:FALLBACK_OT)); if(!ds) return null;
      used.add(c.vs);
      const o=shuffle(r,[c.name,...ds]);
      return {t:"mc",kind:"말한 사람",q:"다음 말을 한 사람은 누구일까요?",quote:c.q,o,a:o.indexOf(c.name),vs:c.vs,
        hint:`${C(c.vs.b,c.vs.c)}의 대화입니다. 이 말을 듣고 있는 사람이 누구였는지, 그 앞뒤 장면을 떠올려 보세요.`};
    },
    personCloze(){
      const cands=A.verses.filter(vs=>!used.has(vs)&&vs.t.length>=20&&!vs.t.startsWith("[")&&vs.ents.some(e=>e.type==="person"&&!honor(vs.t,e)&&!vs.ents.some(x=>x.name===e.name&&honor(vs.t,x))));
      if(!cands.length) return null;
      const vs=pick(r,cands); const pe=vs.ents.filter(e=>e.type==="person"&&!vs.ents.some(x=>x.name===e.name&&honor(vs.t,x))); const e=pick(r,pe);
      const sn=snippetAround(vs.t,e.idx,90);
      const blank=blankName(sn,e.name);
      if(!blank.includes("(　　)")) return null;
      const ds=distract(e.name,peopleDay.filter(n=>!vs.ents.some(x=>x.name===n)),bookPeople,NT?FALLBACK_NT:FALLBACK_OT); if(!ds) return null;
      used.add(vs); const o=shuffle(r,[e.name,...ds]);
      return {t:"mc",kind:"인물",q:"빈칸에 들어갈 사람은 누구일까요?",quote:blank,o,a:o.indexOf(e.name),vs,
        hint:`${C(vs.b,vs.c)}에서 이 일이 벌어질 때 곁에 있던 사람들을 떠올려 보세요. 누가 무엇을 했나요?`};
    },
    placeCloze(){
      const cands=A.verses.filter(vs=>!used.has(vs)&&vs.t.length>=18&&vs.ents.some(e=>e.type==="place"));
      if(!cands.length) return null;
      const vs=pick(r,cands); const e=pick(r,vs.ents.filter(x=>x.type==="place"));
      const sn=snippetAround(vs.t,e.idx,90); const blank=blankName(sn,e.name);
      if(!blank.includes("(　　)")) return null;
      const ds=distract(e.name,placesDay.filter(n=>!vs.ents.some(x=>x.name===n)),bookPlaces,FALLBACK_PL); if(!ds) return null;
      used.add(vs); const o=shuffle(r,[e.name,...ds]);
      return {t:"mc",kind:"장소",q:"빈칸에 들어갈 곳은 어디일까요?",quote:blank,o,a:o.indexOf(e.name),vs,
        hint:`이 일이 어디서 일어났는지 ${C(vs.b,vs.c)}의 흐름을 떠올려 보세요. 위의 지도에서 오늘 나온 곳들을 다시 살펴봐도 좋습니다.`};
    },
    chapter(){
      const chs=[...new Set(A.verses.map(v=>v.b+"-"+v.c))]; if(chs.length<4) return null;
      const cands=A.verses.filter(vs=>!used.has(vs)&&vs.t.length>=25&&vs.t.length<=110&&A.text.split(vs.t.slice(0,18)).length===2);
      if(!cands.length) return null;
      const vs=pick(r,cands); const key=vs.b+"-"+vs.c; const multi=new Set(A.verses.map(v=>v.b)).size>1;
      const others=shuffle(r,chs.filter(k=>k!==key)).slice(0,3);
      const o=shuffle(r,[key,...others]).map(k=>{const [b,c]=k.split("-").map(Number);return {k,label:(multi?ctx.abbr[b-1]+" ":"")+C(b,c)};});
      used.add(vs);
      return {t:"mc",kind:"어디에",q:`다음 말씀은 오늘 본문 몇 ${vs.b===19?"편":"장"}에 있을까요?`,quote:snippetAround(vs.t,0,90),o:o.map(x=>x.label),a:o.findIndex(x=>x.k===key),vs,
        hint:"오늘 요약을 다시 읽어 보세요. 이 말씀의 앞뒤에는 어떤 내용이 있었나요?"};
    },
    phraseMC(){
      const v=splitCands(); if(!v) return null;
      const {vs,first,second,pool}=v;
      const ds=shuffle(r,pool).filter(x=>x!==second&&!A.text.includes(first+" "+x)).slice(0,3); if(ds.length<3) return null;
      used.add(vs); const o=shuffle(r,[second,...ds]);
      return {t:"mc",kind:"말씀 잇기",q:"다음 말씀의 뒷부분으로 알맞은 것은?",quote:first+" …",o,a:o.indexOf(second),vs,
        hint:`앞부분의 뜻과 자연스럽게 이어지는지 생각해 보세요. ${C(vs.b,vs.c)} 근처의 말씀입니다.`};
    },
    nameOX(){
      const cands=A.verses.filter(vs=>!used.has(vs)&&vs.t.length>=20&&!vs.t.startsWith("[")&&new Set(vs.ents.filter(e=>e.type==="person").map(e=>e.name)).size===1&&!vs.ents.some(e=>honor(vs.t,e)));
      if(!cands.length) return null;
      const vs=pick(r,cands); const e=vs.ents.find(x=>x.type==="person");
      const sn=snippetAround(vs.t,e.idx,85);
      const truth=r()<0.5;
      let stmt=sn, swapped=null;
      if(!truth){
        if(e.name==="예수") return null;
        const ds=distract(e.name,peopleDay.filter(n=>n!=="예수"),bookPeople.filter(n=>n!=="예수"),NT?FALLBACK_NT:FALLBACK_OT,1); if(!ds) return null;
        swapped=ds[0]; stmt=swapName(sn,e.name,swapped);
        if(A.text.includes(stmt.replace(/^… | …$/g,""))) return null;
      }
      used.add(vs);
      return {t:"ox",kind:"인물 확인",q:"본문의 내용과 맞으면 O, 틀리면 X를 고르세요.",quote:stmt,o:["O","X"],a:truth?0:1,vs,
        hint: truth?`이 문장의 사람과 행동을 ${C(vs.b,vs.c)}에서 다시 떠올려 보세요. 정말 다른 사람이었나요?`
                   :`문장 속 사람 이름을 눈여겨보세요. ${C(vs.b,vs.c)}에서 이 일을 한 사람이 정말 그 사람이었나요?`};
    },
    orderOX(){
      const pool=A.verses.filter(vs=>!used.has(vs)&&vs.t.length>=18);
      if(pool.length<10) return null;
      for(let tries=0;tries<20;tries++){
        const x=pick(r,pool), y=pick(r,pool);
        const gx=A.verses.indexOf(x), gy=A.verses.indexOf(y);
        const far=(x.c!==y.c||x.b!==y.b)||Math.abs(gx-gy)>=8;
        if(!far||x===y) continue;
        const [p,q]=gx<gy?[x,y]:[y,x];
        const sp=snippetAround(p.t,0,42), sq=snippetAround(q.t,0,42);
        const truth=r()<0.5;
        used.add(x);used.add(y);
        const [s1,s2]=truth?[sp,sq]:[sq,sp];
        return {t:"ox",kind:"순서",q:"두 장면의 순서가 맞으면 O, 틀리면 X를 고르세요.",quote:`‘${s1}’\n이 장면이 먼저 나오고, 그다음에\n‘${s2}’`,o:["O","X"],a:truth?0:1,vs:p,
          hint:"두 장면이 각각 몇 장쯤에 있었는지 떠올려 보세요. 오늘 요약의 흐름을 따라가 보면 순서가 보입니다."};
      }
      return null;
    },
    phraseOX(){
      const v=splitCands(); if(!v) return null;
      const {vs,first,second,pool}=v; const truth=r()<0.5; let tail=second;
      if(!truth){ const alt=shuffle(r,pool).find(x=>x!==second&&!A.text.includes(first+" "+x)); if(!alt) return null; tail=alt; }
      used.add(vs);
      return {t:"ox",kind:"말씀 확인",q:"본문에 있는 그대로의 말씀이면 O, 뒷부분이 바뀌었으면 X를 고르세요.",quote:first+" "+tail,o:["O","X"],a:truth?0:1,vs,
        hint:truth?"앞부분과 뒷부분의 뜻이 정말 어긋나나요? 문장을 천천히 다시 읽어 보세요.":`앞부분이 말하는 내용과 뒷부분이 같은 이야기인가요? ${C(vs.b,vs.c)} 근처를 떠올려 보세요.`};
    }
  };
  function splitCands(){
    const cands=A.verses.filter(vs=>!used.has(vs)&&vs.t.length>=34&&vs.t.length<=120);
    const parts=[];
    for(const vs of cands){
      const sp=[...vs.t.matchAll(/ /g)].map(m=>m.index); if(!sp.length) continue;
      const mid=vs.t.length*0.55; let best=sp[0]; for(const i of sp) if(Math.abs(i-mid)<Math.abs(best-mid)) best=i;
      const first=vs.t.slice(0,best), second=vs.t.slice(best+1);
      if(second.length<10||second.length>55||first.length<12) continue;
      if(A.text.split(second).length!==2) continue;
      parts.push({vs,first,second});
    }
    if(parts.length<4) return null;
    const c=pick(r,parts);
    const L=c.second.length;
    const pool=parts.filter(p=>p!==c&&p.second.length>=L*0.55&&p.second.length<=L*1.6).map(p=>p.second);
    return pool.length>=3?{...c,pool}:null;
  }
  const out=[];
  const cur=(opts.curated||[]).slice();
  const curMC=cur.filter(q=>q.t==="mc"), curOX=cur.filter(q=>q.t==="ox");
  const mcOrder=shuffle(r,["speaker","speaker","personCloze","placeCloze","chapter"]).concat(["phraseMC","personCloze","placeCloze","chapter","phraseMC","speaker"]);
  const oxOrder=shuffle(r,["nameOX","nameOX","orderOX","phraseOX"]).concat(["orderOX","phraseOX","nameOX","phraseOX","orderOX"]);
  function fill(order,n,base){
    const res=base.slice(0,n);
    for(const g of order){ if(res.length>=n) break; let q=null; for(let k=0;k<3&&!q;k++) q=gens[g](); if(q) res.push(q); }
    return res;
  }
  const mcs=fill(mcOrder,nMC,shuffle(r,curMC).slice(0,2));
  const oxs=fill(oxOrder,nOX,shuffle(r,curOX).slice(0,2));
  // 모자라면 다른 쪽으로 채우기
  while(mcs.length+oxs.length<nMC+nOX){
    const q=gens.phraseOX()||gens.orderOX()||gens.phraseMC(); if(!q) break; (q.t==="mc"?mcs:oxs).push(q);
  }
  for(let i=0;i<Math.max(mcs.length,oxs.length);i++){ if(oxs[i]) out.push(oxs[i]); if(mcs[i]) out.push(mcs[i]); }
  return out;
}

["율법교사","율법을 연구하고 가르치던 전문가입니다. 서기관과 거의 같은 사람들입니다."],

["헤롯당","헤롯 왕가와 로마 편에 섰던 유대인들입니다. 예수님을 없애려고 바리새인과 손을 잡기도 했습니다."],
["공회","유대인의 최고 의회입니다. 대제사장을 의장으로 71명이 모여 종교와 생활 문제를 재판했습니다(산헤드린)."],
["세리","로마를 위해 세금을 걷던 유대인입니다. 정해진 것보다 더 걷어 부자가 되는 일이 많아 동족에게 배신자로 미움받았습니다."],
["사마리아 사람","옛 북이스라엘 땅에 살던 사람들로, 앗수르가 데려온 이방인과 섞여 살았습니다. 유대인은 이들과 왕래하지 않았습니다."],
["이방인","유대인이 아닌 모든 민족을 가리키는 말입니다."],
["헬라인","그리스 말과 문화를 따르는 사람입니다. 신약에서는 흔히 '유대인이 아닌 사람'을 대표하는 말로 쓰입니다."],
["대제사장","제사장들의 우두머리입니다. 일 년에 한 번 속죄일에 지성소에 들어갈 수 있었습니다. 예수님 시대에는 종교와 정치 권력을 함께 쥐었습니다."],
["레위인","레위 지파 사람들입니다. 땅을 분배받지 않고 성막과 성전 일을 맡았습니다. 제사장은 그 가운데 아론의 자손입니다."],
["레위 사람","레위 지파 사람들입니다. 땅을 분배받지 않고 성막과 성전 일을 맡았습니다."],
["선견자","'보는 사람'이라는 뜻으로, 선지자를 부르던 옛 이름입니다(삼상 9:9)."],
["나실인","하나님께 특별히 자신을 구별해 드리기로 서원한 사람입니다. 그 기간에는 포도주를 마시지 않고, 머리를 자르지 않고, 시체를 가까이하지 않았습니다(민 6장)."],
["백부장","로마 군대에서 100명쯤 되는 군인을 거느린 장교입니다."],
["천부장","1,000명쯤 되는 군인을 거느린 지휘관입니다."],
["총독","로마가 속주를 다스리라고 보낸 관리입니다. 빌라도, 벨릭스, 베스도가 유대 총독이었습니다."],
["분봉 왕","로마의 허락을 받아 나라의 일부를 다스리던 왕입니다. 세례 요한을 죽인 헤롯 안디바가 갈릴리의 분봉 왕이었습니다."],
["가이사","로마 황제를 부르던 칭호입니다('카이사르')."],
["헤롯","신약에는 여러 헤롯이 나옵니다. 아기 예수 때의 헤롯 대왕, 세례 요한을 죽인 아들 헤롯 안디바, 야고보를 죽인 손자 헤롯 아그립바 1세입니다.",NT],
["사도","'보냄을 받은 사람'이라는 뜻입니다. 예수님이 직접 세우신 열두 제자와 바울을 가리킵니다."],
["장로","공동체를 이끄는 나이 든 지도자입니다. 교회에서는 성도를 돌보고 다스리는 직분이 되었습니다."],
["감독","'살펴보는 사람'이라는 뜻으로, 교회를 돌보는 지도자입니다. 장로와 거의 같은 직분입니다.",[45,66]],
["집사","'섬기는 사람'이라는 뜻으로, 교회의 살림과 구제를 맡은 직분입니다.",[45,66]],

["유월절","이스라엘이 애굽에서 나오던 밤, 어린양의 피를 바른 집은 죽음의 재앙이 '넘어갔던' 일을 기념하는 절기입니다. 봄(3–4월)에 지킵니다."],
["무교절","유월절에 이어 7일 동안 누룩 없는 빵을 먹으며 애굽에서 급히 나온 일을 기억하는 절기입니다."],
["초막절","광야에서 장막에 살던 일을 기억하며 7일 동안 초막(나뭇가지로 지은 임시 집)에서 지내는 가을 추수 절기입니다."],
["칠칠절","유월절 뒤 일곱 주가 지나 지키는 밀 추수 감사 절기입니다. 50일째라는 뜻에서 '오순절'이라고도 합니다."],
["오순절","유월절 뒤 50일째 지키는 추수 절기입니다(칠칠절). 이날 예루살렘에 성령이 오셨습니다(행 2장)."],
["수전절","마카비 시대에 더럽혀진 성전을 다시 깨끗하게 하여 봉헌한 일을 기념하는 겨울 절기입니다(하누카)."],
["안식일","일주일의 일곱째 날로, 일을 쉬고 하나님을 기억하는 날입니다. 금요일 해 질 때부터 토요일 해 질 때까지입니다."],
["안식년","7년마다 한 해씩 땅을 쉬게 하고 빚을 면제해 주는 해입니다."],
["희년","50년마다 돌아오는 해방의 해입니다. 종은 풀려나고, 팔았던 땅은 원래 주인에게 돌아갑니다(레 25장)."],
["할례","남자아이의 몸에 표를 내어 하나님과 맺은 언약의 백성임을 나타내는 의식입니다. 아브라함 때 시작되었습니다(창 17장)."],

["맏물","그해 처음 거둔 열매나 곡식입니다. 가장 먼저, 가장 좋은 것을 하나님께 드렸습니다."],
["도피성","실수로 사람을 죽인 사람이 복수를 피해 몸을 숨길 수 있도록 정해 둔 여섯 성읍입니다."],
["기업 무를 자","가난해서 땅을 팔았거나 종이 된 친척을 대신 값을 치르고 되찾아 주는 가까운 친족입니다. 룻기의 보아스가 대표적입니다."],

["누룩","빵을 부풀게 하는 발효제입니다. 성경에서는 퍼져 가는 힘, 특히 퍼져 가는 죄나 거짓 가르침을 비유하는 데 자주 쓰입니다."],
["우슬초","작은 풀 다발입니다. 피나 물을 찍어 뿌리는 데 썼고, 정결하게 하는 의식에 쓰였습니다."],

["나드","인도에서 들여오는 아주 비싼 향유입니다. 한 근이면 일 년 품삯에 가까웠습니다."],
["옥합","향유를 담는 작은 돌병입니다. 목을 깨뜨려 쏟아 부었습니다."],
/* 성막과 성전 */
["성막","광야에서 하나님이 백성 가운데 함께 계시는 곳으로 지은 이동식 성소(텐트)입니다."],
["회막","'만남의 장막'이라는 뜻으로, 성막을 가리키는 다른 이름입니다."],
["언약궤","십계명 두 돌판을 넣은 나무 상자입니다. 금으로 쌌고 지성소에 두었습니다. 하나님이 함께하심의 상징입니다."],
["증거궤","언약궤의 다른 이름입니다. 언약의 증거인 돌판을 넣었기 때문입니다."],

["성소","성막과 성전에서 지성소 앞의 방입니다. 등잔대, 진설병 상, 분향단이 있었습니다."],
["휘장","성소와 지성소 사이를 가린 두꺼운 천입니다. 예수님이 숨지실 때 위에서 아래로 찢어졌습니다."],

["우림","대제사장이 하나님의 뜻을 물을 때 쓰던 도구입니다(둠밈과 함께). 정확한 모양은 알려져 있지 않습니다."],
["둠밈","대제사장이 하나님의 뜻을 물을 때 우림과 함께 쓰던 도구입니다."],
["산당","언덕 위에 세운 제단입니다. 이방 신을 섬기거나 정해진 곳 밖에서 제사하는 장소가 되어 자주 책망받았습니다."],

["바알","가나안 사람들이 비와 풍요를 준다고 믿고 섬긴 신입니다. 이스라엘이 가장 자주 빠진 우상입니다."],
["아세라","가나안의 여신, 또는 그 여신을 상징하는 나무 기둥입니다."],
["몰렉","암몬 사람들의 신입니다. 아이를 불에 태워 바치는 끔찍한 제사를 드렸습니다."],
["그모스","모압 사람들의 신입니다."],
["드라빔","집에 두던 작은 가족 신상입니다."],
["바알세불","'파리의 왕'이라는 뜻으로, 귀신의 우두머리를 가리키는 말로 쓰였습니다."],
["그룹","하나님의 보좌를 지키는 날개 달린 천사 같은 존재입니다(케루빔). 언약궤 뚜껑 위에도 새겨졌습니다.",OT],
["스랍","하나님의 보좌 둘레에서 찬양하는 여섯 날개를 가진 천사입니다(사 6장)."],
["사탄","'대적하는 자'라는 뜻입니다. 하나님과 사람을 대적하는 악한 영적 존재입니다."],
["마귀","'비방하는 자'라는 뜻으로, 사탄을 가리킵니다."],
["스올","죽은 사람들이 가는 곳을 가리키는 구약의 말입니다. '무덤', '죽음의 세계'라는 뜻입니다."],

["무저갱","'바닥이 없는 구렁'이라는 뜻으로, 악한 영들이 갇히는 곳입니다."],
["낙원","'동산'이라는 뜻으로, 죽은 의인들이 하나님과 함께 있는 곳을 가리킵니다."],
["아마겟돈","'므깃도 산'이라는 뜻입니다. 마지막 큰 전쟁이 일어날 곳으로 계시록에 나옵니다."],
["대접","계시록에서 하나님의 진노를 쏟는 넓은 그릇입니다. 일곱 대접 심판이 이어집니다.",[66,66]],
/* 말과 표현 */
["인자","'사람의 아들'이라는 뜻입니다. 에스겔에게는 '사람아'라는 부름이고, 예수님은 다니엘 7장의 하늘 구름을 타고 오시는 분을 가리켜 자신을 이렇게 부르셨습니다.",[26,27,40,44,58,58,66,66]],
["메시야","'기름부음 받은 자'라는 뜻의 히브리 말입니다. 헬라 말로 '그리스도'입니다."],
["임마누엘","'하나님이 우리와 함께 계신다'는 뜻입니다(사 7:14, 마 1:23)."],
["랍비","'나의 선생님'이라는 뜻으로, 유대인이 율법 선생을 높여 부르던 말입니다."],
["랍오니","'나의 선생님'이라는 뜻의 아람어입니다. 막달라 마리아가 부활하신 예수님을 이렇게 불렀습니다."],
["호산나","'지금 구원하소서'라는 뜻입니다. 예루살렘에 들어가시는 예수님을 무리가 이렇게 외치며 맞았습니다."],
["아멘","'참으로 그렇습니다', '그대로 되기를 원합니다'라는 뜻입니다."],

"아하시야 왕이 에그론의 바알세붑에게 묻다가 죽고, 엘리야는 회오리바람을 타고 하늘로 올라가며 엘리사가 갑절의 영감을 구합니다. 엘리사는 여리고의 물을 고치고, 모압과의 전쟁에서 물을 주십니다. 과부의 기름 그릇을 채우고, 수넴 여인의 죽은 아들을 살리고, 독이 든 국을 고칩니다.",
"아람의 군대 장관 나아만은 요단 강에 일곱 번 몸을 씻고 나병이 낫지만, 게하시는 욕심을 부리다 나병에 걸립니다. 엘리사는 물에 빠진 쇠도끼를 떠오르게 하고, 아람 군대의 눈을 어둡게 하며, 사마리아가 포위된 극심한 기근 때 하루 만에 양식이 넘칠 것을 예언합니다. 엘리사의 말대로 하사엘이 아람 왕이 됩니다.",
"엘리사의 제자가 예후에게 기름을 붓고, 예후는 요람과 아하시야를 죽이고 이세벨을 창밖으로 던지게 합니다. 예후는 아합의 집안과 바알 숭배자들을 없애지만 금송아지는 그대로 둡니다. 남유다에서는 아달랴가 왕족을 죽이고 다스리다가, 숨겨 두었던 일곱 살 요아스가 왕이 되어 성전을 수리합니다.",
"엘리사는 죽기 전 왕에게 화살을 쏘게 하고, 죽은 뒤에도 그 뼈에 닿은 시체가 살아납니다. 남유다의 아마샤, 아사랴, 요담과 북이스라엘의 여로보암 등 여러 왕이 이어지고, 북쪽에서는 반역이 거듭됩니다. 남유다 아하스는 앗수르에 도움을 청하고 다메섹의 제단을 본떠 성전에 들입니다.",
"북이스라엘은 하나님을 떠나 우상을 섬긴 끝에 앗수르에게 멸망하고, 사마리아에는 이방 사람들이 옮겨와 섞여 삽니다. 남유다의 히스기야는 개혁을 하고, 앗수르 왕 산헤립이 예루살렘을 위협하자 이사야와 함께 기도하여 하룻밤에 앗수르 군대 185,000명이 죽습니다. 병든 히스기야는 생명을 15년 더 얻지만, 바벨론 사신들에게 보물을 다 보여 줍니다.",
"므낫세는 온갖 우상을 섬기며 예루살렘을 피로 가득 채우고, 아몬도 그 길을 따릅니다. 요시야 때 성전에서 율법책이 발견되어 큰 개혁과 유월절이 이루어지지만 심판은 돌이켜지지 않습니다. 바벨론이 예루살렘을 무너뜨리고 성전을 불태우며 백성을 사로잡아 가고, 마지막에 여호야긴 왕이 감옥에서 풀려납니다."
],[ // 13 대상

"성전 문지기와 곳간 맡은 사람들, 군대와 지파 지도자들이 정리됩니다. 다윗은 지도자들 앞에서 성전 설계도를 솔로몬에게 주고, 백성은 기쁜 마음으로 예물을 드립니다. 다윗은 \"모든 것이 주께로 말미암았사오니\"라고 찬양하고, 솔로몬이 왕이 된 뒤 다윗은 죽습니다."
],[ // 14 대하
"솔로몬은 기브온에서 지혜를 구하고, 두로 왕 후람의 도움을 받아 모리아 산에 성전을 짓습니다. 언약궤를 성전에 들이고 노래하자 구름이 성전에 가득합니다. 솔로몬은 봉헌 기도를 드립니다.",
"하늘에서 불이 내려와 제물을 사르고, 하나님은 \"내 이름으로 일컫는 내 백성이 그들의 악한 길에서 떠나 스스로 낮추고 기도하여 내 얼굴을 찾으면\" 땅을 고치겠다고 하십니다. 스바 여왕의 방문과 솔로몬의 영화가 이어지고, 솔로몬이 죽자 나라가 나뉩니다. 르호보암은 율법을 버렸다가 애굽 왕 시삭의 침략을 받고 스스로 낮춥니다.",

"아마샤는 에돔을 이긴 뒤 그 신들을 섬기고, 웃시야는 강성해지자 교만하여 직접 분향하다 나병에 걸립니다. 아하스는 우상을 섬기고 성전 문을 닫지만, 히스기야는 성전을 깨끗하게 하고 예배를 회복합니다. 히스기야는 온 이스라엘을 불러 큰 유월절을 지킵니다.",

],[ // 15 스 느 에

],[ // 16 욥

"빌닷은 하나님이 정의를 굽게 하지 않으시니 회개하라고 하고, 욥은 하나님과 자기 사이에 판결할 중재자가 없다고 탄식합니다. 소발은 욥을 더 몰아붙이고, 욥은 친구들을 쓸모없는 의원이라 부르며 하나님께 직접 따지겠다고 합니다. 욥은 짧은 인생과 죽음 너머의 소망을 생각합니다.",

"엘리바스는 욥이 가난한 사람을 학대했을 것이라고 비난하고, 욥은 하나님을 찾을 수 없어 답답해하면서도 \"그가 나를 단련하신 후에는 내가 순금 같이 되어 나오리라\"고 말합니다. 빌닷의 짧은 말 뒤에 욥은 하나님의 크심을 말합니다. 28장은 지혜가 어디 있는지 묻고 \"주를 경외함이 지혜\"라고 답합니다.",
"욥은 존경받던 지난날을 그리워하고, 지금 조롱당하는 처지를 슬퍼하며, 자기가 깨끗하게 살았다고 맹세합니다. 젊은 엘리후가 나서서 욥과 친구들 모두에게 화를 내며, 하나님은 고난을 통해서도 사람을 가르치신다고 말합니다.",
"엘리후의 말이 끝나자 하나님이 폭풍우 가운데서 욥에게 말씀하십니다. \"내가 땅의 기초를 놓을 때에 네가 어디 있었느냐\"로 시작해 별과 바다와 짐승들, 베헤못과 리워야단을 보여 주십니다. 욥은 \"내가 주께 대하여 귀로 듣기만 하였사오나 이제는 눈으로 주를 뵈옵나이다\"라며 회개하고, 하나님은 욥을 통해 친구들을 용서하시고 욥의 형편을 갑절로 회복하십니다."
],[ // 17 시 1-36
"복 있는 사람의 길(1편)과 하나님이 세우신 왕(2편)으로 시편의 문이 열립니다. 압살롬을 피해 도망하던 다윗의 아침 기도(3편)와 평안히 눕고 자는 저녁 기도(4편)가 이어집니다. 6편은 병과 눈물 가운데 부르짖는 기도입니다.",
"7편은 억울한 고발 앞에서 의로우신 재판장께 호소합니다. 8편은 \"여호와 우리 주여 주의 이름이 온 땅에 어찌 그리 아름다운지요\"라며 사람을 돌보시는 하나님을 찬양합니다. 9–10편은 악인이 득세하는 듯한 현실에서 가난한 자를 잊지 않으시는 하나님을 노래하고, 11–12편은 터가 무너질 때 의인이 무엇을 할지 묻습니다.",
"\"어느 때까지니이까\"를 거듭 묻는 13편과 \"어리석은 자는 그의 마음에 이르기를 하나님이 없다 하는도다\"로 시작하는 14편이 나옵니다. 15편은 주의 장막에 머물 사람을, 16편은 \"주는 나의 주님이시오니 주 밖에는 나의 복이 없다\"는 고백을 담습니다. 18편은 사울의 손에서 건짐받은 다윗의 긴 감사의 노래입니다.",
"19편은 하늘이 하나님의 영광을 선포하고 여호와의 율법이 완전하다고 노래합니다. 20–21편은 왕을 위한 기도와 감사이고, 22편은 \"내 하나님이여 내 하나님이여 어찌 나를 버리셨나이까\"로 시작해 찬양으로 끝납니다. 23편은 \"여호와는 나의 목자시니\", 24편은 영광의 왕이 들어가시는 노래입니다.",

],[ // 18 시 37-72
"37편은 악을 행하는 자들 때문에 불평하지 말고 여호와를 의뢰하라고 합니다. 38편은 죄 때문에 몸과 마음이 무너진 사람의 기도, 39편은 인생의 짧음, 40편은 \"내가 여호와를 기다리고 기다렸더니\"라는 감사입니다. 41편으로 시편 1권이 끝나고, 42편은 \"하나님이여 사슴이 시냇물을 찾기에 갈급함 같이\"로 2권을 엽니다.",
"43편은 42편과 이어지는 노래로, \"내 영혼아 네가 어찌하여 낙심하며\"를 되풀이합니다. 44편은 패배한 공동체의 탄식, 45편은 왕의 혼인 노래입니다. 46편 \"하나님은 우리의 피난처시요 힘이시니\"와 47–48편은 온 땅의 왕이신 하나님과 시온을 노래합니다.",

"55편은 가까운 친구에게 배신당한 아픔을, 56편은 가드에서 블레셋 사람에게 잡혔을 때 \"내가 두려워하는 날에는 내가 주를 의지하리이다\"라는 고백을 담습니다. 57편은 사울을 피해 굴에 있을 때, 59편은 사울이 사람을 보내 집을 지킬 때 지은 시입니다. 58편은 불의한 재판관들을, 60편은 전쟁의 패배 속 기도를 담습니다.",

"67편은 모든 민족이 주를 찬송하기를 구하고, 68편은 광야를 행진하시는 하나님의 승리를 노래합니다. 69편은 깊은 수렁에 빠진 사람의 탄식으로 신약에 여러 번 인용되고, 70–71편은 늙을 때에도 버리지 말아 달라는 기도입니다. 72편은 솔로몬을 위한 의로운 왕의 기도로, 시편 2권이 \"이새의 아들 다윗의 기도가 끝나니라\"로 마무리됩니다."
],[ // 19 시 73-109
"73편은 악인의 형통을 보고 미끄러질 뻔하다가 성소에 들어가서야 깨달은 아삽의 고백입니다. 74편은 원수에게 짓밟힌 성소를 보며 부르짖고, 75–76편은 심판하시는 하나님을 노래합니다. 77편은 환난 날에 옛적 일을 기억하고, 78편은 출애굽부터 다윗까지 이스라엘의 불순종과 하나님의 인내를 긴 역사로 들려줍니다.",

"85편은 \"인애와 진리가 같이 만나고 의와 화평이 서로 입맞추었으며\"라고 회복을 노래합니다. 86편은 다윗의 기도, 87편은 열방이 시온에서 났다고 하는 노래, 88편은 끝까지 어둠 속에 머무는 가장 어두운 탄식입니다. 89편은 다윗 언약을 붙들고 왜 왕관이 땅에 떨어졌느냐고 묻고, 90편은 모세의 기도로 4권을 엽니다.",

"97–99편은 여호와께서 통치하시니 땅은 즐거워하라고 노래합니다. 100편은 \"온 땅이여 여호와께 즐거운 찬송을 부를지어다\", 101편은 다윗의 정직한 통치 다짐입니다. 102편은 고난당한 자가 마음이 상하여 여호와 앞에 근심을 토로하는 기도입니다.",

"131편은 젖 뗀 아이처럼 고요한 마음을, 133편은 형제가 연합하여 동거함의 아름다움을 노래하며, 134편으로 올라가는 노래가 끝납니다. 136편은 모든 절마다 \"그 인자하심이 영원함이로다\"를 되풀이하고, 137편은 바벨론 강변에서 시온을 기억하며 웁니다. 139편은 \"여호와여 주께서 나를 살펴 보셨으므로 나를 아시나이다\"라고 고백합니다.",
"141–143편은 다윗이 위험 속에서 드린 기도들이고, 144편은 싸움을 가르치시는 하나님을 찬양합니다. 145편은 다윗의 찬송시이고, 146편부터 150편까지는 모두 \"할렐루야\"로 시작하고 끝나는 찬양입니다. 시편은 \"호흡이 있는 자마다 여호와를 찬양할지어다\"로 마칩니다."

"잠언은 \"여호와를 경외하는 것이 지식의 근본\"이라는 말로 시작합니다. 아버지는 아들에게 악한 자들의 꾐을 따르지 말고 길거리에서 부르는 지혜의 소리를 들으라고 합니다. \"너는 마음을 다하여 여호와를 신뢰하고 네 명철을 의지하지 말라\"와 함께, 음녀의 길을 피하라고 당부합니다.",
"보증 서지 말 것, 개미에게 배우라는 게으른 자에 대한 교훈, 여호와께서 미워하시는 일곱 가지가 나옵니다. 음녀가 젊은이를 꾀는 장면을 생생하게 그리고, 지혜는 창조 때부터 하나님 곁에 있었다고 말합니다. 지혜와 어리석은 여인이 잔치에 사람을 부르고, 10장부터 솔로몬의 짧은 잠언들이 시작됩니다.",
"속이는 저울, 말의 힘, 부지런함과 게으름, 의인과 악인의 차이를 짧은 대조로 보여 줍니다. \"유순한 대답은 분노를 쉬게 하여도 과격한 말은 노를 격동하느니라\" 같은 생활의 지혜가 이어집니다. 가난한 이웃을 대하는 태도와 가정의 화평도 다룹니다.",
"\"사람이 마음으로 자기의 길을 계획할지라도 그의 걸음을 인도하시는 이는 여호와시니라\", \"교만은 패망의 선봉이요\" 같은 말씀이 나옵니다. 다툼과 말을 조심하라는 교훈, 친구와 형제, 술의 해로움, 공평한 저울이 이어집니다. 사람의 마음에 있는 모략은 깊은 물 같다고 말합니다.",
"왕의 마음도 여호와의 손에 있다고 말하고, 많은 재물보다 명예를 택하라고 합니다. 22:17부터는 '지혜 있는 자의 말씀'이 나오고, 25장부터는 히스기야의 신하들이 편집한 솔로몬의 잠언이 이어집니다. \"경우에 합당한 말은 아로새긴 은 쟁반에 금 사과니라\"는 말씀이 여기에 있습니다.",
"미련한 자와 게으른 자의 모습을 익살스럽게 그리고, \"철이 철을 날카롭게 하는 것 같이 사람이 그의 친구의 얼굴을 빛나게 하느니라\"고 말합니다. 아굴의 잠언(30장)은 가난하게도 부하게도 하지 말라고 기도하고, 르무엘 왕의 어머니가 준 교훈이 이어집니다. 잠언은 여호와를 경외하는 현숙한 여인을 노래하며 끝납니다."
],[ // 22 전, 아
"전도자는 \"헛되고 헛되며 헛되고 헛되니 모든 것이 헛되도다\"라며 해 아래 반복되는 삶을 봅니다. 지혜, 즐거움, 큰 사업과 재물을 다 누려 보았지만 바람을 잡는 것 같았다고 고백합니다. \"범사에 기한이 있고 천하 만사가 다 때가 있나니\"라고 하며, 하나님이 사람에게 영원을 사모하는 마음을 주셨다고 말합니다.",

"좋은 이름이 좋은 기름보다 낫고, 초상집에 가는 것이 잔칫집에 가는 것보다 낫다고 말합니다. 의인과 악인이 같은 일을 당하는 듯한 현실을 보며, 하나님이 하시는 일을 사람이 다 알 수 없다고 고백합니다. 사는 동안 사랑하는 아내와 함께 즐겁게 살고 힘을 다해 일하라고 하며, 가난한 지혜자가 성을 구하고도 잊힌 이야기를 합니다.",
"작은 어리석음이 지혜를 망친다고 말하고, \"너는 네 떡을 물 위에 던져라\"라며 결과를 몰라도 씨를 뿌리라고 합니다. 청년에게 즐거워하되 하나님이 심판하실 것을 알라고 하고, \"너는 청년의 때에 너의 창조주를 기억하라\"고 권합니다. \"하나님을 경외하고 그의 명령들을 지킬지어다 이것이 모든 사람의 본분이니라\"로 끝납니다.",
"아가는 솔로몬의 노래로, 사랑하는 여인과 남자가 서로를 그리워하고 칭찬하는 노래를 주고받습니다. 여인은 \"나는 사론의 수선화요 골짜기의 백합화로다\"라고 하고, 예루살렘 딸들에게 사랑하는 자가 원하기 전에는 흔들지 말고 깨우지 말라고 당부합니다. 남자는 신부를 잠근 동산, 덮은 우물에 빗대어 노래합니다.",
"여인이 밤에 문을 늦게 열어 사랑하는 이를 놓치고 성안을 찾아다닙니다. 서로의 아름다움을 다시 노래하며 \"나는 내 사랑하는 자에게 속하였고\"라고 고백합니다. \"사랑은 죽음 같이 강하고 질투는 스올 같이 잔인하며\"라는 말과 함께, 많은 물도 이 사랑을 끄지 못한다고 노래합니다."
],[ // 23 사 1-30
"이사야는 유다를 향해 \"소는 그 임자를 알고 나귀는 그 주인의 구유를 알건마는 이스라엘은 알지 못하고\"라고 탄식합니다. 그러면서도 \"너희의 죄가 주홍 같을지라도 눈과 같이 희어질 것이요\"라고 부르시고, 끝날에 열방이 시온으로 올라와 칼을 쳐서 보습을 만들 것이라 합니다. 5장은 좋은 포도를 기대했는데 들포도를 맺은 포도원의 노래입니다.",
"웃시야 왕이 죽던 해 이사야는 높은 보좌에 앉으신 주님과 \"거룩하다 거룩하다 거룩하다\"를 외치는 스랍들을 보고, \"내가 여기 있나이다 나를 보내소서\"라고 응답합니다. 아람과 북이스라엘의 위협 앞에 떠는 아하스에게 처녀가 아들을 낳아 임마누엘이라 할 것이라는 징조가 주어집니다. \"한 아기가 우리에게 났고\"라는 약속과 함께, 교만한 앗수르도 하나님 손의 몽둥이일 뿐이라고 합니다.",
"이새의 줄기에서 한 싹이 나서 공의로 다스리고, 이리가 어린 양과 함께 살 것이라 예언합니다. 13장부터는 바벨론, 앗수르, 블레셋, 모압 같은 열방에 대한 경고가 이어집니다. 14장에서는 \"너 아침의 아들 계명성이여 어찌 그리 하늘에서 떨어졌으며\"라며 교만한 바벨론 왕의 몰락을 노래합니다.",
"모압, 다메섹, 구스, 애굽에 대한 경고가 이어지고, 언젠가 애굽과 앗수르도 이스라엘과 함께 하나님을 섬길 것이라는 놀라운 약속이 나옵니다. 이사야는 3년 동안 벗은 몸과 맨발로 다니며 애굽과 구스를 의지하지 말라는 표징이 됩니다.",
"바벨론의 함락, 두마, 아라비아, 예루살렘 '환상의 골짜기', 두로에 대한 경고가 나옵니다. 24장부터는 온 땅이 심판받는 장면과 함께, 하나님이 이 산에서 만민을 위해 잔치를 베푸시고 사망을 영원히 멸하실 것이라는 약속이 나옵니다(25장).",
"\"주께서 심지가 견고한 자를 평강하고 평강하도록 지키시리니\"라는 신뢰의 노래가 나옵니다. 에브라임의 술 취한 지도자들을 꾸짖고 시온에 견고한 기촛돌을 두시며, 입술로만 공경하는 백성을 책망하십니다. 애굽을 의지하지 말라며 \"너희가 돌이켜 조용히 있어야 구원을 얻을 것이요\"라고 말합니다."
],[ // 24 사 31-66
"애굽의 말과 병거를 의지하지 말라고 하며, 공의로 통치할 왕과 성령이 부어질 날을 약속합니다. 에돔의 심판과 대조하여 35장은 광야에 꽃이 피고 맹인이 보고 저는 자가 사슴 같이 뛰는 회복을 노래합니다. 36장에서 앗수르 왕 산헤립의 랍사게가 예루살렘 성벽 앞에서 히스기야와 백성을 조롱합니다.",
"히스기야는 산헤립의 편지를 성전에 펴 놓고 기도하고, 앗수르 군대는 하룻밤에 무너집니다. 히스기야는 병에서 낫지만 바벨론 사신들에게 보물을 보여 주어 포로를 예고받습니다. 40장부터 \"너희는 위로하라 내 백성을 위로하라\"로 분위기가 바뀌고, 독수리가 날개 치며 올라가는 소망과 여호와의 종이 소개됩니다.",
"\"너는 내 것이라\" 하시며 물과 불 가운데서도 함께하시겠다고 하시고, 새 일을 행하시겠다고 하십니다. 나무 한 토막으로 불도 때고 신상도 만드는 우상 숭배의 어리석음을 꼬집고, 바사 왕 고레스를 이름까지 불러 기름부음 받은 자로 세우십니다. 바벨론의 신들과 바벨론은 무너질 것이라 합니다.",
"여호와의 종은 이스라엘을 회복할 뿐 아니라 이방의 빛이 될 것입니다. \"여인이 어찌 그 젖 먹는 자식을 잊겠으며\"라고 시온을 위로하시고, 좋은 소식을 전하는 자의 발을 노래합니다. 53장의 종은 \"그가 찔림은 우리의 허물 때문이요\" 우리 죄를 지고 고난받으며, 54장은 장막 터를 넓히라고 합니다.",
"\"오호라 너희 모든 목마른 자들아 물로 나아오라\"며 값없이 오라고 초대하시고, \"내 생각이 너희의 생각과 다르며\"라고 하십니다. 이방인과 고자도 하나님의 집에서 환영받고, 금식은 굶는 것이 아니라 흉악의 결박을 풀어 주는 것이라 합니다. 60장은 \"일어나라 빛을 발하라\"며 열방이 시온의 빛으로 나아오는 영광을 노래합니다.",
"\"주 여호와의 영이 내게 내리셨으니\" 가난한 자에게 아름다운 소식을 전한다고 하는데, 예수님은 나사렛 회당에서 이 말씀을 읽으셨습니다. 하나님은 예루살렘을 '헵시바'(나의 기쁨)라 부르시고, 붉은 옷을 입고 에돔에서 오시는 용사가 그려집니다. 이사야는 새 하늘과 새 땅을 약속하며 끝납니다."
],[ // 25 렘 1-30
"하나님은 아이라고 망설이는 예레미야를 열방의 선지자로 세우시며 살구나무 가지와 끓는 가마 환상을 보여 주십니다. 이스라엘이 생수의 근원을 버리고 터진 웅덩이를 팠다고 고발하시며, 배신한 아내 같은 백성에게 돌아오라고 부르십니다. 예루살렘 거리에서 정의를 행하는 한 사람을 찾아보라고 하십니다.",
"북쪽에서 오는 재앙을 경고하고, \"평강하다 평강하다\" 하는 거짓 선지자들을 꾸짖습니다. 예레미야는 성전 문에 서서 \"이것이 여호와의 성전이라\"는 거짓말을 믿지 말라고 설교합니다. 예레미야는 백성 때문에 \"내 눈은 눈물 근원이 될꼬\" 하고 울며, 지혜로운 자는 지혜를 자랑하지 말고 여호와를 아는 것을 자랑하라고 합니다.",
"백성이 언약을 깨뜨렸다고 하시고, 고향 아나돗 사람들이 예레미야를 죽이려 합니다. 예레미야는 \"악한 자의 길이 형통하며\"라고 하나님께 따집니다. 썩은 띠, 가뭄, 이 백성을 위해 기도하지 말라는 명령을 통해 심판이 정해졌음을 알리시지만 예레미야를 지켜 주겠다고 하십니다.",
"예레미야에게 결혼하지 말라 하시며 다가올 재앙을 보여 주시고, 유다의 죄가 금강석 끝 철필로 마음판에 새겨졌다고 하십니다. 토기장이 집에서 진흙을 다시 빚는 것을 보여 주시고, 옹기를 깨뜨리는 표징을 하게 하십니다. 바스훌에게 맞고 목에 씌우는 나무 고랑에 채워진 예레미야는 그만두고 싶어도 말씀이 뼛속에 불붙는 것 같다고 고백합니다.",
"시드기야 왕에게 바벨론에 항복하는 것이 사는 길이라 하고, 다윗 왕가의 악한 왕들을 하나씩 꾸짖습니다. 다윗에게 일으킬 의로운 가지, 곧 '여호와 우리의 공의'라 불릴 왕을 약속하시고, 거짓 선지자들을 꾸짖습니다. 좋은 무화과와 나쁜 무화과 환상, 그리고 바벨론 포로가 70년 동안 이어질 것을 예언합니다.",
"예레미야가 성전 설교 때문에 죽을 위기에 몰렸다가 장로들의 변호로 살아납니다. 목에 멍에를 메고 바벨론을 섬기라고 하자 거짓 선지자 하나냐가 그 멍에를 꺾고, 하나냐는 그해에 죽습니다. 예레미야는 포로들에게 편지를 보내 그 성읍의 평안을 구하라 하고, 30장부터 회복의 약속이 시작됩니다."
],[ // 26 렘 31-52, 애
"하나님은 영원한 사랑으로 이스라엘을 사랑하셨다며, 마음에 법을 기록할 새 언약을 약속하십니다. 바벨론 군대가 예루살렘을 포위한 때 갇혀 있던 예레미야는 아나돗의 밭을 사서 미래의 회복을 증언합니다. 종들을 풀어 주었다가 다시 붙잡은 백성과 대조하여, 조상의 명령을 지킨 레갑 사람들을 칭찬합니다.",
"여호야김 왕은 예레미야의 말씀이 적힌 두루마리를 칼로 베어 불에 태우지만, 바룩이 다시 기록합니다. 예레미야는 진흙 구덩이에 갇혔다가 구스 사람 에벳멜렉에게 구출됩니다. 마침내 예루살렘이 함락되고 시드기야는 눈이 뽑혀 끌려가며, 예레미야는 풀려나 그다랴와 함께 남습니다.",
"이스마엘이 총독 그다랴를 죽이자 남은 사람들은 바벨론의 보복이 두려워 애굽으로 가려 합니다. 예레미야가 애굽에 가지 말라고 했지만 그들은 예레미야까지 데리고 애굽으로 내려갑니다. 애굽에서도 하늘 여왕을 섬기는 백성에게 심판을 선포하고, 바룩에게는 생명을 지켜 주겠다고 약속합니다.",
"애굽, 블레셋, 모압, 암몬, 에돔, 다메섹, 게달, 엘람 등 열방에 대한 심판의 말씀이 이어집니다. 마지막으로 바벨론이 무너질 것이고, 이스라엘과 유다 자손이 울며 돌아와 영원한 언약을 맺을 것이라 합니다.",
"바벨론에 대한 심판이 계속되고, 예레미야는 이 말씀을 책에 써서 유브라데 강에 던지라고 합니다. 52장은 예루살렘의 함락과 성전의 파괴, 포로로 끌려간 사람들을 다시 기록합니다. 마지막에 바벨론 왕이 여호야긴을 감옥에서 풀어 주는 장면으로 끝납니다.",
"예레미야애가는 무너진 예루살렘을 홀로 앉은 과부에 빗대어 슬퍼하는 다섯 편의 노래입니다. 굶주림과 수치를 낱낱이 쏟아내는 가운데, 3장 한가운데에서 \"여호와의 인자와 긍휼이 무궁하시므로 우리가 진멸되지 아니함이니이다\"라고 고백합니다. 마지막은 \"여호와여 우리를 주께로 돌이키소서\"라는 기도입니다."
],[ // 27 겔 1-24
"바벨론 그발 강가의 포로 에스겔이 네 생물과 바퀴, 보좌 위의 여호와의 영광을 봅니다. 하나님은 에스겔에게 두루마리를 먹게 하시고 이스라엘 족속의 파수꾼으로 세우십니다. 에스겔은 박석에 예루살렘을 그리고 옆으로 누워 지내는 행동으로 포위를 보여 줍니다.",
"머리털을 깎아 셋으로 나누는 표징으로 예루살렘의 운명을 보여 주고, 이스라엘 산들의 우상을 심판하겠다고 하십니다. 환상 가운데 예루살렘 성전으로 옮겨진 에스겔은 성전 안에서 벌어지는 우상 숭배와 태양 숭배를 봅니다.",
"이마에 표가 있는 사람만 남기고 심판이 시작되고, 여호와의 영광이 성전 문지방에서 떠나 성읍 동쪽 산으로 옮겨 갑니다. 하나님은 흩어진 백성에게 돌 같은 마음 대신 부드러운 마음을 주시겠다고 약속하십니다. 에스겔은 짐을 싸서 성벽을 뚫고 나가는 행동으로 포로 됨을 보여 줍니다.",
"회칠한 담 같은 거짓 선지자들을 꾸짖고, 노아, 다니엘, 욥이 있어도 자기 생명만 건질 것이라 하십니다. 쓸모없는 포도나무 비유가 이어지고, 16장은 버려진 아기를 거두어 왕후로 삼았는데 음행한 아내가 된 예루살렘의 긴 비유입니다. 그럼에도 하나님은 영원한 언약을 세우겠다고 하십니다.",
"독수리와 백향목 비유로 바벨론과 맺은 언약을 깨뜨린 유다 왕의 배신을 꾸짖습니다. \"아버지가 신 포도를 먹었으므로 그의 아들의 이가 시다\"는 속담을 버리라 하시며, 각 사람이 자기 죄로 심판받고 돌이키면 산다고 하십니다. 이스라엘 고관들을 위한 애가와 함께, 출애굽 이후 되풀이된 반역의 역사를 되짚습니다.",
"바벨론 왕의 칼이 예루살렘을 향하고, 예루살렘의 죄가 낱낱이 드러납니다. 오홀라(사마리아)와 오홀리바(예루살렘) 두 자매의 비유가 나옵니다. 에스겔의 아내가 죽지만 하나님은 슬퍼하지 말라 하시며, 그것이 성소를 잃을 백성의 표징이 됩니다."

"암몬, 모압, 에돔, 블레셋에 대한 심판이 선포됩니다. 바다 무역으로 부유해진 두로가 무너질 것을 화려한 배의 침몰에 빗대어 노래합니다. 교만하여 \"나는 신이라\" 하는 두로 왕을 꾸짖고, 시돈의 심판과 이스라엘의 회복을 말합니다.",

],[ // 29 단, 호
"바벨론으로 끌려간 다니엘과 세 친구는 왕의 음식으로 자신을 더럽히지 않고 채소를 먹어 더 건강해집니다. 다니엘은 느부갓네살의 큰 신상 꿈을 풀어 하나님의 나라가 모든 나라를 부술 것이라 하고, 세 친구는 금 신상에 절하지 않아 풀무불에 던져지지만 살아납니다. 교만한 느부갓네살은 들짐승처럼 지내다가 하나님을 높이게 됩니다.",

"다니엘은 예레미야서의 70년을 깨닫고 죄를 고백하며 기도하고, 가브리엘이 일흔 이레를 알려 줍니다. 힛데겔 강가에서 본 환상 가운데 남방 왕과 북방 왕의 싸움이 길게 이어집니다. 마지막에 미가엘이 일어나고, 땅의 티끌 가운데서 자는 자들이 깨어나 영생을 얻거나 부끄러움을 당할 것이라 합니다.",
"하나님은 호세아에게 음란한 여인 고멜과 결혼하게 하시고, 자녀들에게 '로루하마'(긍휼히 여김을 받지 못한 자), '로암미'(내 백성이 아니라) 같은 이름을 주십니다. 그러나 다시 '내 백성'이라 부르실 날을 약속하시고, 호세아는 떠난 아내를 값을 주고 다시 데려옵니다. 내 백성이 지식이 없으므로 망한다고 탄식하십니다.",
"\"여호와께로 돌아가자\"는 고백이 있지만 그들의 인애는 아침 구름 같다고 하십니다. 하나님은 제사보다 인애를, 번제보다 하나님을 아는 것을 원하십니다. 이스라엘은 어리석은 비둘기처럼 애굽과 앗수르 사이를 오가고, 바람을 심고 광풍을 거둘 것이라 합니다.",
"\"이스라엘이 어렸을 때에 내가 사랑하여 내 아들을 애굽에서 불러냈거늘\"이라며 걸음을 가르치신 아버지의 마음을 보여 주십니다. \"에브라임이여 내가 어찌 너를 놓겠느냐\"며 심판 앞에서도 긍휼이 불붙듯 하신다고 하십니다. 마지막 장은 이스라엘에게 돌아오라고 하시며 회복을 약속합니다."
],[ // 30 소선지서 1
"요엘은 메뚜기 재앙을 여호와의 날의 경고로 보고 \"너희는 옷을 찢지 말고 마음을 찢고\" 돌아오라고 합니다. 하나님은 모든 사람에게 영을 부어 주시겠다고 약속하십니다. 드고아의 목자 아모스는 열방의 죄를 하나씩 고발하다가 마지막에 유다와 이스라엘을 지목합니다.",
"아모스는 사마리아의 부유한 여인들을 '바산의 암소들'이라 부르며 가난한 자를 학대한 죄를 꾸짖습니다. \"오직 정의를 물 같이, 공의를 마르지 않는 강 같이 흐르게 할지어다\"라고 외치고, 메뚜기, 불, 다림줄, 여름 과일 광주리 환상을 봅니다. 벧엘의 제사장 아마샤가 그를 쫓아내려 하지만, 아모스는 다윗의 무너진 장막을 다시 세우실 날을 예언합니다.",
"오바댜는 형제 유다의 환난을 기뻐한 에돔의 교만을 심판합니다. 요나는 니느웨로 가라는 명령을 피해 배를 탔다가 큰 물고기 뱃속에서 밤낮 삼 일을 보냅니다. 요나가 외치자 니느웨가 회개하고 하나님이 재앙을 거두시자, 요나는 화를 내고 하나님은 박넝쿨로 그의 마음을 깨우치십니다.",
"미가는 사마리아와 예루살렘의 우상과 탐욕, 밭을 빼앗는 자들과 거짓 선지자들을 꾸짖습니다. 끝날에 열방이 여호와의 산으로 올라오고, \"베들레헴 에브라다야\" 그곳에서 이스라엘을 다스릴 자가 나올 것이라 합니다. 하나님이 구하시는 것은 \"오직 정의를 행하며 인자를 사랑하며 겸손하게 네 하나님과 함께 행하는 것\"이라고 말합니다.",
"나훔은 한때 회개했던 니느웨가 다시 잔혹해져 무너질 것을 노래합니다. 하박국은 \"어느 때까지리이까\" 하며 유다의 불의를 하나님께 따지다가, 더 사나운 갈대아 사람(바벨론)을 쓰신다는 답에 다시 묻습니다. \"의인은 그의 믿음으로 말미암아 살리라\"는 응답을 받고, 무화과나무가 무성하지 못해도 여호와로 말미암아 즐거워하겠다고 노래합니다.",

],[ // 33 마 19-막 16
"예수님은 이혼에 대한 질문에 답하시고, 어린아이들을 축복하시며, 재물이 많은 청년에게 가진 것을 팔아 가난한 자들에게 주라고 하십니다. 포도원 품꾼 비유로 나중 된 자가 먼저 된다고 하시고, 세 번째로 죽음과 부활을 예고하십니다. 여리고에서 맹인 두 사람을 고치신 뒤 나귀를 타고 예루살렘에 들어가 성전을 깨끗하게 하시고, 무화과나무를 마르게 하시며, 두 아들 비유와 악한 농부 비유를 말씀하십니다.",
"혼인 잔치 비유 뒤에 바리새인과 헤롯당, 사두개인, 율법교사가 차례로 세금, 부활, 큰 계명에 대해 예수님을 시험합니다. 예수님은 \"가이사의 것은 가이사에게, 하나님의 것은 하나님께\" 바치라 하시고, 하나님 사랑과 이웃 사랑이 가장 큰 계명이라 하십니다. 23장에서 서기관과 바리새인들에게 거듭 \"화 있을진저\"를 선포하시고, 24장에서 감람 산에 앉아 성전의 무너짐과 마지막 때의 징조를 말씀하시며 깨어 있으라고 하십니다.",
"열 처녀, 달란트, 양과 염소 비유로 깨어 준비하라고 하십니다. 베다니에서 한 여자가 향유를 붓고, 예수님은 제자들과 마지막 만찬을 하신 뒤 겟세마네에서 기도하시다가 가룟 유다의 입맞춤으로 잡히십니다. 베드로는 세 번 부인하고, 예수님은 빌라도에게 재판받고 십자가에 못 박혀 죽으시며, 부활하신 뒤 갈릴리 산에서 \"모든 민족을 제자로 삼아\"라고 명령하십니다.",
"마가는 \"하나님의 아들 예수 그리스도의 복음의 시작이라\"로 시작해, 세례 요한과 예수님의 세례, 광야 시험을 짧게 전합니다. 예수님은 가버나움에서 귀신을 쫓으시고, 지붕을 뜯고 중풍병자를 달아 내린 친구들의 믿음을 보시고 죄를 사하십니다. 씨 뿌리는 비유, 바다의 풍랑을 잔잔하게 하심, 거라사의 군대 귀신, 혈루증 여인과 야이로의 딸 이야기가 숨 가쁘게 이어집니다.",
"고향에서 배척받으시고 열두 제자를 보내시며, 헤롯이 세례 요한을 죽인 이야기가 나옵니다. 오천 명을 먹이시고, 물 위를 걸으시고, 수로보니게 여자의 딸을 고치시고, \"에바다\" 하시며 귀먹은 사람을 고치십니다. 베드로의 고백 뒤에 세 번 죽음과 부활을 예고하시는데 제자들은 누가 크냐고 다투고, 예수님은 \"인자가 온 것은 섬김을 받으려 함이 아니라 도리어 섬기려 하고\"라고 하시며, 여리고에서 맹인 바디매오를 고치십니다.",
"예수님은 예루살렘에 들어가 성전을 깨끗하게 하시고, 대제사장과 서기관들과 논쟁하시며, 가난한 과부의 두 렙돈 헌금을 칭찬하십니다. 베다니에서 한 여자가 향유를 붓고, 마지막 만찬과 겟세마네 기도 뒤에 잡히십니다. 빌라도의 재판과 십자가 죽음을 지나, 안식 후 첫날 무덤에 간 여자들이 \"그가 살아나셨고 여기 계시지 아니하니라\"는 말을 듣습니다."
],[ // 34 눅
"누가는 데오빌로에게 차례대로 써 보낸다고 밝히며 시작합니다. 천사 가브리엘이 사가랴에게 요한의 출생을, 마리아에게 예수님의 출생을 알리고, 마리아는 엘리사벳을 찾아가 찬양합니다. 예수님은 베들레헴에서 나셔서 구유에 누이시고, 열두 살에 성전에서 선생들과 문답하시며, 세례와 시험 뒤에 나사렛 회당에서 이사야서를 읽으십니다.",
"밤새 고기를 잡지 못한 시몬에게 깊은 데로 가서 그물을 내리라 하시고 제자로 부르십니다. 평지에서 복과 화를 말씀하시고 원수를 사랑하라고 하시며, 백부장의 종을 고치시고 나인 성 과부의 아들을 살리십니다. 죄인인 한 여자가 향유를 붓자 많이 용서받은 자가 많이 사랑한다고 하시고, 씨 뿌리는 비유와 거라사의 귀신 들린 사람, 야이로의 딸 이야기가 이어집니다.",
"오천 명을 먹이시고 베드로의 고백과 변화산 사건 뒤에 예수님은 예루살렘으로 올라가기로 굳게 결심하십니다. 칠십 인을 보내시고, 선한 사마리아 사람 비유로 누가 이웃인지 가르치시며, 마르다와 마리아의 집을 방문하십니다. 기도를 가르치시고, 어리석은 부자 비유와 함께 염려하지 말라고 하십니다.",
"회개하지 않으면 망한다고 하시며 열매 없는 무화과나무 비유를 주시고, 안식일에 꼬부라진 여자를 고치십니다. 큰 잔치 비유와 제자가 되는 대가를 말씀하십니다. 15장의 잃은 양, 잃은 드라크마, 잃은 아들 비유가 나오고, 옳지 않은 청지기 비유와 부자와 나사로 이야기가 이어집니다.",
"용서와 믿음을 가르치시고, 나병환자 열 명 가운데 사마리아 사람 하나만 돌아와 감사합니다. 끈질긴 과부, 바리새인과 세리의 기도 비유, 여리고의 맹인과 세리장 삭개오 이야기가 나옵니다. 열 므나 비유 뒤에 예루살렘을 보고 우시며 성전을 깨끗하게 하시고, 포도원 농부 비유와 세금, 부활 논쟁이 이어집니다.",
"과부의 두 렙돈을 칭찬하시고 성전의 무너짐과 마지막 때를 말씀하십니다. 마지막 만찬, 감람 산 기도, 체포와 베드로의 부인, 빌라도와 헤롯 앞의 재판이 이어지고, 십자가 위에서 한 강도에게 \"오늘 네가 나와 함께 낙원에 있으리라\" 하십니다. 부활하신 예수님은 엠마오로 가는 두 제자와 함께 걸으시며 성경을 풀어 주시고, 제자들에게 나타나신 뒤 하늘로 올려지십니다."
],[ // 35 요
"\"태초에 말씀이 계시니라\"로 시작하여 말씀이 육신이 되어 우리 가운데 거하셨다고 말합니다. 세례 요한은 예수님을 \"세상 죄를 지고 가는 하나님의 어린 양\"이라 소개하고, 예수님은 가나의 혼인 잔치에서 물로 포도주를 만드시며 성전을 깨끗하게 하십니다. 니고데모에게 거듭나야 한다고 하시고, 사마리아 우물가에서 여자에게 생수를 말씀하시며, 왕의 신하의 아들을 고치십니다.",
"예수님은 베데스다 못가에서 38년 된 병자를 안식일에 고치시고, 아버지와 함께 일하신다고 하십니다. 오천 명을 먹이신 뒤 \"나는 생명의 떡이니\"라고 하시자 많은 제자가 떠나고, 베드로는 \"영생의 말씀이 주께 있사오니\"라고 고백합니다. 초막절에 \"누구든지 목마르거든 내게로 와서 마시라\" 하시고, 간음하다 잡힌 여자를 정죄하지 않으시며 \"나는 세상의 빛이니\"라고 하십니다.",
"날 때부터 맹인 된 사람을 고치시자 바리새인들이 그를 쫓아내고, 예수님은 \"나는 선한 목자라\"고 하십니다. 수전절에 유대인들이 돌을 들고, 예수님은 죽은 나사로를 무덤에서 살리시며 \"나는 부활이요 생명이니\"라고 하십니다. 마리아가 베다니에서 향유를 붓고, 예수님은 나귀를 타고 예루살렘에 들어가시며 한 알의 밀이 죽어야 많은 열매를 맺는다고 하십니다.",
"마지막 만찬에서 예수님은 제자들의 발을 씻기시고, \"서로 사랑하라\"는 새 계명을 주십니다. \"내가 곧 길이요 진리요 생명이니\"라고 하시며 보혜사 성령을 약속하시고, 포도나무와 가지 비유로 \"내 안에 거하라\"고 하십니다. 세상이 미워할 것이지만 근심이 기쁨으로 바뀔 것이라며 \"내가 세상을 이기었노라\"고 하십니다.",
"예수님은 제자들과 앞으로 믿을 사람들이 하나가 되게 해 달라고 기도하십니다. 동산에서 잡히시고, 안나스와 가야바 앞에서 심문받으시며, 베드로는 세 번 부인합니다. 빌라도는 \"진리가 무엇이냐\"고 묻고, 예수님은 십자가에서 \"다 이루었다\" 하시고 숨을 거두시며, 아리마대 사람 요셉과 니고데모가 장례를 치릅니다.",
"안식 후 첫날 막달라 마리아가 빈 무덤 앞에서 울다가 부활하신 예수님을 만납니다. 예수님은 제자들에게 숨을 내쉬며 성령을 받으라 하시고, 의심하던 도마는 \"나의 주님이시요 나의 하나님이시니이다\"라고 고백합니다. 디베랴 호숫가에서 예수님은 고기를 많이 잡게 하시고 아침을 차려 주시며, 베드로에게 세 번 \"네가 나를 사랑하느냐\"고 물으십니다."
],[ // 36 행 1-15
"부활하신 예수님은 성령을 기다리라 하시고 하늘로 올려지시며, 제자들은 맛디아를 뽑아 열두 사도를 채웁니다. 오순절에 성령이 임하여 여러 나라 말로 하나님의 큰일을 말하고, 베드로의 설교로 3,000명이 세례를 받습니다. 성전 미문에서 베드로와 요한이 나면서 못 걷게 된 사람을 일으킵니다.",
"베드로와 요한은 공회 앞에서 \"다른 이로써는 구원을 받을 수 없나니\"라고 담대히 말합니다. 믿는 무리는 물건을 서로 통용하고, 바나바는 밭을 팔아 바치지만 아나니아와 삽비라는 속이다 죽습니다. 사도들이 다시 갇히지만 주의 사자가 풀어 주고, 가말리엘의 조언으로 채찍질만 당하고 풀려나며 기뻐합니다.",
"구제 문제로 일곱 일꾼을 세우고, 그중 스데반은 공회에서 이스라엘의 역사를 설교한 뒤 돌에 맞아 순교합니다. 사울이 교회를 박해하자 성도들이 흩어지며 복음이 퍼지고, 빌립은 사마리아에 그리스도를 전합니다. 빌립은 광야 길에서 이사야서를 읽던 에디오피아 내시에게 예수를 전하고 세례를 줍니다.",
"다메섹으로 가던 사울은 빛 가운데 예수님을 만나 눈이 멀고, 아나니아의 안수로 다시 보고 세례를 받습니다. 베드로는 룻다에서 애니아를 고치고 욥바에서 다비다를 살립니다. 하나님은 환상을 통해 베드로를 가이사랴의 백부장 고넬료 집으로 보내시고, 이방인들에게도 성령이 임합니다.",
"베드로가 예루살렘 교회에 이방인 구원을 설명하고, 안디옥에서 제자들이 처음으로 그리스도인이라 불립니다. 헤롯이 야고보를 죽이고 베드로를 가두지만 주의 사자가 베드로를 구해 내고, 헤롯은 벌레에게 먹혀 죽습니다. 안디옥 교회는 바나바와 사울을 선교사로 보내고, 둘은 구브로와 비시디아 안디옥에서 복음을 전합니다.",
"이고니온, 루스드라, 더베에서 복음을 전하고, 루스드라에서는 신으로 오해받았다가 돌에 맞습니다. 돌아오는 길에 교회마다 장로들을 세우고 안디옥에 돌아와 보고합니다. 예루살렘 회의에서 이방인이 할례를 받지 않아도 구원받는다고 결정하고, 바울과 바나바는 마가 문제로 갈라서서 바울은 실라와 함께 떠납니다."
],[ // 37 행 16-28
"바울은 루스드라에서 디모데를 데리고 가다가 마게도냐 사람의 환상을 보고 빌립보로 건너갑니다. 루디아가 믿고, 점치는 귀신 들린 여종을 고친 일로 감옥에 갇히지만 지진으로 문이 열리고 간수의 온 집이 구원받습니다. 데살로니가와 베뢰아를 거쳐 아덴의 아레오바고에서 설교하고, 고린도에서 아굴라와 브리스길라를 만나 1년 6개월을 머뭅니다.",
"에베소에서 바울은 두란노 서원에서 두 해 동안 가르치고, 마술을 행하던 사람들이 책을 불사릅니다. 은장색 데메드리오가 소동을 일으키고, 바울은 마게도냐와 헬라를 거쳐 돌아갑니다. 드로아에서 졸다가 떨어진 유두고를 살리고, 밀레도에서 에베소 장로들에게 눈물의 작별 설교를 합니다.",
"바울은 결박될 것을 알면서도 예루살렘으로 올라가 야고보와 장로들을 만납니다. 성전에 이방인을 데리고 들어갔다는 오해로 붙잡혀 맞아 죽을 뻔하다가 천부장에게 구출됩니다. 층대 위에서 히브리 말로 자기의 회심 이야기를 하고, 로마 시민권을 밝혀 채찍질을 피합니다.",
"공회 앞에서 바울이 부활을 말하자 바리새인과 사두개인이 서로 다툽니다. 바울을 죽이려는 40여 명의 맹세가 바울의 생질에게 알려져, 바울은 밤에 가이사랴로 호송됩니다. 총독 벨릭스 앞에서 재판을 받고, 벨릭스는 돈을 바라며 2년 동안 바울을 가둡니다.",
"새 총독 베스도 앞에서 바울은 가이사에게 상소합니다. 아그립바 왕과 버니게 앞에서 바울은 다메섹 길의 이야기를 다시 들려주고, 아그립바는 \"네가 적은 말로 나를 권하여 그리스도인이 되게 하려 하는도다\"라고 합니다.",

"요한은 생명의 말씀을 직접 보고 듣고 만졌다고 증언합니다. 하나님은 빛이시니 빛 가운데 행하고, 죄를 자백하면 깨끗하게 하신다고 합니다. 세상을 사랑하지 말고 적그리스도를 분별하며, 우리가 하나님의 자녀라 일컬음을 받는 큰 사랑을 보라고 합니다.",
"영을 다 믿지 말고 분별하라고 합니다. \"하나님은 사랑이심이라\"며, 하나님이 아들을 화목제물로 보내신 것이 사랑이니 우리도 서로 사랑하라고 합니다. 하나님께로 난 자는 세상을 이기며, 아들이 있는 자에게는 생명이 있다고 확신을 줍니다.",
"요한이서에서 장로는 택하심을 받은 부녀와 그의 자녀들에게 진리 안에서 서로 사랑하고, 그리스도를 부인하는 미혹하는 자를 집에 들이지 말라고 합니다. 요한삼서에서는 순회 전도자들을 대접한 가이오를 칭찬하고, 으뜸 되기를 좋아하는 디오드레베를 책망하며 데메드리오를 추천합니다.",
"유다는 성도에게 단번에 주신 믿음의 도를 위해 힘써 싸우라고 합니다. 은혜를 방탕의 핑계로 삼는 거짓 교사들을 광야의 이스라엘, 소돔과 고모라, 가인과 발람과 고라에 빗대어 경고합니다. 끝으로 우리를 지켜 거침이 없게 하실 이에게 영광을 돌리는 찬양으로 마칩니다."

{t:"역대상",u:"2권 5강",story:"아담에서 시작하는 긴 족보로 열리는 책입니다. 포로에서 돌아온 공동체를 위해 다윗과 성전 준비 이야기를 다시 들려주며 '우리는 누구인가'를 일깨웁니다.",christ:"역대상의 족보처럼 마태복음도 족보로 시작합니다. 이스라엘 이야기 전체가 한 분을 향해 흐릅니다."},
{t:"역대하",u:"2권 6강",story:"솔로몬의 성전 봉헌에서 유다의 마지막 왕까지, 왕들이 하나님을 찾았는지에 따라 나라의 형편이 갈립니다. 책은 성전 재건을 허락하는 고레스의 조서로 끝납니다.",christ:"\"올라갈지어다\"(36:23)라는 열린 끝은 참된 성전이신 그리스도(요 2:19–21)를 기다리게 합니다."},
{t:"에스라 · 느헤미야 · 에스더",u:"2권 7강",story:"포로에서 돌아온 백성이 성전과 성벽을 다시 세우고 율법을 함께 읽습니다. 에스더는 페르시아에 남은 유대인들이 멸절 위기에서 건짐받는 이야기인데, 하나님의 이름이 한 번도 나오지 않습니다.",christ:"보이지 않게 일하시는 하나님의 손길(에스더)과 말씀 앞에 다시 모이는 백성(느 8장)은 그리스도 안에서 새로워질 공동체를 기다립니다."},
{t:"욥기",u:"3권 1강",story:"무대가 두 곳입니다. 하늘 회의(1–2장)와 잿더미 위의 욥. 친구들은 '고난은 죄 때문'이라고 몰아붙이고, 욥은 하나님께 직접 답을 요구합니다. 마침내 하나님이 폭풍 가운데서 말씀하십니다.",christ:"\"내가 알기에는 나의 대속자가 살아 계시니\"(19:25). 욥이 갈망한 중재자(9:33)가 그리스도 안에서 오십니다."},
{t:"시편 1",u:"3권 2강",story:"시편은 다섯 권으로 된 기도와 노래 모음입니다. 1–2편이 문을 열고(복 있는 사람과 기름부음 받은 왕), 1권(1–41편)에는 다윗이 쫓기며 부른 탄식과 신뢰의 노래가 많습니다.",christ:"십자가에서 예수님은 시편 22편 첫 구절로 부르짖으셨습니다(마 27:46)."},
{t:"시편 2",u:"3권 3강",story:"2권(42–72편)으로 들어갑니다. 고라 자손의 노래로 시작하고, 다윗의 회개 시(51편)가 있으며, 왕을 위한 기도(72편)로 끝납니다.",christ:"72편이 노래하는 의로운 왕, 가난한 자를 건지는 왕은 그리스도의 나라를 미리 보여 줍니다."},
{t:"시편 3",u:"3권 4강",story:"3권(73–89편)은 성전이 무너진 아픔과 '하나님의 약속은 어디 있습니까'라는 질문으로 가득합니다. 4권(90–106편)은 모세의 기도로 시작해 \"여호와께서 다스리신다\"고 노래합니다.",christ:"무너진 다윗 왕조를 붙들고 우는 89편의 질문에 다윗의 자손 그리스도께서 답이 되십니다."},
{t:"시편 4",u:"3권 5강",story:"5권(107–150편)에는 올라가는 노래(120–134편), 말씀을 노래하는 119편이 있고, 마지막은 \"할렐루야\"로 끝나는 찬양의 물결입니다. 탄식에서 시작한 시편 전체가 찬양으로 마무리됩니다.",christ:"신약에서 가장 많이 인용되는 구약 구절이 시편 110:1입니다. \"내 주께 이르시기를 내가 네 원수들로 네 발판이 되게 하기까지…\""},
{t:"잠언",u:"3권 6강",story:"아버지가 아들에게 들려주는 지혜입니다. 지혜 부인과 어리석은 여인이 길거리에서 젊은이를 부르고(9장), 짧은 격언들이 이어진 뒤 현숙한 여인(31장)으로 끝납니다.",christ:"\"여호와를 경외하는 것이 지식의 근본\"(1:7). 바울은 그리스도를 \"하나님의 지혜\"(고전 1:24)라 부릅니다."},
{t:"전도서 · 아가",u:"3권 7강",story:"전도서는 \"헛되다\"는 말로 '해 아래' 삶을 정직하게 들여다봅니다. 아가는 사랑하는 두 사람이 주고받는 노래입니다.",christ:"해 아래 모든 것이 헛되다는 고백은 해 위에서 오신 분을 기다리게 하고, 아가의 사랑은 그리스도와 교회의 사랑(엡 5장)을 비춥니다."},
{t:"이사야 1",u:"4권 1강",story:"웃시야 왕이 죽던 해 이사야는 거룩하신 왕을 봅니다(6장). 유다와 열방을 향한 심판의 말씀 속에 처녀가 낳을 아들 임마누엘(7장)과 이새의 줄기에서 나올 싹(11장)이 약속됩니다.",christ:"\"한 아기가 우리에게 났고 한 아들을 우리에게 주신 바 되었는데\"(9:6)."},
{t:"이사야 2",u:"4권 1강",story:"40장부터 분위기가 바뀝니다. \"내 백성을 위로하라\". 포로 된 백성에게 새 출애굽을 약속하고, 고난받는 종의 노래(53장)를 거쳐 새 하늘과 새 땅(65장)까지 나아갑니다.",christ:"\"그가 찔림은 우리의 허물 때문이요\"(53:5). 빌립은 이 본문으로 내시에게 예수를 전했습니다(행 8장)."},
{t:"예레미야 1",u:"4권 2강",story:"어린 예레미야가 무너지는 유다를 향해 40년 동안 외칩니다. 아무도 듣지 않고, 그는 매 맞고 갇히고 하나님께 울며 따집니다.",christ:"토기장이의 손에서 다시 빚어지는 진흙(18장)처럼, 하나님은 무너진 백성을 새롭게 빚으실 계획을 갖고 계십니다."},
{t:"예레미야 2 · 애가",u:"4권 2강",story:"새 언약의 약속(31장)이 주어진 뒤 예루살렘이 실제로 무너집니다. 예레미야애가는 무너진 성을 붙들고 부르는 장례의 노래이지만, 한가운데에 \"여호와의 인자와 긍휼이 무궁하시므로\"(애 3:22)가 있습니다.",christ:"\"내가 이스라엘 집과 유다 집에 새 언약을 맺으리라\"(31:31). 예수님은 마지막 만찬에서 \"내 피로 세우는 새 언약\"이라 하셨습니다."},
{t:"에스겔 1",u:"4권 3강",story:"무대는 바벨론 그발 강가입니다. 포로 된 제사장 에스겔이 하나님의 영광을 보고, 그 영광이 예루살렘 성전을 떠나는 장면(10장)을 목격합니다.",christ:"떠났던 영광은 \"우리가 그의 영광을 보니\"(요 1:14)로 돌아옵니다."},
{t:"에스겔 2",u:"4권 3강",story:"예루살렘 함락 소식(33장) 이후 회복의 말씀이 시작됩니다. 참 목자, 마른 뼈 골짜기(37장), 그리고 새 성전에서 흘러나오는 생명의 강(47장)까지.",christ:"\"나는 선한 목자라\"(요 10:11)는 에스겔 34장의 약속을 이루신 말씀입니다."},
{t:"다니엘 · 호세아",u:"4권 4강",story:"다니엘은 바벨론 궁정에서 신실함을 지키며 세상 나라들 너머의 하나님 나라를 봅니다. 호세아는 음란한 아내를 다시 데려오라는 명령을 받아, 자기 결혼으로 하나님의 사랑을 보여 줍니다.",christ:"\"인자 같은 이가 하늘 구름을 타고 와서\"(단 7:13). 예수님이 가장 즐겨 쓰신 자기 호칭이 '인자'입니다."},
{t:"소선지서 1",u:"4권 5강",story:"요엘(여호와의 날), 아모스(정의를 물같이), 오바댜(에돔), 요나(도망친 선지자), 미가(베들레헴), 나훔(니느웨), 하박국(믿음으로 사는 의인), 스바냐가 이어집니다.",christ:"\"베들레헴 에브라다야 … 이스라엘을 다스릴 자가 네게서 내게로 나올 것이라\"(미 5:2). 요나의 사흘은 예수님의 무덤과 부활의 표적이 됩니다(마 12:40)."},
{t:"소선지서 2",u:"4권 5강",story:"포로에서 돌아온 백성에게 학개는 성전을 지으라 하고, 스가랴는 겸손한 왕을 약속하며, 말라기는 식어 버린 예배를 꾸짖습니다. 구약은 엘리야를 보내겠다는 약속으로 끝납니다.",christ:"\"나귀를 타나니\"(슥 9:9)는 예루살렘에 들어가시는 예수님으로, 엘리야(말 4:5)는 세례 요한으로 이어집니다."},
{t:"복음서 1",u:"5권 1강",story:"마태는 아브라함과 다윗의 족보로 예수님을 소개합니다. 산상설교(5–7장), 기적들, 제자 파송, 천국 비유를 지나 베드로의 고백(16장)에 이릅니다.",christ:"\"주는 그리스도시요 살아 계신 하나님의 아들이시니이다\"(16:16). 구약 전체가 기다린 바로 그분입니다."},
{t:"복음서 2",u:"5권 2강",story:"앞의 사흘은 마태복음 후반부(19–28장)입니다. 예수님이 예루살렘으로 올라가 성전을 깨끗하게 하시고, 논쟁과 가르침 끝에 십자가에 달리시고 부활하십니다. 뒤의 사흘은 마가복음 전체입니다. 마가는 '곧'이라는 말을 자주 쓰며 숨 가쁘게 달려가는 복음서입니다.",christ:"\"인자가 온 것은 섬김을 받으려 함이 아니라 도리어 섬기려 하고 자기 목숨을 많은 사람의 대속물로 주려 함이니라\"(막 10:45)."},
{t:"복음서 3",u:"5권 3강",story:"누가는 목자들, 세리, 여인들, 사마리아인처럼 변두리 사람들을 자주 비춥니다. 예수님은 갈릴리에서 예루살렘을 향해 얼굴을 굳게 하시고(9:51), 엠마오 길에서 부활을 설명하십니다.",christ:"\"모세와 모든 선지자의 글로 시작하여 모든 성경에 쓴 바 자기에 관한 것을 자세히 설명하시니라\"(24:27). 리딩지저스의 출발점이 이 구절입니다."},
{t:"복음서 4",u:"5권 4강",story:"요한은 일곱 표적과 \"나는 …이다\"라는 말씀으로 예수님을 보여 줍니다. 다락방 강화(13–17장)를 지나 십자가와 부활, 디베랴 바닷가 아침 식사로 끝납니다.",christ:"\"태초에 말씀이 계시니라\"(1:1). 창세기 1장의 첫 말이 다시 시작됩니다."},
{t:"사도행전 1",u:"5권 5강",story:"성령이 오시고 예루살렘에서 교회가 태어납니다. 베드로와 요한, 스데반의 순교, 사울의 회심, 고넬료의 집, 그리고 안디옥에서 시작된 첫 선교 여행.",christ:"\"너희가 … 예루살렘과 온 유대와 사마리아와 땅 끝까지 이르러 내 증인이 되리라\"(1:8). 부활하신 그리스도께서 성령으로 계속 일하십니다."},
{t:"사도행전 2",u:"5권 6강",story:"바울의 2차, 3차 선교 여행과 예루살렘에서의 체포, 재판, 그리고 풍랑을 지나 로마에 도착하기까지. 책은 바울이 셋집에서 거침없이 복음을 전하는 장면으로 열린 채 끝납니다.",christ:"끝나지 않은 결말은 그리스도의 이야기가 오늘 우리를 통해 계속된다는 초대입니다."},
{t:"로마서",u:"5권 7강",story:"아직 가 보지 못한 로마 교회에 보내는 편지입니다. 모두가 죄 아래 있다는 진단에서 시작해, 믿음으로 얻는 의, 아담과 그리스도, 성령 안의 삶, 이스라엘의 미래, 산 제물로 드리는 삶까지 큰 이야기를 펼칩니다.",christ:"\"한 사람이 순종하지 아니함으로 많은 사람이 죄인 된 것 같이 한 사람이 순종하심으로 많은 사람이 의인이 되리라\"(5:19)."},
{t:"바울 서신 1",u:"6권 1강",story:"고린도 교회는 분열, 음행, 소송, 우상 제물, 예배 질서, 부활 문제로 흔들립니다. 바울은 십자가의 지혜로 답하고, 고린도후서에서는 '질그릇에 담긴 보배'로 자기 사역을 변호합니다.",christ:"\"우리는 십자가에 못 박힌 그리스도를 전하니\"(고전 1:23)."},
{t:"바울 서신 2",u:"6권 2강",story:"고린도 교회와의 화해와 연보, 반대자들 앞에서 약함을 자랑하는 바울(고후 7–13장). 이어서 다른 복음을 막는 갈라디아서, 교회의 큰 그림을 보여 주는 에베소서, 감옥에서 쓴 기쁨의 편지 빌립보서가 이어집니다.",christ:"\"그는 근본 하나님의 본체시나 … 자기를 비워 종의 형체를 가지사\"(빌 2:6–7). 이번 주 편지들은 모두 이 그리스도 이야기 위에 서 있습니다."},
{t:"바울 서신 3",u:"6권 3강",story:"만물보다 먼저 계신 그리스도(골로새서), 다시 오실 주님(데살로니가전후서), 다음 세대 일꾼을 세우는 목회 서신, 그리고 도망친 종 오네시모를 형제로 받아 달라는 빌레몬서.",christ:"\"그는 보이지 아니하는 하나님의 형상이시요 모든 피조물보다 먼저 나신 이시니\"(골 1:15)."},
{t:"일반 서신 1",u:"6권 4강",story:"히브리서는 흔들리는 성도들에게 천사, 모세, 대제사장, 제사보다 더 나으신 예수님을 보여 주고, 믿음의 선진들(11장)을 불러 세웁니다. 야고보서는 행함으로 살아 있는 믿음을 말합니다.",christ:"\"믿음의 주요 또 온전하게 하시는 이인 예수를 바라보자\"(히 12:2)."},
{t:"일반 서신 2",u:"6권 5강",story:"흩어진 나그네 성도들(베드로전서), 거짓 교사에 대한 경고(베드로후서, 유다서), 빛과 사랑 안에 거하라는 요한의 편지들이 이어집니다.",christ:"\"하나님은 사랑이심이라\"(요일 4:8). 그 사랑이 어떻게 나타났는지 요한은 십자가로 답합니다(4:9–10)."},
{t:"요한계시록 1",u:"6권 6강",story:"밧모섬에 갇힌 요한이 부활하신 주님을 보고 일곱 교회에 편지를 받아 적습니다. 이어 하늘 보좌가 열리고, 죽임당한 어린양이 두루마리를 받아 일곱 인과 나팔이 시작됩니다.",christ:"유대 지파의 사자를 기대했는데 보니 \"일찍이 죽임을 당한 것 같은 어린 양\"(5:6)입니다. 계시록 전체의 반전입니다."},

 {n:"약속하시는 하나님",p:"약속하시는",re:/약속하|약속을|언약을 기억|언약을 세우|내 언약/},
 {n:"들으시는 하나님",p:"기도를 들으시는",re:/들으시|응답/},
 {n:"다스리시는 하나님",p:"온 세상을 다스리시는",re:/다스리|왕이시|보좌|통치/}
];
function near(t,re){
  const di=[...t.matchAll(new RegExp(DIVINE.source,"g"))].map(m=>m.index); if(!di.length) return false;
  const ai=[...t.matchAll(new RegExp(re.source,"g"))].map(m=>m.index);
  return ai.some(a=>di.some(d=>Math.abs(a-d)<=22)) && !/거짓 (그리스도|선지자)|맹세하는 자|희롱|조롱|비웃|모욕/.test(t);
}
function godTraits(A){
  const res=[];
  for(const at of ATTRS){
    const vs=A.verses.filter(v=>(!at.ot||v.b<40)&&near(v.t,at.re));
    if(vs.length) res.push({at,vs});
  }
  res.sort((a,b)=>b.vs.length-a.vs.length);
  return res.slice(0,3).map(x=>{
    const pickV=x.vs.slice().sort((a,b)=>Math.abs(a.t.length-70)-Math.abs(b.t.length-70))[0];
    return {...x,verse:pickV};
  });
}

}

    L.polyline(ll,{color:"#fff",weight:6,opacity:.7,interactive:false}).addTo(map);
    L.polyline(ll,{color:col,weight:3,dashArray:"8 6",interactive:false}).addTo(map);
    for(let k=0;k<ll.length-1;k++){ const a=ll[k],b=ll[k+1]; if(a[0]===b[0]&&a[1]===b[1]) continue;
      const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
      const mk=L.marker(mid,{icon:L.divIcon({className:"",html:`<span class="rarrow" style="border-left-color:${col}"></span>`,iconSize:null}),interactive:false,keyboard:false}).addTo(map);
      arrows.push({mk,a,b}); }
    r.p.forEach((q,qi)=>{ if(!q[0]||use.some(p=>p.name===q[0])) return;
      L.circleMarker([q[1],q[2]],{radius:4,color:col,weight:2,fillColor:"#fff",fillOpacity:1,interactive:false}).addTo(map);
      const mk=L.marker([q[1],q[2]],{icon:L.divIcon({className:"",html:`<span class="mlbl rte">${esc(q[0])}</span>`,iconSize:null}),interactive:false,keyboard:false}).addTo(map);
      labels.push({mk,pri:300+qi}); });
  });
  function orient(){ arrows.forEach(o=>{ const p1=map.latLngToLayerPoint(o.a),p2=map.latLngToLayerPoint(o.b); const ang=Math.atan2(p2.y-p1.y,p2.x-p1.x)*180/Math.PI; const e=o.mk.getElement()?.querySelector(".rarrow"); if(e) e.style.transform=`translate(-50%,-50%) rotate(${ang}deg)`; }); }
  const open=p=>{const b0=A.verses[0].b; const kn={c:"성읍",r:"지역",m:"산",w:"강·바다·호수"}[p.g[3]];
    sheet(p.name,`<p>${kn} · 오늘 본문에 ${p.n}번 나옵니다.</p><p class="src">나오는 곳: ${esc(refList(p.refs,b0))}${p.n>p.refs.length?" …":""}</p><p class="src">위치는 대략적인 것입니다.</p>`);};
  use.forEach((p,i)=>{
    const ll=[p.g[1],p.g[2]], kind=p.g[3];
    if(kind==="r"){
      const mk=L.marker(ll,{icon:L.divIcon({className:"",html:`<span class="mlbl reg">${esc(p.name)}</span>`,iconSize:null}),keyboard:false}).addTo(map).on("click",()=>open(p));
      labels.push({mk,pri:200+i}); return;
    }
    L.circleMarker(ll,{radius:6,color:"#fff",weight:2,fillColor:kind==="m"?"#9A6417":kind==="w"?"#2f6582":"#B4432F",fillOpacity:1}).addTo(map).on("click",()=>open(p));
    const mk=L.marker(ll,{icon:L.divIcon({className:"",html:`<span class="mlbl">${esc(p.name)}</span>`,iconSize:null}),keyboard:false}).addTo(map).on("click",()=>open(p));
    labels.push({mk,pri:i});
  });
  for(const [n,la,lo] of (CTXL[fid]||[])){
    if(use.some(p=>p.name===n.replace(/ 강$/,""))) continue;
    const mk=L.marker([la,lo],{icon:L.divIcon({className:"",html:`<span class="mlbl wat">${n}</span>`,iconSize:null}),interactive:false,keyboard:false}).addTo(map);
    labels.push({mk,pri:500});
  }
  function declutter(){
    const kept=[];
    labels.slice().sort((a,b)=>a.pri-b.pri).forEach(l=>{
      const e=l.mk.getElement()?.querySelector(".mlbl"); if(!e) return;
      e.style.visibility="visible"; const r=e.getBoundingClientRect();
      if(kept.some(k=>!(r.right<k.left||r.left>k.right||r.bottom<k.top||r.top>k.bottom))) e.style.visibility="hidden"; else kept.push(r);
    });
  }
  map.on("zoomend moveend",declutter); map.on("zoomend",orient);
  const PB=R.length?L.latLngBounds(R.flatMap(r=>r.p.map(q=>[q[1],q[2]])).filter(q=>FB.contains(q))):L.latLngBounds(use.map(p=>[p.g[1],p.g[2]]));
  if(use.length===1&&!R.length) map.setView(PB.getCenter(),Math.max(map.getZoom(),fid==="israel"?8.5:6.5),{animate:false});
  else map.fitBounds(PB.pad(R.length?0.12:0.25),{maxZoom:fid==="israel"?8.5:(R.length?7.5:6.5),animate:false});
  setTimeout(()=>{if(LMAP!==map)return; map.invalidateSize({animate:false});orient();declutter();},60);
}

/* 진행률 */
const TOTAL_CH=PLAN.plan.flat().reduce((a,p)=>a+p.ch.length,0);
function chDone(){ let n=0; for(const k in mem.done){ const [w,d]=k.split("-").map(Number); if(PLAN.plan[w-1]&&PLAN.plan[w-1][d]) n+=PLAN.plan[w-1][d].ch.length; } return n; }
function chScheduled(){ if(here.state==="before") return 0; let n=0; for(let w=1;w<=here.w;w++) for(let d=0;d<6;d++){ if(w===here.w&&d>here.d) break; n+=PLAN.plan[w-1][d].ch.length; } return n; }
const pct1=(a,b)=>b?(a/b*100).toFixed(1):"0.0";
function progressCard(){
  const n=chDone(), s=chScheduled();
  return `<div class="prog"><div class="top"><span>성경 전체 진행률</span><b>${pct1(n,TOTAL_CH)}%</b></div><div class="bar" aria-hidden="true"><i style="width:${pct1(n,TOTAL_CH)}%"></i><u style="left:${pct1(s,TOTAL_CH)}%"></u></div><span class="lead">${TOTAL_CH.toLocaleString()}장 가운데 ${n.toLocaleString()}장을 읽었습니다. 노란 선은 일정상 오늘까지 읽을 분량(${pct1(s,TOTAL_CH)}%)입니다.</span></div>`;
}

function progressMini(){
  const n=chDone();
  return `<div class="pmini" role="button" tabindex="0" id="pmini" aria-label="자세한 기록 보기"><span>진행률 <b>${pct1(n,TOTAL_CH)}%</b></span><span class="bar" aria-hidden="true"><i style="width:${pct1(n,TOTAL_CH)}%"></i></span><span class="more">기록 ›</span></div>`;
}

/* 자주 나오는 말·봉투 구조 */
const vref=(x,b0)=>(x[0]!==b0?PLAN.abbr[x[0]-1]+" ":"")+x[1]+":"+x[2];
function renderKeyWords(A,w,d){
  const k=w+"-"+(d+1), b0=A.verses[0].b;
  const ppl=[...A.people.values()].filter(x=>x.n>=3).sort((a,b)=>b.n-a.n).slice(0,5);
  const lw=LEITWORT[k]||[], em=EMPH[k]||[], inc=INCL[k]||[];
  if(!ppl.length&&!lw.length&&!em.length&&!inc.length&&!(CLUES[k]||[]).length) return "";
  let h=`<div class="kw"><span class="kw-title">본문을 읽는 단서</span>`;
  if(ppl.length) h+=`<div class="kwrow"><p><b>주요 인물</b> 이름이 자주 나오는 사람이 이야기를 이끌어 갑니다. 누가 말하고 움직이는지 따라가 보세요.</p><div class="chips">${ppl.map(x=>`<button class="chip" data-person="${esc(x.name)}">${esc(x.name)}<small>${x.n}</small></button>`).join("")}</div></div>`;
  if(lw.length) h+=`<div class="kwrow"><p><b>주도어</b> 성경 전체보다 오늘 본문에 훨씬 자주 되풀이되는 말입니다. 이렇게 되풀이되며 이야기를 묶는 말을 주도어(Leitwort)라고 합니다. 이 말이 처음 나올 때와 마지막에 나올 때 무엇이 달라졌는지 살펴보세요.</p><div class="chips">${lw.map(x=>`<button class="chip lw" data-lw="${esc(x[0])}">${esc(x[0])}<small>${x[1]}</small></button>`).join("")}</div></div>`;
  const C=CLUES[k]||[], rows=[];
  const by=t=>C.filter(c=>c.t===t);
  if(inc.length) rows.push(`<div class="kwrow"><p><b>봉투 구조</b> 같은 말이나 장면으로 열고 닫아, 그 사이를 봉투처럼 감싸는 짜임입니다(inclusio). 가운데에 무엇이 들어 있는지 보면 글쓴이의 뜻이 보입니다.</p><div class="chips">${inc.map((x,i)=>`<button class="chip inc" data-inc="${i}">${esc(vref(x.a,b0))} ↔ ${esc(vref(x.z,b0))}</button>`).join("")}</div></div>`);
  const ROWDEF=[["turn","꺾이는 곳","여기서 이야기의 방향이 바뀝니다. 바뀌기 전과 후를 비교해 보세요.",c=>vref(c.r,b0)],
    ["scene","닮은 장면","전에 읽은 장면과 닮았습니다. 같은 점과 다른 점을 찾아보세요.",c=>c.g],
    ["echo","구약의 메아리","신약이 구약의 말씀을 다시 부릅니다. 처음 그 말씀이 나온 장면을 떠올려 보세요.",c=>vref(c.r,b0)+" ← "+PLAN.abbr[c.o[0]-1]+" "+c.o[1]+":"+c.o[2]],
    ["pair","나란히 보기","두 사람을 나란히 놓으면 차이가 보입니다. 누가 무엇을 택했나요?",c=>c.a+" ↔ "+c.b],
    ["irony","독자만 아는 것","인물은 모르지만 읽는 우리는 아는 것이 있습니다. 그래서 이 장면이 더 아프거나 우습습니다.",c=>vref(c.r,b0)],
    ["aside","글쓴이의 해설","이야기 중간에 글쓴이가 직접 설명을 덧붙인 곳입니다. 왜 여기서 멈추고 설명했을까요?",c=>vref(c.r,b0)]];
  for(const [t,lab,desc,chip] of ROWDEF){
    let list=by(t); if(t==="scene") list=list.filter(c=>c.prev.length);
    if(list.length) rows.push(`<div class="kwrow"><p><b>${lab}</b> ${desc}</p><div class="chips">${list.map(c=>`<button class="chip cl cl-${t}" data-clue="${C.indexOf(c)}">${esc(chip(c))}</button>`).join("")}</div></div>`);
  }
  if(em.length) rows.push(`<div class="kwrow"><p><b>강조</b> 같은 말을 연달아 부르는 곳은 감정이 북받치거나 힘주어 말하는 자리입니다. 말하는 사람의 마음을 생각해 보세요.</p><div class="chips">${em.map(x=>`<button class="chip em" data-em="${esc(x[0])}">${esc(Array(x[1]).fill(x[0]).join(" "))}</button>`).join("")}</div></div>`);
  h+=rows.slice(0,3).join("");
  return h+`</div>`;
}
const iga=w=>hasB(w.replace(/[^가-힣]/g,"").slice(-1)||"가")?"이":"가";
function showLW(word){
  const k=view.w+"-"+(view.d+1), x=(LEITWORT[k]||[]).find(y=>y[0]===word); if(!x) return; const b0=dayPlan(view.w,view.d).ch[0][0];
  sheet(word,`<p>오늘 본문에 ${x[1]}번 · 평소보다 약 ${Math.round(x[2])}배 자주 나옵니다.</p><p class="src">나오는 곳: ${esc(refList(x[3],b0))}${x[1]>x[3].length?" …":""}</p>`);
}
function showEM(word){
  const k=view.w+"-"+(view.d+1), x=(EMPH[k]||[]).find(y=>y[0]===word); if(!x) return; const b0=dayPlan(view.w,view.d).ch[0][0];

/* 단서 자료를 날짜별로 */
function dayOfRef(q){ for(let w=1;w<=45;w++) for(let d=0;d<6;d++) if(PLAN.plan[w-1][d].ch.some(([b,c])=>b===q[0]&&c===q[1])) return [w,d]; return null; }
const CLUES={};
for(const c of CLUE_LIST){ const at=dayOfRef(c.t==="pair"?c.ra:c.r); if(!at) continue; const key=at[0]+"-"+(at[1]+1); (CLUES[key] ||= []).push(c); }
for(const c of CLUE_LIST.filter(c=>c.t==="scene")){ const me=dayOfRef(c.r); c.prev=CLUE_LIST.filter(o=>o.t==="scene"&&o.g===c.g&&o!==c).map(o=>({o,at:dayOfRef(o.r)})).filter(x=>x.at&&(x.at[0]<me[0]||(x.at[0]===me[0]&&x.at[1]<me[1]))); }
const GAPS={}; for(const g of GAP_LIST){ const at=dayOfRef(g.r); if(at) GAPS[at[0]+"-"+(at[1]+1)]=g; }

function confetti(){
  try{ if(matchMedia("(prefers-reduced-motion: reduce)").matches) return; }catch(e){}
  const c=document.createElement("canvas"); c.className="confetti"; const W=c.width=innerWidth, H=c.height=innerHeight; document.body.appendChild(c);
  const x=c.getContext("2d"), cs=getComputedStyle(document.documentElement), col=["--accent","--gold","--ok","--bad"].map(v=>cs.getPropertyValue(v).trim()||"#2C5C52");
  const P=Array.from({length:110},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.55,vx:(Math.random()-.5)*11,vy:-Math.random()*15-6,r:Math.random()*6+4,a:Math.random()*6,va:(Math.random()-.5)*.4,c:col[Math.random()*4|0]}));
  const t0=performance.now();
  (function f(t){ const k=(t-t0)/1700; x.clearRect(0,0,W,H); if(k>=1){c.remove();return;}
    x.globalAlpha=k>.7?(1-k)/.3:1;
    for(const p of P){ p.vy+=.45; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore(); }
    requestAnimationFrame(f); })(t0);
  try{ navigator.vibrate&&navigator.vibrate(30); }catch(e){}
}

function clueFor(k,A,w,d){

  if(/무대/.test(k)&&A.places.size) return "오늘 나오는 곳: "+top(A.places,6);

  if(/줄거리|편지 뒤|시간/.test(k)) return "요약 다시 보기: "+SUMMARY[w-1][d].split(/(?<=다\.)\s/)[0];
  return "";
}
function qtVerses(A,traits,key){

function makePrayer(key,vi,pv,label,v,traits){

    const s=qz.first.filter(Boolean).length, t=qz.qs.length; const [g,msg]=grade(s,t);
    return `<div class="quiz"><div class="score"><span class="badge">${g}</span><div class="big">${s}<small> / ${t}</small></div><p class="lead">${msg}</p></div><div class="row" style="justify-content:center"><button class="btn" data-qstart="${mode}">새 문제로 다시 풀기</button>${mode==="day"?`<button class="btn ghost" data-goweek="1">이번 주 기록 보기</button>`:""}</div></div>`;
  }
  const dots=qz.qs.map((_,i)=>`<i class="${i<qz.i?(qz.first[i]?"ok":"no"):i===qz.i?"cur":""}"></i>`).join("");
  const st=qz.state;
  let h=`<div class="quiz"><div class="qhead"><span class="kind">${esc(q.kind)} · ${qz.i+1}/${qz.qs.length}</span><span class="dots">${dots}</span></div><p class="qtext">${esc(q.q)}</p>${q.quote?`<p class="quote">${esc(q.quote)}</p>`:""}<div class="opts ${q.t==="ox"?"ox":""}">`;
  h+=q.o.map((o,i)=>{let c="opt"; if(st.wrong.includes(i))c+=" wrong"; if(st.solved&&i===q.a)c+=" right";
    return `<button class="${c}" data-ans="${i}" data-mode="${mode}" ${st.solved||st.wrong.includes(i)?"disabled":""}>${esc(o)}</button>`;}).join("")+`</div>`;
  if(st.solved){
    const vs=q.vs; const ref=`${PLAN.abbr[vs.b-1]} ${vs.c}:${vs.v}`;
    h+=`<div class="feedback good"><span><b>${st.wrong.length?"찾았습니다!":"정답입니다!"}</b> 본문 ${esc(ref)}</span><div class="row"><button class="btn ghost small" data-see="${vs.b}-${vs.c}-${vs.v}">본문에서 보기</button><button class="btn small" data-next="${mode}">${qz.i+1<qz.qs.length?"다음 문제":"결과 보기"}</button></div></div>`;
  } else if(st.wrong.length){
    const last=st.wrong[st.wrong.length-1];
    const hint=(q.h&&q.h[last])||q.hint||"본문을 다시 떠올려 보세요.";
    h+=`<div class="feedback hint"><span><b>다시 생각해 보세요.</b> ${esc(hint)}</span><div class="row"><button class="btn ghost small" data-see="${q.vs.b}-${q.vs.c}-0">본문 ${q.vs.b===19?q.vs.c+"편":q.vs.c+"장"} 다시 보기</button></div></div>`;
  }
  return h+`</div>`;
}
function startQuiz(mode){
  const {w,d}=view;
  if(mode==="day"){
    const A=dayA(w,d);
    const qs=makeQuiz(A,CTX,(Date.now()^Math.floor(Math.random()*1e9))>>>0,{curated:(CURATED[w+"-"+(d+1)]||[]).map(cq=>({...cq,vs:{b:cq.ref[0],c:cq.ref[1],v:cq.ref[2]}}))});
    view.quiz={key:keyOf(w,d),qs,i:0,first:[],state:{wrong:[],solved:false}};
  } else {
    const qs=[]; const base=(Date.now()^Math.floor(Math.random()*1e9))>>>0;
    for(let dd=0;dd<6;dd++){ const A=dayA(w,dd); const one=makeQuiz(A,CTX,base+dd*7919,{nOX:dd%2?0:1,nMC:dd%2?1:0}); if(one[0]) qs.push(one[0]); }
    view.wquiz={key:String(w),qs,i:0,first:[],state:{wrong:[],solved:false}};
  }
}
function answer(mode,i){
  const qz=mode==="day"?view.quiz:view.wquiz; const q=qz.qs[qz.i];
  if(qz.state.solved) return;
  if(i===q.a){ qz.state.solved=true; if(qz.first[qz.i]===undefined) qz.first[qz.i]=true; }
  else { qz.state.wrong.push(i); if(qz.first[qz.i]===undefined) qz.first[qz.i]=false; }
}
function nextQ(mode){
  const qz=mode==="day"?view.quiz:view.wquiz;
  qz.i++; qz.state={wrong:[],solved:false};
  if(qz.i>=qz.qs.length){
    const store=mode==="day"?mem.q:mem.wq; const s=qz.first.filter(Boolean).length, t=qz.qs.length;
    const rec=store[qz.key]||{tries:0};
    rec.tries=(rec.tries||0)+1; rec.last={s,t}; if(!rec.first) rec.first={s,t,at:new Date().toISOString().slice(0,10)};
    if(!rec.best||s/t>rec.best.s/rec.best.t) rec.best={s,t};
    store[qz.key]=rec; if(mode==="day"&&!mem.done[qz.key]){mem.done[qz.key]=new Date().toISOString().slice(0,10); view.justDone=true; if(window.SYNC&&SYNC.available) SYNC.markDone(qz.key,todayStr());} save();
  }
}

/* 주일 돌아보기 */
function weekTotals(w){
  let s=0,t=0,n=0; for(let d=0;d<6;d++){const f=dayScore(w,d); if(f){s+=f.s;t+=f.t;n++;}} return {s,t,n};
}
function renderReview(){
  const w=view.w, W=WEEKS[w-1]; const T=weekTotals(w);

  h+=`<section class="sec"><span class="label">이번 주 퀴즈 성적</span><div class="tbl">`;
  for(let d=0;d<6;d++){
    const f=dayScore(w,d), p=dayPlan(w,d);
    h+=`<button class="trow" data-jump="${w}-${d}"><span class="d">${d+1}일째</span><span class="r">${esc(p.label)}${f?`<div class="meter"><i style="width:${pct(f.s,f.t)}%"></i></div>`:""}</span><span class="s ${f?"":"none"}">${f?`${f.s}/${f.t}`:"아직"}</span></button>`;
  }
  const [g,msg]=T.t?grade(T.s,T.t):["아직 시작 전","이번 주 날마다 퀴즈를 풀면 여기에 점수가 모입니다."];
  h+=`<div class="total"><span>${T.n}일 참여 · ${T.t?`정답률 ${pct(T.s,T.t)}%`:""}</span><span class="big">${T.s} / ${T.t}</span></div></div>
  <div class="score"><span class="badge">${g}</span><p class="lead">${T.t?`${T.t}문제 가운데 ${T.s}문제를 처음 시도에 맞히셨어요. `:""}${msg}${T.n&&T.n<6?` 아직 ${6-T.n}일이 남아 있어요. 놓친 날도 지금 풀 수 있습니다.`:""}</p></div></section>`;
  if(BIBLE) h+=`<section class="sec"><span class="label">주간 도전 문제</span>${renderQuiz(String(w),null,"week")}</section>`;
  h+=renderArcs(w);
  h+=`<section class="sec"><span class="label">이번 주 이야기 다시 보기</span><details class="flow" open><summary>이번 주 전체 흐름</summary><p>${esc(W.story)}</p><p style="color:var(--muted);font-size:14.5px">${esc(W.christ)}</p></details><div class="sumlist">`;
  for(let d=0;d<6;d++) h+=`<details><summary>${d+1}일째 · ${esc(dayPlan(w,d).label)}</summary><p>${esc(SUMMARY[w-1][d])}</p></details>`;
  return h+`</div></section>`;
}

/* 나의 기록 */
function renderRecord(){
  let days=0,s=0,t=0; for(const k in mem.q){const f=mem.q[k].first; if(f){days++;s+=f.s;t+=f.t;}}
  // 연속 기록: 오늘(또는 어제)부터 거꾸로
  let streak=0; {let w=here.w,d=here.d; if(d===6)d=5; if(!dayScore(w,d)){ if(d>0)d--; else if(w>1){w--;d=5;} }
    while(w>=1&&dayScore(w,d)){streak++; if(d>0)d--; else {w--;d=5;}}}
  let h=renderAccount()+`<section class="sec"><span class="label">나의 기록</span><h2>45주 통독 여정</h2>${progressCard()}<div class="stats"><div class="stat"><b>${Object.keys(mem.done).length}</b><span>통독 마친 날 / 270</span></div><div class="stat"><b>${t?pct(s,t)+"%":"–"}</b><span>처음 시도 정답률</span></div><div class="stat"><b>${Object.values(mem.qt).filter(x=>x.done).length}</b><span>QT 마친 날</span></div></div></section>`;
  h+=`<section class="sec"><span class="label">주차별 점수</span><div class="tbl">`;
  let any=false;
  for(let w=45;w>=1;w--){
    const T=weekTotals(w); if(!T.n&&w!==here.w) continue; any=true;
    h+=`<button class="trow" data-jump="${w}-6"><span class="d">${w}주차</span><span class="r">${esc(WEEKS[w-1].t)}${T.t?`<div class="meter"><i style="width:${pct(T.s,T.t)}%"></i></div>`:""}</span><span class="s ${T.t?"":"none"}">${T.t?`${T.s}/${T.t}`:"아직"}</span></button>`;
  }
  h+=`</div>${any?"":""}<p class="lead">주차를 누르면 그 주의 돌아보기 화면으로 갑니다.</p></section>`;
  return h;
}
