 안의 사람들을 구원하신 일은 그리스도의 부활로 우리를 구원하는 세례의 모형입니다(벧전 3:20-21).","1-3":"바벨에서 흩어진 언어는 오순절에 성령이 임하실 때 각 나라 말로 하나님의 큰 일을 듣게 하심으로 그리스도 안에서 다시 모이기 시작합니다(행 2:6-11).","1-4":"아브람이 믿음으로 의롭다 여김을 받은 것처럼, 우리도 예수님을 살리신 하나님을 믿을 때 의롭다 하심을 받습니다(롬 4:22-25).","1-5":"아브라함과 그 씨에게 하신 약속은 궁극적으로 한 사람, 곧 그리스도를 가리킵니다(갈 3:16).","1-6":"독자를 아끼지 않은 아브라함과 대신 드려진 숫양은, 자기 아들을 아끼지 아니하시고 우리를 위해 내주신 하나님의 사랑을 가리킵니다(롬 8:32).","2-0":"\"큰 자가 어린 자를 섬기리라\"는 택하심은 행위가 아닌 부르시는 이의 은혜로 구원하시는 하나님을 보여 줍니다(롬 9:11-12).","2-1":"하늘과 땅을 잇는 사닥다리는 하나님의 사자들이 인자 위에 오르락내리락하리라 하신 예수님 자신을 가리킵니다(요 1:51).","2-2":"사랑받지 못한 레아에게서 난 유다를 통해 왕의 계보가 이어져, 마침내 유다 지파에서 예수님이 나셨습니다(마 1:2-3; 히 7:14).","2-3":"원수 되었던 형제의 화해는, 그리스도께서 십자가로 원수 된 것을 소멸하시고 우리를 하나님과 화목하게 하신 복음을 미리 보여 줍니다(엡 2:16).","2-4":"\"왕들이 네 허리에서 나오리라\"는 약속은 야곱의 후손, 다윗의 자손으로 오신 왕 예수님 안에서 이루어집니다(마 1:1-2).","2-5":"에서의 계보까지 기록하신 하나님은, 열방의 역사도 다스리시며 결국 모든 족속을 그리스도 앞으로 부르십니다(계 7:9).","2-6":"형들에게 미움받고 은에 팔린 요셉은, 자기 백성에게 버림받고 은 삼십에 팔리신 예수님을 미리 보여 줍니다(마 26:15).","3-0":"고난의 자리에서 높임을 받아 온 세상을 먹이는 요셉은, 낮아지셨다가 높아지셔서 생명의 떡이 되신 예수님을 비춥니다(빌 2:8-9).","3-1":"아우 대신 자기를 종으로 내놓은 유다의 간청은, 우리 대신 자기 목숨을 내주신 유다 지파의 예수님을 미리 보여 줍니다(막 10:45).","3-2":"\"내가 너와 함께 애굽으로 내려가겠고\" 하신 하나님은 마침내 임마누엘 예수님으로 우리와 함께하러 오셨습니다(마 1:23).","3-3":"\"규가 유다를 떠나지 아니하며\"라는 축복은 유다 지파에서 나신 영원한 왕 예수님 안에서 이루어졌습니다(히 7:14; 계 5:5).","3-4":"아기들을 죽이려는 왕의 손에서 건짐받은 모세처럼, 예수님도 헤롯의 칼을 피하여 애굽으로 가셨다가 구원자로 오셨습니다(마 2:13-16).","3-5":"\"나는 스스로 있는 자\"라 하신 하나님은 \"아브라함이 나기 전부터 내가 있느니라\" 하신 예수님 안에서 자신을 보여 주셨습니다(요 8:58).","3-6":"\"편 팔과 여러 큰 심판들로써 너희를 속량하여\" 하신 약속은, 그리스도께서 자기 피로 우리를 죄의 종살이에서 속량하신 일로 완성됩니다(엡 1:7).","4-0":"애굽의 신들과 바로를 심판하신 하나님의 능력은, 십자가로 통치자들과 권세들을 무력화하여 이기신 그리스도의 승리를 내다봅니다(골 2:15).","4-1":"흑암 가운데서도 빛이 있던 이스라엘처럼, 세상의 빛이신 예수님을 따르는 자는 어둠에 다니지 않고 생명의 빛을 얻습니다(요 8:12).","4-2":"유월절 어린 양의 피는 우리를 위해 희생되신 예수님을 가리킵니다(고전 5:7). 뼈를 꺾지 말라는 규례도 십자가에서 이루어졌습니다(요 19:36).","4-3":"홍해를 건넌 일은 세례의 모형이며(고전 10:1-2), 원수에게서 백성을 건지신 하나님은 죄와 죽음에서 우리를 구원하신 그리스도의 구원을 미리 보여 줍니다.","4-4":"하늘에서 내린 만나는 \"나는 생명의 떡이니\" 하신 예수님을, 물을 낸 반석은 그리스도를 가리킵니다(요 6:31-35; 고전 10:4).","4-5":"시내 산에서 주신 율법은 우리의 죄를 드러내어, 율법을 완전히 이루신 그리스도께로 인도하는 초등교사가 됩니다(갈 3:24; 마 5:17).","4-6":"\"이는 여호와께서 이 모든 말씀에 대하여 너희와 세우신 언약의 피니라\"는 말씀은 죄 사함을 위해 흘리신 예수님의 '언약의 피'로 완성됩니다(마 26:28).","5-0":"백성 가운데 거하려 하신 성막은, 말씀이 육신이 되어 우리 가운데 거하신 예수님 안에서 온전히 이루어졌습니다(요 1:14).","5-1":"백성의 이름을 가슴에 품고 하나님 앞에 선 대제사장은, 우리를 위해 항상 간구하시는 영원한 대제사장 예수님을 가리킵니다(히 7:24-25).","5-2":"생명의 속전으로 바친 은은, 은이나 금이 아닌 흠 없는 어린 양 같은 그리스도의 보배로운 피로 우리가 대속받을 것을 가리킵니다(벧전 1:18-19).","5-3":"모세 얼굴의 광채는 수건으로 가려져야 했지만, 이제 우리는 그리스도의 얼굴에 있는 하나님의 영광을 봅니다(고후 3:13-18; 4:6).","5-4":"자원하는 마음으로 지어진 성막처럼, 이제 성도들은 그리스도 안에서 함께 지어져 하나님이 거하실 처소가 됩니다(엡 2:21-22).","5-5":"성막에 충만했던 하나님의 영광은, 우리 가운데 거하신 독생자 예수님에게서 은혜와 진리로 충만하게 드러났습니다(요 1:14).","5-6":"날마다 반복된 이 제사들은, 자기 몸을 단번에 드려 영원한 제사를 이루신 예수 그리스도를 가리킵니다(히 10:10-12).","6-0":"하나님의 부르심으로 세워진 아론처럼, 그리스도께서도 스스로가 아니라 하나님이 세우셔서 우리의 대제사장이 되셨습니다(히 5:4-5).","6-1":"예수님의 어머니도 이 법대로 비둘기로 정결 제사를 드렸고, 그 아기 예수님이 친히 우리를 깨끗하게 하는 제물이 되셨습니다(눅 2:22-24).","6-2":"진영 밖으로 쫓겨나야 했던 나병 환자를 예수님은 불쌍히 여기시고 손을 대어 깨끗하게 하셨습니다(막 1:40-42).","6-3":"대제사장이 짐승의 피를 들고 해마다 들어간 지성소에, 그리스도는 자기 피로 단번에 들어가 영원한 속죄를 이루셨습니다(히 9:12).","6-4":"예수님은 레위기 19장의 이웃을 자기 몸같이 사랑하라는 계명을 하나님 사랑과 함께 가장 큰 계명으로 꼽으셨습니다(마 22:39).","6-5":"흠 없는 제물과 거룩한 제사장의 규례는 흠 없고 점 없는 어린 양 같은 그리스도의 보배로운 피를 가리킵니다(벧전 1:19).","6-6":"유월절 어린 양과 첫 열매의 절기는 우리를 위해 죽으시고 잠자는 자들의 첫 열매로 다시 살아나신 그리스도를 가리킵니다(고전 5:7, 15:20).","7-0":"예수님은 나사렛 회당에서 포로 된 자에게 자유를, 눌린 자를 자유롭게 하는 은혜의 해를 선포하셨습니다(눅 4:18-19).","7-1":"하나님이 진영 한가운데 성막에 거하신 것처럼, 말씀이 육신이 되신 예수님은 우리 가운데 거하셨습니다(요 1:14).","7-2":"맏아들 대신 레위인을 받으시고 속전을 받게 하신 하나님은, 많은 사람의 대속물로 자기 목숨을 주신 그리스도를 보여 줍니다(막 10:45).","7-3":"제사장의 축복처럼 하나님은 그리스도의 얼굴에 있는 하나님의 영광을 아는 빛을 우리 마음에 비추셨습니다(고후 4:6).","7-4":"속죄소 위에서 모세에게 말씀하신 하나님은, 그 피로 화목제물이 되신 그리스도 안에서 우리를 만나 주십니다(롬 3:25).","7-5":"유월절 양의 뼈를 하나도 꺾지 말라는 규례는 십자가에서 뼈가 꺾이지 않으신 예수님에게서 이루어졌습니다(요 19:36).","7-6":"믿지 않아 약속의 땅에 들어가지 못한 이 세대의 이야기는, 오늘 그리스도의 음성을 듣고 믿음으로 안식에 들어가라는 경고가 됩니다(히 3:19).","8-0":"죽은 자와 산 자 사이에 서서 속죄한 아론처럼, 예수님은 항상 살아 계셔서 우리를 위하여 간구하시는 대제사장이십니다(히 7:25).","8-1":"붉은 암송아지의 재가 육체를 정결하게 했다면, 그리스도의 피는 더욱 우리 양심을 죽은 행실에서 깨끗하게 합니다(히 9:13-14).","8-2":"예수님은 모세가 광야에서 뱀을 든 것같이 인자도 들려야 하리니 그를 믿는 자마다 영생을 얻는다고 말씀하셨습니다(요 3:14-15).","8-3":"야곱에게서 나올 한 별과 한 규는 다윗의 뿌리요 자손이며 광명한 새벽 별이신 예수님에게서 이루어집니다(계 22:16).","8-4":"목자 없는 양 같지 않게 해 달라는 모세의 기도는, 무리를 불쌍히 여기신 참 목자 예수님에게서 응답됩니다(마 9:36).","8-5":"바울은 광야에서 일어난 이 일들이 본보기가 되고 말세를 만난 우리를 깨우치기 위해 기록되었다고 말합니다(고전 10:11).","8-6":"도피성으로 피한 사람처럼, 우리는 앞에 있는 소망을 붙잡으려고 대제사장 되신 예수님께 피난처를 찾은 사람들입니다(히 6:18-20).","9-0":"호렙에서 음성으로만 말씀하신 보이지 않는 하나님을, 그의 형상이신 예수님이 우리에게 나타내 보이셨습니다(골 1:15).","9-1":"광야에서 시험받으신 예수님은 사람이 떡으로만 사는 것이 아니라는 신명기 8장 3절 말씀으로 마귀를 이기셨습니다(마 4:4).","9-2":"땅을 받은 것이 이스라엘의 의 때문이 아니었듯, 우리의 구원도 우리의 의로운 행위가 아니라 하나님의 긍휼하심을 따른 것입니다(딛 3:5).","9-3":"하나님이 택하신 한 곳에서 드리던 예배는, 영과 진리로 아버지께 예배할 때가 온다고 하신 예수님 안에서 새롭게 완성됩니다(요 4:23).","9-4":"애굽에서 나온 날을 기억하며 먹던 유월절 음식은, 떡을 떼어 자기 몸을 주신다고 하신 예수님의 마지막 만찬으로 이어집니다(눅 22:19).","9-5":"베드로는 모세와 같은 선지자를 일으키시리라는 약속이 예수 그리스도에게서 이루어졌다고 전했습니다(행 3:22).","9-6":"나무에 달린 자는 하나님께 저주를 받았다는 말씀처럼, 그리스도는 우리를 위해 저주를 받아 율법의 저주에서 우리를 속량하셨습니다(갈 3:13).","10-0":"형제의 어려움을 못 본 체하지 말라는 말씀은, 강도 만난 자의 이웃이 되어 주라고 가르치신 예수님의 비유로 이어집니다(눅 10:36-37).","10-1":"하나님의 보배로운 백성이라는 이름은, 그리스도 안에서 택하신 족속이요 그의 소유가 된 백성이 된 교회에게 주어집니다(벧전 2:9).","10-2":"바울은 율법을 다 행하지 못하는 자는 저주 아래 있다는 이 말씀을 인용하며, 의인은 믿음으로 산다고 선포합니다(갈 3:10-11).","10-3":"말씀이 네 입에 있고 네 마음에 있다는 이 말씀을 바울은 우리가 전파하는 믿음의 말씀, 곧 예수를 주로 시인하는 복음에 적용합니다(롬 10:8-9).","10-4":"모세와 같은 선지자가 다시 없었다는 말은, 모세보다 더 큰 영광을 받으실 아들 예수님을 기다리게 합니다(히 3:3).","10-5":"믿음으로 정탐꾼을 영접한 기생 라합은 멸망하지 않았고, 예수님의 족보에까지 이름이 오릅니다(히 11:31, 마 1:5).","10-6":"길갈에서 새 세대가 받은 할례는, 그리스도 안에서 손으로 하지 않은 할례 곧 그리스도의 할례를 받은 우리를 보여 줍니다(골 2:11).","11-0":"여리고 성이 믿음으로 무너졌듯, 우리의 참된 승리는 우리 주 예수 그리스도로 말미암아 하나님이 주십니다(히 11:30, 고전 15:57).","11-1":"왕들의 목을 발로 밟게 하신 승리는, 모든 원수를 그 발 아래에 두기까지 왕 노릇 하실 그리스도의 승리를 바라보게 합니다(고전 15:25).","11-2":"땅을 기업으로 받은 이스라엘처럼, 그리스도인은 하늘에 간직된 썩지 않고 쇠하지 않는 유업을 바라봅니다(벧전 1:4).","11-3":"히브리서는 여호수아가 준 땅의 안식이 끝이 아니며, 하나님의 백성에게 참된 안식이 남아 있다고 말합니다(히 4:8-9).","11-4":"도피성은 죄인이 피할 참된 피난처가 되시는 예수님을 가리킵니다(히 6:18). 그분께 피하는 자는 심판에서 안전합니다.","11-5":"여호수아가 백성을 안식의 땅으로 이끌었듯, 예수님은 더 온전한 안식으로 우리를 인도하십니다(히 4:8-9).","11-6":"죽으면 끝나는 사사들과 달리, 예수님은 영원히 살아 계셔서 자기 백성을 온전히 구원하시는 구원자이십니다(히 7:25).","12-0":"하나님은 부르짖는 백성에게 구원자를 세우셨고, 마침내 참 구원자 예수님을 보내셨습니다(눅 2:11).","12-1":"하나님은 약한 자들을 통해 원수를 이기셨고, 마침내 십자가의 약함으로 사탄을 이기신 예수님 안에서 온전한 승리를 주십니다(골 2:15).","12-2":"삼백 명의 승리처럼 구원은 사람의 힘이 아니라 하나님께 있으며, 그 구원은 약함 가운데 이루신 그리스도의 십자가에서 온전히 드러납니다(고전 1:25).","12-3":"자기를 위해 형제를 죽인 거짓 왕과 달리, 참 왕이신 예수님은 형제들을 위해 자기 목숨을 내어 주셨습니다(막 10:45).","12-4":"입다는 믿음의 사람으로 기억되지만(히 11:32) 흠 많은 구원자였기에, 우리에게는 흠 없는 참 구원자 예수님이 필요합니다.","12-5":"자기 죽음으로 원수를 무너뜨린 삼손보다 더 크신 예수님은 죽으심으로 죽음의 세력을 잡은 마귀를 멸하셨습니다(히 2:14).","12-6":"자기 마음대로 하나님을 섬기는 시대는 참 왕을 기다리게 하며, 그 왕은 우리를 다스리시는 예수 그리스도이십니다(요 18:37).","13-0":"왕이 없어 무너진 사사기의 끝은 의로 다스리실 참 왕을 바라보게 하며, 그 왕이 바로 다윗의 자손 예수님이십니다(눅 1:32-33).","13-1":"값을 치르고 룻을 품은 기업 무를 자 보아스는 우리를 피로 사신 구속자 예수님을 미리 보여 주며, 룻은 예수님의 족보에 오릅니다(마 1:5).","13-2":"낮은 자를 높이시는 하나님을 노래한 한나의 기도는 예수님을 잉태한 마리아의 찬양으로 이어집니다(눅 1:52).","13-3":"사무엘처럼 선지자요 제사장이요 백성을 위해 중보하는 분은 예수님이시며, 그분은 지금도 우리를 위해 간구하십니다(롬 8:34).","13-4":"기름 부음 받은 자를 뜻하는 메시아, 곧 그리스도라는 이름처럼, 하나님이 성령으로 기름 부으신 참 왕은 예수님이십니다(행 10:38).","13-5":"왕을 구한 죄에도 자기 백성을 버리지 않으시는 하나님의 신실하심은 그리스도 안에서 끝까지 지켜집니다(딤후 2:13).","13-6":"하나님의 명령을 기다리지 못한 사울과 달리, 예수님은 죽기까지 아버지께 순종하신 참 왕이십니다(빌 2:8).","14-0":"사람들이 눈여겨보지 않던 베들레헴의 다윗을 택하신 하나님은, 같은 베들레헴에서 다윗의 자손 예수님을 왕으로 나게 하셨습니다(마 2:6).","14-1":"홀로 나가 거인을 이기고 온 백성에게 승리를 안긴 다윗처럼, 예수님은 우리를 대신해 싸우시고 승리를 주십니다(고전 15:57).","14-2":"예수님은 다윗이 진설병을 먹은 일을 들어, 자신이 안식일의 주인이심을 가르치셨습니다(막 2:25-28).","14-3":"환난 당하고 빚진 자들의 우두머리가 된 다윗처럼, 예수님은 수고하고 무거운 짐 진 자들을 자기에게로 부르십니다(마 11:28).","14-4":"원수를 갚지 않고 판단을 하나님께 맡긴 다윗의 모습은, 욕을 당해도 공의로 심판하시는 이에게 맡기신 예수님을 비춰 줍니다(벧전 2:23).","14-5":"하나님의 침묵 앞에서 신접한 자를 찾은 사울과 달리, 우리는 아들을 통해 말씀하신 하나님께 나아갈 수 있습니다(히 1:2).","14-6":"원수를 이기고 빼앗긴 것을 되찾아 백성에게 나누어 준 다윗처럼, 승리하신 예수님은 자기 백성에게 선물을 주십니다(엡 4:8).","15-0":"다윗이 자기 손이 아닌 하나님의 때에 왕위에 오른 것처럼, 하나님은 그리스도 안에서 흔들리지 않는 나라를 우리에게 주십니다(히 12:28).","15-1":"다윗의 씨를 통해 영원한 나라를 세우시겠다는 약속은 하나님의 아들이신 예수님 안에서 이루어졌습니다(히 1:5).","15-2":"다리 저는 므비보셋을 왕의 상에 앉힌 다윗처럼, 하나님은 그리스도 안에서 자격 없는 우리를 자기 권속으로 삼으셨습니다(엡 2:19).","15-3":"죄를 고백한 다윗이 용서받은 것처럼, 하나님은 그리스도 안에서 믿는 자의 죄를 가려 주시는 복을 주십니다(롬 4:7).","15-4":"내쫓긴 자가 버림받지 않도록 방책을 베푸시는 하나님은, 그리스도를 통해 우리를 자기와 화목하게 하셨습니다(고후 5:18).","15-5":"반역한 아들 대신 죽기를 바랐던 다윗의 소원은, 불의한 우리를 대신해 죽으신 그리스도 안에서 실제로 이루어졌습니다(벧전 3:18).","15-6":"돌아오는 날 자신을 저주한 시므이를 살려 준 다윗처럼, 예수님은 자신을 못 박은 자들을 위해서도 용서를 구하셨습니다(눅 23:34).","16-0":"모든 민족 중에서 주께 감사하리라는 다윗의 노래는, 그리스도로 말미암아 이방인도 하나님께 영광을 돌리게 된 일로 이루어졌습니다(롬 15:9).","16-1":"다윗의 왕위를 이은 솔로몬보다 더 크신 분, 다윗의 자손 예수님이 영원한 왕으로 오셨습니다(마 12:42).","16-2":"솔로몬에게 주신 지혜보다 더 큰 지혜와 지식의 모든 보화가 그리스도 안에 감추어져 있습니다(골 2:3).","16-3":"예수님은 자기 몸을 성전이라 하셨으니, 하나님이 사람 가운데 거하시는 참 성전은 그리스도이십니다(요 2:19-21).","16-4":"말씀이 육신이 되어 우리 가운데 거하시매 그 영광을 보았다고 하신 대로, 하나님의 영광은 예수님 안에 머물렀습니다(요 1:14).","16-5":"예수님은 남방 여왕이 솔로몬의 지혜를 들으러 왔으나 솔로몬보다 더 큰 이가 여기 있다고 말씀하셨습니다(마 12:42).","16-6":"하나님은 다윗을 위해 예루살렘에 등불을 남기셨고, 그 다윗의 자손으로 오신 예수님이 영원한 왕이 되십니다(눅 1:32-33).","17-0":"예수님은 엘리야가 이스라엘이 아닌 사르밧 과부에게 보내진 일을 들어 이방인에게까지 미치는 은혜를 말씀하셨습니다(눅 4:25-26).","17-1":"바울은 바알에게 무릎 꿇지 않은 칠천 명을 들어, 지금도 은혜로 택하심을 따라 남은 자가 있다고 말합니다(롬 11:4-5).","17-2":"거짓 증인들에 의해 죄 없이 죽은 나봇처럼, 예수님도 거짓 증언으로 정죄를 받고 십자가에 달리셨습니다(마 26:59-61).","17-3":"엘리야가 하늘로 올라간 뒤 엘리사가 그 영의 능력을 받았듯, 예수님은 승천하신 뒤 제자들에게 성령을 보내셨습니다(행 1:8-9).","17-4":"예수님은 이스라엘의 많은 나병환자 중 수리아 사람 나아만만 깨끗함을 받은 일을 들어 이방인에게 미치는 은혜를 보여 주셨습니다(눅 4:27).","17-5":"\"우리와 함께 한 자가 그들과 함께 한 자보다 많으니라\"는 말씀처럼, 하나님이 우리를 위하시면 누구도 우리를 대적할 수 없습니다(롬 8:31).","17-6":"예후는 바알을 없앴으나 여로보암의 죄에서는 떠나지 못했으니, 백성을 죄에서 온전히 구원하실 참 왕은 예수님이십니다(마 1:21).","18-0":"왕의 씨가 끊어질 위기에서도 다윗의 등불을 지키신 하나님은 마침내 다윗의 자손 예수님을 보내셨습니다(마 1:1).","18-1":"섞여 살게 된 사마리아 사람들에게도 예수님은 찾아가셔서 영과 진리로 드리는 참 예배를 알려 주셨습니다(요 4:9, 23).","18-2":"히스기야가 부순 모세의 놋뱀은 본래 십자가에 들려 믿는 자를 살리실 예수님을 가리키는 표였습니다(요 3:14-15).","18-3":"요시야가 지킨 유월절은 우리의 유월절 양으로 희생되신 그리스도를 가리킵니다(고전 5:7).","18-4":"포로로 끌려간 여호야긴(여고냐)의 계보가 끊어지지 않고 이어져 마침내 그리스도가 나셨습니다(마 1:11-16).","18-5":"유다와 다윗, 스룹바벨로 이어지는 이 족보는 아브라함과 다윗의 자손으로 오신 예수 그리스도의 족보로 완성됩니다(마 1:1-16).","18-6":"아론 자손이 날마다 드리던 속죄의 직무는 자기를 단번에 드리신 영원한 대제사장 예수님 안에서 완성되었습니다(히 7:26-27).","19-0":"하나님이 다윗을 이스라엘의 목자로 세우셨듯, 예수님은 양들을 위해 목숨을 버리는 선한 목자이십니다(요 10:11).","19-1":"언약궤가 보여 준 하나님의 함께하심은 임마누엘, 곧 우리와 함께 계신 하나님으로 오신 예수님 안에서 이루어졌습니다(마 1:23).","19-2":"\"나는 그의 아버지가 되고 그는 나의 아들이 되리니\"라는 약속은 히브리서에서 하나님의 아들 예수님께 적용됩니다(히 1:5).","19-3":"백성 대신 자신을 쳐 달라던 다윗의 간구는, 의인으로서 불의한 우리를 대신해 죽으신 예수님 안에서 참으로 이루어졌습니다(벧전 3:18).","19-4":"제사장 반열 가운데 아비야 반열의 사가랴가 성전에서 섬기다가 예수님의 길을 예비할 세례 요한의 탄생 소식을 들었습니다(눅 1:5, 13).","19-5":"다윗이 만물의 머리로 높인 하나님의 주권은, 하나님이 그리스도를 만물 위에 교회의 머리로 삼으심으로 드러났습니다(엡 1:22).","19-6":"솔로몬이 구한 지혜와 지식의 모든 보화는 그리스도 안에 감추어져 있습니다(골 2:3).","20-0":"지성소를 가린 휘장은 예수님이 자기 육체를 찢으심으로 열어 주신 새롭고 산 길을 가리킵니다(히 10:19-20).","20-1":"성전을 향한 기도를 들어 달라던 간구는, 큰 대제사장 예수님 덕분에 우리가 은혜의 보좌 앞에 담대히 나아감으로 이루어집니다(히 4:14-16).","20-2":"열방의 왕들이 예물을 들고 솔로몬을 찾아온 모습은, 동방 박사들이 아기 예수께 엎드려 황금과 유향과 몰약을 드린 일에서 더 크게 이루어졌습니다(마 2:11).","20-3":"백성의 멍에를 더 무겁게 한 르호보암과 달리, 예수님은 내 멍에는 쉽고 내 짐은 가볍다며 쉼을 주십니다(마 11:29-30).","20-4":"아비야가 말한 다윗 자손이 다스리는 여호와의 나라는, 다윗의 자손 예수님이 오셔서 선포하신 하나님 나라로 이어집니다(막 1:15).","20-5":"싸우지 않고 찬송하며 승리를 받은 유다처럼, 우리도 예수 그리스도로 말미암아 하나님이 주시는 승리를 얻습니다(고전 15:57).","20-6":"다윗에게 주신 등불의 약속을 지키신 하나님은 마침내 다윗의 집에 구원의 뿔이신 예수님을 일으키셨습니다(눅 1:69).","21-0":"예수님은 제단과 성전 사이에서 죽임을 당한 사가랴를 들어 선지자들을 거부해 온 죄를 책망하셨고, 그 길 끝에서 자신도 버림받아 십자가에 달리셨습니다(눅 11:50-51).","21-1":"왕이 넘을 수 없던 제사장의 자리를, 예수님은 의의 왕이요 평강의 왕인 멜기세덱의 반차를 따르는 영원한 제사장으로서 함께 맡으십니다(히 7:1-2, 17).","21-2":"히스기야가 속죄제로 성전과 백성을 정결하게 했듯, 예수님은 단번에 자기 피로 우리를 깨끗하게 하신 참 유월절 어린 양이십니다(고전 5:7).","21-3":"가장 악했던 므낫세도 겸손히 돌이키자 기도를 들으신 하나님은, 돌아온 탕자를 달려가 안은 아버지처럼 회개하는 죄인을 은혜로 받아 주십니다(눅 15:20-24).","21-4":"율법 앞에서 무너진 백성에게 필요한 것은 마음에 새겨지는 새 언약이며, 예수님이 그 새 언약을 자기 피로 세우셨습니다(눅 22:20).","21-5":"포로에서 돌아오게 하신 하나님은 마침내 예수님을 통해 죄의 포로 된 자들에게 자유를 선포하십니다(눅 4:18).","21-6":"다시 세워진 성전은 성전 된 자기 몸을 사흘 만에 다시 일으키실 예수님, 곧 참 성전을 가리킵니다(요 2:19-21).","22-0":"에스라처럼 백성의 죄를 자기 죄로 여기며 하나님 앞에 선 중보자의 모습은, 우리를 위해 간구하시는 예수님 안에서 완전해집니다(히 7:25).","22-1":"높은 자리를 두고 무너진 성과 백성에게 내려간 느헤미야는, 하늘 영광을 버리고 우리에게 오신 예수님을 떠올리게 합니다(빌 2:6-8).","22-2":"가난한 형제의 짐을 덜어 준 느헤미야의 섬김은, 섬기러 오셔서 자기 목숨을 대속물로 주신 예수님을 가리킵니다(막 10:45).","22-3":"율법을 듣고 우는 백성에게 기쁨을 선포했듯, 율법의 요구를 다 이루신 예수님 안에서 우리는 슬픔 대신 구원의 기쁨을 누립니다(마 5:17).","22-4":"거듭 배반한 백성을 끝내 버리지 않으신 하나님의 긍휼은, 우리 죄를 대신 지신 예수님의 십자가에서 가장 분명히 드러납니다(롬 5:8).","22-5":"느헤미야가 성전 방에서 도비야의 세간을 내던졌듯, 예수님은 성전을 깨끗하게 하시고 참된 예배를 회복하십니다(요 2:13-17).","22-6":"이름조차 드러나지 않는 하나님의 손길이 구원자를 미리 세우시듯, 하나님은 때가 차매 아들을 보내어 백성을 구원하십니다(갈 4:4).","23-0":"죽음을 무릅쓰고 왕 앞에 나아가 민족을 위해 간구한 에스더처럼, 예수님은 자기 생명을 내어 주시고 하나님 앞에서 우리를 위해 간구하십니다(롬 8:34).","23-1":"원수의 계략이 오히려 그 자신을 무너뜨리고 백성이 구원받았듯, 하나님은 십자가로 악의 권세를 이기시고 우리를 구원하셨습니다(골 2:15).","23-2":"죄 없이 고난받은 욥의 모습은, 의로우신데도 우리를 위해 고난과 버림받음을 당하신 예수님을 미리 보여 줍니다(벧전 2:22-24).","23-3":"고난의 이유를 몰라 부르짖는 욥의 탄식은, 십자가에서 하나님께 버림받는 고통을 부르짖으신 예수님 안에서 응답을 찾습니다(마 27:46).","23-4":"하나님과 사람 사이에 판결자가 없다는 욥의 탄식은, 하나님과 사람 사이의 유일한 중보자 예수님으로 응답됩니다(딤전 2:5).","23-5":"죽은 사람이 다시 살 수 있느냐는 욥의 물음에, 부활이요 생명이신 예수님이 죽음을 이기시고 대답하셨습니다(요 11:25).","23-6":"하늘에 계신 증인과 중보자를 바라던 욥의 소망은, 하나님 우편에서 우리를 위해 간구하시는 예수님 안에서 이루어집니다(요일 2:1).","24-0":"욥이 고백한 살아 계신 대속자는, 죽은 자 가운데서 다시 살아나 잠자는 자들의 첫 열매가 되신 예수님 안에서 온전히 드러납니다(고전 15:20).","24-1":"하나님을 찾아도 뵐 수 없다던 욥의 갈망은, 하나님을 우리에게 나타내 보이신 아들 예수님 안에서 채워집니다(요 1:18).","24-2":"사람이 찾을 수 없던 하나님의 지혜는, 지혜와 지식의 모든 보화가 감추어진 예수 그리스도 안에서 우리에게 주어집니다(골 2:3).","24-3":"욥은 끝내 자기 의로 하나님 앞에 서려 했지만, 우리는 오직 예수님이 주시는 하나님의 의로 하나님 앞에 섭니다(빌 3:9).","24-4":"엘리후가 말한 중보자와 대속물은, 자기를 모든 사람을 위한 대속물로 주신 예수님 안에서 실제로 이루어졌습니다(딤전 2:5-6).","24-5":"천둥 같은 음성으로 다스리시는 높으신 하나님이, 말씀이 육신이 되어 우리 가운데 오신 예수님을 통해 가까이 말씀하십니다(요 1:14).","24-6":"만물을 지으시고 붙드시는 하나님의 능력은, 만물이 그로 말미암아 창조되고 그 안에 함께 선 예수 그리스도 안에서 드러납니다(골 1:16-17).","25-0":"친구들을 위해 기도하여 그들이 용서받게 한 욥처럼, 예수님은 자기를 해한 자들을 위해서도 기도하신 참 중보자이십니다(눅 23:34).","25-1":"시편 2편의 기름 부음 받은 왕이자 하나님의 아들은, 부활로 그 사실이 선포된 예수 그리스도이십니다(행 13:33).","25-2":"대적에게 둘러싸여 구원을 부르짖은 다윗의 기도는, 고난 중에 아버지께 부르짖으시고 응답받으신 다윗의 자손 예수님 안에서 완성됩니다(히 5:7).","25-3":"시편 8편이 말한 만물을 다스리는 사람은, 잠시 천사보다 낮아지셨다가 영광과 존귀의 관을 쓰신 예수님 안에서 성취됩니다(히 2:6-9).","25-4":"시편 22편의 버림받은 자의 부르짖음과 옷을 제비 뽑는 장면은 십자가의 예수님에게서 그대로 이루어졌습니다(마 27:35, 46).","25-5":"자기 영을 주의 손에 맡긴다는 31편의 기도는, 예수님이 십자가에서 숨을 거두시며 드리신 마지막 기도가 되었습니다(눅 23:46).","25-6":"의인의 뼈 하나도 꺾이지 않는다는 34편의 말씀은, 십자가에서 다리가 꺾이지 않으신 예수님에게서 이루어졌습니다(요 19:36).","26-0":"제사보다 주의 뜻 행하기를 즐긴다는 40편의 고백은, 자기 몸을 단번에 드려 하나님의 뜻을 이루신 예수님의 고백으로 인용됩니다(히 10:5-10).","26-1":"영원한 보좌에 앉아 즐거움의 기름 부음을 받은 45편의 왕은, 히브리서가 하나님의 아들 예수님께 적용한 말씀입니다(히 1:8-9).","26-2":"우슬초로 씻어 눈보다 희게 해 달라는 다윗의 기도는, 모든 죄에서 우리를 깨끗하게 하시는 예수님의 피로 응답됩니다(요일 1:7).","26-3":"까닭 없이 쫓기던 다윗을 지키신 하나님은, 우리를 위해 아들을 내어 주셨으니 누구도 우리를 대적할 수 없게 하십니다(롬 8:31-32).","26-4":"높은 곳에 오르사 사로잡은 자들을 취하시는 68편의 하나님은, 승천하셔서 교회에 선물을 주신 예수님으로 설명됩니다(엡 4:8-10).","26-5":"주의 집을 향한 열성과 목마를 때 받은 신 포도주는, 성전을 깨끗하게 하시고 십자가에서 고난받으신 예수님에게서 이루어졌습니다(요 2:17; 19:28-29).","26-6":"하나님께 가까이 함이 복이라는 고백은, 예수님의 피로 열린 새로운 길을 따라 담대히 하나님께 나아가는 은혜로 이루어집니다(히 10:19-22).","27-0":"광야에서 내려 주신 하늘 양식 만나는, 하늘에서 내려와 세상에 생명을 주시는 참 떡 예수님을 가리킵니다(요 6:31-35).","27-1":"다윗의 왕위를 영원히 세우겠다는 89편의 언약은, 다윗의 왕위를 받아 영원히 다스리실 예수님에게서 이루어집니다(눅 1:32-33).","27-2":"사탄이 시험할 때 인용한 시편 91편 앞에서 예수님은 하나님을 시험하지 않고 아버지를 온전히 신뢰하셨습니다(마 4:6-7).","27-3":"오늘 그의 음성을 듣거든 마음을 완악하게 하지 말라는 시편 95편의 경고는, 히브리서에서 그리스도 안에서 누리는 참 안식으로의 초대로 이어집니다(히 3:7-4:11).","27-4":"하늘과 땅은 옷처럼 낡아도 주는 영원하시다는 시편 102편의 고백을 히브리서는 아들 예수님께 돌립니다(히 1:10-12).","27-5":"모세가 틈에 서서 하나님의 진노를 돌이켰듯, 예수님은 항상 살아 계셔서 우리를 위해 간구하시는 중보자이십니다(히 7:25).","27-6":"예수님은 시편 110편을 자신에게 적용하셨고(마 22:44), 히브리서는 그분을 멜기세덱의 반차를 따르는 영원한 제사장이라 부릅니다(히 5:6).","28-0":"예수님은 자신을 버린 돌이 머릿돌이 된다는 말씀의 성취로 말씀하셨고(마 21:42), 무리는 그분을 주의 이름으로 오시는 이로 맞았습니다(마 21:9).","28-1":"말씀을 사랑한 시인의 갈망은 율법을 완전하게 하러 오신(마 5:17), 육신이 되신 말씀 예수님 안에서 채워집니다(요 1:14).","28-2":"다윗의 몸에서 난 자손을 영원히 왕위에 두시겠다는 맹세(시 132:11)는 다윗의 왕위를 받으신 예수님 안에서 이루어졌습니다(눅 1:32; 행 2:30).","28-3":"영원한 인자하심의 가장 큰 증거는 우리가 아직 죄인 되었을 때 그리스도께서 우리를 위해 죽으신 일입니다(롬 5:8).","28-4":"주 앞에 의로운 인생이 하나도 없다는 고백(시 143:2)은 오직 그리스도를 믿음으로 의롭게 된다는 복음으로 이어집니다(갈 2:16).","28-5":"갇힌 자를 자유케 하고 맹인의 눈을 여시는 하나님의 일은 예수님의 사역에서 그대로 나타났습니다(눅 4:18; 마 11:5).","28-6":"잠언이 그토록 구하라고 하는 지혜는, 하나님의 지혜이시며 모든 지혜의 보화를 품으신 그리스도 안에 있습니다(고전 1:24; 골 2:3).","29-0":"창조 때 하나님 곁에 있던 지혜의 노래는, 태초에 하나님과 함께 계셨고 만물을 지으신 말씀이신 그리스도를 떠올리게 합니다(요 1:1-3).","29-1":"사랑은 모든 허물을 가린다는 잠언(10:12)은 베드로전서에서 서로 뜨겁게 사랑하라는 권면으로 이어지고(벧전 4:8), 그 사랑은 십자가에서 완성되었습니다.","29-2":"누가 자기 죄를 스스로 깨끗하게 했다 하겠느냐는 물음(20:9)에, 복음은 예수의 피가 우리를 모든 죄에서 깨끗하게 한다고 답합니다(요일 1:7).","29-3":"원수가 넘어져도 기뻐하지 말고 받은 대로 갚지 말라는 교훈은, 원수를 사랑하라 하시고 욕을 당해도 맞대어 욕하지 않으신 예수님에게서 완성됩니다(마 5:44; 벧전 2:23).","29-4":"원수가 주리거든 먹이라는 잠언(25:21-22)을 바울은 그대로 인용하여, 그리스도인이 선으로 악을 이기는 길로 가르칩니다(롬 12:20).","29-5":"하늘에 올라갔다가 내려온 자가 누구냐는 아굴의 물음(30:4)에 예수님은 하늘에서 내려온 인자가 바로 그분이라고 답하십니다(요 3:13).","29-6":"해 아래의 수고가 헛되다는 탄식과 달리, 부활하신 그리스도 안에서 우리의 수고는 헛되지 않습니다(고전 15:58).","30-0":"학대받는 자에게 위로자가 없다는 탄식에, 예수님은 수고하고 무거운 짐 진 자들을 부르시며 쉼을 약속하십니다(마 11:28).","30-1":"죄를 짓지 않는 의인은 세상에 없다는 고백(7:20)은, 그리스도 예수 안의 속량으로 값없이 의롭게 된다는 복음을 필요로 합니다(롬 3:23-24).","30-2":"모든 은밀한 일을 선악 간에 심판하신다는 결론은, 우리 모두가 그리스도의 심판대 앞에 서게 된다는 신약의 가르침으로 이어집니다(고후 5:10).","30-3":"신랑과 신부의 사랑은 그리스도께서 교회를 사랑하여 자신을 주신 큰 비밀을 비추어 보여 줍니다(엡 5:25, 32).","30-4":"죽음같이 강하고 많은 물도 끄지 못하는 사랑은, 어떤 것도 우리를 끊을 수 없는 그리스도 예수 안의 하나님의 사랑을 떠올리게 합니다(롬 8:39).","30-5":"들포도를 맺은 포도원과 달리, 예수님은 참포도나무가 되셔서 그 안에 거하는 자들이 열매를 많이 맺게 하십니다(요 15:1, 5).","30-6":"요한은 이사야가 본 보좌 위의 영광이 바로 예수님의 영광이었다고 말합니다(요 12:41).","31-0":"처녀가 낳을 임마누엘(7:14)과 흑암 속 백성에게 비친 큰 빛(9:2)은 예수님의 탄생과 갈릴리 사역에서 이루어졌습니다(마 1:23; 4:16).","31-1":"하늘에 오르려다 떨어진 교만한 왕과 달리, 예수님은 자기를 낮추어 십자가에 죽기까지 복종하셨기에 하나님이 그를 지극히 높이셨습니다(빌 2:8-9).","31-2":"원수였던 애굽과 앗수르까지 하나님의 백성이 된다는 약속은, 막힌 담을 허시고 이방인을 하나님의 권속으로 삼으신 그리스도 안에서 이루어집니다(엡 2:14, 19).","31-3":"엘리아김의 어깨에 둔 다윗의 집 열쇠는, 열면 닫을 자가 없는 참된 열쇠를 가지신 예수님을 가리킵니다(계 3:7).","31-4":"사망을 영원히 멸하고 눈물을 씻기시리라는 약속은 그리스도의 부활과 새 하늘과 새 땅에서 이루어집니다(고전 15:54; 계 21:4).","31-5":"시온에 두신 귀하고 견고한 기촛돌(28:16)을 베드로는 믿는 자를 부끄럽게 하지 않는 모퉁잇돌 예수님이라고 말합니다(벧전 2:6).","31-6":"맹인이 보고 못 듣는 자가 듣는 일은, 예수님이 자신이 오실 그이임을 보여 주시며 말씀하신 표적입니다(마 11:5).","32-0":"히스기야는 생명을 십오 년 더 얻었지만, 예수님은 죽은 자 가운데서 살아나셔서 다시 죽지 않으시고 사망이 다시 그를 주장하지 못합니다(롬 6:9).","32-1":"광야에서 여호와의 길을 예비하라는 외침(40:3)은 예수님의 길을 예비한 세례 요한에게서 이루어졌습니다(마 3:3).","32-2":"모든 무릎이 하나님께 꿇으리라는 맹세(45:23)는, 모든 무릎을 예수의 이름에 꿇게 하신 일로 이어집니다(빌 2:10-11).","32-3":"모욕과 침 뱉음을 피하지 않은 종의 모습(50:6)은, 공회 앞에서 얼굴에 침 뱉음과 주먹질을 당하신 예수님에게서 그대로 이루어졌습니다(마 26:67).","32-4":"빌립은 이사야 53장의 고난받는 종이 바로 예수님이라고 전했고, 베드로는 그분이 채찍에 맞으심으로 우리가 나음을 얻었다고 고백합니다(행 8:32-35; 벧전 2:24).","32-5":"예수님은 성전을 깨끗하게 하시며 내 집은 만민이 기도하는 집이라는 이사야 56장의 말씀을 인용하셨습니다(막 11:17).","32-6":"예수님은 나사렛 회당에서 이사야 61장을 읽으시고 이 글이 오늘 너희 귀에 응하였다고 선언하셨습니다(눅 4:18-21).","33-0":"새 하늘과 새 땅의 약속은 다시 오실 그리스도께서 모든 것을 새롭게 하실 때 완성됩니다(계 21:1).","33-1":"생수의 근원을 버린 백성에게, 예수님은 목마른 자는 자신에게 와서 마시라며 생수를 약속하십니다(요 7:37-38).","33-2":"선지자가 요구한 마음의 할례는 그리스도 안에서 성령으로 받는 할례로 이루어집니다(롬 2:29; 골 2:11).","33-3":"예수님은 성전을 깨끗하게 하시며 이 말씀(렘 7:11)을 인용해 성전이 강도의 소굴이 되었다고 꾸짖으셨습니다(마 21:13).","33-4":"도살당하러 끌려가는 어린 양 같았던 예레미야는, 자기 백성에게 배척받고 십자가로 가신 예수님을 미리 보여 줍니다(요 1:11; 행 8:32).","33-5":"만물보다 거짓되고 부패한 마음은 스스로 고칠 수 없기에, 그리스도 안에서 새로 지으심을 받아야 합니다(고후 5:17).","33-6":"예레미야처럼 진리를 전하다 매 맞고 조롱당하신 예수님은, 그 고난을 끝까지 참으시고 우리를 구원하셨습니다(벧전 2:23).","34-0":"다윗의 의로운 가지, 여호와 우리의 공의라 불릴 왕은 우리의 의가 되신 예수 그리스도이십니다(고전 1:30).","34-1":"모든 나라가 마셔야 할 진노의 잔을 예수님이 겟세마네에서 받아 대신 마셔 주셨습니다(마 26:39).","34-2":"포로 된 백성에게 미래와 희망을 약속하신 하나님은, 그리스도의 부활로 우리에게 산 소망을 주십니다(벧전 1:3).","34-3":"예레미야가 약속한 새 언약은 예수님이 마지막 만찬에서 자신의 피로 세우신 언약입니다(눅 22:20; 히 8:8-12).","34-4":"왕이 두루마리를 불살라도 사라지지 않은 하나님의 말씀은, 영원히 있는 말씀 곧 우리에게 전해진 복음입니다(벧전 1:25).","34-5":"하나님을 믿은 이방인 에벳멜렉이 구원받았듯, 그리스도를 믿는 사람은 누구든지 차별 없이 구원을 얻습니다(롬 10:12-13).","34-6":"좋든 싫든 순종하겠다고 해 놓고 거역한 백성과 달리, 예수님은 죽기까지 아버지 뜻에 순종하셨습니다(빌 2:8).","35-0":"심판받은 이방 나라들까지 회복하시겠다는 약속은, 모든 민족을 제자로 삼으라 하신 그리스도의 복음으로 열렸습니다(마 28:19).","35-1":"바벨론의 멸망과 그곳에서 나오라는 부르심은, 하나님을 대적하는 세상의 최후 심판을 그린 요한계시록에서 다시 울립니다(계 18:2, 4).","35-2":"위로할 자 없던 예루살렘과 달리, 예수님은 애통하는 자에게 위로를 약속하시며 참 위로자로 오셨습니다(마 5:4).","35-3":"다함이 없는 여호와의 인자와 긍휼은, 우리가 죄인이었을 때 우리를 위해 죽으신 그리스도 안에서 가장 분명히 드러났습니다(롬 5:8).","35-4":"보좌 위에 사람의 모양으로 나타난 여호와의 영광은, 육신이 되어 오셔서 아버지의 영광을 보여 주신 예수님 안에서 온전히 드러났습니다(요 1:14).","35-5":"백성의 죄악을 담당하며 누웠던 에스겔의 표징과 달리, 그리스도는 실제로 우리 죄를 자기 몸에 담당하셨습니다(벧전 2:24).","35-6":"돌 같은 마음을 없애고 새 영을 주시겠다는 약속은, 그리스도를 믿는 자를 거듭나게 하시는 성령의 일로 이루어집니다(요 3:5-6).","36-0":"땔감밖에 될 수 없는 포도나무 같은 이스라엘과 달리, 예수님은 참포도나무로 오셔서 자기 안에 거하는 자가 열매를 맺게 하십니다(요 15:1, 5).","36-1":"악인이 죽는 것을 기뻐하지 않으시는 하나님은, 그리스도 안에서 모든 사람이 회개하여 멸망하지 않기를 원하십니다(벧후 3:9).","36-2":"유다 왕의 왕관을 벗기시며 마땅히 얻을 자가 오면 주겠다고 하신 약속은, 다윗의 왕위를 영원히 이으실 예수님 안에서 이루어집니다(눅 1:32-33).","36-3":"성 무너진 데를 막아설 한 사람을 찾지 못하셨던 하나님은, 하나님과 사람 사이의 유일한 중보자 예수 그리스도를 보내셨습니다(딤전 2:5).","36-4":"사람이면서 신이라 한 두로 왕과 달리, 예수님은 하나님의 본체이시면서도 자기를 낮추어 종의 형체를 가지셨습니다(빌 2:6-7).","36-5":"부러진 갈대처럼 무너지는 세상 나라들과 달리, 그리스도를 믿는 자는 흔들리지 않는 나라를 받습니다(히 12:28).","36-6":"잃어버린 양을 친히 찾겠다고 하신 하나님은, 양들을 위해 목숨을 버리는 선한 목자 예수님으로 오셨습니다(요 10:11).","37-0":"마른 뼈에 생기를 불어넣으신 하나님은, 허물로 죽었던 우리를 그리스도와 함께 살리셨습니다(엡 2:5).","37-1":"하나님이 백성 가운데 거하실 새 성전의 환상은 '이 성전을 헐라'고 하시며 자기 육체를 성전이라 하신 예수님 안에서 성취됩니다(요 2:19-21).","37-2":"떠났던 영광이 성전으로 돌아오는 장면은 '말씀이 육신이 되어 우리 가운데 거하시매 우리가 그의 영광을 보니'라는 예수님 안에서 이루어집니다(요 1:14).","37-3":"성전에서 흘러나와 생명을 살리는 강은 자기를 믿는 자에게 생수의 강이 흐르리라 하신 예수님과 새 예루살렘의 생명수 강으로 이어집니다(요 7:38; 계 22:1-2).","37-4":"모든 나라를 부수고 영원히 설 하나님의 나라는 '때가 찼고 하나님의 나라가 가까이 왔으니'라고 선포하신 예수님에게서 시작됩니다(막 1:15).","37-5":"불 속에서도 함께하시며 건져 내시는 하나님은 세상 끝날까지 항상 함께 있으리라 약속하신 임마누엘 예수님 안에서 온전히 드러납니다(마 28:20).","37-6":"돌로 막고 봉인한 굴에서 다니엘이 살아 나온 일은, 돌로 막고 인봉한 무덤에서 다시 살아나신 예수님의 승리를 미리 보여 줍니다(마 27:66; 28:6).","38-0":"예수님은 인자가 권능의 우편에 앉아 하늘 구름을 타고 오는 것을 보리라고 말씀하시며 다니엘 7장의 인자가 바로 자신임을 밝히셨습니다(마 26:64).","38-1":"죄를 끝내고 영원한 의를 드러낼 기름 부음 받은 자와 죽은 자의 부활의 약속은 십자가와 부활의 예수님 안에서 이루어집니다(요 5:28-29).","38-2":"내 백성 아니었던 자를 내 백성이라 부르시겠다는 약속은 예수님을 통해 유대인과 이방인을 함께 부르시는 은혜로 성취됩니다(롬 9:25-26; 벧전 2:10).","38-3":"예수님은 죄인들과 함께 잡수시며 '내가 긍휼을 원하고 제사를 원하지 아니하노라'는 이 말씀을 직접 인용하셨습니다(마 9:13).","38-4":"'내 아들을 애굽에서 불러냈거늘'이라는 말씀은 애굽에서 돌아오신 아기 예수님에게서 이루어졌다고 마태가 증언합니다(마 2:15).","38-5":"'사망아 네 재앙이 어디 있느냐'는 약속은 예수님의 부활로 사망을 이기신 승리의 노래가 됩니다(고전 15:55-57).","38-6":"'내 영을 만민에게 부어 주리니'라는 약속은 오순절 성령 강림으로 이루어졌고, 베드로는 이 말씀으로 예수님을 전했습니다(행 2:16-21).","39-0":"이방과 유다와 이스라엘이 모두 죄 아래 있다는 선포는, 모든 사람이 죄를 범했으나 예수님 안에서 값없이 의롭게 된다는 복음으로 이어집니다(롬 3:23-24).","39-1":"제물보다 정의와 공의를 원하신 하나님의 뜻은, 율법의 더 중한 바를 버린 이들을 책망하신 예수님의 가르침으로 이어집니다(마 23:23).","39-2":"다윗의 무너진 장막을 일으키겠다는 약속은 예수님 안에서 이방인까지 하나님의 백성이 되는 일로 이루어졌다고 야고보가 증언합니다(행 15:16-17).","39-3":"예수님은 요나가 밤낮 사흘을 물고기 뱃속에 있었던 것처럼 인자도 사흘 동안 땅속에 있으리라고 하시며 자신의 죽음과 부활을 요나의 표적으로 말씀하셨습니다(마 12:40).","39-4":"예루살렘에서 나온 말씀이 열방으로 퍼지는 그림은, 회개와 죄 사함의 복음이 예루살렘에서 시작하여 모든 족속에게 전파되는 일로 이루어집니다(눅 24:47).","39-5":"베들레헴에서 다스릴 자가 나오리라는 예언은 유대 베들레헴에서 태어나신 예수님에게서 성취되었습니다(마 2:5-6).","39-6":"백성을 억누르던 앗수르의 멍에를 깨뜨리신 하나님의 승리는, 십자가에서 통치자들과 권세들을 이기신 예수님 안에서 완성됩니다(골 2:15).","40-0":"의인은 믿음으로 말미암아 산다는 이 말씀은 예수 그리스도를 믿는 믿음으로 의롭게 된다는 복음의 핵심이 되었습니다(롬 1:17).","40-1":"형벌을 제거하시고 백성 가운데 계시는 이스라엘의 왕은, 자기 백성을 죄에서 구원하시고 우리와 함께 계시는 임마누엘로 오신 예수님 안에서 드러납니다(마 1:21, 23).","40-2":"하늘과 땅을 진동시키겠다는 약속은 예수님을 통해 받는 흔들리지 않는 나라에 대한 말씀으로 히브리서에 인용됩니다(히 12:26-28).","40-3":"죄악을 하루에 제거하시고 제사장이자 왕으로 다스릴 싹은, 자기 몸을 단번에 드려 영원한 대제사장이 되신 예수님을 가리킵니다(히 7:26-27).","40-4":"이방 백성이 하나님을 찾아 몰려오리라는 약속은, 멀리 있던 이방인들이 예수님의 피로 가까워져 하나님의 권속이 되는 일로 이루어집니다(엡 2:13, 19).","40-5":"나귀 새끼를 타고 오시는 왕과 은 삼십 개의 품삯은, 예루살렘에 입성하시고 은 삼십에 팔리신 예수님에게서 성취됩니다(마 21:4-5; 27:9-10).","40-6":"그들이 찌른 자를 바라보리라는 말씀과 목자를 치면 양이 흩어지리라는 말씀은 십자가에 달리신 예수님에게서 이루어졌습니다(요 19:37; 마 26:31).","41-0":"예수님은 길을 준비할 사자이자 오리라 한 엘리야가 세례 요한이라고 밝히셨고, 그 뒤에 오신 언약의 주님이 바로 예수님이십니다(마 11:10, 14).","41-1":"예수라는 이름은 자기 백성을 그들의 죄에서 구원하실 분이라는 뜻이며, 그분은 하나님이 우리와 함께 계시는 임마누엘이십니다(마 1:21, 23).","41-2":"율법을 폐하러 오지 않고 완전하게 하러 오신 예수님은, 권위 있는 가르침으로 하나님 나라의 의를 보여 주시는 참된 왕이십니다(마 5:17; 7:29).","41-3":"병을 고치시고 죄를 사하시는 예수님은 우리의 연약한 것을 친히 담당하시고 병을 짊어지신 분으로, 이사야의 말씀을 이루셨습니다(마 8:17).","41-4":"예수님은 수고하고 무거운 짐 진 자들을 쉬게 하시는 분이며, 성전과 요나와 솔로몬보다 더 크신 분입니다(마 11:28; 12:6, 41-42).","41-5":"좋은 씨를 뿌리는 이는 인자라고 하신 대로, 예수님은 말씀의 씨를 뿌리시며 작게 시작해 온 세상에 자라 가는 하나님 나라를 여시는 분입니다(마 13:37).","41-6":"베드로의 고백처럼 예수님은 그리스도시요 살아 계신 하나님의 아들이시며, 그 길은 고난받고 죽임당한 뒤 제삼일에 살아나는 십자가의 길입니다(마 16:16, 21).","42-0":"예수님은 섬김을 받으려 하지 않고 도리어 섬기며 자기 목숨을 많은 사람의 대속물로 주러 오셨습니다(마 20:28).","42-1":"건축자들이 버린 돌이 모퉁이의 머릿돌이 되었다는 말씀처럼, 버림받으신 예수님이 하나님 나라의 머릿돌이 되십니다(마 21:42).","42-2":"다시 오실 예수님은 영광의 보좌에 앉아 모든 민족을 심판하시는 왕이시며, 지극히 작은 자 하나에게 한 것을 자신에게 한 것으로 여기십니다(마 25:31, 40).","42-3":"예수님의 피는 죄 사함을 얻게 하려고 많은 사람을 위하여 흘리신 언약의 피이며, 부활하신 주님은 세상 끝날까지 우리와 함께하십니다(마 26:28; 28:20).","42-4":"예수님은 땅에서 죄를 사하는 권세를 가진 인자이시며, 의인이 아니라 죄인을 부르러 오신 하나님의 아들이십니다(막 2:10, 17).","42-5":"바람과 바다를 잠잠하게 하시고 죽은 소녀를 일으키신 예수님은 자연과 질병과 죽음까지 다스리시는 하나님의 아들이십니다(막 4:41; 5:41-42).","42-6":"목자 없는 양 같은 무리를 먹이신 예수님은 그리스도이시며, 많은 고난을 받고 죽임을 당한 뒤 사흘 만에 살아나실 분입니다(막 6:34; 8:29, 31).","43-0":"예수님은 섬김을 받으러 오신 것이 아니라 섬기고 자기 목숨을 많은 사람의 대속물로 주러 오셨습니다(막 10:45).","43-1":"건축자들이 버린 돌이 모퉁이의 머릿돌이 되듯, 사람들에게 버림받아 죽으신 예수님이 구원의 머릿돌이 되셨습니다(행 4:11).","43-2":"예수님이 숨지실 때 성소 휘장이 찢어진 것처럼, 그분의 죽음은 우리를 위해 하나님께 나아가는 새로운 살 길을 열었습니다(히 10:19-20).","43-3":"다윗의 동네에서 나신 아기 예수님은 온 백성을 위해 오신 구주, 곧 그리스도 주이십니다(눅 2:10-11).","43-4":"예수님은 주의 성령으로 기름 부음을 받아 가난한 자에게 복음을, 포로 된 자에게 자유를 전하러 오신 메시아이십니다(눅 4:18-21).","43-5":"베드로의 고백처럼 예수님은 하나님의 그리스도이시며, 고난받고 버림받아 죽임을 당한 뒤 제삼일에 살아나실 분입니다(눅 9:20-22).","43-6":"예수님은 솔로몬보다, 요나보다 더 큰 이로서 하나님의 손으로 귀신을 쫓아내시며 하나님 나라를 우리 가운데 가져오셨습니다(눅 11:20, 31-32).","44-0":"예수님은 선지자들을 죽인 예루살렘으로 스스로 가셔서, 암탉이 새끼를 모으듯 자기 백성을 모으시려고 고난의 길을 걸으셨습니다(눅 13:33-34).","44-1":"예수님은 세리와 죄인을 영접하시는 분으로, 돌아온 아들을 달려가 안아 준 아버지의 마음을 우리에게 보여 주십니다(눅 15:2, 20).","44-2":"예수님은 잃어버린 자를 찾아 구원하러 오신 분으로, 죄인이라 불리던 삭개오의 집에 구원을 가져오셨습니다(눅 19:9-10).","44-3":"다윗이 주라 부른 그리스도는 십자가에 못 박혔다가 살아나 하나님 우편에 앉으신 예수님이십니다(행 2:34-36).","44-4":"부활하신 예수님은 모세의 율법과 선지자의 글과 시편에 자기를 가리켜 기록된 모든 것이 이루어졌다고 밝히셨습니다(눅 24:44-46).","44-5":"예수님은 세상 죄를 지고 가는 하나님의 어린 양이시며, 죽고 사흘 만에 다시 일으켜질 참 성전이십니다(요 1:29, 2:19-21).","44-6":"모세가 광야에서 뱀을 든 것처럼 예수님은 십자가에 들리셔서, 그를 믿는 자마다 영생을 얻게 하셨습니다(요 3:14-15).","45-0":"광야의 만나를 먹은 조상들은 죽었지만, 하늘에서 내려온 생명의 떡이신 예수님을 먹는 자는 영원히 삽니다(요 6:48-51).","45-1":"예수님은 목마른 자에게 생수의 강 같은 성령을 주시고, 어둠 속에 있는 자에게 생명의 빛이 되시는 분입니다(요 7:37-39, 8:12).","45-2":"선한 목자이신 예수님은 양들을 위하여 스스로 목숨을 버리고 다시 얻으셔서, 자기 양들에게 영생을 주십니다(요 10:11, 17-18, 28).","45-3":"부활이요 생명이신 예수님은 한 알의 밀처럼 땅에 떨어져 죽으심으로, 흩어진 하나님의 자녀를 모아 하나가 되게 하셨습니다(요 11:25, 52, 12:24).","45-4":"자기 사람들을 끝까지 사랑하신 예수님은 우리가 아버지께 나아갈 수 있는 유일한 길이십니다(요 13:1, 14:6).","45-5":"예수님은 친구를 위하여 목숨을 버리는 가장 큰 사랑을 보이셨고, 세상을 이기신 그분 안에서 우리는 평안을 누립니다(요 15:13, 16:33).","45-6":"제자들과 앞으로 믿을 우리를 위해 기도하신 예수님은 지금도 하나님 우편에서 우리를 위하여 간구하십니다(롬 8:34).","46-0":"예수님은 십자가에서 구원의 일을 다 이루셨고, 부활하셔서 도마의 고백처럼 우리의 주님이시요 하나님이심을 보이셨습니다(요 19:30, 20:28).","46-1":"하나님 오른손으로 높아지신 예수님이 아버지께 약속하신 성령을 받아 교회에 부어 주셨습니다(행 2:32-33).","46-2":"건축자들이 버린 돌이었다가 머릿돌이 되신 예수님 외에는, 천하 사람 중에 구원받을 만한 다른 이름이 없습니다(행 4:11-12).","46-3":"모세가 예고한 그 선지자요 선지자들이 오리라 한 의인이신 예수님은, 지금 하나님 우편에 계신 높임 받은 인자이십니다(행 7:37, 52, 56).","46-4":"내시가 읽던 이사야의 도살자에게로 끌려가는 양은, 빌립이 그 글에서 시작하여 전한 예수님을 가리킵니다(행 8:32-35).","46-5":"예수 그리스도는 만유의 주이시며, 유대인이든 이방인이든 그를 믿는 사람은 다 그의 이름으로 죄 사함을 받습니다(행 10:36, 43).","46-6":"모세의 율법으로는 의롭다 하심을 얻지 못하나, 예수님을 힘입어 믿는 자마다 의롭다 하심을 얻습니다(행 13:38-39, 15:11).","47-0":"바울이 성경으로 풀어 증언했듯, 해를 받고 죽은 자 가운데서 다시 살아나신 예수님이 바로 그리스도이십니다(행 17:3).","47-1":"교회는 하나님이 자기 피로 사신 양 떼이며, 우리는 흠 없는 어린 양 같은 그리스도의 보배로운 피로 대속함을 받았습니다(행 20:28; 벧전 1:18-19).","47-2":"바울이 다메섹 길에서 만난 나사렛 예수는 하나님이 보게 하신 그 의인이시며, 갇힌 증인 곁에 서서 담대하라 하시는 주님이십니다(행 22:14, 23:11).","47-3":"바울이 전한 복음의 중심은 그리스도가 고난받고 죽은 자 가운데서 먼저 살아나 이스라엘과 이방인에게 빛을 전하신다는 것입니다(행 26:22-23).","47-4":"하나님은 예수님을 그의 피로써 화목제물로 세우셔서, 믿는 자를 차별 없이 의롭다 하십니다(롬 3:24-25).","47-5":"우리가 아직 죄인일 때 죽으신 그리스도께서 우리를 의롭게 하시고, 그분의 영이 우리를 하나님의 자녀로 삼으십니다(롬 5:8; 8:15).","47-6":"그리스도는 모든 믿는 자에게 의를 이루기 위해 율법의 마침이 되셨고, 유대인과 이방인 모두의 주가 되십니다(롬 10:4, 12).","48-0":"그리스도께서 자기를 기쁘게 하지 않으시고 우리를 받으셨듯이, 교회는 서로를 받아 하나님께 영광을 돌립니다(롬 15:3, 7).","48-1":"십자가에 못 박히신 그리스도가 하나님의 능력이요 지혜이시며, 우리에게 의로움과 거룩함과 구원함이 되셨습니다(고전 1:24, 30).","48-2":"우리의 유월절 양이신 그리스도께서 희생되셨으니, 값으로 사신 우리는 몸으로 하나님께 영광을 돌립니다(고전 5:7; 6:20).","48-3":"광야에서 이스라엘을 따르던 신령한 반석은 그리스도이셨고, 성찬의 잔과 떡은 그리스도의 피와 몸에 참여하는 것입니다(고전 10:4, 16).","48-4":"성찬은 우리를 위해 몸을 주시고 피로 새 언약을 세우신 주님의 죽으심을 그가 오실 때까지 전하는 것입니다(고전 11:24-26).","48-5":"그리스도는 잠자는 자들의 첫 열매로 부활하셨고, 그분으로 말미암아 하나님께서 사망을 이기는 승리를 우리에게 주십니다(고전 15:20, 57).","48-6":"하나님의 약속은 얼마든지 그리스도 안에서 예가 되어, 우리는 그분으로 말미암아 아멘 하고 하나님께 영광을 돌립니다(고후 1:20).","49-0":"하나님은 죄를 알지도 못하신 그리스도를 우리 대신 죄로 삼으셔서, 우리가 그 안에서 하나님의 의가 되게 하셨습니다(고후 5:21).","49-1":"부요하신 예수님이 우리를 위해 가난하게 되셔서 그 가난으로 우리를 부요하게 하신 은혜가 나눔의 근거입니다(고후 8:9).","49-2":"그리스도께서 약하심으로 십자가에 못 박히셨으나 하나님의 능력으로 사시듯, 그분의 능력은 우리의 약함 속에서 온전해집니다(고후 12:9; 13:4).","49-3":"나를 사랑하사 나를 위해 자기 자신을 버리신 하나님의 아들을 믿을 때, 그리스도께서 내 안에 사십니다(갈 2:20).","49-4":"그리스도께서 우리를 위해 저주를 받으셔서 율법의 저주에서 속량하시고, 아브라함의 복이 이방인에게까지 미치게 하셨습니다(갈 3:13-14).","49-5":"그리스도는 우리의 화평이 되셔서 십자가로 원수 된 것을 소멸하시고, 유대인과 이방인을 한 몸으로 하나님과 화목하게 하셨습니다(엡 2:14-16).","49-6":"근본 하나님의 본체이신 예수님은 자기를 비워 십자가에 죽기까지 복종하셨고, 하나님은 그를 지극히 높이셨습니다(빌 2:6-9).","50-0":"그리스도 안에는 신성의 모든 충만이 육체로 거하시며, 그는 십자가의 피로 화평을 이루어 만물을 하나님과 화목하게 하셨습니다(골 1:20; 2:9).","50-1":"예수님은 죽으셨다가 다시 살아나신 분으로, 하늘에서 강림하셔서 장래의 노하심에서 우리를 건지실 구주이십니다(살전 1:10; 4:14).","50-2":"다시 오실 주 예수께서 그 입의 기운으로 불법한 자를 멸하시고, 성도들에게서 영광을 받으실 것입니다(살후 1:10; 2:8).","50-3":"하나님과 사람 사이의 중보자는 사람이신 그리스도 예수 한 분이시며, 그는 모든 사람을 위해 자기를 대속물로 주셨습니다(딤전 2:5-6).","50-4":"다윗의 씨로 죽은 자 가운데서 다시 살아나신 예수 그리스도는 사망을 폐하시고 생명과 썩지 아니할 것을 드러내셨습니다(딤후 1:10; 2:8).","50-5":"크신 하나님이요 구주이신 예수 그리스도께서 자신을 주셔서, 모든 불법에서 우리를 속량하고 깨끗한 자기 백성으로 삼으셨습니다(딛 2:13-14).","50-6":"오네시모의 빚을 자기 앞으로 계산하라는 바울의 모습은 친히 나무에 달려 우리 죄를 담당하신 그리스도를 떠올리게 하며, 그리스도 안에서 종이었던 사람도 사랑받는 형제가 됩니다(몬 1:16, 18; 벧전 2:24).","51-0":"우리와 똑같이 시험을 받으셨으나 죄는 없으신 대제사장 예수님 덕분에 우리는 은혜의 보좌 앞에 담대히 나아갑니다(히 4:15-16).","51-1":"그리스도는 염소와 송아지의 피가 아니라 자기의 피로 단번에 성소에 들어가 영원한 속죄를 이루셨습니다(히 9:12).","51-2":"예수님은 믿음의 주요 온전하게 하시는 이로서 십자가를 참으시고, 성문 밖에서 고난받아 자기 피로 백성을 거룩하게 하셨습니다(히 12:2; 13:12).","51-3":"영광의 주 예수 그리스도를 믿는 참 믿음은, 차별 없이 이웃을 사랑하는 행함으로 살아 있음을 드러냅니다(약 2:1, 8).","51-4":"그리스도는 친히 나무에 달려 그 몸으로 우리 죄를 담당하셨고, 그가 채찍에 맞음으로 우리는 나음을 얻었습니다(벧전 2:24).","51-5":"구주 예수 그리스도는 반드시 다시 오시며, 그의 더디심은 아무도 멸망하지 않고 회개하기를 바라시는 오래 참으심입니다(벧후 3:9, 15).","51-6":"의로우신 예수 그리스도는 아버지 앞에서 우리의 대언자이시며, 우리 죄뿐 아니라 온 세상의 죄를 위한 화목 제물이십니다(요일 2:1-2).","52-0":"하나님은 독생자를 세상에 보내어 그로 말미암아 우리를 살리셨으니, 아들이 있는 자에게는 생명이 있습니다(요일 4:9; 5:12).","52-1":"능히 우리를 보호하사 거침이 없게 하시는 하나님께, 우리 주 예수 그리스도로 말미암아 영광이 영원토록 있습니다(유 1:24-25).","52-2":"예수님은 전에 죽었으나 이제 세세토록 살아 계셔서 사망과 음부의 열쇠를 가지신 분으로, 교회 가운데 거니시며 다스리십니다(계 1:18; 2:1).","52-3":"죽임을 당하신 어린 양 예수님은 그 피로 각 족속과 나라에서 사람들을 사서 하나님께 드리셨기에 두루마리를 떼기에 합당하십니다(계 5:9).","52-4":"큰 환난에서 나온 무리는 어린 양의 피에 옷을 씻어 희게 하였고, 어린 양이 그들의 목자가 되어 생명수 샘으로 인도하십니다(계 7:14, 17).","52-5":"성도들은 어린 양의 피와 자기들이 증언하는 말씀으로 용을 이겼고, 세상 나라는 그리스도의 나라가 됩니다(계 11:15; 12:11).","52-6":"만주의 주시요 만왕의 왕이신 어린 양은 짐승과 그 편에 선 왕들을 이기시고, 부르심 받은 자들도 그와 함께 이깁니다(계 17:14).","53-0":"보좌에 앉으신 이는 만물을 새롭게 하시고 목마른 자에게 생명수를 값없이 주시며, 알파와 오메가이신 예수님은 속히 오리라고 약속하십니다(계 21:5-6; 22:13, 17, 20)."});}

function posOfToday(){
  const diff=dayDiff(parseD(mem.start),today0());
  if(diff<0) return {w:1,d:0,state:"before",diff};
  if(diff>=TOTAL_DAYS){ const L=TOTAL_DAYS-1; return {w:Math.floor(L/7)+1,d:L%7,state:"after",diff}; }

}

/* 어려운 말 표시 */
function markGloss(text,b,seen){
  let out="",last=0; GI.re.lastIndex=0; let m;
  while((m=GI.re.exec(text))){
    const it=GI.by.get(m[1]); if(!it||!inScope(it,b)||seen.has(it.t)) continue;
    seen.add(it.t);
    out+=esc(text.slice(last,m.index))+`<span class="g${NAME_SET.has(it.t)?" nm":""}" tabindex="0" role="button" data-g="${esc(it.t)}">${esc(m[1])}</span>`;
    last=m.index+m[1].length;
  }
  return out+esc(text.slice(last));
}
function glossInDay(A,b){
  const found=[]; const seen=new Set(); GI.re.lastIndex=0;
  for(const v of A.verses){ GI.re.lastIndex=0; let m; while((m=GI.re.exec(v.t))){ const it=GI.by.get(m[1]); if(it&&inScope(it,v.b)&&!seen.has(it.t)){seen.add(it.t);found.push({it,ref:[v.b,v.c,v.v]});} } }
  return found;
}

function initMap(A){
  destroyMap();

  let fid=order.find(id=>must.every(p=>inF(id,p))&&(rpts.length?pts.filter(p=>inF(id,p)).length>=Math.min(pts.length,1):true));
  if(!fid) fid=order.map(id=>[id,must.filter(p=>inF(id,p)).length]).sort((a,b)=>b[1]-a[1])[0][0];

  if(fid==="israel") terr.addLayer(L.imageOverlay(TERRAIN.israelhi.url,TERRAIN.israelhi.bounds));
  const water=L.layerGroup([...WATER.lakes.map(l=>L.polygon(l,{color:"#5f8fae",weight:1,fillColor:"#A8C6D6",fillOpacity:1,interactive:false})),...WATER.rivers.map(r=>L.polyline(r,{color:"#5f8fae",weight:2,interactive:false}))]);
  terr.addTo(map); water.addTo(map);
  // 최소 확대 = 전체 판
  map.fitBounds(FB,{animate:false}); map.setMinZoom(map.getZoom());
  const use=pts.filter(p=>inF(fid,p));
  const labels=[];
  const arrows=[];
  R.forEach((r,ri)=>{
    const col=RC[ri%RC.length], ll=r.p.map(q=>[q[1],q[2]]);
    L.polyline(ll,{color:"#fff",weight:6,opacity:.7,interactive:false}).addTo(map);
    L.polyline(ll,{color:col,weight:3,dashArray:"8 6",interactive:false}).addTo(map);
    for(let k=0;k<ll.length-1;k++){ const a=ll[k],b=ll[k+1]; if(a[0]===b[0]&&a[1]===b[1]) continue;
      const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
      const mk=L.marker(mid,{icon:L.divIcon({className:"",html:`<span class="rarrow" style="border-left-color:${col}"></span>`,iconSize:null}),interactive:false,keyboard:false}).addTo(map);
      arrows.push({mk,a,b}); }
    r.p.forEach((q,qi)=>{ if(!q[0]||use.some(p=>p.name===q[0])) return;
      L.circleMarker([q[1],q[2]],{radius:4,color:col,weight:2,fillColor:"#fff",fillOpacity:1,interactive:false}).addTo(map);
      const mk=L.marker([q[1],q[2]],{icon:L.divIcon({className:"",html:`<span class="mlbl rte">${esc(q[0])}</span>`,iconSize:null}),interactive:false,keyboard:false}).addTo(map);
      labels.push({mk,pri:300+qi}); });
  });
  function orient(){ arrows.forEach(o=>{ const p1=map.latLngToLayerPoint(o.a),p2=map.latLngToLayerPoint(o.b); const ang=Math.atan2(p2.y-p1.y,p2.x-p1.x)*180/Math.PI; const e=o.mk.getElement()?.querySelector(".rarrow"); if(e) e.style.transform=`translate(-50%,-50%) rotate(${ang}deg)`; }); }
  const open=p=>{const b0=A.verses[0].b; const kn={c:"성읍",r:"지역",m:"산",w:"강·바다·호수"}[p.g[3]];
    sheet(p.name,`<p>${kn} · 오늘 본문에 ${p.n}번 나옵니다.</p><p class="src">나오는 곳: ${esc(refList(p.refs,b0))}${p.n>p.refs.length?" …":""}</p><p class="src">위치는 대략적인 것입니다.</p>`);};
  use.forEach((p,i)=>{
    const ll=[p.g[1],p.g[2]], kind=p.g[3];

      const mk=L.marker(ll,{icon:L.divIcon({className:"",html:`<span class="mlbl reg">${esc(p.name)}</span>`,iconSize:null}),keyboard:false}).addTo(map).on("click",()=>open(p));

    const mk=L.marker(ll,{icon:L.divIcon({className:"",html:`<span class="mlbl">${esc(p.name)}</span>`,iconSize:null}),keyboard:false}).addTo(map).on("click",()=>open(p));
    labels.push({mk,pri:i});
  });
  for(const [n,la,lo] of (CTXL[fid]||[])){
    if(use.some(p=>p.name===n.replace(/ 강$/,""))) continue;
    const mk=L.marker([la,lo],{icon:L.divIcon({className:"",html:`<span class="mlbl wat">${n}</span>`,iconSize:null}),interactive:false,keyboard:false}).addTo(map);
    labels.push({mk,pri:500});
  }
  function declutter(){
    const kept=[];
    labels.slice().sort((a,b)=>a.pri-b.pri).forEach(l=>{
      const e=l.mk.getElement()?.querySelector(".mlbl"); if(!e) return;
      e.style.visibility="visible"; const r=e.getBoundingClientRect();
      if(kept.some(k=>!(r.right<k.left||r.left>k.right||r.bottom<k.top||r.top>k.bottom))) e.style.visibility="hidden"; else kept.push(r);
    });
  }
  map.on("zoomend moveend",declutter); map.on("zoomend",orient);
  const PB=R.length?L.latLngBounds(R.flatMap(r=>r.p.map(q=>[q[1],q[2]])).filter(q=>FB.contains(q))):L.latLngBounds(use.map(p=>[p.g[1],p.g[2]]));

  setTimeout(()=>{if(LMAP!==map)return; map.invalidateSize({animate:false});orient();declutter();},60);

/* 진행률 */
const TOTAL_CH=PLAN.plan.flat().reduce((a,p)=>a+p.ch.length,0);
function chDone(){ let n=0; for(const k in mem.done){ const [w,d]=k.split("-").map(Number); if(PLAN.plan[w-1]&&PLAN.plan[w-1][d]) n+=PLAN.plan[w-1][d].ch.length; } return n; }
function chScheduled(){ if(here.state==="before") return 0; let n=0; for(let w=1;w<=here.w;w++) for(let d=0;d<nd(w);d++){ if(w===here.w&&d>here.d) break; n+=PLAN.plan[w-1][d].ch.length; } return n; }
const pct1=(a,b)=>b?(a/b*100).toFixed(1):"0.0";
function progressCard(){
  const n=chDone(), s=chScheduled();

  const ROWDEF=[["turn","꺾이는 곳","여기서 이야기의 방향이 바뀝니다. 바뀌기 전과 후를 비교해 보세요.",c=>vref(c.r,b0)],
    ["scene","닮은 장면","전에 읽은 장면과 닮았습니다. 같은 점과 다른 점을 찾아보세요.",c=>c.g],
    ["echo","구약의 메아리","신약이 구약의 말씀을 다시 부릅니다. 처음 그 말씀이 나온 장면을 떠올려 보세요.",c=>vref(c.r,b0)+" ← "+PLAN.abbr[c.o[0]-1]+" "+c.o[1]+":"+c.o[2]],
    ["pair","나란히 보기","두 사람을 나란히 놓으면 차이가 보입니다. 누가 무엇을 택했나요?",c=>c.a+" ↔ "+c.b],
    ["irony","독자만 아는 것","인물은 모르지만 읽는 우리는 아는 것이 있습니다. 그래서 이 장면이 더 아프거나 우습습니다.",c=>vref(c.r,b0)],

const QT_GOALS=[[1,"첫 QT를 마쳤습니다"],[3,"QT 3일 달성"],[7,"QT 7일 달성"],[14,"QT 14일 달성"],[30,"QT 30일 달성"],[50,"QT 50일 달성"],[100,"QT 100일 달성"],[150,"QT 150일 달성"],[200,"QT 200일 달성"],[300,"QT 300일 달성"]].filter(g=>g[0]<READ_DAYS).concat([[READ_DAYS,PI.short+" QT 완주"]]);
function prevDay(w,d){ d--; if(d<0){ w--; if(w<1) return null; d=nd(w)-1; } return [w,d]; }
function streakOf(ok,w,d){ let n=0, p=[w,d]; while(p&&ok(p[0],p[1])){ n++; p=prevDay(p[0],p[1]); } return n; }
function qtStreak(w,d){ return streakOf((a,b)=>(mem.qt[keyOf(a,b)]||{}).done,w,d); }

  const goal=QT_GOALS.find(g=>g[0]===total), next=QT_GOALS.find(g=>g[0]>total);
  const stamps=Array.from({length:nd(w)},(_,i)=>i).map(i=>{const on=(mem.qt[keyOf(w,i)]||{}).done; return `<span class="stamp${on?" on":""}${i===d?" me":""}" title="${i+1}일째">${on?"✓":i+1}</span>`;}).join("");

function confetti(){
  try{ if(matchMedia("(prefers-reduced-motion: reduce)").matches) return; }catch(e){}
  const c=document.createElement("canvas"); c.className="confetti"; const W=c.width=innerWidth, H=c.height=innerHeight; document.body.appendChild(c);
  const x=c.getContext("2d"), cs=getComputedStyle(document.documentElement), col=["--accent","--gold","--ok","--bad"].map(v=>cs.getPropertyValue(v).trim()||"#2C5C52");
  const P=Array.from({length:110},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.55,vx:(Math.random()-.5)*11,vy:-Math.random()*15-6,r:Math.random()*6+4,a:Math.random()*6,va:(Math.random()-.5)*.4,c:col[Math.random()*4|0]}));
  const t0=performance.now();
  (function f(t){ const k=(t-t0)/1700; x.clearRect(0,0,W,H); if(k>=1){c.remove();return;}
    x.globalAlpha=k>.7?(1-k)/.3:1;
    for(const p of P){ p.vy+=.45; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore(); }
    requestAnimationFrame(f); })(t0);
  try{ navigator.vibrate&&navigator.vibrate(30); }catch(e){}
}
function qtOf(key){ return mem.qt[key] ||= {}; }
function lensesFor(w,d){
  const det=DETAIL[w+"-"+(d+1)]; if(det&&det.lenses) return det.lenses;
  const g=GENRE_OF(dayPlan(w,d).ch[0][0]); const L=LENSES[g], st=((w-1)*6+d)%L.length;
  return [0,1,2].map(i=>L[(st+i)%L.length]);
}
function clueFor(k,A,w,d){
  const top=(m,n)=>[...m.values()].sort((a,b)=>b.n-a.n).slice(0,n).map(x=>x.name).join(", ");
  if(/무대/.test(k)&&A.places.size) return "오늘 나오는 곳: "+top(A.places,6);
  if(/인물|내 자리/.test(k)&&A.people.size) return "오늘 나오는 사람: "+top(A.people,6);
  if(/줄거리|편지 뒤|시간/.test(k)&&(SUMMARY[w-1]||[])[d]) return "요약 다시 보기: "+SUMMARY[w-1][d].split(/(?<=다\.)\s/)[0];
  return "";
}
function qtVerses(A,traits,key){
  const det=DETAIL[key]; const list=[];
  if(det){ const txt=[det.god,det.christ,det.apply].join(" ");
    for(const m of txt.matchAll(/\((\d+):(\d+)\)/g)){ const v=A.verses.find(x=>x.c===+m[1]&&x.v===+m[2]); if(v) list.push(v); } }
  traits.forEach(t=>list.push(t.verse));
  // 짧고 하나님이 등장하는 구절 보충
  A.verses.filter(v=>DIVINE.test(v.t)&&v.t.length>=25&&v.t.length<=110).slice(0,40).forEach(v=>list.push(v));
  return [...new Set(list)];
}

  if(/인자가 온 것은|인자가 .{0,20}권세|나는 .{0,12}(이니|이라|니라)|내가 곧/.test(t)) return {k:"self",at};

function makePrayer(key,vi,pv,label,v,traits){

function readStreak(){ let p=[here.w,here.d]; if(isRev(p[1])) p=[p[0],5]; if(here.state==="before") return 0;
  const ok=(w,d)=>!!mem.done[keyOf(w,d)]; if(!ok(p[0],p[1])) p=prevDay(p[0],p[1]); return p?streakOf(ok,p[0],p[1]):0; }
function bookProgress(){ const tot={},got={}; PLAN.plan.flat().forEach(p=>p.ch.forEach(([b])=>{tot[b]=(tot[b]||0)+1;}));
  for(const k in mem.done){ const [w,d]=k.split("-").map(Number); const p=PLAN.plan[w-1]&&PLAN.plan[w-1][d]; if(p) p.ch.forEach(([b])=>{got[b]=(got[b]||0)+1;}); }
  return {tot,got}; }

    <div class="ring">${ringSVG(pc)}<div class="rt"><span class="lead">성경 전체 진행률</span><b>${pct1(n,TOTAL_CH)}%</b><span class="lead">${TOTAL_CH.toLocaleString()}장 중 ${n.toLocaleString()}장 · 일정상 오늘까지 ${pct1(sch,TOTAL_CH)}%</span></div></div>
    <div class="pstats"><div class="pstat"><b>${doneN}</b><span>통독한 날 / ${READ_DAYS}</span></div><div class="pstat"><b>${rs}일</b><span>연속 통독</span></div><div class="pstat"><b>${t?pct(s,t)+"%":"–"}</b><span>퀴즈 정답률</span></div><div class="pstat"><b>${qtN}</b><span>QT 한 날</span></div><div class="pstat"><b>${qs}일</b><span>연속 QT</span></div><div class="pstat"><b>${hlN}</b><span>형광펜 절</span></div></div></div></section>`;

    ["✎","첫 QT",qtN>=1],["7","QT 7일 연속",qs>=7],["★","퀴즈 만점",perfect>=1],["✓","만점 10번",perfect>=10],
    ["◐","성경 25%",pc>=25],["◑","성경 50%",pc>=50],["●","성경 100%",pc>=100],["🖍","형광펜 10절",hlN>=10]];

  h+=`</section>`;
  // 최근 QT
  const qtl=Object.entries(mem.qt).filter(([k,q])=>q.med||q.pray||qtStoryText(q)).map(([k,q])=>{const [w,d]=k.split("-").map(Number); return {w,d,q};}).filter(x=>PLAN.plan[x.w-1]&&PLAN.plan[x.w-1][x.d]).sort((a,b)=>dayNo(b.w,b.d)-dayNo(a.w,a.d)).slice(0,5);

  document.body.style.overflow="hidden";
  document.getElementById("drawerX").onclick=closeMenu;
  document.getElementById("drawerBg").onclick=e=>{if(e.target.id==="drawerBg")closeMenu();};
  r.querySelectorAll("[data-plan]").forEach(b=>b.onclick=()=>{ if(b.dataset.plan===MODE) return; try{localStorage.setItem("cbsr-mode",b.dataset.plan);}catch(e){} location.reload(); });
  bindInstall();
  document.getElementById("startSave").onclick=()=>{const v=document.getElementById("startIn").value; if(!v) return; mem.start=v; save(); Object.assign(here,posOfToday()); closeMenu(); go(here.w,here.d);};
  document.getElementById("markPast").onclick=()=>{ for(let w=1;w<=here.w;w++) for(let d=0;d<nd(w);d++){ if(w===here.w&&d>=here.d) break; const k=keyOf(w,d); if(!mem.done[k]) mem.done[k]="past"; } save(); closeMenu(); view.tab="record"; render(); window.scrollTo({top:0}); };
  document.getElementById("resetAsk").onclick=()=>{
    document.getElementById("resetBox").innerHTML=`<div class="confirm"><span>이 통독표의 퀴즈, 진행률, QT 기록을 모두 지울까요? 되돌릴 수 없습니다.</span><div class="row"><button class="btn small" id="resetYes">지우기</button><button class="btn ghost small" id="resetNo">취소</button></div></div>`;
    document.getElementById("resetYes").onclick=()=>{mem.q={};mem.wq={};mem.done={};mem.qt={};save();closeMenu();render();};
    document.getElementById("resetNo").onclick=()=>{closeMenu();openMenu();};
  };
}

/* 그리기 */
function render(){
  renderHead();
  const m=document.getElementById("main");
  if(view.tab==="guide") view.tab="read";
  m.innerHTML=view.tab==="read"?renderRead():view.tab==="qt"?renderQT():renderRecord();
  bind(); syncHlBar();
  if(view.tab==="read"&&!isRev(view.d)&&BIBLE) initMap(dayA(view.w,view.d)); else destroyMap();
}
function go(w,d){view.w=w;view.d=d;view.tab="read";view.open=false;view.quiz=null;view.wquiz=null;render();window.scrollTo({top:0});}
function keepScroll(fn){const el=document.getElementById("quizSec")||document.querySelector(".quiz"); const top=el?el.getBoundingClientRect().top:null; fn(); render(); const el2=document.getElementById("quizSec")||document.querySelector(".quiz"); if(el2&&top!==null) window.scrollBy(0,el2.getBoundingClientRect().top-top);}
function seeVerse(b,c,v){
  view.open=true; render();
  const el=v?document.getElementById(`v-${b}-${c}-${v}`):document.getElementById(`ch-${b}-${c}`);
  if(el){ el.scrollIntoView({block:v?"center":"start"}); if(v){el.classList.add("hl"); setTimeout(()=>el.classList.remove("hl"),2600);} }
}
function bind(){
  const m=document.getElementById("main");
  m.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{const [w,d]=b.dataset.jump.split("-").map(Number);go(w,d);});
  m.querySelectorAll("[data-g]").forEach(el=>{el.onclick=()=>showGloss(el.dataset.g); el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();showGloss(el.dataset.g);}};});
  m.querySelectorAll("[data-person]").forEach(b=>b.onclick=()=>{const A=dayA(view.w,view.d), p=A.people.get(b.dataset.person); const b0=A.verses[0].b;
    sheet(p.name,`<p>오늘 본문에 ${p.n}번 나옵니다.</p><p class="src">나오는 곳: ${esc(refList(p.refs,b0))}${p.n>p.refs.length?" …":""}</p>`);});
  m.querySelectorAll("[data-place]").forEach(g=>g.onclick=()=>{const A=dayA(view.w,view.d), p=A.places.get(g.dataset.place); const k=PLACE.get(p.name)[3]; const b0=A.verses[0].b;
    const kn={c:"성읍",r:"지역",m:"산",w:"강·바다·호수"}[k];
    sheet(p.name,`<p>${kn} · 오늘 본문에 ${p.n}번 나옵니다.</p><p class="src">나오는 곳: ${esc(refList(p.refs,b0))}${p.n>p.refs.length?" …":""}</p><p class="src">위치는 대략적인 것입니다.</p>`);});
  m.querySelectorAll("[data-qstart]").forEach(b=>b.onclick=()=>keepScroll(()=>startQuiz(b.dataset.qstart)));
  m.querySelectorAll("[data-ans]").forEach(b=>b.onclick=()=>keepScroll(()=>answer(b.dataset.mode,+b.dataset.ans)));
  m.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>keepScroll(()=>nextQ(b.dataset.next)));
  m.querySelectorAll("[data-see]").forEach(b=>b.onclick=()=>{const [bb,c,v]=b.dataset.see.split("-").map(Number); if(isRev(view.d)){const dd=PLAN.plan[view.w-1].findIndex(p=>p.ch.some(([x,y])=>x===bb&&y===c)); go(view.w,Math.max(0,dd));} seeVerse(bb,c,v);});
  m.querySelectorAll("[data-goweek]").forEach(b=>b.onclick=()=>go(view.w,6));
  const ot=document.getElementById("openText"); if(ot) ot.onclick=()=>{view.open=true;render();document.getElementById("bible")?.scrollIntoView({block:"start"});};

  m.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{view.open=false;render();document.getElementById("textSec")?.scrollIntoView({block:"start"});});
  const dn=document.getElementById("doneBtn"); if(dn) dn.onclick=()=>{const k=keyOf(view.w,view.d); if(mem.done[k]) delete mem.done[k]; else {mem.done[k]=new Date().toISOString().slice(0,10); view.justDone=true; if(window.SYNC&&SYNC.available) SYNC.markDone(syncKey(k),todayStr());} const was=view.justDone; save(); render(); document.getElementById("doneSec")?.scrollIntoView({block:"center"}); if(was) confetti();};
  const toQT=()=>{view.tab="qt";render();window.scrollTo({top:0});};
  const tqt=document.getElementById("toQT"); if(tqt) tqt.onclick=toQT;
  m.querySelectorAll("[data-toqt]").forEach(b=>b.onclick=toQT);
  m.querySelectorAll(".v[data-v]").forEach(el=>el.onclick=e=>{ if(e.target.closest(".g")) return; toggleSel(el.dataset.v); });
  m.querySelectorAll("[data-hljump]").forEach(b=>b.onclick=()=>{const [bb,c,v]=b.dataset.hljump.split("-").map(Number); const at=dayOfRef([bb,c,v]); if(!at) return; view.w=at[0]; view.d=at[1]; view.tab="read"; seeVerse(bb,c,v);});
  bindProfile(m);
  const pm=document.getElementById("pmini"); if(pm){const go2=()=>{view.tab="record";render();window.scrollTo({top:0});}; pm.onclick=go2; pm.onkeydown=e=>{if(e.key==="Enter")go2();};}
  m.querySelectorAll("[data-lw]").forEach(b=>b.onclick=()=>showLW(b.dataset.lw));
  m.querySelectorAll("[data-em]").forEach(b=>b.onclick=()=>showEM(b.dataset.em));
  m.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>showINC(+b.dataset.inc));
  m.querySelectorAll("[data-clue]").forEach(b=>b.onclick=()=>showClue(+b.dataset.clue));
  bindAccount(m); bindInstall(); if(view.tab==="read") churchCounts();
  bindQT(m);
  const fp=document.getElementById("fp"); if(fp){fp.onclick=()=>{mem.size=Math.min(24,(mem.size||17)+1);applySize();save();}; document.getElementById("fm").onclick=()=>{mem.size=Math.max(14,(mem.size||17)-1);applySize();save();};}
}
function applySize(){document.documentElement.style.setProperty("--bible-size",(mem.size||17)+"px");}
const fixD=()=>{ if(!isRev(view.d)&&view.d>=nd(view.w)) view.d=nd(view.w)-1; };
document.getElementById("prevW").onclick=()=>{if(view.w>1){view.w--;fixD();view.quiz=null;view.wquiz=null;view.open=false;render();}};
document.getElementById("nextW").onclick=()=>{if(view.w<NW){view.w++;fixD();view.quiz=null;view.wquiz=null;view.open=false;render();}};
document.getElementById("menuBtn").onclick=openMenu;
document.getElementById("todayBtn").onclick=()=>{const t=view.tab; go(here.w,here.d); if(t!=="read"){view.tab=t;render();}};
document.querySelectorAll(".bnav .tab").forEach(t=>t.onclick=()=>{const same=view.tab===t.dataset.tab; view.tab=t.dataset.tab; HSEL.clear(); render(); window.scrollTo({top:0,behavior:same?"smooth":"auto"});});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){document.getElementById("sheetRoot").innerHTML=""; closeMenu();}});
applySize(); render(); loadBible();
if(window.SYNC&&SYNC.loggedIn()) SYNC.pull().then(remote=>{ if(remote){ mem=mergeMem(mem,remote); try{localStorage.setItem(KEY,JSON.stringify(mem));}catch(e){} Object.assign(here,posOfToday()); render(); } }).catch(()=>{});
if(window.SYNC) SYNC.onChange(()=>{ if(view.tab==="record"){ const a=document.activeElement; if(!(a&&a.tagName==="INPUT")) render(); } });
})();

(function(){const b=document.createElement("button");b.className="totop";b.type="button";b.setAttribute("aria-label","맨 위로");b.title="맨 위로";
b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
b.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});document.body.appendChild(b);
const upd=()=>b.classList.toggle("show",window.scrollY>window.innerHeight*0.8);window.addEventListener("scroll",upd,{passive:true});upd();})();
</script>
