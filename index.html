,1],[54,2],[54,3],[54,4],[54,5],[54,6]],"topic":"믿음과 성실함으로 목회하라"},{"spec":"딤후 1-4","label":"디모데후서 1–4장","ch":[[55,1],[55,2],[55,3],[55,4]],"topic":"경건한 삶으로 목회하라"},{"spec":"딛 1-3","label":"디도서 1–3장","ch":[[56,1],[56,2],[56,3]],"topic":"바른 복음으로 목회하라"},{"spec":"몬 1","label":"빌레몬서","ch":[[57,1]],"topic":"주 안에서 형제된 자를 사랑하라"}],[{"spec":"히 1-6","label":"히브리서 1–6장","ch":[[58,1],[58,2],[58,3],[58,4],[58,5],[58,6]],"topic":"천사보다 우월한 그리스도의 사역"},{"spec":"히 7-10","label":"히브리서 7–10장","ch":[[58,7],[58,8],[58,9],[58,10]],"topic":"대제사장 그리스도의 사역"},{"spec":"히 11-13","label":"히브리서 11–13장","ch":[[58,11],[58,12],[58,13]],"topic":"믿음과 형제 사랑"},{"spec":"약 1-5","label":"야고보서 1–5장","ch":[[59,1],[59,2],[59,3],[59,4],[59,5]],"topic":"믿음과 행함"},{"spec":"벧전 1-5","label":"베드로전서 1–5장","ch":[[60,1],[60,2],[60,3],[60,4],[60,5]],"topic":"박해를 기뻐하라"},{"spec":"벧후 1-3","label":"베드로후서 1–3장","ch":[[61,1],[61,2],[61,3]],"topic":"재림을 사모하라"},{"spec":"요일 1-3","label":"요한일서 1–3장","ch":[[62,1],[62,2],[62,3]],"topic":"사랑이란 무엇인가"}],[{"spec":"요일 4-5","label":"요한일서 4–5장","ch":[[62,4],[62,5]],"topic":"우리가 서로 사랑하자"},{"spec":"요이 1-유 1","label":"요한이서 · 요한삼서 · 유다서","ch":[[63,1],[64,1],[65,1]],"topic":"바른 교훈을 따르라"},{"spec":"계 1-3","label":"요한계시록 1–3장","ch":[[66,1],[66,2],[66,3]],"topic":"7교회에 보내는 예수 그리스도의 말씀"},{"spec":"계 4-6","label":"요한계시록 4–6장","ch":[[66,4],[66,5],[66,6]],"topic":"7인을 떼는 그리스도"},{"spec":"계 7-9","label":"요한계시록 7–9장","ch":[[66,7],[66,8],[66,9]],"topic":"14만 4천의 노래"},{"spec":"계 10-14","label":"요한계시록 10–14장","ch":[[66,10],[66,11],[66,12],[66,13],[66,14]],"topic":"14만 4천의 노래"},{"spec":"계 15-18","label":"요한계시록 15–18장","ch":[[66,15],[66,16],[66,17],[66,18]],"topic":"7대접 심판과 바벨론의 패망"}],[{"spec":"계 19-22","label":"요한계시록 19–22장","ch":[[66,19],[66,20],[66,21],[66,22]],"topic":"어린양의 혼인잔치와 새하늘과 새땅"}]];SUMMARY.length=0;SUMMARY.push(...[["하나님이 엿새 동안 말씀으로 빛과 하늘, 땅과 바다, 해와 달과 별, 생물들을 지으시고 자기 형상대로 사람을 남자와 여자로 창조하셨습니다. 일곱째 날에는 안식하시며 그날을 복되고 거룩하게 하셨습니다. 여호와 하나님은 흙으로 지은 사람을 에덴 동산에 두시고 선악을 알게 하는 나무의 열매를 먹지 말라 명하셨으며, 아담의 갈빗대로 여자를 만들어 그에게 이끌어 오셨습니다.","뱀의 꾐에 넘어간 여자와 아담이 금지된 열매를 먹자, 하나님은 뱀과 여자와 아담에게 각각 벌을 선언하시고 가죽옷을 지어 입히신 뒤 동산에서 내보내셨습니다. 가인은 제물이 받아들여지지 않자 동생 아벨을 죽였고, 아담은 셋을 낳았습니다. 아담부터 노아까지의 계보가 이어지며, 하나님과 동행하던 에녹은 하나님이 데려가셨습니다.","사람의 죄악이 세상에 가득하자 하나님은 홍수로 심판하기로 하시고, 은혜를 입은 노아에게 방주를 짓게 하셨습니다. 노아와 가족과 짐승들이 방주에 들어간 뒤 사십 주야 비가 내려 모든 생물이 죽었고, 물이 줄자 노아는 방주에서 나와 제단을 쌓았습니다. 하나님은 다시는 홍수로 멸하지 않겠다고 무지개를 언약의 증거로 주셨고, 노아가 술에 취한 일로 함의 아들 가나안이 저주를 받았습니다.","노아의 세 아들 셈과 함과 야벳에게서 여러 족속과 나라가 퍼져 나간 족보가 나옵니다. 언어가 하나였던 사람들이 시날 평지에서 꼭대기가 하늘에 닿는 탑을 쌓아 이름을 내려 하자, 여호와께서 언어를 혼잡하게 하여 그들을 온 지면에 흩으셨고 그곳을 바벨이라 불렀습니다. 이어 셈에서 데라까지의 족보가 이어지고, 데라는 아브람과 사래와 롯을 데리고 우르를 떠나 하란에 머물렀습니다.","여호와께서 아브람을 불러 땅과 큰 민족과 복을 약속하시자, 아브람은 하란을 떠나 가나안에 들어갔습니다. 기근 때 애굽에서 사래를 누이라 속였고, 롯과 갈라선 뒤 다시 땅의 약속을 받았으며, 사로잡힌 롯을 구하고 멜기세덱에게 십분의 일을 주었습니다. 아브람이 여호와를 믿으니 여호와께서 이를 의로 여기시고 언약을 세우셨지만, 사래는 여종 하갈을 아브람에게 주어 이스마엘이 태어났습니다.","하나님은 아브람의 이름을 아브라함으로, 사래를 사라로 바꾸시고 할례를 언약의 표징으로 주시며 사라가 이삭을 낳으리라 약속하셨습니다. 아브라함은 세 손님을 대접하며 아들의 약속을 다시 들었고, 소돔을 위해 의인 열 명까지 간구했습니다. 소돔과 고모라는 유황과 불로 멸망했으나 롯은 구출되었고, 아브라함은 그랄에서 또다시 사라를 누이라 하였다가 하나님이 아비멜렉을 막으셨습니다.","하나님이 말씀하신 대로 사라가 노년에 이삭을 낳았고, 하갈과 이스마엘은 쫓겨났으나 하나님이 광야에서 그들을 돌보셨습니다. 하나님이 아브라함을 시험하여 독자 이삭을 번제로 드리라 하시자, 아브라함은 모리아 산에서 순종하였고 하나님은 이삭 대신 숫양을 준비하셨습니다. 사라가 죽자 아브라함은 헷 족속 에브론에게서 막벨라 굴을 사서 그를 장사했습니다."],["아브라함은 늙은 종을 고향으로 보내 이삭의 아내를 구하게 했고, 종은 우물가에서 기도한 대로 낙타에게까지 물을 길어 준 리브가를 만났습니다. 리브가는 가겠다고 대답하고 이삭의 아내가 되었습니다. 아브라함이 죽어 막벨라 굴에 장사되었고, 이스마엘의 족보 뒤에 리브가가 에서와 야곱 쌍둥이를 낳았으며, 에서는 팥죽 한 그릇에 장자의 명분을 야곱에게 팔았습니다.","흉년에 그랄로 간 이삭은 아버지처럼 아내를 누이라 속였으나, 여호와의 복으로 백 배를 거두었고 우물 다툼 끝에 르호봇과 브엘세바에 이르렀습니다. 늙은 이삭이 에서를 축복하려 하자 리브가와 야곱은 에서로 꾸며 속여 복을 받아 냈습니다. 에서의 분노를 피해 하란으로 떠난 야곱은 벧엘에서 하늘에 닿은 사닥다리 꿈을 꾸고 함께하시겠다는 약속을 받았습니다.","하란의 야곱은 라헬을 위해 칠 년을 일했지만 라반에게 속아 레아를 먼저 맞고, 다시 칠 년을 섬겨 라헬을 얻었습니다. 레아와 라헬, 두 여종의 경쟁 속에 열한 아들과 딸 디나가 태어났고, 마침내 라헬도 요셉을 낳았습니다. 품삯을 열 번이나 바꾼 라반 밑에서도 하나님이 야곱을 번성케 하셨고, 야곱이 몰래 떠나자 라반이 뒤쫓았으나 둘은 길르앗 산에서 언약을 맺고 헤어졌습니다.","고향으로 돌아가던 야곱은 에서가 사백 명을 거느리고 온다는 소식에 두려워 기도하고 많은 예물을 앞서 보냈습니다. 얍복 나루에서 홀로 남은 야곱은 어떤 사람과 날이 새도록 씨름하여 허벅지 관절이 어긋났고, 이스라엘이라는 새 이름을 받았습니다. 이튿날 에서는 달려와 야곱을 안고 입맞추며 함께 울었고, 야곱은 세겜에 이르러 제단을 쌓았습니다.","세겜이 디나를 욕되게 하자 야곱의 아들들은 할례를 조건으로 속인 뒤, 시므온과 레위가 성읍의 남자들을 죽이고 성을 노략했습니다. 하나님의 명령에 야곱은 이방 신상들을 버리고 벧엘로 올라가 제단을 쌓았고, 하나님은 다시 이스라엘이라는 이름과 땅과 자손의 복을 확인해 주셨습니다. 라헬은 베냐민을 낳다가 죽어 베들레헴 길에 장사되었고, 야곱의 열두 아들 명단 뒤에 이삭이 죽었습니다.","에서 곧 에돔의 아내들과 아들들, 그리고 그가 가나안을 떠나 세일 산으로 옮겨 간 일이 기록됩니다. 에서 자손의 족장들과 세일 땅의 원주민인 호리 족속의 족장들이 나열되고, 이스라엘에 왕이 있기 전에 에돔을 다스리던 왕들의 이름이 이어집니다.","야곱이 요셉을 더 사랑하여 채색옷을 지어 주고 요셉이 형들이 자기에게 절하는 꿈을 이야기하자, 형들은 그를 은 이십에 이스마엘 사람들에게 팔았습니다. 유다는 며느리 다말을 셀라에게 주지 않다가 창녀로 변장한 다말에게서 베레스와 세라를 얻었습니다. 애굽 보디발의 집에 팔려 간 요셉은 주인의 아내의 유혹을 물리쳤다가 누명을 쓰고 옥에 갇혔으나, 여호와께서 그와 함께하셨습니다."],["옥에서 요셉은 두 관원장의 꿈을 풀어 주었고 그대로 이루어졌지만, 복직한 술 맡은 관원장은 그를 잊었습니다. 만 이 년 뒤 바로가 살진 소와 파리한 소, 충실한 이삭과 마른 이삭의 꿈을 꾸자, 요셉은 칠 년 풍년과 칠 년 흉년이라고 풀고 대비책을 아뢰었습니다. 바로는 요셉을 애굽 온 땅의 총리로 세웠고, 요셉은 풍년에 곡식을 쌓아 두었다가 흉년이 들자 창고를 열었습니다.","기근 때 곡식을 사러 온 형들을 요셉은 알아보았으나 정탐꾼으로 몰아 시므온을 가두고 베냐민을 데려오게 했습니다. 다시 온 형들에게 잔치를 베푼 뒤 요셉은 베냐민의 자루에 은잔을 넣어 그를 붙잡으려 했고, 유다는 베냐민 대신 자기가 종이 되겠다고 간청했습니다. 마침내 요셉은 울며 자신을 밝히고, 하나님이 생명을 구원하시려고 자기를 먼저 보내셨다며 아버지를 모셔 오게 했습니다.","야곱은 브엘세바에서 두려워하지 말라는 약속을 받고 칠십 명의 가족과 함께 애굽으로 내려가 고센에서 요셉과 다시 만났습니다. 야곱은 바로를 축복했고, 요셉은 가족을 라암셋 땅에 살게 하며 봉양했습니다. 흉년이 심해지자 요셉은 곡식을 주고 애굽 백성의 돈과 가축과 토지를 사들여 바로의 소유로 삼았고, 야곱은 자기를 조상의 묘지에 장사하라고 맹세하게 했습니다.","병든 야곱은 요셉의 두 아들을 자기 아들로 삼고, 팔을 엇바꾸어 에브라임을 므낫세보다 앞세워 축복했습니다. 이어 열두 아들을 불러 각자의 앞날을 말하며 유다에게서 규가 떠나지 않으리라 축복했고, 막벨라 굴에 장사하라고 명한 뒤 숨을 거두었습니다. 아버지가 죽자 두려워하는 형들에게 요셉은 하나님이 악을 선으로 바꾸셨다며 위로했고, 자기 해골을 메고 올라가라 맹세시킨 뒤 백십 세에 죽었습니다.","요셉을 알지 못하는 새 왕이 번성하는 이스라엘 자손에게 고된 노동을 시키고 남자 아기를 죽이라 명했지만, 산파들은 하나님을 두려워하여 아기들을 살렸습니다. 레위 여자가 낳은 아기는 갈대 상자에 담겨 나일 강에 놓였다가 바로의 딸에게 건져져 모세라 불렸습니다. 장성한 모세는 애굽 사람을 죽이고 미디안으로 도망하여 십보라와 결혼했고, 하나님은 이스라엘의 부르짖음을 들으시고 언약을 기억하셨습니다.","호렙 산에서 양을 치던 모세에게 하나님이 타지 않는 떨기나무 불꽃 가운데 나타나, 백성의 고통을 보셨으니 그를 바로에게 보내 이스라엘을 인도해 내겠다고 하셨습니다. 하나님은 자기 이름을 \"스스로 있는 자\"라 알리시고 지팡이가 뱀이 되는 표적을 주셨습니다. 말을 못한다며 거절하는 모세에게 형 아론을 붙여 주셨고, 모세와 아론이 장로들에게 말씀을 전하자 백성이 믿고 경배했습니다.","모세와 아론이 바로에게 백성을 보내라 하자 바로는 여호와를 알지 못한다며 거절하고, 짚을 주지 않은 채 벽돌 수를 그대로 채우게 하여 노역을 더 무겁게 했습니다. 백성은 모세를 원망했고 모세도 여호와께 탄식했습니다. 하나님은 강한 손으로 그들을 속량하여 자기 백성으로 삼고 약속의 땅으로 인도하겠다고 다시 말씀하셨으며, 모세와 아론의 레위 족보가 소개됩니다."],["아론의 지팡이가 뱀이 되어 요술사들의 지팡이를 삼켰지만 바로의 마음은 완악했습니다. 이어 나일 강이 피로 변하고, 개구리와 이와 파리 떼가 애굽을 덮었으며, 가축의 돌림병과 악성 종기, 불덩이가 섞인 우박이 내렸습니다. 하나님은 고센 땅의 이스라엘을 구별하여 지키셨고, 바로는 재앙이 그칠 때마다 보내겠다고 하다가도 다시 마음을 완강하게 했습니다.","모세가 바로에게 다시 경고한 뒤 메뚜기 떼가 온 땅을 덮어 우박 뒤에 남은 채소와 나무 열매를 다 먹었습니다. 이어 사흘 동안 더듬을 만한 흑암이 애굽을 덮었지만 이스라엘 자손이 사는 곳에는 빛이 있었습니다. 바로는 가축을 두고 가라며 끝내 거절하고 모세를 쫓아냈고, 모세는 밤중에 애굽의 모든 처음 난 것이 죽으리라는 마지막 재앙을 선포했습니다.","하나님은 흠 없는 어린 양을 잡아 그 피를 문설주와 인방에 바르고 고기를 무교병과 쓴 나물과 함께 먹으라 하시며, 피를 보면 넘어가겠다고 하셨습니다. 그 밤에 애굽의 모든 처음 난 것이 죽자 바로는 이스라엘을 내보냈고, 육십만 장정이 라암셋을 떠났습니다. 하나님은 처음 난 것을 거룩히 구별하라 하셨고, 낮에는 구름 기둥, 밤에는 불 기둥으로 백성을 인도하셨습니다.","바로가 병거를 이끌고 뒤쫓아 오자 백성은 두려워 모세를 원망했지만, 모세는 가만히 서서 여호와의 구원을 보라고 했습니다. 모세가 바다 위로 손을 내밀자 바다가 갈라져 이스라엘은 마른 땅으로 건넜고, 뒤따르던 애굽 군대는 돌아온 물에 잠겼습니다. 모세와 미리암은 여호와를 찬양했고, 마라의 쓴 물이 나무로 달게 된 뒤 백성은 엘림에 이르렀습니다.","신 광야에서 백성이 배고프다고 원망하자, 하나님은 저녁에는 메추라기를, 아침에는 하늘에서 만나를 내려 주시고 여섯째 날에는 갑절을 거두어 안식일을 지키게 하셨습니다. 르비딤에서는 모세가 반석을 쳐서 물을 내었고, 아말렉과 싸울 때 모세가 손을 들면 이스라엘이 이겼습니다. 장인 이드로는 모세를 찾아와 하나님을 찬송하고, 천부장과 백부장 등을 세워 재판을 나누어 맡기라고 조언했습니다.","애굽을 떠난 지 삼 개월 만에 시내 광야에 이른 이스라엘에게 하나님은 언약을 지키면 그들이 제사장 나라와 거룩한 백성이 되리라 말씀하셨습니다. 백성은 몸을 성결하게 하고 기다렸고, 셋째 날 우레와 번개와 나팔 소리 가운데 여호와께서 시내 산에 강림하셨습니다. 하나님은 십계명을 주셨으며, 두려워 떠는 백성은 멀리 섰고 모세만 하나님이 계신 흑암으로 가까이 나아갔습니다.","하나님은 종의 해방, 상해와 배상에 관한 법규를 주시고, 나그네와 과부와 고아와 가난한 자를 압제하지 말라고 하셨습니다. 공정한 재판, 안식년과 안식일, 해마다 세 번 지킬 절기를 명하시고 사자를 앞서 보내 약속의 땅으로 인도하겠다고 약속하셨습니다. 모세는 언약서를 낭독하고 피를 백성에게 뿌려 언약을 세웠으며, 장로들과 하나님을 뵌 뒤 사십 일 동안 산에 머물렀습니다."],["하나님은 백성에게 기쁜 마음으로 예물을 가져오게 하시고, 자신이 그들 중에 거할 성소를 산에서 보여 준 양식대로 지으라고 하셨습니다. 증거판을 넣을 궤와 그 위의 속죄소, 진설병을 둘 상, 순금 등잔대를 만드는 법을 알려 주셨습니다. 이어 휘장과 널판으로 성막을 짓고 성소와 지성소를 휘장으로 구분하게 하셨으며, 놋 번제단과 성막 뜰, 꺼지지 않는 등불에 대해서도 지시하셨습니다.","하나님은 아론과 그의 아들들을 제사장으로 세우시고, 에봇과 흉패, 겉옷, 관 같은 거룩한 옷을 짓게 하셨습니다. 아론은 이스라엘 열두 아들의 이름을 새긴 보석을 어깨와 가슴에 달고, 이마에는 '여호와께 성결'이라 새긴 패를 달았습니다. 이어 물로 씻고 옷을 입히고 기름을 부어 이레 동안 위임식을 행하는 법과, 아침저녁으로 어린 양을 번제로 드리는 규례를 주셨습니다.","하나님은 아침저녁으로 향을 사를 금 분향단과, 스무 살 이상 된 사람이 생명의 속전으로 바칠 반 세겔, 제사장이 손발을 씻을 놋 물두멍을 만들게 하셨습니다. 거룩한 관유와 향을 만드는 법도 알려 주셨습니다. 하나님의 영으로 충만하게 한 브살렐과 오홀리압을 불러 성막의 모든 것을 만들게 하셨고, 안식일을 영원한 표징으로 지키라 하신 뒤 친히 쓰신 증거판 둘을 모세에게 주셨습니다.","모세가 더디 내려오자 백성은 아론에게 금송아지를 만들게 하고 그것을 자기들을 인도한 신이라 하며 섬겼습니다. 하나님이 진노하시자 모세는 간구했고, 내려와 돌판을 깨뜨리고 송아지를 부순 뒤 자기 이름을 책에서 지워 달라고까지 중보했습니다. 하나님은 함께 가시겠다고 약속하시고 자신의 이름과 성품을 선포하시며 언약을 다시 세우셨고, 사십 일 뒤 내려온 모세의 얼굴에는 광채가 났습니다.","모세가 안식일 규례와 성막을 지을 예물에 대해 전하자, 마음이 감동된 백성이 금과 은, 실과 가죽, 보석을 자원하여 가져왔고 남을 만큼 넘쳤습니다. 하나님의 영으로 충만한 브살렐과 오홀리압과 지혜로운 사람들이 성막의 휘장과 널판, 증거궤와 속죄소, 상과 등잔대, 분향단과 번제단, 물두멍과 뜰을 명령대로 만들었습니다. 쓰인 금과 은과 놋의 양도 기록됩니다.","백성은 아론의 거룩한 옷과 에봇, 흉패, '여호와께 성결'이라 새긴 패를 만들고, 성막의 모든 것을 여호와께서 명령하신 대로 마쳐 모세에게 가져왔으며 모세는 그들을 축복했습니다. 둘째 해 첫째 달 초하루에 모세는 성막을 세우고 기구들을 제자리에 두었습니다. 그러자 구름이 회막을 덮고 여호와의 영광이 성막에 충만했으며, 이스라엘은 구름이 떠오를 때마다 행진했습니다.","여호와께서 회막에서 모세를 부르시고 다섯 가지 제사를 알려 주셨습니다. 흠 없는 짐승을 온전히 태워 드리는 번제, 고운 가루에 기름과 유향을 더해 드리는 소제, 하나님과의 화목을 위한 화목제가 먼저 나옵니다. 이어 부지중에 지은 죄를 위한 속죄제와, 성물이나 이웃에게 끼친 손해를 오분의 일을 더해 갚고 드리는 속건제가 이어지며, 제단의 불을 꺼지지 않게 하라는 규례도 주어집니다."],["속건제와 화목제 규례, 기름과 피를 먹지 말라는 명령이 이어집니다. 모세는 온 회중 앞에서 아론과 아들들을 씻기고 옷을 입히고 기름을 부으며 이레 동안 위임식을 행했습니다. 여덟째 날 아론이 처음으로 제사를 드리자 여호와의 영광이 나타나고 불이 나와 제물을 살랐습니다. 그러나 아론의 아들 나답과 아비후는 명령하지 않은 다른 불로 분향하다가 여호와 앞에서 나온 불에 죽었습니다.","하나님은 먹을 수 있는 짐승과 먹지 못할 짐승을 나누어 주셨습니다. 굽이 갈라지고 새김질하는 짐승, 지느러미와 비늘 있는 물고기는 먹되, 그렇지 않은 것과 가증한 새와 기는 것은 먹지 말고 그 주검을 만지면 부정하다고 하셨습니다. 그 이유로 \"내가 거룩하니 너희도 거룩할지어다\"라고 말씀하셨고, 아이를 낳은 여인이 정결하게 되는 기한과 제사 규례도 주셨습니다.","제사장은 피부에 생긴 색점과 환부를 진찰하여 나병인지 아닌지를 가리고, 나병 환자는 부정하다고 외치며 진영 밖에서 혼자 살아야 했습니다. 옷과 가죽, 집 벽에 생긴 색점을 살피는 법도 나옵니다. 병이 나은 사람은 새 두 마리와 백향목, 홍색 실, 우슬초로 정결 예식을 치르고 제사를 드렸으며, 몸에서 나오는 유출로 부정해진 남녀를 정결하게 하는 규례도 이어집니다.","아론의 두 아들이 죽은 뒤, 하나님은 대제사장이 일 년에 한 번만 지성소에 들어가 속죄하는 대속죄일 규례를 주셨습니다. 아론은 자기와 집안을 위해 수송아지를, 백성을 위해 염소를 드려 그 피를 속죄소에 뿌렸고, 다른 염소의 머리에 안수하여 백성의 모든 죄를 아뢴 뒤 아사셀을 위해 광야로 보냈습니다. 또 제물은 회막 문에서 드리고, 생명이 피에 있으니 피를 먹지 말라 하셨습니다.","하나님은 이스라엘에게 애굽과 가나안의 풍속을 따르지 말라고 하시며 가까운 친척 사이의 성관계, 몰렉 숭배 같은 가증한 일을 금하십니다. 19장은 \"너희는 거룩하라\"고 명하며 부모 공경, 가난한 자를 위한 이삭 남기기, 공정한 재판과 저울, 이웃과 거류민을 자기같이 사랑할 것을 가르칩니다. 20장은 이런 죄들에 대한 형벌을 정합니다.","제사장은 시체를 가까이하여 몸을 더럽히지 말고 결혼에서도 거룩함을 지켜야 하며, 대제사장에게는 더 엄격한 규례가 주어집니다. 몸에 흠이 있는 아론의 자손은 제단에 나아가 음식을 드리지 못합니다. 성물은 정결한 사람만 먹을 수 있고, 하나님께 드리는 제물은 흠 없는 것이어야 합니다.","하나님은 안식일과 유월절, 무교절, 첫 이삭 단을 흔드는 날, 오십 일 뒤의 절기, 나팔절, 속죄일, 초막절 등 여호와의 절기들을 정해 주십니다. 성소의 등잔불을 항상 켜 두고 안식일마다 떡 열두 개를 상 위에 진설하라고 하십니다. 진영에서 싸우다 여호와의 이름을 모독한 사람은 진영 밖에서 돌에 맞아 죽습니다."],["일곱째 해마다 땅을 쉬게 하는 안식년과, 오십 년째 해에 자유를 공포하고 판 땅과 팔린 사람이 돌아가게 하는 희년이 주어집니다. 가난한 형제의 땅과 몸은 가까운 친족이 무를 수 있습니다. 26장은 순종하면 받을 복과 불순종하면 받을 재앙을 말하고, 27장은 서원한 것과 십일조를 무르는 규례로 마칩니다.","출애굽 둘째 해에 하나님은 시내 광야에서 이십 세 이상으로 싸움에 나갈 만한 남자를 지파별로 계수하게 하시니, 모두 육십만 삼천오백오십 명이었습니다. 레위인은 계수에서 빠지고 성막을 맡아 그 사방에 진을 칩니다. 열두 지파는 회막을 중심으로 동서남북에 세 지파씩 진을 치고, 유다 진영이 맨 앞에서 행진합니다.","레위인은 이스라엘의 모든 맏아들을 대신하여 하나님의 것으로 구별되고, 제사장 아론과 그 아들들을 도와 회막에서 섬깁니다. 게르손, 고핫, 므라리 자손이 각각 성막의 휘장, 거룩한 기구, 널판과 기둥을 맡고 성막 서쪽, 남쪽, 북쪽에 진을 칩니다. 레위인보다 많은 맏아들 이백칠십삼 명은 속전을 내고, 삼십 세부터 오십 세까지 일할 레위인을 계수합니다.","부정한 사람은 진영 밖으로 내보내고, 남에게 죄를 지은 사람은 자복하고 오분의 일을 더해 갚아야 합니다. 아내의 부정을 의심할 때 쓴 물로 가리는 의심의 법이 주어집니다. 6장은 나실인이 포도주를 멀리하고 머리를 깎지 않으며 시체를 가까이하지 않는 서원의 법을 정하고, 아론이 백성에게 할 축복의 말씀으로 마칩니다.","성막을 세우고 기름을 바른 날, 이스라엘 지휘관들이 수레와 소를 드려 레위인의 운반 일에 쓰게 합니다. 열두 지파의 지휘관이 열두 날 동안 하루 한 사람씩 똑같은 은반, 은 바리, 금 그릇과 제물을 제단 봉헌물로 드립니다. 모세는 속죄소 위 두 그룹 사이에서 말씀하시는 하나님의 음성을 듣고, 레위인은 정결하게 되어 요제로 드려진 뒤 회막에서 봉사합니다.","이스라엘은 시내 광야에서 유월절을 지키고, 시체로 부정해졌거나 먼 길에 있던 사람은 둘째 달에 지키도록 허락받습니다. 구름이 성막 위에 머물면 진을 치고 떠오르면 행진했으며, 은 나팔 둘로 회중을 모으고 진영을 출발시킵니다. 둘째 해 둘째 달 스무날 구름이 떠오르자 백성은 지파별 순서대로 시내 광야를 떠나 바란 광야로 행진합니다.","백성이 원망하자 여호와의 불이 진영 끝을 사르고, 고기를 달라고 울자 하나님은 메추라기를 보내시지만 탐욕을 낸 자들을 재앙으로 치십니다. 모세를 비방한 미리암은 나병에 걸려 이레 동안 진영 밖에 갇힙니다. 가나안을 정탐한 열두 명 중 열 명이 악평하자 백성은 애굽으로 돌아가자고 하고, 여호수아와 갈렙 외에 이십 세 이상은 사십 년 동안 광야에서 죽게 됩니다."],["제사의 규례와 모르고 지은 죄를 속하는 법이 주어지고, 안식일에 나무하던 사람은 돌에 맞아 죽습니다. 고라와 다단, 아비람이 이백오십 명과 함께 모세와 아론을 거스르자 땅이 갈라져 그들을 삼키고 불이 분향하던 자들을 사릅니다. 염병이 퍼지자 아론이 향로를 들고 죽은 자와 산 자 사이에 서서 속죄하고, 아론의 지팡이에만 싹이 나 살구 열매가 열립니다.","아론과 그 아들들은 성소와 제사장 직분의 책임을 지고, 레위인은 그들을 도와 회막에서 봉사합니다. 제사장에게는 거제물과 처음 익은 열매가 몫으로 주어지고, 땅의 기업 대신 하나님이 그들의 분깃이 되시며, 레위인은 십일조를 받고 그 십일조의 십일조를 드립니다. 19장은 흠 없는 붉은 암송아지를 진영 밖에서 불사른 재로 시체 때문에 부정해진 사람을 정결하게 하는 법을 정합니다.","미리암이 가데스에서 죽고, 물이 없다고 다투는 백성 앞에서 모세는 반석에 명령하는 대신 지팡이로 두 번 쳐서 가나안에 들어가지 못하게 됩니다. 에돔은 길을 내주지 않고, 아론은 호르 산에서 죽습니다. 원망하던 백성이 불뱀에 물리자 모세가 놋뱀을 장대에 달았고, 쳐다본 사람은 살았습니다. 이스라엘은 시혼과 옥을 물리칩니다.","모압 왕 발락은 발람을 불러 이스라엘을 저주하게 합니다. 길을 가던 발람은 칼을 든 여호와의 사자를 본 나귀가 말을 하는 일을 겪고, 하나님이 주신 말씀만 전합니다. 발람은 세 번 저주 대신 축복하고 야곱에게서 한 별이 나올 것을 예언합니다. 그러나 싯딤에서 백성이 바알브올을 섬기자 염병이 돌고, 비느하스의 열심으로 염병이 그칩니다.","염병 후 모압 평지에서 이십 세 이상 남자를 다시 계수하니 육십만 천칠백삼십 명이었고, 처음 계수된 사람 중에는 갈렙과 여호수아만 남았습니다. 아들 없이 죽은 슬로브핫의 딸들이 기업을 요청하자 하나님은 딸도 기업을 이을 수 있게 하십니다. 모세는 여호수아를 후계자로 세우고, 하나님은 날마다 드릴 상번제와 안식일, 초하루, 절기의 제물과 서원에 대한 규례를 주십니다.","이스라엘은 각 지파에서 천 명씩 보내 미디안을 치고, 발람도 칼로 죽입니다. 전리품은 군인과 회중이 절반씩 나누고 일부를 여호와께 드립니다. 르우벤과 갓 자손은 요단 동쪽 땅을 달라고 하고, 형제들과 함께 요단을 건너 싸우겠다고 약속한 뒤 그 땅을 받습니다. 33장은 라암셋부터 모압 평지까지 광야의 노정을 기록하고, 가나안 원주민과 우상을 몰아내라고 명합니다.","하나님은 가나안 땅의 사방 경계를 정하시고 엘르아살과 여호수아, 각 지파 지휘관에게 땅을 나누게 하십니다. 레위인에게는 마흔여덟 성읍을 주고, 그중 여섯은 모르고 사람을 죽인 자가 피할 도피성으로 삼되 대제사장이 죽은 후에야 고향으로 돌아갈 수 있게 합니다. 슬로브핫의 딸들은 기업이 다른 지파로 넘어가지 않도록 같은 지파 사람과 결혼합니다."],["광야 사십 년째 해, 모세는 모압 땅에서 지난 여정을 되돌아봅니다. 호렙을 떠나 가데스 바네아에서 정탐꾼의 보고를 듣고 믿지 않아 광야를 떠돈 일, 세일의 에서 자손과 모압과 암몬을 지나고 시혼과 옥을 물리친 일을 이야기합니다. 모세는 요단을 건너지 못하게 되고, 형상 없이 음성으로만 말씀하신 하나님을 기억하여 우상을 만들지 말고 율법을 지키라고 당부하며 요단 동쪽에 도피성 세 곳을 구별합니다.","모세는 호렙 산에서 받은 십계명을 다시 들려주며, 백성이 두려워하여 모세가 하나님과 그들 사이에서 말씀을 전했던 일을 상기시킵니다. \"너는 마음을 다하고 뜻을 다하고 힘을 다하여 네 하나님 여호와를 사랑하라\"는 말씀을 마음에 새기고 자녀에게 가르치라고 합니다. 가나안 족속과 언약하지 말라고 하며, 광야에서 만나를 먹이신 하나님을 잊지 말고 풍요 속에서 교만하지 말라고 경고합니다.","모세는 이스라엘이 땅을 얻는 것이 그들의 의로움 때문이 아니라 가나안 민족들의 악함과 조상들에게 하신 맹세 때문이라고 말합니다. 호렙에서 금송아지를 만든 일과 모세가 사십 주야를 엎드려 중보한 일, 다시 받은 두 돌판을 궤에 넣은 일을 회고합니다. 마음에 할례를 행하고 하나님을 사랑하여 섬기라 하며, 그리심 산과 에발 산에서 복과 저주를 선포하라고 명합니다.","가나안 족속의 예배 처소를 모두 헐고, 하나님이 자기 이름을 두시려고 택하실 곳에서만 제물과 십일조를 드리며 가족과 레위인과 함께 즐거워하라고 합니다. 고기는 각 성에서 먹을 수 있지만 피는 먹지 말아야 합니다. 다른 신을 섬기자고 꾀는 자는 선지자든 가족이든 용납하지 말고, 정한 짐승과 부정한 짐승을 구별하며 십일조로 레위인과 가난한 이웃을 돌보라고 명합니다.","매 칠 년 끝에는 이웃의 빚을 면제하고, 가난한 형제에게 손을 펴서 넉넉히 꾸어 주라고 합니다. 여섯 해를 섬긴 히브리 종은 일곱째 해에 빈손이 아니게 후히 주어 자유롭게 보내야 합니다. 16장은 유월절과 무교절, 칠칠절, 초막절을 하나님이 택하신 곳에서 지키고 레위인과 객과 고아와 과부와 함께 즐거워하라고 하며, 재판장은 뇌물을 받지 말고 공의로 재판해야 한다고 말합니다.","다른 신을 섬긴 자는 두세 증인의 증언으로 처벌하고, 어려운 재판은 하나님이 택하신 곳의 제사장과 재판장에게 맡깁니다. 왕을 세우려면 하나님이 택하신 형제 중에서 세우되, 병마와 아내와 은금을 많이 두지 말고 율법서를 곁에 두고 평생 읽어야 합니다. 레위인의 몫을 정하고 점쟁이와 무당을 금하며, 하나님은 모세와 같은 선지자 하나를 일으켜 그 입에 말씀을 두시겠다고 약속하십니다.","모르고 사람을 죽인 자를 위한 도피성 세 곳을 구별하되, 미워하여 죽인 자는 보복자에게 넘기라고 합니다. 두세 증인으로 사건을 확정하고 위증자는 꾀한 대로 벌을 받습니다. 전쟁에 나갈 때 두려워하지 말고 성읍에 먼저 화평을 선언하라고 하며, 범인을 모르는 살인, 장자의 권리, 패역한 아들, 나무에 달린 시체에 대한 규례가 이어집니다."],["이웃의 길 잃은 짐승이나 넘어진 짐승을 못 본 체하지 말고 돌보라고 합니다. 새 집 지붕에 난간을 만들고, 섞어 뿌리거나 섞어 짜는 것을 금하며, 결혼과 정절, 간음에 대한 규례를 정합니다. 23장은 여호와의 총회에 들어올 수 있는 사람, 진영을 거룩하게 지키는 법, 도망한 종을 돌려보내지 말 것, 형제에게 이자를 받지 말 것, 서원을 지체 없이 갚을 것을 말합니다.","이혼과 재혼, 전당물과 품삯에 대한 규례가 주어지고, 가난한 이웃의 옷은 해 질 때 돌려주며 추수 때 남은 것은 나그네와 고아와 과부를 위해 남겨 두라고 합니다. 형이 아들 없이 죽으면 동생이 이름을 잇게 하고, 공정한 저울추를 쓰라고 합니다. 백성은 첫 열매를 바치며 애굽에서 건지신 하나님을 고백하고, 하나님은 그들을 보배로운 백성으로 삼으십니다.","모세는 요단을 건너면 에발 산에 큰 돌들을 세워 율법을 기록하고 다듬지 않은 돌로 제단을 쌓으라고 명합니다. 여섯 지파는 그리심 산에서 축복하고 여섯 지파는 에발 산에서 저주하며, 레위인이 선포하는 열두 가지 저주에 백성은 아멘으로 응답합니다. 28장은 말씀에 순종하면 성읍과 들, 자녀와 소산에 복을 받고, 불순종하면 질병과 패배와 포위와 흩어짐의 저주를 받는다고 길게 말합니다.","모세는 모압 땅에서 언약을 다시 세웁니다. 다른 신을 따르면 땅이 소돔과 고모라처럼 되겠지만, 흩어진 곳에서 돌아오면 하나님이 다시 모으시고 마음에 할례를 베푸실 것이라 약속합니다. 모세는 생명과 사망을 앞에 두고 생명을 택하라 하며, 여호수아에게 강하고 담대하라고 격려한 뒤 율법책을 언약궤 곁에 두게 하고 노래를 가르칩니다.","모세는 반석이신 하나님의 신실하심과 그를 버린 백성의 배반, 그리고 결국 자기 백성을 불쌍히 여기실 하나님을 노래합니다. 하나님은 모세에게 느보 산에 올라 가나안을 바라보게 하시고, 모세는 죽기 전 이스라엘 각 지파를 축복합니다. 모세는 백이십 세에 모압 땅에서 죽고, 지혜의 영이 충만한 여호수아가 뒤를 이으며, 그 후 모세와 같은 선지자는 일어나지 않았습니다.","모세가 죽은 후 하나님은 여호수아에게 강하고 담대하라 하시며 율법책을 주야로 묵상하고 지키라고 명하십니다. 여리고에 들어간 두 정탐꾼은 기생 라합의 집에 숨고, 라합은 여호와가 하늘과 땅의 하나님이심을 고백하며 가족의 생명을 부탁해 창문에 붉은 줄을 맵니다. 언약궤를 멘 제사장들의 발이 요단 물에 닿자 물이 끊어지고, 온 백성이 마른 땅으로 건넙니다.","열두 지파에서 한 사람씩 요단 가운데서 돌 열둘을 가져와 길갈에 세우고, 자손들에게 하나님이 요단을 마르게 하신 일을 알려 주게 합니다. 광야에서 태어난 남자들은 길갈에서 할례를 받고, 하나님은 애굽의 수치를 떠나가게 하셨습니다. 백성은 유월절을 지키고 그 땅의 소산을 먹으며 만나가 그칩니다. 여호수아는 칼을 든 여호와의 군대 대장을 만나 신을 벗습니다."],["이스라엘은 언약궤를 앞세우고 엿새 동안 여리고 성을 하루 한 번씩 돌고, 일곱째 날 일곱 번 돈 뒤 나팔 소리에 외치자 성벽이 무너집니다. 라합과 그 가족은 약속대로 구원을 받습니다. 그러나 아간이 바친 물건을 몰래 취하여 이스라엘은 아이 성에서 패하고, 아간은 아골 골짜기에서 처벌됩니다. 이후 복병 작전으로 아이를 점령하고, 여호수아는 에발 산에 제단을 쌓아 율법을 낭독합니다.","기브온 주민들은 먼 나라에서 온 것처럼 속여 이스라엘과 조약을 맺고, 하나님께 묻지 않은 이스라엘은 그들을 나무 패고 물 긷는 자로 삼습니다. 기브온을 치러 온 아모리 다섯 왕을 여호수아가 물리칠 때 하나님은 우박을 내리시고, 여호수아의 기도에 태양과 달이 멈춥니다. 남쪽과 북쪽의 왕들을 차례로 정복하여 땅에 전쟁이 그치고, 12장은 정복한 서른한 왕의 목록을 기록합니다.","늙은 여호수아에게 하나님은 아직 얻을 땅이 많다고 하시며 땅을 분배하라고 명하십니다. 요단 동쪽은 모세가 이미 르우벤과 갓과 므낫세 반 지파에게 주었고, 레위 지파는 여호와가 기업이 되십니다. 팔십오 세의 갈렙은 여호와를 온전히 따른 대로 헤브론 산지를 요구하여 받습니다. 15장은 유다 지파의 경계와 성읍을 기록하며, 유다가 예루살렘의 여부스 족속을 쫓아내지 못했다고 말합니다.","에브라임과 므낫세가 기업을 받고, 슬로브핫의 딸들도 약속대로 땅을 받습니다. 땅이 좁다는 요셉 자손에게 여호수아는 삼림을 개척하라고 합니다. 온 회중은 실로에 회막을 세우고, 여호수아는 남은 일곱 지파를 위해 땅을 그려 오게 한 뒤 여호와 앞에서 제비를 뽑아 나누어 줍니다. 마지막으로 여호수아도 딤낫 세라를 기업으로 받습니다.","하나님은 실수로 사람을 죽인 자가 피의 보복자를 피해 도망할 도피성으로 게데스, 세겜, 헤브론, 베셀, 길르앗 라못, 골란을 정하게 하셨습니다. 땅을 기업으로 받지 않은 레위 사람들은 각 지파 가운데서 목초지와 함께 모두 마흔여덟 성읍을 받았고, 여호와께서 하신 선한 말씀은 하나도 남김없이 다 이루어졌습니다.","요단 동쪽 지파들이 돌아가 요단 가에 큰 제단을 쌓자 온 이스라엘이 싸우려 했지만, 그것이 같은 하나님을 섬긴다는 증거의 제단임을 듣고 화해했습니다. 늙은 여호수아는 백성에게 율법을 지키고 다른 신을 섬기지 말라고 당부하고, 세겜에서 언약을 새롭게 맺은 뒤 백십 세에 죽었습니다.","여호수아가 죽은 뒤 유다 지파가 먼저 올라가 가나안 족속과 싸웠지만, 여러 지파가 그 땅 주민을 다 쫓아내지 못하고 함께 살았습니다. 여호와의 사자는 보김에서 언약을 어긴 백성을 꾸짖었습니다. 여호와를 알지 못하는 새 세대는 바알을 섬기다 압제를 당하고, 하나님이 사사를 세워 구원하시면 또다시 타락하는 일이 되풀이되었습니다."],["하나님은 남겨 두신 이방 민족들로 이스라엘을 시험하셨지만, 백성은 그들과 혼인하며 그들의 신을 섬겼습니다. 이스라엘이 부르짖자 하나님은 옷니엘을 세워 구산 리사다임을 이기게 하셨고, 왼손잡이 에훗을 세워 모압 왕 에글론을 죽이고 모압을 굴복시키게 하셨습니다. 그 뒤 삼갈도 블레셋 사람 육백 명을 죽였습니다.","가나안 왕 야빈이 이십 년 동안 이스라엘을 괴롭히자, 여선지자 드보라가 바락을 불러 다볼 산으로 나가게 했습니다. 여호와께서 시스라의 군대를 혼란에 빠뜨리셨고, 걸어서 도망한 시스라는 겐 사람 헤벨의 아내 야엘의 장막에서 죽임을 당했습니다. 드보라와 바락은 승리를 주신 여호와를 노래했고 그 땅은 사십 년 동안 평온했습니다.","미디안의 압제 아래 숨어서 밀을 타작하던 기드온에게 여호와의 사자가 나타나 이스라엘을 구원하라고 부르셨습니다. 기드온은 바알의 제단을 헐고 양털 표징을 구한 뒤, 하나님이 줄이신 삼백 명과 함께 나팔과 항아리와 횃불로 미디안을 무찔렀습니다. 그는 왕이 되기를 거절했지만 금으로 만든 에봇이 이스라엘에 올무가 되었고, 그가 죽자 백성은 다시 바알을 따랐습니다.","여룹바알(기드온)의 첩의 아들 아비멜렉은 세겜 사람들의 도움으로 형제 칠십 명을 죽이고 왕이 되었습니다. 살아남은 요담은 그리심 산에서 가시나무 비유로 그들을 꾸짖었습니다. 삼 년 뒤 세겜 사람들이 배반하자 아비멜렉은 세겜을 멸했지만, 데베스에서 한 여인이 던진 맷돌에 맞아 죽었고, 하나님은 그들의 악을 그대로 갚으셨습니다.","이스라엘이 또 우상을 섬기자 하나님은 블레셋과 암몬의 손에 그들을 넘기셨고, 백성은 이방 신들을 버리고 부르짖었습니다. 쫓겨났던 기생의 아들 입다가 길르앗의 머리가 되어 암몬을 물리쳤지만, 경솔한 서원 때문에 외동딸을 잃었습니다. 이어 에브라임과 싸워 '쉽볼렛'을 발음하지 못하는 자들을 죽였고, 입산, 엘론, 압돈이 차례로 사사가 되었습니다.","여호와의 사자가 마노아의 아내에게 나타나 나실인으로 바쳐질 아들을 약속했고, 그렇게 태어난 삼손에게 여호와의 영이 임했습니다. 삼손은 블레셋 여자와 혼인하려다 다툼이 생겨 여우와 나귀 턱뼈로 블레셋을 쳤습니다. 들릴라에게 힘의 비밀을 털어놓아 머리털이 밀리고 눈이 뽑혔지만, 마지막에 하나님께 부르짖어 다곤 신전을 무너뜨리고 블레셋 사람들과 함께 죽었습니다.","에브라임 산지의 미가는 어머니의 은으로 신상을 만들고 떠돌던 레위 청년을 자기 집 제사장으로 삼았습니다. 살 땅을 찾던 단 지파는 정탐꾼을 보낸 뒤 미가의 신상과 제사장을 빼앗아 갔고, 평화롭게 살던 라이스를 쳐서 단이라 부르며 그 신상을 세웠습니다. 그 때에는 왕이 없어 사람마다 자기 소견에 옳은 대로 행했습니다."],["한 레위 사람의 첩이 베냐민 땅 기브아에서 불량배들에게 능욕당해 죽자, 그는 시체를 열두 덩이로 나누어 이스라엘 사방에 보냈습니다. 온 이스라엘이 모여 베냐민과 싸웠고 두 번 패한 뒤 베냐민을 거의 멸절했습니다. 남은 육백 명에게 아내를 얻게 하려고 야베스 길르앗을 치고 실로의 여자들을 붙들게 했으며, 사람이 각기 자기의 소견에 옳은 대로 행했습니다.","흉년에 모압으로 갔던 나오미는 남편과 두 아들을 잃고, 끝까지 따라온 모압 며느리 룻과 함께 베들레헴으로 돌아왔습니다. 룻은 이삭을 줍다가 엘리멜렉의 친족 보아스의 밭에 이르러 그의 친절을 입었고, 나오미의 권유로 타작 마당에서 기업 무를 자가 되어 달라고 청했습니다. 보아스는 성문에서 법대로 기업을 무르고 룻과 결혼했고, 그들이 낳은 오벳은 다윗의 할아버지가 되었습니다.","자식이 없어 괴로워하던 한나는 실로에서 아들을 주시면 평생 여호와께 드리겠다고 서원했고, 사무엘을 낳아 젖을 뗀 뒤 엘리에게 맡겼습니다. 한나는 낮은 자를 높이시는 여호와를 찬양했습니다. 엘리의 아들들은 제물을 멸시하는 죄를 지었고, 하나님의 사람은 엘리의 집에 내릴 심판과 충실한 제사장을 세우실 것을 전했습니다.","여호와께서 어린 사무엘을 부르셔서 엘리 집의 심판을 알리셨습니다. 이스라엘은 블레셋에게 패해 언약궤를 빼앗기고 홉니와 비느하스, 엘리가 죽었지만, 궤 앞에서 다곤이 엎드러지고 재앙이 내리자 블레셋은 궤를 돌려보냈습니다. 백성이 미스바에서 회개하자 하나님은 블레셋을 물리치셨고, 사무엘은 \"여호와께서 여기까지 우리를 도우셨다\" 하며 에벤에셀 돌을 세웠습니다.","사무엘의 아들들이 뇌물을 받자 장로들은 다른 나라들처럼 왕을 세워 달라고 요구했고, 하나님은 그것이 자신을 버린 것이라 하시면서도 허락하셨습니다. 잃은 암나귀를 찾던 베냐민 사람 사울은 사무엘을 만나 기름 부음을 받았고, 하나님의 영이 임해 예언했습니다. 미스바에서 제비로 뽑힌 사울은 짐보따리 사이에 숨어 있다가 나와 왕으로 세워졌습니다.","암몬 사람 나하스가 길르앗 야베스를 위협하자, 하나님의 영에 감동된 사울이 이스라엘을 모아 암몬을 물리쳤고 백성은 길갈에서 그를 왕으로 세웠습니다. 사무엘은 자신의 깨끗한 삶을 증언하게 한 뒤, 왕을 구한 것이 큰 죄임을 우레와 비로 보여 주었습니다. 그러면서도 마음을 다해 여호와를 섬기라고 권하고, 그들을 위해 기도하기를 쉬지 않겠다고 말했습니다.","블레셋이 대군으로 몰려오자 사울은 사무엘을 기다리지 못하고 직접 번제를 드렸고, 사무엘은 그의 나라가 길지 못할 것이라고 선언했습니다. 요나단은 무기 든 소년과 함께 블레셋 부대로 올라가 그들을 쳤고, 하나님이 이스라엘을 구원하셨습니다. 사울의 경솔한 맹세 때문에 꿀을 맛본 요나단이 죽을 뻔했으나 백성이 그를 구했습니다."],["사울은 아말렉을 진멸하라는 명령을 받고도 아각 왕과 좋은 양과 소를 남겼고, 사무엘은 순종이 제사보다 낫다고 하며 하나님이 사울을 버리셨다고 선언했습니다. 하나님은 사무엘을 베들레헴 이새의 집으로 보내셨고, \"사람은 외모를 보거니와 나 여호와는 중심을 보느니라\" 하시며 양을 치던 막내 다윗에게 기름을 붓게 하셨습니다. 여호와의 영이 사울을 떠나자 다윗이 수금을 타며 사울을 섬기게 되었습니다.","블레셋 장수 골리앗이 사십 일 동안 이스라엘을 모욕하자, 형들에게 음식을 가져온 소년 다윗이 나섰습니다. 그는 사울의 갑옷을 벗고 물매와 돌 다섯 개를 들고 만군의 여호와의 이름으로 나아가 골리앗을 쓰러뜨렸습니다. 요나단은 다윗과 언약을 맺었지만, 여인들의 노래를 들은 사울은 다윗을 시기하여 창을 던지고 블레셋의 손에 죽게 하려 했습니다.","사울이 다윗을 죽이려 하자 요나단이 말렸지만, 사울은 다시 창을 던졌고 미갈은 다윗을 창문으로 달아 내려 피하게 했습니다. 라마 나욧으로 다윗을 잡으러 간 사울과 전령들은 하나님의 영이 임해 예언했습니다. 요나단은 화살 신호로 아버지의 뜻을 알리고 다윗과 눈물로 헤어졌으며, 다윗은 놉의 제사장 아히멜렉에게서 거룩한 떡과 골리앗의 칼을 받고 가드 왕 아기스 앞에서 미친 체했습니다.","다윗이 아둘람 굴로 피하자 환난 당한 자와 빚진 자와 원통한 자 사백 명가량이 그에게 모였습니다. 사울은 다윗을 도왔다는 이유로 에돔 사람 도엑을 시켜 놉의 제사장 팔십오 명과 성읍 사람들을 죽였고, 살아남은 아비아달은 다윗에게로 피했습니다. 다윗은 하나님께 물어 그일라를 블레셋에게서 구했고, 사울에게 쫓기는 중에도 요나단이 찾아와 하나님을 의지하게 했습니다.","엔게디 굴에서 사울을 죽일 기회가 왔지만 다윗은 여호와의 기름 부음 받은 자를 해할 수 없다며 옷자락만 베었고, 사울은 울며 다윗이 더 의롭다고 인정했습니다. 사무엘이 죽은 뒤, 다윗은 자신을 모욕한 나발에게 복수하러 가다가 아비가일의 지혜로운 간청을 듣고 멈추었고, 하나님이 나발을 치셨습니다. 십 광야에서 다윗은 다시 잠든 사울의 창과 물병만 가져오며 그를 살려 주었습니다.","사울을 피해 블레셋 땅으로 간 다윗은 가드 왕 아기스에게서 시글락을 받아 일 년 사 개월을 지냈습니다. 블레셋이 쳐들어오자 하나님께 대답을 얻지 못한 사울은 변장하고 엔돌의 신접한 여인을 찾아가 사무엘을 불러 올리게 했고, 내일 그와 아들들이 죽을 것이라는 말을 들었습니다. 한편 블레셋 방백들이 의심하여 다윗은 전쟁에 나가지 않고 돌아가게 되었습니다.","아말렉이 시글락을 불사르고 가족들을 끌고 가자, 다윗은 여호와를 힘입어 추격해 모든 것을 되찾고 뒤에 남았던 사람들과도 똑같이 나누었습니다. 그 무렵 사울과 요나단을 비롯한 세 아들이 길보아 산에서 블레셋에게 죽었고, 길르앗 야베스 사람들이 시체를 거두어 장사했습니다. 다윗은 사울을 죽였다는 아말렉 청년을 처형하고, 사울과 요나단을 위해 슬픈 노래를 지었습니다."],["다윗은 하나님께 여쭈어 헤브론으로 올라가 유다의 왕이 되었고, 아브넬은 사울의 아들 이스보셋을 이스라엘의 왕으로 세웠습니다. 두 집안의 오랜 싸움 속에 다윗은 점점 강해졌고, 이스보셋과 사이가 틀어진 아브넬이 다윗에게 넘어오려 했지만 요압이 동생의 원수를 갚는다며 그를 죽이자 다윗은 아브넬을 애도했습니다. 이스보셋도 부하들에게 살해되자, 다윗은 그 머리를 가져온 자들을 벌했습니다.","이스라엘 모든 지파가 헤브론에서 다윗에게 기름을 부어 왕으로 세웠고, 다윗은 여부스 사람의 시온 산성을 빼앗아 다윗 성이라 불렀으며 블레셋도 물리쳤습니다. 언약궤를 옮기다 웃사가 죽는 일이 있었지만, 다윗은 다시 궤를 메어 오며 여호와 앞에서 힘을 다해 춤추었습니다. 하나님의 집을 지으려는 다윗에게 하나님은 나단을 통해 오히려 다윗의 집과 왕위를 영원히 견고하게 하겠다고 약속하셨습니다.","다윗은 블레셋, 모압, 아람, 에돔 등 주변 나라들을 쳐서 이겼고, 얻은 은금을 여호와께 드리며 모든 백성에게 정의와 공의를 행했습니다. 다윗은 요나단을 생각하여 사울의 집에 남은 사람을 찾았고, 두 발을 저는 요나단의 아들 므비보셋을 불러 사울의 밭을 모두 돌려주었습니다. 므비보셋은 왕자 중 하나처럼 늘 왕의 상에서 먹었습니다.","다윗의 조문 사절을 모욕한 암몬이 아람과 연합했지만 요압과 다윗에게 패했습니다. 전쟁 중에 예루살렘에 머물던 다윗은 우리아의 아내 밧세바와 동침했고, 그녀가 임신하자 우리아를 싸움터 앞에 세워 죽게 했습니다. 나단이 가난한 사람의 양 비유로 \"당신이 그 사람이라\" 하고 꾸짖자 다윗은 죄를 고백했고, 아이는 죽었지만 이후 솔로몬이 태어났습니다.","다윗의 아들 암논이 이복누이 다말을 욕보이고 내쫓자, 다말의 오라버니 압살롬은 두 해를 참았다가 양 털 깎는 잔치에서 암논을 죽이고 그술로 도망했습니다. 삼 년 뒤 요압은 드고아의 지혜로운 여인을 보내 다윗의 마음을 움직였고, 압살롬은 예루살렘으로 돌아왔습니다. 그러나 두 해 동안 왕의 얼굴을 보지 못하던 압살롬은 요압의 밭에 불을 질러 결국 왕을 만나 입맞춤을 받았습니다.","압살롬은 성문에서 백성의 마음을 훔친 뒤 헤브론에서 반역을 일으켰고, 다윗은 예루살렘을 떠나 기드론 시내를 건너 감람 산 길을 울며 올라갔습니다. 도중에 시므이가 저주했지만 다윗은 참았고, 후새를 보내 아히도벨의 계략을 무너뜨리게 했습니다. 에브라임 수풀 전투에서 압살롬은 머리가 상수리나무에 걸렸다가 요압에게 죽임을 당했고, 소식을 들은 다윗은 \"내 아들 압살롬아\" 하며 통곡했습니다.","압살롬의 죽음을 슬퍼하던 다윗은 요압의 책망을 듣고 백성 앞에 나섰고, 유다 사람들의 환영을 받으며 요단을 건너 돌아왔습니다. 돌아오는 길에 자신을 저주했던 시므이를 살려 주고, 모함당한 므비보셋의 말을 들었으며, 늙은 바르실래에게 복을 빌었습니다. 이어 세바가 반란을 일으켰지만, 아마사를 죽인 요압이 아벨의 지혜로운 여인의 도움으로 반란을 끝냈습니다."],["사울이 기브온 사람을 죽인 죄로 기근이 들자 다윗은 사울의 자손 일곱을 기브온 사람에게 넘겼고, 사울과 요나단의 뼈를 거두어 장사했습니다. 다윗은 원수들에게서 건지신 여호와를 나의 반석이요 요새요 구원자라 노래하며 마지막 말을 남겼고, 그의 용사들의 이름이 소개됩니다. 다윗이 인구를 조사하는 죄를 지어 전염병이 내렸으나, 아라우나의 타작 마당을 값을 주고 사서 제단을 쌓자 재앙이 그쳤습니다.","다윗이 늙자 아도니야가 스스로 왕이 되려 했고, 나단과 밧세바가 다윗에게 약속을 일깨우자 다윗은 솔로몬을 자기 노새에 태워 기혼에서 기름을 부어 왕으로 세웠습니다. 다윗은 솔로몬에게 여호와의 율법을 지켜 행하라고 당부한 뒤 죽었습니다. 솔로몬은 아비삭을 청한 아도니야와 요압, 시므이를 처단하고 아비아달을 쫓아냈으며, 나라가 솔로몬의 손에 견고해졌습니다.","기브온에서 일천 번제를 드린 솔로몬에게 하나님이 꿈에 나타나셨고, 백성을 재판할 듣는 마음을 구한 솔로몬은 지혜와 함께 구하지 않은 부귀와 영광까지 받았습니다. 그는 한 아이를 두고 다투는 두 여자 중 진짜 어머니를 가려냈습니다. 솔로몬의 나라는 평안을 누렸고, 그는 두로 왕 히람과 약조를 맺어 성전 건축에 쓸 백향목과 돌을 준비했습니다.","솔로몬은 애굽에서 나온 지 사백팔십 년, 왕이 된 지 사 년째에 성전 건축을 시작해 칠 년 만에 마쳤습니다. 성전 안은 백향목과 금으로 입히고 지성소에 두 그룹을 두었습니다. 솔로몬은 십삼 년 동안 왕궁을 지었고, 두로의 히람은 야긴과 보아스라는 놋기둥, 놋바다, 받침 수레와 물두멍 등 성전 기구를 만들었습니다.","솔로몬은 언약궤를 성전 지성소 그룹들의 날개 아래로 옮겼고, 여호와의 영광의 구름이 성전에 가득했습니다. 솔로몬은 하늘도 주를 담을 수 없다고 고백하며, 백성이 죄를 짓고 이 성전을 향해 기도할 때 하늘에서 들으시고 용서해 달라고, 이방인의 기도도 들어 달라고 간구했습니다. 이어 많은 제물을 드리고 십사 일 동안 절기를 지켰습니다.","여호와께서 다시 솔로몬에게 나타나 순종하면 왕위를 견고히 하고, 다른 신을 섬기면 성전도 버리시겠다고 하셨습니다. 솔로몬의 지혜와 부를 보러 스바의 여왕이 찾아왔고 그는 큰 부귀를 누렸습니다. 그러나 이방 여인들이 그의 마음을 돌려 우상을 섬기게 했고, 하나님은 하닷과 르손을 대적으로 일으키시며 아히야를 통해 여로보암에게 열 지파를 주겠다고 하셨습니다.","르호보암이 노인들의 조언을 버리고 멍에를 더 무겁게 하겠다고 하자 열 지파가 여로보암을 왕으로 세워 나라가 갈라졌습니다. 여로보암은 벧엘과 단에 금송아지를 두었고, 유다에서 온 하나님의 사람은 제단을 꾸짖었으나 늙은 선지자에게 속아 명령을 어기고 사자에게 죽었습니다. 유다에서는 아비얌 뒤에 아사가 우상을 없앴고, 이스라엘에서는 바아사가 나답을 죽이고 왕이 되었습니다."],["선지자 예후가 바아사 집의 멸망을 선포했고, 엘라를 죽이고 왕이 된 시므리는 칠 일 만에 오므리에게 몰려 죽었습니다. 오므리는 사마리아 성을 세웠고, 그 아들 아합은 이세벨을 아내로 맞아 바알을 섬겼습니다. 엘리야는 비가 오지 않으리라 선포한 뒤 그릿 시냇가에서 까마귀가 주는 음식을 먹었고, 사르밧 과부의 가루와 기름이 떨어지지 않게 하며 죽은 아들을 살렸습니다.","엘리야는 갈멜 산에서 바알 선지자 사백오십 명과 대결했고, 여호와의 불이 내려 물에 젖은 제물과 제단을 태우자 백성이 여호와가 하나님이시라고 외쳤습니다. 그 뒤 큰 비가 내렸습니다. 이세벨의 위협에 도망한 엘리야는 로뎀 나무 아래서 천사가 준 음식을 먹고 호렙 산에 이르러 세미한 소리를 들었고, 하나님이 남겨 두신 칠천 명 이야기를 듣고 엘리사를 제자로 불렀습니다.","아합은 선지자의 말대로 아람 왕 벤하닷의 군대를 두 번 이겼지만, 하나님이 멸하기로 하신 벤하닷을 조약을 맺고 놓아주어 책망을 받았습니다. 이세벨은 거짓 증인을 세워 나봇을 죽이고 그의 포도원을 아합에게 주었고, 엘리야는 아합 집의 심판을 선포했습니다. 아합은 거짓 선지자들의 말을 따르고 미가야의 경고를 무시한 채 길르앗 라못에서 싸우다 화살에 맞아 죽었습니다.","아하시야 왕이 병들어 에그론의 신 바알세붑에게 묻자, 엘리야는 그가 죽으리라 선포했고 그를 잡으러 온 군사들에게 하늘에서 불이 내렸습니다. 아하시야는 말씀대로 죽었습니다. 엘리야는 엘리사와 함께 요단을 건넌 뒤 불수레와 불말 사이에서 회오리 바람으로 하늘에 올라갔고, 엘리야의 겉옷을 받은 엘리사는 요단을 가르고 여리고의 물을 고쳤습니다.","모압이 배반하자 이스라엘·유다·에돔 세 왕이 출정했다가 물이 떨어졌고, 엘리사의 말대로 골짜기에 물이 가득해 모압을 이겼습니다. 엘리사는 빚진 과부의 기름 그릇을 채우고, 수넴 여인에게 아들을 약속했다가 그 아들이 죽자 다시 살렸습니다. 국의 독을 없애고 보리떡 이십 개로 백 명을 먹였으며, 아람 군대 장관 나아만은 요단 강에 일곱 번 몸을 씻고 나병이 나았습니다.","엘리사는 물에 빠진 쇠도끼를 떠오르게 했고, 아람 왕의 작전을 이스라엘 왕에게 미리 알렸습니다. 아람 군대가 도단을 에워싸자 사환의 눈을 열어 불말과 불병거를 보게 했습니다. 사마리아가 포위되어 극심한 굶주림에 빠졌으나 엘리사의 예언대로 아람 군대가 도망했고, 나병환자 넷이 이 소식을 알렸습니다. 하사엘은 벤하닷을 죽이고 아람 왕이 되었습니다.","엘리사가 보낸 선지자의 제자가 예후에게 기름을 부어 이스라엘 왕으로 세웠습니다. 예후는 요람 왕을 활로 쏘아 나봇의 밭에 던지고, 유다 왕 아하시야도 죽였으며, 이세벨은 창밖으로 던져져 엘리야의 말대로 개들에게 먹혔습니다. 예후는 아합의 아들 칠십 명과 바알 숭배자들을 없앴지만, 벧엘과 단의 금송아지 죄에서는 떠나지 않았습니다."],["아달랴가 왕족을 죽였으나 여호세바가 어린 요아스를 성전에 숨겼고, 칠 년째 제사장 여호야다가 요아스를 왕으로 세우고 아달랴를 처단했습니다. 요아스는 헌금궤를 두어 성전을 수리했지만 하사엘에게 성물을 바치고 신하들에게 죽었습니다. 이스라엘의 여호아하스와 요아스는 아람에 시달렸고, 엘리사는 죽기 전 요아스에게 화살로 땅을 치게 했으며 그의 뼈에 닿은 시체가 살아났습니다.","유다 왕 아마샤는 에돔을 이긴 뒤 교만해져 이스라엘 왕 요아스에게 싸움을 걸었다가 패했습니다. 이스라엘은 여로보암 때 요나의 예언대로 영토를 되찾았으나, 이후 스가랴부터 호세아까지 반역과 암살이 이어졌고 앗수르가 땅을 빼앗았습니다. 유다 왕 아하스는 앗수르를 의지하며 다메섹 제단을 본떴고, 결국 사마리아가 함락되어 이스라엘은 앗수르로 끌려갔으며 그 땅에는 이방 민족이 옮겨 와 살았습니다.","히스기야는 산당을 없애고 모세의 놋뱀까지 부수며 여호와를 의지했습니다. 앗수르 왕 산헤립의 신하 랍사게가 예루살렘을 위협하며 하나님을 비방하자, 히스기야는 편지를 여호와 앞에 펴 놓고 기도했고, 여호와의 사자가 앗수르 군사 십팔만 오천 명을 쳤습니다. 병든 히스기야는 기도하여 십오 년을 더 살게 되었으나, 바벨론 사신들에게 보물을 다 보여 주어 바벨론 포로의 예언을 들었습니다.","므낫세는 산당을 다시 세우고 성전에 우상 제단을 쌓으며 무죄한 피를 많이 흘려 유다를 범죄하게 했고, 아들 아몬도 그 길을 따르다 살해되었습니다. 요시야는 성전을 수리하다 발견한 율법책의 말씀을 듣고 옷을 찢었으며, 백성과 언약을 세우고 온 땅의 우상을 없애고 유월절을 지켰습니다. 그러나 므낫세의 죄로 진노는 돌이켜지지 않았고, 요시야는 므깃도에서 바로 느고에게 죽었습니다.","바벨론 왕 느부갓네살이 예루살렘을 쳐서 여호야긴 왕과 지도자, 용사, 장인들을 바벨론으로 끌어갔습니다. 시드기야가 바벨론을 배반하자 예루살렘은 포위되어 함락되었고, 시드기야는 눈이 뽑힌 채 끌려갔으며 성전과 왕궁은 불탔습니다. 남은 백성을 다스리던 그달리야가 살해되자 백성은 애굽으로 갔고, 사로잡힌 지 삼십칠 년 만에 여호야긴은 옥에서 풀려나 바벨론 왕의 식탁에서 먹었습니다.","아담에서 노아와 그 아들들, 셈의 후손 아브라함, 이스마엘과 에서의 자손, 에돔의 왕들까지 족보가 이어집니다. 이어 이스라엘의 아들들 가운데 유다 지파를 자세히 기록하며 보아스와 이새를 거쳐 다윗과 그 아들들, 솔로몬부터 포로기 스룹바벨의 후손까지 다윗 왕가를 적습니다. 야베스의 기도와 시므온 지파, 요단 동쪽의 르우벤·갓·므낫세 반 지파가 우상을 섬기다 앗수르에 사로잡힌 일도 나옵니다.","레위 지파의 족보로 아론부터 포로로 끌려간 여호사닥까지의 대제사장 계보와, 다윗이 세운 찬송하는 자 헤만·아삽·에단의 계보를 기록합니다. 아론 자손이 이스라엘을 위해 속죄하던 직무와 레위 사람에게 준 성읍과 도피성이 나옵니다. 잇사갈, 베냐민, 납달리, 므낫세, 에브라임, 아셀 지파와 사울 집안의 족보가 이어지고, 포로에서 돌아와 예루살렘에 살게 된 백성과 제사장, 레위 사람, 문지기의 직무를 적습니다."],["사울은 길보아 산에서 블레셋에게 쫓기다 자기 칼에 엎드러져 죽었는데, 이는 여호와께 묻지 않고 신접한 자를 찾았기 때문이었습니다. 온 이스라엘이 헤브론에서 다윗에게 기름을 부어 왕으로 세웠고, 다윗은 시온 산성을 빼앗아 다윗 성이라 불렀습니다. 다윗의 용사들의 활약과, 시글락 시절부터 각 지파 용사들이 다윗에게 모여 헤브론에서 그를 왕으로 세우며 기뻐한 일이 기록됩니다.","다윗이 하나님의 궤를 새 수레에 싣고 옮기다가 궤를 붙든 웃사가 죽었고, 궤는 오벧에돔의 집에 석 달 머물며 복을 가져왔습니다. 다윗은 블레셋을 두 번 물리친 뒤, 이번에는 레위 사람들이 규례대로 궤를 어깨에 메고 노래하며 다윗 성으로 옮겼고, 미갈은 춤추는 다윗을 업신여겼습니다. 다윗은 아삽과 형제들을 세워 \"여호와께 감사하라 그는 선하시며 그의 인자하심이 영원함이로다\"라고 찬양하게 했습니다.","다윗이 성전을 짓고자 하자, 하나님은 나단을 통해 그 아들이 성전을 짓게 하고 다윗의 왕조를 세워 그 왕위를 영원히 견고하게 하시겠다고 약속하셨습니다. 다윗은 자신이 무엇이기에 이런 은혜를 주시느냐며 감사 기도를 드렸습니다. 이후 다윗은 블레셋, 모압, 소바, 아람, 에돔을 이겼고, 사절을 모욕한 암몬과 아람 연합군을 물리쳐 랍바를 함락했으며 블레셋의 거인들도 쓰러뜨렸습니다.","사탄의 충동으로 다윗이 요압의 만류에도 인구를 조사하자 하나님이 전염병으로 이스라엘을 치셔서 칠만 명이 죽었습니다. 다윗은 죄를 고백하며 자신을 치시고 백성은 살려 달라고 간구했고, 오르난의 타작 마당을 값을 치르고 사서 제단을 쌓자 하나님이 불로 응답하셨습니다. 다윗은 그곳을 성전 터로 정하고 많은 재료를 준비하며 솔로몬에게 성전 건축을 부탁했습니다.","늙은 다윗은 솔로몬을 왕으로 세우고 레위 사람 삼만 팔천 명을 계수하여 성전 일, 관원과 재판관, 문지기, 찬송하는 일로 나누었습니다. 아론 자손 제사장들은 제비를 뽑아 스물네 반열로 나뉘었고, 아삽·헤만·여두둔의 자손 이백팔십팔 명도 스물네 반으로 나뉘어 악기로 신령한 노래를 맡았습니다. 이어 문지기들이 성전 사방의 문을 제비로 맡았고, 곳간과 성물을 지키는 자와 성전 밖의 관원들이 세워졌습니다.","다윗은 달마다 이만 사천 명씩 섬기는 열두 반의 군대와 각 지파 지도자, 왕의 재산을 맡은 관리들을 세웠습니다. 다윗은 지도자들을 모아 하나님이 솔로몬을 택하셨음을 알리고 하나님께 받은 성전 설계도를 솔로몬에게 주며 강하고 담대하라고 격려했습니다. 다윗과 지도자들이 성전을 위해 즐거이 예물을 드리자, 다윗은 모든 것이 주께로 왔다고 감사 기도를 드렸고, 솔로몬이 왕위에 오른 뒤 다윗은 세상을 떠났습니다.","솔로몬은 기브온 산당의 회막 앞 놋제단에서 천 마리 희생으로 번제를 드렸고, 그 밤에 하나님이 나타나 무엇을 줄지 구하라고 하셨습니다. 솔로몬이 백성을 재판할 지혜와 지식을 구하자, 하나님은 지혜와 지식뿐 아니라 부와 영광도 주셨습니다. 솔로몬은 성전 건축을 결심하고 두로 왕 후람에게 재목과 기술자를 청했으며, 후람은 재주 있는 사람을 보내고 레바논 재목을 바다로 보내기로 했습니다."],["솔로몬은 다윗이 정한 모리아 산 오르난의 타작 마당에서 성전 건축을 시작했습니다. 성전 안을 순금으로 입히고 지성소에 두 그룹을 두었으며, 청색·자색·홍색 실로 휘장을 짓고 성전 앞에 야긴과 보아스 두 기둥을 세웠습니다. 놋제단, 놋바다, 물두멍, 금 등잔대와 상 등을 만든 뒤 언약궤를 지성소에 들였고, 노래하는 자와 나팔 부는 제사장들이 함께 여호와를 찬송하자 여호와의 영광의 구름이 성전에 가득했습니다.","솔로몬은 무릎을 꿇고, 백성이 죄를 짓고 이 성전을 향해 기도할 때 하늘에서 들으시고 용서해 달라고 간구했습니다. 기도를 마치자 하늘에서 불이 내려 제물을 사르고 여호와의 영광이 성전에 가득했습니다. 낙성식과 절기를 마친 뒤 여호와께서 밤에 나타나, 백성이 \"그들의 악한 길에서 떠나 스스로 낮추고 기도하여 내 얼굴을 찾으면\" 땅을 고치시겠다고 약속하시고 우상 숭배를 경고하셨습니다.","솔로몬은 이십 년 동안 성전과 왕궁을 지은 뒤 여러 성읍과 국고성, 병거성을 건축했고, 남은 이방 족속을 역꾼으로 삼았습니다. 모세의 명령대로 절기마다 번제를 드리고 다윗의 규례를 따라 제사장과 레위 사람의 반열을 세웠습니다. 오빌에서 금을 들여왔고, 스바 여왕이 찾아와 그의 지혜에 감탄했으며, 천하의 왕들이 예물을 들고 왔습니다. 솔로몬은 사십 년을 다스리고 죽어 아들 르호보암이 왕이 되었습니다.","르호보암이 원로들의 조언을 버리고 백성의 멍에를 더 무겁게 하겠다고 하자 이스라엘이 떨어져 나갔습니다. 르호보암은 스마야의 말대로 전쟁을 멈추고 성읍들을 견고히 했으며, 여로보암에게 쫓겨난 제사장과 레위 사람들이 유다로 왔습니다. 그러나 나라가 강해지자 율법을 버렸고, 애굽 왕 시삭이 쳐들어오자 스스로 겸비하여 멸망은 면했지만 성전 보물을 빼앗겼습니다.","유다 왕 아비야는 두 배나 많은 여로보암의 군대를 하나님을 의지하여 이겼습니다. 아사는 우상을 없애고 구스 사람 세라의 백만 대군을 기도로 물리쳤으며, 선지자 아사랴의 권면에 백성과 함께 여호와를 찾기로 언약했습니다. 그러나 말년에 아람 왕을 의지하다 선견자 하나니에게 \"여호와의 눈은 온 땅을 두루 감찰하사\" 전심으로 그를 향하는 자를 도우신다는 책망을 듣고 그를 옥에 가두었습니다.","여호사밧은 레위 사람들을 보내 유다 성읍마다 율법책을 가르치게 했습니다. 아합과 함께 길르앗 라못에 나섰다가 위기를 겪고 선견자 예후의 책망을 들은 뒤 재판관들을 세웠습니다. 모압과 암몬이 쳐들어오자 금식하며 기도했고, \"이 전쟁은 너희에게 속한 것이 아니요 하나님께 속한 것이니라\"는 말씀을 들었습니다. 찬양하는 자들을 앞세워 나가자 적들이 서로 쳐 죽였습니다.","여호람은 아우들을 죽이고 아합의 딸을 아내로 맞아 악을 행했지만, 하나님은 다윗과의 언약 때문에 유다를 멸하지 않으셨습니다. 에돔과 립나가 배반했고, 엘리야는 글로 심판을 선포했으며, 여호람은 침략으로 재물과 가족을 잃고 창자의 병으로 아끼는 자 없이 죽었습니다. 아들 아하시야는 예후에게 죽임을 당했고, 아달랴가 왕족을 죽였으나 여호사브앗이 어린 요아스를 성전에 숨겼습니다."],["제사장 여호야다가 요아스를 왕으로 세우자 아달랴는 처형되고 바알 신당은 무너졌습니다. 요아스는 헌금을 모아 성전을 보수했지만, 여호야다가 죽자 우상을 섬기고 책망하는 그의 아들 스가랴를 성전 뜰에서 돌로 쳐 죽였으며, 아람의 침략 뒤 신하들에게 죽었습니다. 아마샤는 에돔을 이긴 뒤 에돔의 신들을 섬기고 경고를 무시하다 이스라엘 왕 요아스에게 패하고 반역자들에게 죽었습니다.","웃시야는 하나님을 찾는 동안 블레셋을 이기고 크게 강성해졌으나, 교만해져 성전에서 직접 분향하려다 이마에 나병이 생겨 죽을 때까지 별궁에 살았습니다. 요담은 바른 길을 걸어 강해졌지만, 아하스는 바알 우상을 만들고 자녀를 불사르며 앗수르를 의지하다가 성전 문까지 닫았습니다.","히스기야는 즉위하자마자 닫힌 성전 문을 열고 레위 사람들과 함께 성전을 깨끗하게 한 뒤 속죄제와 번제를 드렸습니다. 온 이스라엘에 편지를 보내 유월절을 지키게 하니 솔로몬 이후 없던 큰 기쁨이 있었고, 백성은 우상을 없애고 첫 열매와 십일조를 풍성히 드렸습니다.","앗수르 왕 산헤립이 예루살렘을 위협하며 하나님을 비방하자, 히스기야는 이사야와 함께 기도했고 여호와께서 천사를 보내 앗수르 군대를 치셨습니다. 그의 아들 므낫세는 성전에 우상을 세우는 큰 악을 행하다 바벨론으로 끌려갔으나, 겸손히 기도하여 돌아와 우상을 없앴습니다. 아몬은 악을 행하다 신하에게 죽임을 당했습니다.","요시야는 어려서부터 하나님을 찾아 우상을 없애고, 성전 수리 중 발견된 율법책을 듣고 옷을 찢으며 백성과 언약을 세우고 큰 유월절을 지켰습니다. 그러나 애굽 왕 느고와 싸우다 죽었고, 이후 왕들이 계속 악을 행하자 느부갓네살이 성전을 불사르고 백성을 바벨론으로 끌어갔습니다. 마지막에 고레스가 성전 재건 조서를 내립니다.","바사 왕 고레스가 여호와의 감동을 받아 유다 사람들이 예루살렘으로 돌아가 성전을 지으라는 조서를 내리고, 느부갓네살이 가져갔던 성전 그릇들을 세스바살에게 돌려주었습니다. 스룹바벨과 예수아를 따라 돌아온 사람들의 명단과 수가 기록되고, 족장들은 성전 터에서 예물을 기쁘게 드렸습니다.","돌아온 백성은 먼저 제단을 쌓아 번제를 드리고 성전 기초를 놓으며 기쁨과 통곡으로 찬송했습니다. 대적들의 방해와 고발로 공사가 중단되었으나, 학개와 스가랴의 예언으로 다시 시작했고, 다리오 왕이 고레스의 조서를 찾아 공사를 도우라고 명하여 성전이 완공되고 봉헌식과 유월절이 열렸습니다."],["율법에 익숙한 학자이자 제사장인 에스라가 아닥사스다 왕의 조서와 예물을 가지고 사람들과 함께 예루살렘으로 올라왔습니다. 길을 떠나기 전 아하와 강 가에서 금식하며 하나님의 보호를 구했고 무사히 도착했습니다. 그러나 백성과 지도자들이 이방 여인과 통혼한 사실을 듣고 옷을 찢으며 죄를 자복하자, 백성이 함께 회개하고 이방 아내를 내보내기로 언약했습니다.","바사 왕의 술 관원 느헤미야는 예루살렘 성벽이 무너지고 성문이 불탔다는 소식을 듣고 울며 금식하고 죄를 자복하며 기도했습니다. 왕이 그의 수심을 알아보고 예루살렘 재건을 허락하자, 느헤미야는 밤에 몰래 성벽을 살펴본 뒤 백성에게 함께 건축하자고 말했습니다. 산발랏과 도비야, 게셈은 이를 비웃었습니다.","대제사장부터 금장색과 상인까지 각자 맡은 구역의 성벽과 성문을 중수했습니다. 산발랏과 도비야가 비웃고 공격을 꾀하자 백성은 한 손에는 일을, 한 손에는 병기를 잡고 일했습니다. 느헤미야는 가난한 형제에게 높은 이자를 받는 귀족들을 꾸짖어 저당 잡은 밭과 이자를 돌려주게 했고, 거짓 편지와 거짓 예언의 위협을 물리쳐 성벽을 오십이 일 만에 완성했습니다.","성벽이 완성되자 느헤미야는 성문을 지킬 사람들을 세우고, 처음 돌아온 사람들의 계보를 다시 확인해 기록했습니다. 일곱째 달에 백성이 수문 앞 광장에 모이자 에스라가 새벽부터 정오까지 율법책을 읽고 레위 사람들이 그 뜻을 풀어 주었습니다. 말씀을 듣고 우는 백성에게 \"여호와로 인하여 기뻐하는 것이 너희의 힘이니라\"고 했고, 백성은 초막을 짓고 초막절을 지켰습니다.","백성이 금식하며 모여 율법을 읽고 죄를 자복했습니다. 레위 사람들은 창조부터 아브라함, 출애굽, 광야, 가나안 정복, 사사 시대와 포로까지 이스라엘이 거듭 배반했으나 하나님이 긍휼로 버리지 않으셨다고 고백했습니다. 이어 지도자들이 견고한 언약에 인봉하고, 통혼 금지와 안식일 준수, 성전을 위한 헌물과 십일조를 지키기로 맹세했습니다.","백성의 십분의 일이 제비를 뽑아 예루살렘에 살게 되었고, 제사장과 레위 사람들의 명단이 기록되었습니다. 성벽 봉헌식에서 두 찬양대가 성벽 위를 돌며 감사 찬송을 드리니 예루살렘의 즐거운 소리가 멀리 들렸습니다. 그러나 느헤미야가 잠시 떠난 사이 도비야가 성전 방을 차지하고 안식일과 통혼 문제가 생기자, 돌아온 느헤미야가 이를 바로잡았습니다.","바사 왕 아하수에로가 큰 잔치를 베풀다 왕후 와스디가 부름에 응하지 않자 그녀를 폐위했습니다. 새 왕후를 찾는 과정에서 모르드개가 딸처럼 기른 유다 처녀 에스더가 왕의 사랑을 받아 왕후가 되었습니다. 에스더는 모르드개의 말대로 민족을 밝히지 않았고, 모르드개는 왕을 암살하려는 음모를 알려 궁중 일기에 기록되었습니다."],["모르드개가 하만에게 절하지 않자, 하만은 분노하여 제비를 뽑아 아달월 십삼일에 모든 유다인을 죽이라는 왕의 조서를 받아 냈습니다. 모르드개는 굵은 베 옷을 입고 통곡하며 에스더에게 왕 앞에 나아가 민족을 위해 구하라고 했고, 에스더는 사흘 금식을 부탁한 뒤 \"죽으면 죽으리이다\" 하며 왕에게 나아가 잔치에 초대했습니다. 하만은 모르드개를 매달 높은 나무를 세웠습니다.","잠 못 이루던 왕이 일기를 읽다 모르드개의 공을 알고, 하만에게 그를 존귀하게 하라고 명했습니다. 둘째 잔치에서 에스더가 하만의 계략을 밝히자 하만은 모르드개를 매달려던 나무에 달렸습니다. 모르드개가 새 조서를 써서 유다인이 스스로를 지키게 하니 슬픔이 기쁨으로 바뀌었고, 이 날을 부림절로 지키게 되었으며 모르드개는 왕 다음가는 자리에 올랐습니다.","온전하고 정직한 욥에 대해 사탄이 까닭 없이 하나님을 경외하겠느냐고 하자, 하나님은 욥을 시험하도록 허락하셨습니다. 욥은 하루아침에 재산과 자녀를 잃고 온몸에 종기가 났지만 \"주신 이도 여호와시요 거두신 이도 여호와시오니\" 하며 범죄하지 않았습니다. 세 친구가 찾아와 칠 일 동안 말없이 함께 앉았고, 이후 욥은 자기 생일을 저주하며 탄식했습니다.","엘리바스는 죄 없이 망한 사람이 없다며, 욥의 고난에는 이유가 있으니 하나님을 찾고 징계를 업신여기지 말라고 말했습니다. 욥은 자신의 괴로움이 바다 모래보다 무겁다며, 친구들이 마르는 개울처럼 위로가 되지 못한다고 답했습니다. 이어 인생의 덧없음을 탄식하며 하나님께 왜 자신을 과녁으로 삼으시느냐고 부르짖었습니다.","빌닷은 하나님은 공의를 굽게 하지 않으시니 욥의 자녀들이 죄 때문에 죽었다며, 청결하고 정직하게 하나님을 찾으면 회복될 것이라고 말했습니다. 욥은 사람이 어찌 하나님 앞에 의로울 수 있느냐며 크신 하나님과 변론할 수 없다고 고백하고, 둘 사이에 손을 얹을 판결자가 없음을 탄식했습니다. 그리고 자신을 지으신 하나님께 왜 자신을 치시는지 알려 달라고 호소했습니다.","소발은 욥의 말이 많다고 꾸짖으며, 하나님의 지혜는 측량할 수 없으니 죄를 버리면 다시 평안해질 것이라고 말했습니다. 욥은 친구들을 쓸모없는 의원이라 부르며 하나님 앞에서 직접 변론하겠다고 했습니다. 이어 사람의 인생이 꽃처럼 시들고 그림자처럼 지나간다며, 나무는 찍혀도 다시 움이 나는데 사람은 죽으면 어찌 다시 살겠느냐고 탄식했습니다.","엘리바스는 욥의 말이 헛되고 하나님 경외를 버리는 것이라며, 악인은 평생 고통을 당하고 멸망한다고 다시 말했습니다. 욥은 친구들을 재난을 주는 위로자들이라 부르며, 하나님이 자신을 과녁으로 삼아 치신다고 탄식했습니다. 그러면서도 하늘에 자신의 증인과 중보자가 계신다고 고백했지만, 다시 무덤만 바라보며 희망이 어디 있느냐고 물었습니다."],["빌닷은 악인의 등불은 꺼지고 그 이름이 땅에서 사라진다고 말했습니다. 욥은 하나님이 자신을 치시고 형제와 친구, 아내까지 자신을 멀리한다며 불쌍히 여겨 달라고 호소하면서도 \"내가 알기에는 나의 대속자가 살아 계시니\" 하고 고백했습니다. 소발이 악인의 즐거움은 잠깐이라고 하자, 욥은 실제로는 악인이 장수하고 형통하는 일이 많다고 반박했습니다.","엘리바스는 욥이 가난한 자를 학대한 큰 죄가 있다고 단정하며 하나님과 화목하라고 권했습니다. 욥은 하나님을 찾아도 만날 수 없다고 탄식하면서도 \"그가 나를 단련하신 후에는 내가 순금 같이 되어 나오리라\"고 고백했고, 세상에 억울한 자가 많은데 악인이 심판받지 않는 현실을 호소했습니다. 빌닷이 사람은 벌레 같다고 짧게 말하자, 욥은 하나님의 크신 능력을 노래했습니다.","욥은 하나님의 사심을 두고 맹세하며 죽기 전까지 자신의 온전함을 버리지 않겠다고 말하고, 악인이 받을 분깃을 이야기했습니다. 이어 사람은 땅속 깊은 곳에서 금과 보석을 캐낼 수 있지만, 지혜는 어디서도 찾을 수 없고 어떤 보물로도 살 수 없다고 노래합니다. 오직 하나님만 지혜의 길을 아시며, \"주를 경외함이 지혜요 악을 떠남이 명철이니라\"고 결론짓습니다.","욥은 하나님이 함께하시던 지난날, 고아와 과부를 돕고 맹인의 눈과 다리 저는 사람의 발이 되어 존경받던 때를 그리워했습니다. 그러나 이제는 천한 자들에게까지 조롱받으며, 부르짖어도 하나님이 대답하지 않으신다고 탄식했습니다. 마지막으로 음란, 불의, 재물 의지, 우상 숭배 등을 하나씩 들며 자신이 그런 죄를 짓지 않았다고 맹세하고, 전능자가 대답해 주시기를 구했습니다.","세 친구가 대답을 그치자 젊은 엘리후가 나서서, 욥이 하나님보다 자기를 의롭다 하고 친구들은 대답도 못 하면서 욥을 정죄했다며 화를 냈습니다. 엘리후는 하나님이 꿈과 질병을 통해서도 사람을 깨우쳐 구덩이에서 건지신다고 말했습니다. 또 하나님은 결코 불의를 행하지 않으시고 각 사람의 행위대로 갚으신다며 욥의 말이 지혜롭지 못하다고 했습니다.","엘리후는 사람의 의나 죄가 높으신 하나님께 영향을 줄 수 없다며, 욥이 지식 없는 말을 많이 한다고 말했습니다. 하나님은 고난을 통해 사람의 귀를 열어 죄에서 돌이키게 하시고 곤고한 자를 구원하신다고 했습니다. 이어 비와 구름, 번개와 천둥, 눈과 얼음을 다스리시는 하나님의 위엄을 묘사하며, 욥에게 가만히 서서 하나님의 오묘한 일을 깨달으라고 권했습니다.","마침내 여호와께서 폭풍우 가운데에서 욥에게 말씀하셨습니다. \"내가 땅의 기초를 놓을 때에 네가 어디 있었느냐\" 물으시며, 바다의 경계와 아침, 빛과 어둠, 눈과 비, 별자리를 누가 다스리는지 아느냐고 하셨습니다. 이어 사자와 까마귀, 산 염소, 들나귀, 들소, 타조, 말, 매와 독수리를 하나하나 들어 창조 세계를 돌보시는 하나님의 지혜를 보여 주셨습니다."],["하나님은 욥에게 네가 내 공의를 부인하려느냐 물으시고, 베헤못과 리워야단을 들어 그 누구도 다스릴 수 없는 피조물조차 하나님이 지으셨음을 보여 주셨습니다. 욥은 \"내가 주께 대하여 귀로 듣기만 하였사오나 이제는 눈으로 주를 뵈옵나이다\" 고백하며 티끌과 재 가운데서 회개했습니다. 하나님은 세 친구를 꾸짖으시고, 친구들을 위해 기도한 욥에게 이전보다 갑절의 복을 주셨습니다.","시편 1편은 여호와의 율법을 주야로 묵상하는 사람은 시냇가에 심은 나무처럼 열매를 맺지만, 악인은 바람에 나는 겨와 같다고 노래합니다. 2편은 세상 왕들이 여호와와 그의 기름 부음 받은 자를 대적해도 하나님이 시온에 왕을 세우셨다고 선포합니다. 하나님은 그 왕에게 \"너는 내 아들이라 오늘 내가 너를 낳았도다\" 말씀하시며 땅 끝까지 다스리게 하십니다.","다윗은 아들 압살롬을 피해 도망할 때 대적이 많아도 여호와가 방패시니 누워 자고 깬다며 \"구원은 여호와께 있사오니\" 하고 고백합니다. 이어지는 시들에서 그는 곤란 중에 응답을 구하고, 아침마다 기도하며, 눈물로 침상을 적시며 고쳐 주시기를 간구합니다. 7편에서는 자신을 쫓는 자들에게서 건져 달라며 의로우신 재판장께 억울함을 호소합니다.","8편은 하늘의 달과 별을 보며 \"사람이 무엇이기에 주께서 그를 생각하시며\" 노래하고, 사람에게 만물을 다스리게 하신 하나님을 찬양합니다. 9-13편은 가난한 자의 부르짖음을 잊지 않으시는 의로우신 재판장을 의지하며, 하나님이 숨으신 듯한 때에도 주의 사랑을 신뢰합니다. 14편은 선을 행하는 자가 하나도 없는 인간의 부패를 고발합니다.","15편과 24편은 주의 거룩한 산에 설 자는 정직하고 마음이 청결한 자라고 노래합니다. 16-21편은 주 밖에는 복이 없다는 고백과 구원의 감사, 하늘과 율법에 나타난 하나님의 영광을 찬양합니다. 22편은 버림받은 자의 부르짖음에서 찬양으로 나아가고, 23편은 \"여호와는 나의 목자시니 내게 부족함이 없으리로다\" 하고 고백합니다.","다윗은 주의 길을 가르쳐 달라고 간구하며 \"여호와는 나의 빛이요 나의 구원이시니\" 하고 두려움 없이 주의 집에 살기를 소망합니다. 29-30편은 여호와의 위엄 있는 소리와 슬픔을 춤으로 바꾸신 하나님을 노래합니다. 31편은 자기 영을 주의 손에 맡기는 기도이며, 32편은 죄를 자복하고 용서받은 복을, 33편은 말씀으로 하늘을 지으신 하나님을 찬양합니다.","34편은 곤고한 자의 부르짖음을 들으시는 하나님을 찬양하며 \"너희는 여호와의 선하심을 맛보아 알지어다\" 하고 권합니다. 35편은 까닭 없이 미워하는 자들에게서 건져 달라는 기도이고, 36편은 악인의 교만과 하늘에 닿은 주의 인자하심을 대조합니다. 37편은 악인의 형통을 시기하지 말고 여호와께 길을 맡기라, 온유한 자가 땅을 차지하리라고 가르칩니다."],["38편에서 다윗은 자기 죄로 몸과 마음이 상하고 친구들마저 멀어졌다며 버리지 말아 달라고 간구하고, 39편은 인생이 그림자처럼 헛되니 소망은 주께 있다고 고백합니다. 40편은 \"내가 여호와를 기다리고 기다렸더니\" 수렁에서 건지셨다며 주의 뜻 행하기를 즐긴다고 노래하고, 41편은 믿던 친구에게 배신당한 아픔 속에서 주의 은혜를 구합니다.","42-43편은 사슴이 시냇물을 찾듯 하나님을 갈망하며 낙심한 영혼에게 하나님께 소망을 두라고 말합니다. 44편은 숨으신 듯한 하나님께 깨어 도와 달라고 부르짖고, 45편은 영원한 보좌의 왕을 노래합니다. 46-48편은 \"하나님은 우리의 피난처시요 힘이시니\" 고백하며 온 땅의 왕을 찬양하고, 49-50편은 재물의 헛됨과 감사의 제사를 가르칩니다.","51편은 밧세바 일 후 나단의 책망을 듣고 드린 다윗의 회개 기도로, 정한 마음을 창조해 달라고 간구하며 \"하나님께서 구하시는 제사는 상한 심령이라\" 고백합니다. 52-53편은 악을 자랑하는 자와 선을 행하는 자가 없는 인간의 부패를 말하고, 54-55편은 원수와 가까운 친구의 배신 속에서 짐을 여호와께 맡기라고 노래합니다.","다윗은 블레셋에 잡혔을 때와 사울을 피해 굴에 숨었을 때에도 하나님을 의지하며 노래했습니다. 56편은 \"나의 눈물을 주의 병에 담으소서\" 하며 사람을 두려워하지 않겠다고 고백하고, 57편은 주의 날개 그늘 아래 피하며 새벽을 깨워 찬송합니다. 58-59편은 원수의 심판을 구하고, 60편은 패배 가운데 회복을 간구합니다.","61-63편에서 다윗은 땅 끝에서 부르짖으며 \"나의 영혼이 잠잠히 하나님만 바람이여\" 고백하고, 광야에서도 주의 인자하심이 생명보다 낫다고 노래합니다. 64편은 원수의 음모에서 숨겨 달라는 기도이고, 65-66편은 땅에 곡식을 주시고 기도를 들으신 하나님을 찬양합니다. 67편은 주의 구원이 모든 나라에 알려지기를 구하고, 68편은 고아의 아버지이신 승리의 하나님을 노래합니다.","69편에서 다윗은 깊은 수렁에 빠진 듯 까닭 없이 미움받고 \"주의 집을 위하는 열성이 나를 삼키고\" 비방을 당한다며 건져 달라고 부르짖습니다. 70-71편은 속히 도와 달라는 기도와 늙어서도 버리지 말아 달라는 간구입니다. 72편은 공의로 가난한 자를 구원하고 땅 끝까지 다스릴 왕을 위한 솔로몬의 기도입니다.","73편에서 아삽은 악인의 형통을 보고 넘어질 뻔했으나 \"하나님의 성소에 들어갈 때에야 그들의 종말을 내가 깨달았나이다\" 하며 하나님께 가까이 함이 복이라고 고백합니다. 74편은 원수가 성소를 불사른 참상 속의 부르짖음이고, 75-76편은 바르게 심판하시는 하나님을 찬양하며, 77편은 환난 중에 옛적 주의 일을 기억합니다."],["78편은 출애굽과 광야에서 만나와 물을 주신 은혜에도 이스라엘이 거듭 배반한 역사를 후대에 전하며, 하나님이 다윗을 목자로 세우셨다고 노래합니다. 79-80편은 황폐해진 예루살렘을 두고 주의 얼굴빛을 비춰 달라고 간구합니다. 81편은 듣지 않는 백성을 향한 하나님의 안타까운 음성을, 82-83편은 불의한 재판관과 원수를 심판해 달라는 기도를 담고 있습니다.","84편은 \"주의 궁정에서의 한 날이 다른 곳에서의 천 날보다 나은즉\" 하며 주의 장막을 사모하고, 85-87편은 백성을 다시 살려 주시기를 구하며 열방이 시온에서 났다고 불릴 날을 노래합니다. 88편은 흑암 속에서 끝까지 부르짖는 탄식이며, 89편은 다윗과 맺으신 영원한 언약을 노래하면서도 무너진 왕위 앞에서 주의 인자하심을 묻습니다.","하나님의 사람 모세는 영원하신 하나님과 풀처럼 시드는 짧은 인생을 대비하며, 우리 날 계수함을 가르쳐 지혜로운 마음을 얻게 해 달라고 기도합니다. 이어 지존자의 그늘에 거하는 자를 하나님이 올무와 전염병에서 건지시고 천사들로 지키신다는 노래와, 악인은 망하나 의인은 종려나무처럼 번성한다는 안식일의 찬송이 나옵니다.","\"여호와께서 다스리시니\"라는 고백으로 하나님이 온 세상의 왕이심을 노래합니다. 교만한 악인을 심판해 달라는 호소, 므리바와 맛사처럼 마음을 완악하게 하지 말라는 예배로의 초청, 새 노래로 온 땅이 찬양하라는 부름이 이어지며, 땅을 의로 심판하러 오실 거룩하신 왕 앞에서 모세와 아론과 사무엘을 기억합니다.","온 땅이 기쁨으로 여호와를 섬기며 감사함으로 그 문에 들어가라는 노래로 시작합니다. 다윗은 완전한 길로 행하며 악을 멀리하겠다고 다짐하고, 고난 당한 자는 연기처럼 사라지는 자기 날을 탄식하며 영원하신 주께 시온의 회복을 구합니다. 마지막으로 죄를 사하시고 동이 서에서 먼 것같이 허물을 옮기신 여호와를 송축합니다.","빛을 옷처럼 입으시고 땅과 바다, 짐승과 사람을 먹이시는 창조주를 찬양합니다. 이어 아브라함과의 언약을 기억하셔서 요셉을 앞서 보내시고 애굽에 재앙을 내려 백성을 이끌어 내신 일을 노래하고, 반대로 홍해, 광야의 탐욕, 금송아지, 브올의 바알 등 거듭된 조상들의 반역과 그럼에도 언약을 기억하신 하나님의 인자하심을 고백합니다.","광야에서 헤매는 자, 흑암에 갇힌 자, 죄로 병든 자, 광풍 속 뱃사람이 부르짖을 때 건지신 여호와의 인자하심을 감사합니다. 다윗은 하나님을 의지하여 대적을 이기기를 구하고, 거짓으로 공격하는 대적들을 하나님께 고발하며 구원을 호소합니다. 시편 110편은 \"내 오른쪽에 앉아 있으라\"는 말씀과 멜기세덱의 서열을 따른 영원한 제사장을 노래합니다."],["\"할렐루야\"로 여호와를 찬양하는 시들입니다. 여호와를 경외함이 지혜의 근본이라는 고백, 낮은 자를 일으키시는 하나님, 출애굽 때 바다가 도망한 일을 노래하고, 말 못하는 우상과 살아 계신 하나님을 대조합니다. 사망의 줄에서 건지심에 감사하며 구원의 잔을 들고, 건축자가 버린 돌이 모퉁이의 머릿돌이 되었다고 찬양합니다.","히브리어 알파벳 순서로 된 성경에서 가장 긴 시로, 율법, 증거, 법도, 계명, 말씀을 사랑하는 마음을 176절에 걸쳐 고백합니다. 시인은 교만한 자들의 비방과 고난 속에서도 말씀을 붙들며, 말씀이 꿀보다 달고 \"내 발에 등이요 내 길에 빛\"이라고 노래하고, 말씀대로 자신을 살려 달라고 거듭 간구합니다.","예루살렘 성전으로 올라가며 부르던 순례의 노래 모음입니다. 천지를 지으신 여호와가 졸지도 주무시지도 않고 지키심을 고백하고, 여호와의 집에 올라가는 기쁨과 예루살렘의 평안을 구합니다. 포로에서 돌아온 기쁨, 여호와께서 집을 세우셔야 한다는 고백, 깊은 곳에서 죄 사함을 기다리는 기도, 다윗 언약과 형제의 연합을 노래합니다.","이스라엘을 특별한 소유로 택하시고 애굽의 처음 난 것을 치시며 시혼과 옥을 이기게 하신 여호와를 찬송하고, 말 못하는 우상과 대조합니다. 시편 136편은 창조와 출애굽, 광야 인도를 하나하나 짚으며 \"그 인자하심이 영원함이로다\"를 반복합니다. 마지막으로 포로들이 바벨론 강변에서 시온을 기억하며 울고, 예루살렘을 잊지 않겠다고 맹세합니다.","다윗의 시들입니다. 다윗은 응답하신 하나님께 감사하고, 앉고 일어섬과 모태의 자신까지 아시며 어디에나 계시는 하나님을 노래합니다. 악인의 올무에서 건져 달라는 기도, 굴에서 드린 부르짖음, 주 앞에 의로운 인생이 없다는 고백이 이어지고, 마지막에는 은혜롭고 긍휼이 많으신 왕 하나님과 영원한 그의 나라를 찬양합니다.","시편을 마무리하는 다섯 편의 할렐루야 시입니다. 사람을 의지하지 말고 억눌린 자에게 정의를, 갇힌 자에게 자유를 주시는 여호와를 의지하라고 하며, 상한 마음을 고치시고 별의 수를 세시는 하나님을 찬양합니다. 하늘과 땅의 모든 피조물과 성도들을 찬양으로 부르고, \"호흡이 있는 자마다 여호와를 찬양할지어다\"로 끝맺습니다.","솔로몬의 잠언은 여호와를 경외하는 것이 지식의 근본이라는 선언으로 시작합니다. 아버지는 아들에게 피 흘리는 악한 무리를 따르지 말라고 경고하고, 지혜가 길거리에서 외치며 듣지 않는 자의 멸망을 알립니다. 마음을 다해 여호와를 신뢰하라, 네 마음을 지키라는 교훈과 함께 음녀의 길을 피하고 젊어서 얻은 아내를 즐거워하라고 권합니다."],["보증 서는 일, 개미에게 배우라는 게으름에 대한 경고, 여호와께서 미워하시는 예닐곱 가지가 나옵니다. 아버지는 음녀에게 끌려가는 지혜 없는 젊은이의 모습을 생생하게 그리며 경고합니다. 이어 지혜가 성문에서 외치며 창조 이전부터 여호와 곁에 있었다고 말하고, 지혜의 잔치와 미련한 여인의 초대가 대조됩니다.","여기서부터 짧은 두 줄 격언으로 된 솔로몬의 잠언이 이어집니다. 의인과 악인, 지혜로운 자와 미련한 자, 부지런한 자와 게으른 자를 짝지어 대조하며 말의 힘, 정직한 저울, 교만과 겸손, 가난한 자를 대하는 태도를 다룹니다. 여호와를 경외하는 것이 생명의 샘이며, 가산이 적어도 여호와를 경외하는 것이 낫다고 말합니다.","사람이 마음으로 길을 계획해도 그 걸음을 인도하시는 이는 여호와시라는 고백이 거듭 나옵니다. 교만은 패망의 선봉이고, 노하기를 더디 하는 자가 용사보다 낫다고 말합니다. 화목한 가정, 친구와 형제, 혀의 힘, 가난한 자를 불쌍히 여김, 정직한 저울과 술의 위험, 악을 스스로 갚지 말고 여호와를 기다리라는 교훈이 이어집니다.","왕의 마음도 여호와의 손에 있고, 싸움의 이김도 여호와께 있다고 말합니다. 공의를 행하는 것이 제사보다 낫다는 말씀, 많은 재물보다 명예를 택하라는 권면, 아이에게 마땅히 행할 길을 가르치라는 교훈이 나옵니다. 이어지는 '지혜로운 자들의 말씀'은 술 취함과 악인의 형통을 부러워하지 말 것, 원수가 넘어질 때 기뻐하지 말 것, 게으른 자의 밭을 보며 훈계를 받으라고 합니다.","히스기야의 신하들이 편집한 솔로몬의 잠언입니다. 경우에 합당한 말, 원수가 배고파하면 먹이라는 교훈, 미련한 자와 게으른 자의 모습이 생생한 비유로 그려집니다. 내일 일을 자랑하지 말 것, 친구의 아픈 책망의 가치, 죄를 숨기지 말고 자복하고 버리라는 권면, 사람을 두려워하지 말고 여호와를 의지하라는 말씀이 이어집니다.","아굴은 자신이 거룩하신 자를 아는 지식이 없다고 고백하며, 하나님의 말씀은 다 순전하다고 말합니다. 그는 가난하게도 부하게도 말고 필요한 양식만 달라고 기도하고, 만족할 줄 모르는 것, 기이한 것, 작지만 지혜로운 것들을 숫자로 묶어 가르칩니다. 르무엘 왕의 어머니는 술을 삼가고 약한 자를 변호하라고 훈계하며, 여호와를 경외하는 현숙한 여인을 노래합니다.","예루살렘 왕 전도자는 \"헛되고 헛되며 헛되고 헛되니 모든 것이 헛되도다\"라고 선언합니다. 그는 지혜와 쾌락, 큰 사업과 재물을 모두 경험해 보았지만 해 아래의 모든 수고가 바람을 잡는 것 같다고 고백합니다. 이어 날 때와 죽을 때처럼 모든 일에 때가 있고, 하나님이 모든 것을 때를 따라 아름답게 하시며 사람에게 영원을 사모하는 마음을 주셨다고 말합니다."],["전도자는 학대받는 자들에게 위로자가 없고, 이웃의 시기를 받는 수고도 헛되다고 말합니다. 한 사람보다 두 사람이 낫다는 교훈과 함께, 하나님의 집에 들어갈 때 말을 적게 하고 서원한 것은 갚으며 하나님을 경외하라고 권합니다. 은을 사랑하는 자는 만족하지 못하고 사람은 벌거벗고 온 대로 돌아간다며, 하나님이 주신 몫을 누리는 것이 선물이라고 말합니다.","좋은 이름이 좋은 기름보다 낫고 초상집이 잔칫집보다 낫다는 역설적 지혜로 시작합니다. 전도자는 의인이 망하고 악인이 장수하는 모순을 보며, 선만 행하고 죄를 짓지 않는 의인은 세상에 없다고 말합니다. 하나님의 일을 사람이 다 알 수 없고 모든 것이 하나님의 손 안에 있으니, 주신 날 동안 기쁨으로 살고 손이 일을 얻는 대로 힘을 다하라고 권합니다.","작은 우매가 지혜를 망치고, 게으르면 집이 샌다는 교훈이 이어집니다. 네 떡을 물 위에 던지라며 결과를 다 알 수 없어도 아침저녁으로 씨를 뿌리라고 권하고, 청년에게 즐거워하되 하나님의 심판을 기억하라고 말합니다. 늙음을 그림처럼 묘사하며 청년의 때에 창조주를 기억하라고 하고, 하나님을 경외하고 그 명령을 지키는 것이 사람의 본분이라고 결론짓습니다.","솔로몬의 아가는 사랑하는 두 사람이 주고받는 노래입니다. 햇볕에 그을린 여인은 자신을 부끄러워하면서도 사랑하는 자를 찾고, 두 사람은 서로의 아름다움을 칭찬합니다. 겨울이 지나 함께 가자는 부름, 밤에 사랑하는 자를 찾아 헤매는 장면, 혼인날 솔로몬의 가마 행렬이 이어지고, 신랑은 신부를 흠 없는 잠근 동산에 비유합니다.","신부는 문을 두드리는 사랑하는 자에게 늦게 문을 열었다가 그를 놓치고, 성 안을 헤매며 찾습니다. 그녀는 예루살렘 딸들에게 사랑하는 자의 뛰어남을 묘사하고, 신랑은 다시 술람미 여자의 아름다움을 노래합니다. 두 사람은 서로에게 속하였음을 고백하고, 마지막에 \"사랑은 죽음 같이 강하고\" 많은 물도 끄지 못한다고 노래합니다.","이사야는 소도 임자를 아는데 이스라엘은 하나님을 알지 못한다고 고발합니다. 하나님은 손에 피가 가득한 채 드리는 제사를 싫어하시며, 죄가 주홍 같아도 눈과 같이 희게 하시겠다고 부르십니다. 말일에 만방이 여호와의 산으로 모여드는 환상과 교만한 자를 낮추시는 여호와의 날이 이어지고, 좋은 포도 대신 들포도를 맺은 포도원의 노래와 여섯 가지 화가 선포됩니다.","웃시야 왕이 죽던 해에 이사야는 높이 들린 보좌에 앉으신 주와 거룩하다를 외치는 스랍들을 봅니다. 입술이 부정하다고 탄식하는 그에게 스랍이 제단의 숯을 대어 죄가 사해졌다고 선언하고, 이사야는 \"내가 여기 있나이다 나를 보내소서\"라고 응답합니다. 하나님은 듣고도 깨닫지 못할 백성에게 그를 보내시며, 땅이 황폐해져도 거룩한 씨가 그루터기로 남을 것이라 하십니다."],["아람과 북이스라엘의 침략에 흔들리는 아하스에게 이사야는 굳게 믿으라고 하며, 처녀가 아들을 낳아 임마누엘이라 하리라는 징조를 줍니다. 그러나 앗수르가 큰 물처럼 유다를 덮을 것이 예고됩니다. 흑암에 행하던 백성이 큰 빛을 보고, 한 아기가 나서 평강의 왕으로 다윗의 왕좌에 앉으실 것이라는 약속, 이새의 줄기에서 나올 한 싹과 남은 자의 귀환, 구원의 노래가 이어집니다.","이사야는 여호와의 날에 교만한 바벨론이 메대 사람에게 멸망하여 소돔과 고모라처럼 될 것이라고 경고합니다. 하나님은 야곱을 긍휼히 여겨 회복시키시고, 하늘에 올라 지극히 높은 이와 같아지려던 바벨론 왕이 스올로 떨어졌다는 조롱의 노래가 이어집니다. 앗수르와 블레셋에 대한 심판에 이어, 교만한 모압의 멸망을 슬퍼하는 애가가 나옵니다.","다메섹과 에브라임이 무너지지만, 감람나무 끝에 열매 몇 개가 남듯 남은 자가 있어 지으신 이를 바라볼 것이라고 합니다. 구스는 여호와께 예물을 들고 시온으로 올 것이라 하고, 애굽은 우상과 지혜자들이 헛되이 무너지는 심판을 받습니다. 그러나 그 날에 애굽과 앗수르가 이스라엘과 함께 여호와를 경배하며 세계 중에 복이 되리라는 놀라운 약속이 나옵니다.","이사야는 삼 년 동안 벗은 몸과 벗은 발로 다니며 애굽과 구스가 앗수르에 끌려갈 것을 보여 줍니다. 바벨론의 함락, 두마와 아라비아에 대한 경고에 이어, 위기 앞에서 하나님을 바라보지 않고 먹고 마시는 예루살렘이 책망받습니다. 교만한 왕궁 관리 셉나 대신 엘리아김이 다윗의 집의 열쇠를 받고, 무역으로 부요하던 두로의 몰락이 선포됩니다.","율법을 범하고 영원한 언약을 깨뜨린 온 땅에 하나님의 심판이 임하여 땅이 흔들리고 황폐해집니다. 그러나 여호와께서 시온 산에서 만민을 위해 잔치를 베푸시고, 사망을 영원히 멸하시며 모든 얼굴에서 눈물을 씻기실 것이라고 노래합니다. 주를 신뢰하는 자를 평강으로 지키시고 죽은 자들이 살아나리라는 소망, 리워야단을 벌하시고 흩어진 백성을 모으시는 그 날이 예고됩니다.","술에 취한 에브라임의 지도자들과 사망과 언약했다고 큰소리치는 예루살렘의 오만한 자들에게 화가 선포됩니다. 하나님은 시온에 귀하고 견고한 기촛돌을 두시겠다고 하시며, 입술로만 공경하는 백성을 책망하십니다. 하나님께 묻지 않고 애굽의 도움을 구하는 자들에게 돌이켜 잠잠히 신뢰하라 하시고, 공의로 통치할 왕과 위에서 부어질 영, 여호와가 우리의 왕이 되시는 시온을 약속하십니다.","여호와께서 열방, 특히 에돔에게 진노하셔서 그 땅을 영영히 황폐하게 하실 것이 선포됩니다. 이어서 광야와 사막이 꽃처럼 피어나는 회복의 노래가 나옵니다. 하나님이 오셔서 구하실 때 맹인의 눈이 밝고 못 듣는 자의 귀가 열리며, 거룩한 대로로 여호와의 속량함을 받은 자들이 노래하며 시온에 돌아오고 슬픔과 탄식이 사라집니다."],["앗수르 왕 산헤립의 신하 랍사게가 예루살렘 앞에서 여호와를 조롱하고 산헤립이 다시 위협하는 글을 보내자, 히스기야는 그 글을 여호와 앞에 펴 놓고 기도합니다. 여호와의 사자가 앗수르 진영에서 십팔만 오천 명을 치고 산헤립은 돌아가 죽임을 당합니다. 죽을 병에 걸린 히스기야는 통곡하며 기도하여 생명을 십오 년 연장받지만, 바벨론 사신에게 보물을 다 보여 주었다가 포로가 될 미래를 듣게 됩니다.","하나님은 \"내 백성을 위로하라\" 하시며 예루살렘의 죄가 사함을 받았다고 선포하십니다. 광야에 여호와의 길을 예비하라는 외침, 풀은 마르나 하나님의 말씀은 영원하다는 선언, 여호와를 앙망하는 자는 새 힘을 얻는다는 약속이 이어집니다. 하나님은 택한 종을 소개하시고, 우상과 달리 홀로 창조주요 구속자이심을 밝히시며 고레스를 통해 예루살렘을 중건하실 것을 예고하십니다.","하나님은 고레스를 기름 부어 세우시고, 그를 통해 포로 된 백성을 값없이 놓아주며 하나님의 성읍을 건축하게 하시겠다고 하십니다. 나 외에 다른 신이 없다고 거듭 선포하시며 땅의 모든 끝을 향해 돌이켜 구원을 받으라고 부르십니다. 바벨론의 우상은 짐승에 실려 가지만 하나님은 백발이 되기까지 백성을 품으시며, 바벨론의 몰락과 함께 바벨론에서 나오라고 명령하십니다.","태에서부터 부름 받은 여호와의 종이 등장해, 야곱을 돌아오게 할 뿐 아니라 이방의 빛이 되어 하나님의 구원을 땅 끝까지 베풀 것이라고 말합니다. 버림받았다고 탄식하는 시온에게 하나님은 여인이 젖 먹는 자식을 잊을지라도 나는 너를 잊지 않겠다며, 손바닥에 너를 새겼다고 하십니다. 종은 아침마다 귀를 열어 순종하며, 때리는 자들에게 등을 맡기고 모욕과 침 뱉음을 당해도 물러서지 않습니다.","하나님은 아브라함을 기억하라 하시며 시온의 황폐한 곳을 에덴처럼 회복하시고, 분노의 잔을 예루살렘의 손에서 거두겠다고 하십니다. 좋은 소식을 전하는 자의 발이 아름답다는 노래에 이어, 멸시받고 버림받은 여호와의 종이 우리의 허물과 죄악을 대신 지는 모습이 그려집니다. \"그가 찔림은 우리의 허물 때문이요\"라는 고백 뒤에, 시온의 회복과 목마른 자는 값없이 와서 마시라는 초청이 이어집니다.","하나님은 여호와와 연합하여 언약을 붙드는 이방인과 고자도 성산으로 인도하시고, 내 집은 만민이 기도하는 집이라 일컬어질 것이라 하십니다. 게으른 지도자들과 우상숭배를 책망하시며, 형식적인 금식 대신 억눌린 자를 풀어 주고 주린 자와 나누는 금식을 원하십니다. 죄가 하나님과 백성 사이를 갈라놓았으나 구속자가 시온에 임하실 것이라 하십니다.","\"일어나라 빛을 발하라\"는 부름으로 시작해, 여호와의 영광이 시온에 임하여 나라들과 왕들이 그 빛으로 나아오고 여호와가 영원한 빛이 되실 것을 노래합니다. 주 여호와의 영이 임한 이가 가난한 자에게 아름다운 소식을, 포로된 자에게 자유를, 슬픈 자에게 위로를 선포합니다. 하나님은 시온을 위해 잠잠하지 않으시며, 버림받은 자라 불리던 시온을 헵시바라 부르시고 신랑이 신부를 기뻐하듯 기뻐하십니다."],["에돔 보스라에서 붉은 옷을 입고 오시는 여호와께서 홀로 포도즙틀을 밟듯 원수를 심판하십니다. 백성은 옛 은혜를 기억하며 하늘을 가르고 강림해 달라고 회개의 기도를 드립니다. 하나님은 패역한 자는 벌하시되 남은 종들을 위해 새 하늘과 새 땅, 즐거운 예루살렘을 창조하시고, 뭇 나라를 모아 그 영광을 보게 하겠다고 약속하십니다.","요시야 왕 때 아나돗의 제사장 힐기야의 아들 예레미야가 선지자로 부름을 받습니다. 자신은 아이라 말할 줄 모른다고 하자 하나님은 그 입에 말씀을 두시고, 살구나무 가지와 북에서 기울어진 끓는 가마 환상을 보여 주십니다. 이스라엘은 생수의 근원을 버리고 터진 웅덩이를 판 백성으로 고발되고, 하나님은 배역한 자식들에게 돌아오라고 부르십니다.","하나님은 마음의 할례를 행하고 돌아오라 하시며, 북방에서 사자 같은 멸망자가 오고 있다고 경고하십니다. 예루살렘 거리에서 정의를 행하는 자를 한 사람이라도 찾으면 용서하겠다고 하시지만 찾을 수 없습니다. 선지자와 제사장은 평강이 없는데도 평강하다고 말하고, 백성은 옛적 선한 길로 가라는 말씀과 파수꾼의 나팔 소리를 거절합니다.","예레미야는 성전 문에 서서, 성전이 있다는 것만 믿지 말고 길과 행위를 바르게 하라고 외칩니다. 백성은 하늘의 여왕을 섬기고 도벳에서 자녀를 불사르며 돌아오기를 거절하고, 예레미야는 죽임 당한 백성을 위해 밤낮 울고 싶다고 탄식합니다. 하나님은 지혜나 힘이나 부가 아니라 여호와를 아는 것을 자랑하라 하시고, 사람이 만든 우상과 살아 계신 참 하나님을 대조하십니다.","백성이 조상과 맺은 언약을 깨뜨리고 다른 신들을 섬겼으므로 하나님은 피할 수 없는 재앙을 선언하십니다. 고향 아나돗 사람들이 예레미야를 죽이려 하자 그는 악인이 형통한 까닭을 묻고, 하나님은 더 큰 시련을 각오하라고 답하십니다. 유브라데 물가 바위 틈에 감춘 베 띠가 썩은 것처럼 유다의 교만도 썩게 하시겠다고 하시며 포로로 잡혀갈 것을 경고하십니다.","심한 가뭄 속에 백성이 부르짖지만 하나님은 모세와 사무엘이 구해도 돌이키지 않겠다고 하시고, 평강을 외치는 거짓 선지자들을 심판하십니다. 고통을 호소하는 예레미야에게 하나님은 돌아오면 그를 입으로 삼고 놋 성벽이 되게 하겠다고 하십니다. 결혼과 초상집·잔칫집 출입을 금하는 표징이 주어지고, 사람을 믿는 자와 여호와를 의지하는 자의 차이, 안식일을 거룩히 지키라는 말씀이 이어집니다.","토기장이 집에서 하나님은 진흙이 토기장이 손에 있듯 이스라엘이 자기 손에 있다며 돌이키라 하시지만, 백성은 거절합니다. 예레미야는 힌놈의 아들의 골짜기에서 옹기를 깨뜨리며 예루살렘의 멸망을 선포합니다. 바스훌이 그를 때리고 나무 고랑에 채우자, 예레미야는 말씀이 마음속에 불붙는 것 같아 견딜 수 없다고 고백하며 자기 생일을 저주할 만큼 괴로워합니다."],["느부갓네살이 쳐들어오자 시드기야가 도움을 구하지만, 하나님은 성을 바벨론에 넘기겠다며 생명의 길과 사망의 길을 제시하십니다. 정의를 행하지 않은 살룸, 여호야김, 고니야 등 유다 왕들에게 심판이 선언되고, 양 떼를 흩은 목자들과 거짓 선지자들이 책망받습니다. 그러나 하나님은 다윗에게서 의로운 가지를 일으키겠다고 약속하시고, 무화과 두 광주리 환상으로 포로 된 자들을 돌보시겠다고 하십니다.","예레미야는 23년 동안 전한 말씀을 듣지 않은 유다가 칠십 년 동안 바벨론 왕을 섬길 것이며, 그 뒤에 바벨론도 벌을 받을 것이라고 예언합니다. 여러 나라가 하나님의 진노의 술잔을 마시게 됩니다. 성전이 실로처럼 된다는 예언 때문에 예레미야는 죽을 위기에 처하지만 장로들의 변호와 아히감의 도움으로 살아나고, 목에 멍에를 메고 바벨론 왕을 섬기라고 전합니다.","시드기야 4년, 선지자 하나냐는 2년 안에 바벨론의 멍에가 꺾이고 포로가 돌아온다고 예언하며 예레미야의 나무 멍에를 꺾습니다. 예레미야는 하나님이 쇠 멍에를 메우실 것이라 전하고, 하나냐는 그 해에 죽습니다. 예레미야는 바벨론 포로들에게 편지를 보내 그곳에서 집을 짓고 그 성읍의 평안을 구하라 하며, 칠십 년이 차면 돌아오게 하시리라는 약속을 전합니다.","하나님은 회복의 말씀을 책에 기록하게 하시고, 야곱의 환난 뒤에 포로를 돌아오게 하며 상처를 고치시겠다고 약속하십니다. 영원한 사랑으로 이스라엘을 이끄신 하나님은 법을 마음에 기록하는 새 언약을 맺겠다고 하십니다. 시위대 뜰에 갇힌 예레미야는 아나돗의 밭을 사서 회복의 증표로 삼고 다윗의 공의로운 가지 약속을 듣지만, 풀어 준 노비를 다시 잡아들인 백성에게는 심판이 선언됩니다.","하나님은 예레미야를 시켜 레갑 사람들에게 포도주를 권하게 하시는데, 그들은 조상 요나답의 명령을 지켜 거절합니다. 하나님은 이들의 순종을 말씀을 듣지 않는 유다와 대조하십니다. 여호야김 때 바룩이 예레미야가 불러 준 말씀을 두루마리에 기록해 낭독하자, 왕은 그것을 면도칼로 베어 화로에 태웁니다. 하나님은 다시 두루마리를 쓰게 하시고 여호야김에게 심판을 선언하십니다.","바벨론 군대가 잠시 물러간 사이 예레미야는 항복하려 한다는 누명을 쓰고 갇히고, 고관들은 그를 진창 구덩이에 던집니다. 구스인 내시 에벳멜렉이 왕의 허락을 받아 그를 끌어냅니다. 시드기야는 몰래 말씀을 묻고도 항복하지 못하고, 결국 예루살렘이 함락되어 아들들이 그의 눈앞에서 죽고 그는 눈이 뽑힌 채 끌려갑니다. 예레미야는 그다랴에게 맡겨지고, 에벳멜렉은 구원의 약속을 받습니다.","풀려난 예레미야는 미스바의 총독 그다랴 곁에 머물지만, 이스마엘이 그다랴를 죽입니다. 남은 무리가 갈 길을 묻자, 하나님은 유다 땅에 남으면 살고 애굽으로 가면 망한다고 답하십니다. 그러나 그들은 그 말씀을 거짓이라 하며 예레미야와 바룩을 데리고 애굽 다바네스로 내려가고, 거기서도 하늘의 여왕에게 분향하겠다고 고집합니다. 하나님은 낙심한 바룩에게 생명을 지켜 주겠다고 하십니다."],["예레미야는 이방 나라들에 대한 심판을 선포합니다. 갈그미스에서 패한 애굽은 느부갓네살에게 넘겨지고, 블레셋은 북쪽에서 밀려오는 물에 휩쓸립니다. 자기 업적과 그모스를 의지한 모압, 재물을 자랑한 암몬, 바위 틈에 살며 교만한 에돔, 그리고 다메섹과 게달과 하솔과 엘람도 벌을 받습니다. 그러나 하나님은 야곱을 구원하겠다고 하시고, 모압과 암몬과 엘람의 포로도 훗날 돌아오게 하겠다고 하십니다.","하나님은 온 세계를 취하게 하던 바벨론이 북쪽에서 온 나라에게 함락되어 황무지가 될 것이라 하시고, 자기 백성에게 그곳에서 도망하여 나오라고 하십니다. 예레미야는 이 말씀을 책에 써서 스라야에게 주어 바벨론에서 읽고 유브라데 강에 던지게 합니다. 끝으로 예루살렘 함락과 성전 파괴, 그리고 여호야긴이 옥에서 풀려나 바벨론 왕 앞에서 먹게 된 일이 기록됩니다.","무너진 예루살렘이 과부처럼 홀로 앉아 밤새 울지만 위로할 자가 없다고 노래합니다. 시인은 이 고통이 많은 죄 때문에 여호와께서 진노하신 결과임을 인정하고, 성벽과 성소가 무너지고 어린아이들이 거리에서 굶주려 쓰러지는 참상을 그립니다. 헛된 묵시를 본 선지자들을 탄식하며, 밤낮 주 앞에 마음을 물 쏟듯 부르짖으라고 권합니다.","시인은 하나님의 진노 아래 어둠 속에 갇힌 듯한 고통을 토로하다가, 여호와의 인자와 긍휼이 무궁하여 아침마다 새롭다는 사실을 떠올리며 소망을 붙듭니다. 스스로 행위를 돌아보고 여호와께 돌아가자고 권합니다. 이어 순금 같던 시온의 자녀들이 굶주림과 수치 속에 쓰러진 모습을 슬퍼하고, 마지막으로 우리를 주께로 돌이켜 날들을 옛적같이 새롭게 해 달라고 기도합니다.","포로가 된 지 5년째, 제사장 에스겔이 그발 강 가에서 네 생물과 바퀴, 그리고 보좌 위에 사람 모양으로 나타난 여호와의 영광을 봅니다. 하나님은 그를 인자라 부르시며 패역한 이스라엘에게 보내시고, 애가와 재앙의 말이 적힌 두루마리를 먹게 하시니 꿀같이 답니다. 이어 그를 이스라엘 족속의 파수꾼으로 세우시고, 악인을 깨우치지 않으면 그 피 값을 그에게서 찾겠다고 하십니다.","하나님은 에스겔에게 토판에 예루살렘을 그려 포위하는 시늉을 하게 하시고, 왼쪽으로 390일, 오른쪽으로 40일 누워 백성의 죄악을 담당하게 하십니다. 달아서 먹는 떡은 포위된 성의 기근을, 셋으로 나눈 머리털은 전염병과 칼과 흩어짐을 보여 줍니다. 이스라엘 산들의 산당과 우상이 무너지고, 끝이 왔으니 은과 금도 그들을 건지지 못한다고 하십니다.","에스겔은 환상 중에 예루살렘 성전에서 질투의 우상, 우상 앞에서 분향하는 장로들, 담무스를 위해 우는 여인들, 태양에게 절하는 사람들을 봅니다. 하나님은 탄식하며 우는 자의 이마에 표를 그리게 하신 뒤 성읍을 심판하십니다. 여호와의 영광은 그룹들과 함께 성전을 떠나 성읍 동쪽 산에 머무르고, 흩어진 자들에게는 새 영과 부드러운 마음을 주겠다고 약속하십니다."],["에스겔은 포로의 행장을 메고 성벽을 뚫고 나가는 표징으로 왕과 백성이 사로잡혀 갈 것을 보여 줍니다. 하나님은 평강이 없는데 평강을 외치며 담에 회칠하는 거짓 선지자들과 영혼을 사냥하는 여자들을 책망하십니다. 마음에 우상을 둔 장로들에게는 노아와 다니엘과 욥이 있어도 자기만 건질 것이라 하시고, 쓸모없는 포도나무처럼 예루살렘을 불에 던지겠다고 하십니다.","하나님은 들에 버려진 피투성이 아기를 살려 왕후로 삼았으나 받은 영화로 우상과 행음한 예루살렘의 이야기를 들려주십니다. 그래도 하나님은 어렸을 때 세운 언약을 기억하고 영원한 언약을 세우겠다고 하십니다. 두 독수리와 포도나무 비유로 언약을 배반한 왕을 심판하시고, 범죄하는 그 영혼이 죽는다며 돌이켜 살라고 하십니다. 이어 이스라엘 고관들을 위한 애가가 나옵니다.","장로들이 여호와께 물으러 오자, 하나님은 애굽과 광야와 가나안에서 이스라엘이 거듭 반역했지만 자기 이름을 위해 멸하지 않으셨던 역사를 되짚으시고, 흩어진 백성을 모아 거룩한 산에서 섬기게 하겠다고 하십니다. 이어 남쪽 숲을 태우는 불과 칼집에서 뽑힌 칼로 예루살렘의 심판을 선포하시고, 바벨론 왕이 갈림길에서 점을 쳐 예루살렘으로 오게 될 것을 예언하십니다.","하나님은 피를 흘리고 우상으로 더럽혀진 예루살렘을 풀무 불에 찌꺼기를 녹이듯 심판하겠다고 하시며, 성 무너진 데를 막아설 사람을 찾지 못하셨다고 하십니다. 사마리아와 예루살렘은 음행한 두 자매 오홀라와 오홀리바로 그려지고, 바벨론 왕이 다가온 날 녹슨 가마 비유가 주어집니다. 에스겔은 아내가 죽어도 슬퍼하지 말라는 명령을 받아 성소를 잃을 백성의 표징이 됩니다.","하나님은 예루살렘의 멸망을 기뻐한 암몬, 유다를 이방과 다름없다 한 모압, 원수를 갚은 에돔, 옛 원한을 품은 블레셋을 심판하십니다. 예루살렘의 멸망을 자기 이익으로 여긴 무역 도시 두로는 느부갓네살에게 무너져 맨 바위가 될 것이고, 화려한 배 같던 두로를 위한 애가가 불립니다. 스스로 신이라 하며 교만해진 두로 왕과 시돈도 심판받고, 흩어진 이스라엘은 다시 모여 평안히 살게 됩니다.","하나님은 나일 강을 자기 것이라 자랑하는 바로를 강 속의 큰 악어에 빗대어 심판하시고, 이스라엘이 의지했던 애굽이 부러지는 갈대 지팡이였다고 하십니다. 애굽은 느부갓네살에게 넘겨져 황폐해지고 바로의 팔은 꺾입니다. 구름에 닿을 만큼 높았다가 교만으로 찍힌 앗수르 백향목처럼 바로도 스올로 내려가며, 앗수르와 엘람과 에돔 등 칼에 죽은 나라들과 함께 눕게 될 것이라는 애가가 이어집니다.","하나님은 에스겔을 다시 파수꾼으로 세우시며, 악인이 죽는 것을 기뻐하지 않으시니 돌이켜 살라고 부르십니다. 예루살렘 함락 소식이 전해지던 날 에스겔의 입이 열립니다. 하나님은 자기만 먹은 이스라엘 목자들을 책망하시고, 친히 목자가 되어 잃어버린 양을 찾으며 내 종 다윗을 한 목자로 세우겠다고 약속하십니다. 이스라엘 땅을 탐낸 세일 산 에돔은 황폐하게 됩니다."],["하나님은 자기 거룩한 이름을 위해 흩어진 백성을 모아 맑은 물로 씻고 새 영과 새 마음을 주겠다고 약속하십니다. 에스겔이 마른 뼈들에게 대언하자 생기가 들어가 큰 군대가 되고, 두 막대기가 하나 되듯 유다와 이스라엘이 한 왕 다윗 아래 하나가 됩니다. 마곡의 곡이 평안히 사는 이스라엘을 치러 오지만 하나님이 그들을 멸하시고 이스라엘에게 영을 쏟아 주십니다.","사로잡힌 지 스물다섯째 해, 에스겔은 이상 중에 이스라엘의 높은 산으로 이끌려 갑니다. 놋 같이 빛난 사람이 측량하는 장대로 성전의 바깥 문과 안뜰 문, 뜰과 방들, 성소와 지성소를 하나하나 재고, 제사장들의 거룩한 방을 보여 준 뒤 사방 오백 척의 담을 측량합니다.","여호와의 영광이 동쪽 문으로 들어와 성전에 가득하고, 하나님은 이곳이 백성 가운데 영원히 있을 보좌의 처소라고 말씀하십니다. 이어 제단의 크기와 봉헌 제사, 사독 자손 제사장과 레위인의 직분, 거룩한 땅의 구역, 군주의 의무와 절기와 매일 드리는 제사의 규례가 주어집니다.","성전 문지방 밑에서 물이 나와 발목, 무릎, 허리를 지나 건널 수 없는 강이 되고, 그 강이 이르는 곳마다 생물이 살아나며 강가의 나무는 달마다 열매를 맺습니다. 이어 열두 지파의 땅 경계와 몫, 거룩한 구역이 정해지고, 열두 문이 있는 성읍의 이름을 '여호와삼마'라 부르게 됩니다.","바벨론에 끌려간 다니엘과 세 친구는 왕의 음식으로 자신을 더럽히지 않기로 하고 채식으로도 더 건강해져 지혜가 뛰어남을 인정받습니다. 느부갓네살이 꿈을 꾸고 아무도 풀지 못하자, 다니엘이 기도로 알게 된 신상의 꿈과 해석을 전합니다. 손대지 아니한 돌이 신상을 부수고 온 세계에 가득하게 되듯, 하나님이 영원한 나라를 세우신다는 내용입니다.","느부갓네살이 두라 평지에 금 신상을 세우고 절하게 하자, 사드락과 메삭과 아벳느고는 절하지 않아 풀무불에 던져집니다. 그러나 불 가운데 네 사람이 다니고 세 사람은 머리털도 그을리지 않았습니다. 이후 느부갓네살은 큰 나무가 베이는 꿈대로 교만하다가 짐승처럼 들에서 살게 되고, 총명이 돌아오자 하늘의 왕을 찬양합니다.","벨사살 왕이 예루살렘 성전의 그릇으로 술을 마시며 우상을 찬양할 때, 손가락이 나타나 벽에 글자를 씁니다. 다니엘은 왕의 나라가 끝나고 메대와 바사에게 넘어간다고 해석하고, 그 밤에 벨사살이 죽습니다. 다리오 때에 다니엘은 금령을 알고도 하루 세 번 기도하다 사자 굴에 던져지지만 하나님이 천사를 보내 사자들의 입을 봉하십니다."],["다니엘은 바다에서 나오는 네 짐승과 큰 말을 하는 작은 뿔, 그리고 옛적부터 항상 계신 이의 심판을 환상으로 봅니다. 인자 같은 이가 하늘 구름을 타고 와서 영원한 권세와 나라를 받습니다. 이어 두 뿔 가진 숫양과 숫염소의 환상을 보고, 가브리엘이 이것이 메대와 바사, 헬라 왕을 가리킨다고 풀어 줍니다.","다니엘은 예레미야의 칠십 년 예언을 깨닫고 백성의 죄를 자복하며 주의 긍휼을 구합니다. 가브리엘이 와서 일흔 이레의 계시를 전하고, 힛데겔 강가에서 세마포 옷 입은 이가 나타나 남방 왕과 북방 왕의 긴 전쟁을 알려 줍니다. 마지막 때에 큰 환난이 있으나 책에 기록된 자는 구원받고, 자는 자들이 깨어나 영생이나 영원한 부끄러움을 받게 됩니다.","하나님은 호세아에게 음란한 여자 고멜을 아내로 맞게 하시고, 자녀들의 이름을 이스르엘, 로루하마, 로암미라 지어 하나님을 떠난 이스라엘의 심판을 알리십니다. 바알을 따른 아내 같은 이스라엘을 벌하시지만, 결국 거친 들로 데려가 위로하고 다시 장가 들어 내 백성 아니었던 자를 내 백성이라 부르겠다고 약속하십니다.","호세아는 음녀가 된 그 여자를 다시 사랑하라는 명령을 받고, 은과 보리로 그를 사 옵니다. 이어 하나님은 이 땅에 진실과 인애와 하나님을 아는 지식이 없고, 제사장과 백성이 우상과 음행에 빠졌다고 책망하십니다. 백성은 여호와께 돌아가자고 말하지만 그 인애는 아침 이슬처럼 사라지고, 하나님은 \"나는 인애를 원하고 제사를 원하지 아니하며\"라고 말씀하십니다.","이스라엘은 하나님 없이 왕을 세우고 사마리아의 송아지 우상을 섬기며 앗수르와 애굽을 의지했기에, 바람을 심고 광풍을 거두듯 포로로 끌려가게 됩니다. 그러나 하나님은 어린 이스라엘을 사랑하여 애굽에서 불러내고 사랑의 줄로 이끄셨던 일을 떠올리시며, 에브라임을 차마 버리지 못하는 긍휼을 보이십니다.","하나님은 형과 겨루던 야곱의 역사를 들어 거짓 저울과 우상 숭배에 빠진 에브라임을 책망하시고, 자신 외에는 구원자가 없다고 하십니다. 그러면서도 스올과 사망에서 그들을 속량하겠다고 하십니다. 마지막으로 이스라엘에게 말씀을 가지고 돌아오라고 부르시며, 반역을 고치고 기쁘게 사랑하여 백합화와 백향목처럼 회복시키겠다고 약속하십니다.","메뚜기 떼가 땅을 휩쓸어 곡식과 포도나무가 말라 버리자, 요엘은 이를 여호와의 날의 경고로 보고 금식하며 돌아오라고 외칩니다. \"옷을 찢지 말고 마음을 찢고\" 돌아오면 하나님이 땅을 회복하시고, 그 후에 하나님의 영을 만민에게 부어 주실 것입니다. 마지막에 여호사밧 골짜기에서 열방을 심판하시고 시온에 거하십니다."],["드고아 목자 아모스는 다메섹, 가사, 두로, 에돔, 암몬, 모압의 서너 가지 죄를 차례로 고발하며 하나님의 불 심판을 선포합니다. 이어 율법을 멸시한 유다를 꾸짖고, 마지막으로 은을 받고 의인을 팔며 가난한 자를 짓밟은 이스라엘을 가장 길게 고발합니다. 애굽에서 이끌어 내신 은혜를 잊은 그들은 그 날에 피할 곳이 없습니다.","하나님은 땅의 모든 족속 가운데 이스라엘만을 알았기에 그 죄를 보응하신다고 하십니다. 가난한 자를 학대하는 사마리아의 부자들, 벧엘과 길갈의 형식적 제사, 여러 재앙에도 돌아오지 않은 백성을 책망하시며 여호와를 찾으면 살리라고 부르십니다. 절기와 제물 대신 \"오직 정의를 물 같이, 공의를 마르지 않는 강 같이 흐르게 할지어다\"라고 요구하십니다.","아모스는 메뚜기와 불의 환상을 보고 중보하여 재앙이 멈추지만, 다림줄과 여름 과일 광주리의 환상으로 이스라엘의 끝이 이르렀음을 듣습니다. 벧엘의 제사장 아마샤가 예언을 막자 아모스는 자신이 목자였으나 하나님이 보내셨다고 답합니다. 말씀을 듣지 못하는 기갈이 오겠지만, 마지막에 하나님은 다윗의 무너진 장막을 일으키고 백성을 회복하겠다고 약속하십니다.","오바댜는 교만한 에돔이 형제 야곱의 환난 날에 방관하고 약탈한 죄로 멸망한다고 선포합니다. 요나는 니느웨로 가라는 명령을 피해 도망하다 바다에 던져져 큰 물고기 뱃속에서 사흘 동안 기도합니다. 다시 부름받아 외치자 니느웨가 회개하고, 하나님은 박넝쿨을 통해 화내는 요나에게 그 큰 성읍을 아끼시는 마음을 보여 주십니다.","미가는 사마리아와 예루살렘의 우상 숭배 때문에 여호와께서 심판하러 오신다고 선포합니다. 밭과 집을 탐하여 빼앗는 자들, 백성의 살을 뜯는 지도자들, 돈을 위해 예언하는 선지자들을 고발하며 시온이 갈아엎은 밭이 되리라고 말합니다. 그러나 끝날에는 민족들이 여호와의 산으로 몰려와 말씀을 배우고, 칼을 쳐서 보습을 만드는 평화가 올 것입니다.","미가는 작은 베들레헴 에브라다에서 이스라엘을 다스릴 자가 나오리라고 예언합니다. 하나님은 자기 백성과 변론하시며 많은 제물보다 \"오직 정의를 행하며 인자를 사랑하며 겸손하게 네 하나님과 함께 행하는 것\"을 원하신다고 말씀하십니다. 부패한 사회를 탄식하던 미가는 죄를 깊은 바다에 던지시는 하나님을 바라보며 고백합니다.","나훔은 질투하시며 보복하시는 하나님이 니느웨를 심판하신다고 선포합니다. 여호와는 노하기를 더디하시지만 벌 받을 자를 내버려두지 않으시며, 유다에게 지운 앗수르의 멍에를 깨뜨리십니다. 붉은 방패의 군대가 니느웨를 쳐서 약탈하고, 피의 성 니느웨는 노아몬처럼 무너져 고칠 수 없는 상처를 입습니다."],["하박국은 왜 악을 내버려두시느냐고 묻고, 하나님은 갈대아 사람을 일으켜 심판하겠다고 답하십니다. 더 악한 자가 의인을 삼키는 것을 묻자, 하나님은 묵시는 더디어도 반드시 이루어진다며 \"의인은 그의 믿음으로 말미암아 살리라\"고 말씀하시고 갈대아 사람에게 다섯 가지 화를 선포하십니다. 하박국은 무화과나무가 무성하지 못하고 포도나무에 열매가 없어도 여호와로 즐거워하겠다고 노래합니다.","요시야 시대에 스바냐는 바알과 별을 섬기며 여호와를 찾지 않는 유다에 분노의 날인 여호와의 날이 가깝다고 경고합니다. 겸손한 자들에게 여호와를 찾고 공의와 겸손을 구하라고 권하며, 블레셋과 모압, 암몬, 구스, 앗수르의 심판도 선포합니다. 마지막에 하나님은 교만한 자를 제거하고 곤고한 남은 자를 모아, 그들 가운데 계시며 기뻐 노래하시겠다고 약속하십니다.","포로에서 돌아온 백성이 자기 집만 짓고 성전 건축을 미루자, 학개는 많이 뿌려도 거두는 것이 적은 까닭이 여기에 있다고 일깨웁니다. 스룹바벨과 대제사장 여호수아와 백성이 말씀을 듣고 공사를 시작하고, 하나님은 함께하겠다고 하시며 이 성전의 나중 영광이 이전 영광보다 크리라고 약속하십니다. 스룹바벨은 하나님의 인장으로 세워집니다.","스가랴는 하나님께 돌아오라고 외친 뒤 밤에 여러 환상을 봅니다. 말 탄 자들, 네 뿔과 대장장이, 측량줄, 더러운 옷을 벗고 정결한 관을 쓰는 대제사장 여호수아, 순금 등잔대와 두 감람나무, 날아가는 두루마리, 에바 속 여인, 네 병거입니다. 하나님은 성전 건축이 힘이나 능력이 아니라 하나님의 영으로 된다고 하시고, 싹이라 이름하는 사람이 성전을 건축하리라고 하십니다.","벧엘 사람들이 금식을 계속해야 하느냐고 묻자, 하나님은 그 금식이 정말 하나님을 위한 것이었냐고 되물으시며 진실한 재판과 인애와 긍휼을 요구하십니다. 이어 시온에 돌아와 예루살렘 가운데 거하겠다고 약속하시고, 금식의 날들이 기쁨의 절기로 바뀌며 많은 나라 사람들이 유다 사람의 옷자락을 잡고 여호와를 찾아오리라고 말씀하십니다.","하나님은 두로와 블레셋 등 주변 나라를 심판하시고, 공의로우시며 겸손하여 나귀 새끼를 타고 오시는 왕을 약속하십니다. 목자 없는 양 같은 백성을 모아 회복시키겠다고 하시지만, 이어 선지자는 잡혀 죽을 양 떼를 치는 목자가 되어 은총이라는 막대기를 꺾습니다. 백성은 그의 품삯으로 은 삼십 개를 주고, 그는 그것을 여호와의 전에서 토기장이에게 던진 뒤 연합이라는 막대기마저 꺾습니다.","하나님은 예루살렘을 치러 오는 나라들을 멸하시고, 다윗의 집에 은총과 간구하는 심령을 부어 주셔서 그들이 찌른 자를 바라보며 애통하게 하십니다. 그 날에 죄와 더러움을 씻는 샘이 열리고, 목자가 맞아 양이 흩어지지만 남은 자는 연단을 받습니다. 여호와께서 감람 산에 서시고 생수가 예루살렘에서 솟아나며, 여호와께서 천하의 왕이 되십니다."],["하나님은 이스라엘을 사랑한다고 하시지만, 백성과 제사장들은 흠 있는 제물을 드리고 이방 여인과 결혼하며 어려서 맞은 아내를 버립니다. 하나님은 길을 준비할 사자를 보내고 언약의 사자가 성전에 임하리라고 하시며, 온전한 십일조를 드리라고 하십니다. 여호와를 경외하는 자에게는 공의로운 해가 떠오르고, 크고 두려운 날 전에 선지자 엘리야를 보내시겠다고 약속하십니다.","마태는 아브라함과 다윗의 자손 예수 그리스도의 계보로 시작합니다. 성령으로 잉태된 마리아에게서 예수님이 나시고, 동방 박사들이 별을 따라와 경배하지만 헤롯이 아기를 죽이려 하자 요셉은 애굽으로 피했다가 나사렛에 정착합니다. 세례 요한이 회개를 외치는 가운데 예수님이 세례를 받으시고, 광야에서 마귀의 시험을 말씀으로 이기신 뒤 갈릴리에서 천국 복음을 전하며 제자들을 부르십니다.","예수님은 산에 올라 심령이 가난한 자, 애통하는 자, 온유한 자 등이 복이 있다고 가르치시고, 제자들을 세상의 소금과 빛이라 부르십니다. 율법을 완전하게 하러 오셨다며 분노, 음욕, 맹세, 보복, 원수 사랑에 대해 더 깊은 의를 가르치시고, 은밀한 구제와 기도, 주기도, 먼저 그의 나라와 의를 구하라는 말씀을 주신 뒤 반석 위의 집 비유로 마치십니다.","예수님은 나병환자와 백부장의 하인을 고치시고, 풍랑을 잠잠하게 하시며, 가다라 지방에서 귀신을 쫓아내십니다. 중풍병자의 죄를 사하시고 세리 마태를 부르시며 \"나는 의인을 부르러 온 것이 아니요 죄인을 부르러 왔노라\"고 하십니다. 관리의 죽은 딸을 살리시고 혈루증 여인과 맹인들을 고치시며, 목자 없는 양 같은 무리를 불쌍히 여기십니다.","예수님은 열두 제자에게 권능을 주어 이스라엘의 잃어버린 양에게 보내시며 박해를 두려워하지 말고 자기 십자가를 지고 따르라고 하십니다. 옥에 갇힌 세례 요한의 물음에 하신 일로 답하시고, 회개하지 않는 고을들을 책망하시며 수고하고 무거운 짐 진 자들을 부르십니다. 안식일 논쟁과 바알세불 논란 속에서 자신이 안식일의 주인이요 요나와 솔로몬보다 더 큰 이라고 말씀하십니다.","예수님은 바닷가에서 무리에게 씨 뿌리는 자의 비유를 말씀하시고, 제자들에게 길가, 돌밭, 가시떨기, 좋은 땅의 뜻을 풀어 주십니다. 이어 가라지, 겨자씨, 누룩, 밭에 감추인 보화, 값진 진주, 그물의 비유로 천국을 설명하십니다. 그러나 고향 나사렛 사람들은 목수의 아들이라며 예수님을 배척하고, 그들이 믿지 않아 거기서는 많은 능력을 행하지 않으십니다.","헤롯이 세례 요한의 목을 벤 뒤, 예수님은 오병이어로 오천 명을 먹이시고 바다 위를 걸으십니다. 장로들의 전통을 따지는 바리새인들을 책망하시고, 가나안 여자의 믿음을 칭찬하시며, 사천 명을 먹이십니다. 베드로가 주는 그리스도시요 살아 계신 하나님의 아들이라고 고백하자, 예수님은 고난과 부활을 처음 말씀하시고 높은 산에서 변형되십니다."],["예수님은 어린 아이처럼 자기를 낮추는 자가 천국에서 크다고 하시고, 잃은 양을 찾는 목자와 형제를 권면하고 용서하는 법을 가르치십니다. 만 달란트 빚을 탕감받고도 동료를 용서하지 않은 종의 비유를 말씀하시고, 이혼 문제와 재물 많은 청년, 포도원 품꾼의 비유를 통해 천국의 원리를 보여 주십니다. 세 번째로 수난을 예고하시고, 여리고에서 맹인 두 사람의 눈을 뜨게 하십니다.","예수님은 나귀 새끼를 타고 예루살렘에 들어가시고 무리는 호산나를 외칩니다. 성전에서 장사하는 자들을 내쫓으시고 열매 없는 무화과나무를 마르게 하시며, 두 아들, 악한 농부, 혼인 잔치의 비유로 종교 지도자들을 꾸짖으십니다. 세금, 부활, 가장 큰 계명에 관한 질문에 답하신 뒤, 외식하는 서기관과 바리새인들에게 일곱 번 화를 선포하시고 예루살렘을 향해 탄식하십니다.","성전이 무너지리라는 예수님의 말씀에 제자들이 끝의 징조를 묻자, 예수님은 미혹과 전쟁과 박해, 큰 환난이 있을 것이며 복음이 온 세상에 전파된 뒤 인자가 구름을 타고 큰 영광으로 오리라고 말씀하십니다. 그 날과 그 때는 아무도 모르니 깨어 있으라고 하시며, 열 처녀와 달란트 비유, 양과 염소를 구분하는 최후 심판의 말씀을 주십니다.","한 여자가 예수님께 향유를 붓고, 유다는 은 삼십에 예수님을 팝니다. 예수님은 마지막 만찬에서 떡과 잔으로 언약의 피를 말씀하시고, 겟세마네에서 기도하신 뒤 잡히십니다. 베드로는 세 번 부인하고, 예수님은 빌라도에게 넘겨져 십자가에 못 박혀 죽으십니다. 안식 후 첫날 천사가 여자들에게 부활을 알리고, 예수님은 갈릴리에서 제자들에게 모든 민족을 제자로 삼으라고 명하십니다.","마가는 하나님의 아들 예수 그리스도의 복음의 시작을 세례 요한의 외침으로 엽니다. 세례를 받고 광야에서 시험을 받으신 예수님은 하나님 나라가 가까이 왔다고 전하시며 어부들을 부르시고, 가버나움에서 귀신을 쫓고 병자를 고치십니다. 중풍병자의 죄를 사하시고 레위를 부르시며 안식일의 주인이심을 보이시지만, 바리새인들은 예수님을 죽일 의논을 하고, 예수님은 열두 제자를 세우십니다.","예수님은 바닷가에서 씨 뿌리는 자의 비유를 말씀하시고, 등불, 스스로 자라는 씨, 겨자씨 비유로 하나님 나라를 가르치십니다. 광풍을 꾸짖어 바다를 잔잔하게 하시고, 거라사 지방에서 군대 귀신 들린 사람을 고쳐 집으로 보내십니다. 혈루증 여인이 옷에 손을 대어 낫고, 예수님은 죽은 야이로의 딸에게 \"달리다굼\" 하시며 일으키십니다.","고향 사람들은 예수님을 배척하고, 예수님은 열두 제자를 둘씩 보내십니다. 헤롯이 세례 요한을 죽인 일 뒤에 예수님은 오병이어로 오천 명을 먹이시고 바다 위를 걸으십니다. 장로들의 전통을 꾸짖으시고 수로보니게 여인의 딸과 귀 먹은 사람을 고치시며 사천 명을 먹이십니다. 베드로가 주는 그리스도라고 고백하자 예수님은 고난과 부활을 가르치시고 자기 십자가를 지고 따르라고 하십니다."],["예수님이 높은 산에서 베드로·야고보·요한 앞에서 변형되시고, 산 아래에서는 귀신 들린 아이를 고치십니다. 누가 크냐 다투는 제자들에게 섬기는 자가 첫째라고 가르치시고, 이혼 문제와 어린 아이 축복, 재물 많은 사람과의 대화가 이어집니다. 다시 죽음과 부활을 예고하신 뒤 여리고에서 맹인 바디매오의 눈을 뜨게 하십니다.","예수님이 나귀 새끼를 타고 예루살렘에 들어가시자 무리가 호산나를 외칩니다. 잎만 있는 무화과나무를 저주하시고 성전에서 매매하는 자들을 내쫓으시며, 권위 논쟁과 악한 농부 비유, 세금·부활·첫째 계명에 대한 문답이 이어집니다. 감람 산에서는 성전 파괴와 마지막 때의 징조, 인자의 오심을 말씀하시며 깨어 있으라고 하십니다.","베다니에서 한 여자가 예수님 머리에 향유를 붓고, 예수님은 유월절 음식을 나누며 떡과 잔으로 자기 몸과 언약의 피를 말씀하십니다. 겟세마네에서 기도하신 뒤 유다에게 잡히시고, 공회와 빌라도의 재판을 거쳐 십자가에 못 박혀 숨지십니다. 안식 후 첫날 무덤을 찾은 여자들은 예수님이 살아나셨다는 소식을 듣고, 부활하신 주님은 제자들에게 온 천하에 복음을 전파하라고 하십니다.","천사 가브리엘이 제사장 사가랴에게 요한의 출생을, 처녀 마리아에게 예수님의 잉태를 알립니다. 마리아는 엘리사벳을 찾아가 하나님을 찬양하고, 요한이 태어나자 사가랴의 입이 열립니다. 예수님은 베들레헴 구유에서 나시고 목자들과 시므온, 안나가 아기를 맞이합니다. 어른이 된 요한이 회개의 세례를 전하고, 예수님이 세례를 받으신 뒤 그 족보가 아담까지 이어집니다.","예수님은 광야에서 마귀의 시험을 말씀으로 이기시고, 나사렛 회당에서 이사야의 글이 오늘 이루어졌다고 선포하셨다가 배척당하십니다. 가버나움에서 귀신을 쫓고 병자를 고치시며, 시몬에게 많은 고기를 잡게 하신 뒤 제자로 부르십니다. 나병환자와 중풍병자를 고치시고 세리 레위를 부르시며, 안식일 논쟁 후 열두 사도를 세우시고 평지에서 복과 화, 원수 사랑을 가르치십니다.","예수님은 백부장의 종을 말씀으로 고치시고 나인 성 과부의 죽은 아들을 살리십니다. 눈물로 발을 적신 죄 많은 여자에게 죄 사함을 선언하시고, 씨 뿌리는 비유, 풍랑을 잔잔하게 하심, 군대 귀신 축출, 야이로의 딸과 혈루증 여자의 치유가 이어집니다. 오병이어 뒤 베드로가 예수님을 하나님의 그리스도라고 고백하고, 산에서 변화되신 예수님은 예루살렘을 향해 길을 떠나십니다.","예수님은 칠십 인을 둘씩 앞서 보내시고, 기뻐하며 돌아온 그들에게 이름이 하늘에 기록된 것을 기뻐하라고 하십니다. 영생을 묻는 율법교사에게 선한 사마리아 사람 비유로 참 이웃을 가르치시고, 마르다의 집에서는 말씀을 듣는 마리아를 칭찬하십니다. 주기도와 한밤중 벗의 비유로 기도를 가르치시고, 바알세불 논쟁과 요나의 표적을 말씀하신 뒤 바리새인과 율법교사들의 위선을 꾸짖으십니다."],["예수님은 바리새인의 외식을 주의하라 하시고, 어리석은 부자 비유로 탐심을 경계하십니다. 염려하지 말고 하나님의 나라를 구하며, 주인을 기다리는 종처럼 깨어 준비하라고 가르치십니다. 회개하지 않으면 망한다고 경고하시며 열매 없는 무화과나무 비유를 드시고, 안식일에 꼬부라진 여자를 고치십니다. 겨자씨와 누룩 비유, 좁은 문 말씀 뒤 예루살렘을 두고 탄식하십니다.","예수님은 안식일에 수종병 든 사람을 고치시고, 잔치 자리에서 겸손을 가르치시며 큰 잔치 비유와 제자가 되는 대가를 말씀하십니다. 죄인을 영접한다고 수군거리는 이들에게 잃은 양, 잃은 드라크마, 집을 나갔다 돌아온 둘째 아들 비유로 회개하는 죄인을 맞는 하늘의 기쁨을 보여 주십니다. 이어 옳지 않은 청지기 비유로 재물에 대해 가르치시고, 부자와 거지 나사로 이야기를 들려주십니다.","예수님은 용서와 믿음을 가르치시고, 나병환자 열 명을 고치시지만 사마리아 사람 하나만 돌아와 감사합니다. 인자의 날을 노아와 롯의 때에 비기시고, 끈질긴 과부와 바리새인과 세리의 기도 비유를 드십니다. 여리고에서 맹인을 고치시고 세리장 삭개오의 집에 머무시며, 므나 비유 뒤 나귀 새끼를 타고 예루살렘에 들어가 성을 보고 우시고 성전을 깨끗하게 하십니다.","성전에서 가르치시는 예수님께 대제사장들이 권위를 따지자 요한의 세례에 대해 되물으시고, 악한 농부 비유로 그들을 경고하십니다. 세금과 부활 문제로 책잡으려는 시도를 지혜롭게 물리치시고, 그리스도가 다윗의 주이심을 밝히십니다. 생활비 전부를 드린 가난한 과부를 칭찬하신 뒤, 성전 파괴와 예루살렘의 멸망, 인자가 구름을 타고 오실 일을 말씀하시며 항상 기도하며 깨어 있으라고 하십니다.","예수님은 마지막 유월절에 떡과 잔으로 새 언약을 세우시고, 감람 산에서 간절히 기도하신 뒤 잡히십니다. 베드로는 세 번 부인하고, 예수님은 공회와 빌라도, 헤롯 앞에서 재판받아 십자가에 못 박히시며 회개한 강도에게 낙원을 약속하십니다. 안식 후 첫날 여자들이 빈 무덤을 보고, 부활하신 예수님은 엠마오로 가는 두 제자와 제자들에게 나타나 성경을 풀어 주신 뒤 하늘로 올려지십니다.","요한복음은 태초부터 하나님과 함께 계신 말씀이 육신이 되어 우리 가운데 거하셨다고 시작합니다. 세례 요한은 예수님을 하나님의 어린 양이라고 증언하고, 안드레와 시몬, 빌립과 나다나엘이 예수님을 따릅니다. 예수님은 갈릴리 가나 혼례에서 물로 포도주를 만드는 첫 표적을 행하시고, 예루살렘 성전에서 장사하는 자들을 내쫓으시며 성전을 헐면 사흘 동안에 일으키겠다고 하십니다.","밤에 찾아온 니고데모에게 예수님은 물과 성령으로 나야 하나님 나라에 들어간다고 하시며, \"하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니\"라고 말씀하십니다. 수가 동네 우물가에서는 사마리아 여자에게 영생하는 생수와 영과 진리의 예배를 말씀하시고 메시야이심을 밝히십니다. 가나에서는 왕의 신하의 아들을 말씀으로 고치십니다."],["예수님은 안식일에 베데스다 못가의 서른여덟 해 된 병자를 고치시고, 이를 문제 삼는 유대인들에게 아버지와 아들의 관계를 말씀하십니다. 보리떡 다섯 개와 물고기 두 마리로 오천 명을 먹이시고, 밤에는 바다 위를 걸어 제자들에게 오십니다. 자신이 하늘에서 내려온 생명의 떡이라고 하시자 많은 제자가 떠나지만, 베드로는 영생의 말씀이 주께 있다고 고백합니다.","초막절에 예수님은 성전에서 가르치시고, 명절 끝날에 목마른 자는 내게 와서 마시라고 외치십니다. 무리는 그가 그리스도인지를 두고 갈라지고, 그를 잡으러 온 아랫사람들도 손을 대지 못합니다. 예수님은 간음 중에 잡힌 여자를 정죄하지 않으시고, 자신이 세상의 빛이며 진리가 자유롭게 한다고 하십니다. 아브라함이 나기 전부터 내가 있다고 하시자 유대인들이 돌로 치려 합니다.","예수님은 안식일에 날 때부터 맹인 된 사람의 눈에 진흙을 바르고 실로암 못에서 씻게 하여 보게 하십니다. 바리새인들은 그와 부모를 심문하다가 결국 그를 쫓아내고, 예수님을 다시 만난 그는 믿고 절합니다. 예수님은 자신이 양의 문이요 양들을 위해 목숨을 버리는 선한 목자라고 하시며, 수전절에 나와 아버지는 하나라고 말씀하시자 유대인들이 돌로 치려 합니다.","예수님은 죽은 지 나흘 된 나사로의 무덤 앞에서 눈물을 흘리시고, 자신이 부활이요 생명이라 하시며 나사로를 살리십니다. 이 일로 공회는 예수님을 죽이기로 모의합니다. 마리아가 예수님 발에 향유를 붓고, 예수님은 나귀 새끼를 타고 예루살렘에 들어가십니다. 헬라인들이 찾아오자 한 알의 밀이 죽어 많은 열매를 맺는다고 하시며 자신의 죽음을 말씀하십니다.","유월절 전 저녁 식사 자리에서 예수님은 제자들의 발을 씻기시며 섬김의 본을 보이시고, 유다가 자신을 팔 것을 알리십니다. 서로 사랑하라는 새 계명을 주시고 베드로의 부인을 예고하십니다. 근심하는 제자들에게 거처를 예비하러 간다고 하시며 자신이 곧 길이요 진리요 생명이라 하시고, 또 다른 보혜사 성령을 보내 주시겠다고 약속하십니다.","예수님은 자신이 참포도나무요 제자들은 가지라 하시며, 내 안에 거하여 열매를 맺고 서로 사랑하라고 하십니다. 세상이 자신을 미워했듯 제자들도 미워할 것이라 하시고, 보혜사 진리의 성령이 오셔서 예수님을 증언하고 세상을 책망하며 제자들을 모든 진리 가운데로 인도하실 것을 말씀하십니다. 지금의 근심이 기쁨으로 바뀔 것이라 하시며, 내가 세상을 이기었으니 담대하라고 격려하십니다.","예수님은 하늘을 우러러 아버지께 아들을 영화롭게 해 달라고 기도하시며, 영생은 유일하신 참 하나님과 그가 보내신 예수 그리스도를 아는 것이라고 하십니다. 세상에 남을 제자들을 악에 빠지지 않게 보전하시고 진리로 거룩하게 해 달라고 구하십니다. 또 제자들의 말을 듣고 믿을 사람들까지 위해 기도하시며, 그들이 다 하나가 되고 예수님의 영광을 보게 해 달라고 간구하십니다."],["예수님은 동산에서 잡혀 안나스와 가야바, 빌라도 앞에 서시고, 베드로는 세 번 부인합니다. 빌라도는 죄를 찾지 못하지만 무리의 요구에 넘겨주고, 예수님은 골고다에서 십자가에 못 박혀 다 이루었다 하시고 숨지십니다. 부활하신 주님은 막달라 마리아와 제자들, 도마에게 나타나시고, 디베랴 호숫가에서 베드로에게 세 번 사랑을 물으신 뒤 내 양을 먹이라고 하십니다.","부활하신 예수님은 사십 일 동안 제자들에게 나타나시고, 땅 끝까지 증인이 되리라 말씀하신 뒤 하늘로 올려지십니다. 제자들은 기도에 힘쓰며 맛디아를 사도로 세웁니다. 오순절에 성령이 임하자 제자들이 여러 나라 말로 하나님의 큰 일을 전하고, 베드로는 하나님이 예수를 살리셔서 주와 그리스도가 되게 하셨다고 설교합니다. 그날 삼천 명이 세례를 받고, 믿는 무리는 함께 떡을 떼며 서로 나눕니다.","베드로와 요한이 성전 미문에서 나면서 못 걷게 된 사람을 예수 그리스도의 이름으로 일으키고, 베드로는 백성에게 회개를 촉구합니다. 공회의 위협에도 사도들은 굴하지 않고, 교회는 기도하며 성령으로 충만해져 소유를 서로 나눕니다. 땅 값을 속인 아나니아와 삽비라가 죽고, 옥에 갇혔다가 천사의 도움으로 풀려난 사도들은 사람보다 하나님께 순종하겠다며 계속 전도합니다.","구제 문제로 원망이 생기자 사도들은 성령과 지혜가 충만한 일곱 사람을 세워 일을 맡깁니다. 그 중 스데반은 큰 기사와 표적을 행하다가 거짓 증인들의 고발로 공회에 끌려갑니다. 스데반은 아브라함부터 모세와 성전까지 이스라엘 역사를 되짚으며 백성이 늘 성령을 거슬렀다고 말합니다. 그는 하나님 우편에 서신 예수님을 보며 돌에 맞아 죽고, 죽어 가면서 자기를 치는 이들을 위해 기도합니다.","스데반의 죽음 뒤 큰 박해로 흩어진 성도들이 곳곳에서 복음을 전하고, 빌립은 사마리아에서 그리스도를 전하며 에디오피아 내시에게 세례를 줍니다. 교회를 박해하던 사울은 다메섹 길에서 예수님을 만나 눈이 멀었다가 아나니아의 안수로 다시 보고, 예수가 하나님의 아들이심을 전파합니다. 베드로는 룻다에서 중풍병자 애니아를 고치고 욥바에서 죽은 다비다를 살립니다.","베드로는 환상을 통해 하나님이 깨끗하게 하신 것을 속되다 하지 말라는 가르침을 받고, 백부장 고넬료의 집에서 복음을 전하자 이방인들에게도 성령이 임합니다. 안디옥에서는 헬라인들도 믿어 제자들이 처음으로 그리스도인이라 불립니다. 헤롯이 야고보를 죽이고 베드로를 가두지만 교회가 기도하는 중에 천사가 베드로를 구출하고, 교만한 헤롯은 벌레에게 먹혀 죽습니다.","안디옥 교회는 성령의 지시로 바나바와 사울을 보내고, 두 사람은 구브로와 비시디아 안디옥에서 예수님의 부활을 전합니다. 유대인들의 반대로 이방인에게 향한 그들은 이고니온, 루스드라, 더베에서 복음을 전하다가 바울이 돌에 맞기도 합니다. 할례 문제로 예루살렘 회의가 열려 이방인도 주 예수의 은혜로 구원받는다고 결정하고, 바울과 바나바는 마가 문제로 갈라섭니다."],["바울은 환상을 보고 마게도냐로 건너가, 빌립보에서 루디아에게 복음을 전하고 귀신 들린 여종을 고칩니다. 옥에 갇힌 바울과 실라가 한밤중에 찬송할 때 지진이 나고, 간수와 온 가족이 주 예수를 믿습니다. 데살로니가와 베뢰아를 거쳐 아덴의 아레오바고에서 천지의 주재이신 하나님과 부활을 전하고, 고린도에서는 일 년 육 개월 동안 말씀을 가르칩니다.","바울은 에베소에서 요한의 세례만 받은 제자들에게 성령을 받게 하고, 두란노 서원에서 두 해 동안 가르칩니다. 마술하던 사람들이 책을 불사르지만, 은장색 데메드리오는 아데미 신상 장사 때문에 큰 소동을 일으킵니다. 바울은 드로아에서 떨어져 죽은 유두고를 살리고, 밀레도에서 에베소 장로들에게 하나님이 자기 피로 사신 교회를 보살피라고 당부하며 눈물로 작별합니다.","바울은 결박당할 것이라는 예언에도 예루살렘으로 올라가고, 성전에서 유대인들의 선동으로 붙잡힙니다. 그는 층대 위에서 자신의 회심 이야기를 들려주고, 공회 앞에서 부활 문제로 변론합니다. 주님은 밤에 로마에서도 증언해야 한다고 격려하시고, 바울을 죽이려는 음모가 드러나자 그는 가이사랴의 총독 벨릭스에게 호송되어 재판을 받고 두 해 동안 갇혀 지냅니다.","새 총독 베스도 앞에서 바울은 가이사에게 상소하고, 아그립바 왕 앞에서 자신의 회심과 사명을 증언합니다. 로마로 가는 배는 유라굴로 광풍을 만나 부서지지만, 하나님의 약속대로 모두 살아 멜리데 섬에 닿습니다. 바울은 독사에 물리고도 상하지 않고 병자들을 고치며, 마침내 로마에 도착해 두 해 동안 하나님의 나라와 주 예수 그리스도를 담대하게 가르칩니다.","바울은 로마 성도들에게 자신이 부끄러워하지 않는 복음, 곧 믿음으로 나타나는 하나님의 의를 소개합니다. 하나님을 알면서도 우상을 섬긴 이방인과 율법을 자랑하면서도 지키지 못한 유대인 모두가 죄 아래 있음을 밝힙니다. 그러나 이제 율법 외에 예수 그리스도를 믿음으로 말미암는 하나님의 의가 나타나 누구든지 값없이 의롭다 하심을 얻는다고 선언합니다.","아브라함이 행위가 아니라 하나님을 믿음으로 의롭다 여김을 받았음을 보이며, 믿음으로 의롭게 된 자는 하나님과 화평을 누린다고 말합니다. 아담 한 사람으로 죄와 사망이 들어왔으나 그리스도 한 사람의 순종으로 생명이 넘쳤습니다. 세례로 그리스도와 연합한 자는 죄에 대해 죽었고, 율법 아래 곤고한 싸움을 지나, 그리스도 예수 안에 있는 자에게는 결코 정죄함이 없으며 아무것도 하나님의 사랑에서 끊을 수 없다고 선포합니다.","바울은 동족 이스라엘을 위한 큰 근심을 털어놓으며, 하나님의 구원이 육신의 혈통이 아니라 긍휼과 택하심에 달려 있다고 말합니다. 이스라엘은 자기 의를 세우려다 믿음의 의에 이르지 못했지만, 누구든지 입으로 예수를 주로 시인하고 마음으로 믿으면 구원을 받습니다. 하나님은 은혜로 남은 자를 두셨고, 이방인을 참감람나무에 접붙이신 뒤 결국 온 이스라엘도 구원하실 것이라며 하나님의 지혜를 찬양합니다."],["바울은 몸을 거룩한 산 제물로 드리고 마음을 새롭게 하라고 권합니다. 은사대로 서로 섬기고, 원수를 선으로 이기며, 위의 권세에 복종하고, 사랑으로 율법을 이루라고 가르칩니다. 음식과 날 문제로 서로 비판하지 말고 믿음이 약한 자를 받으라고 한 뒤, 서바나로 가려는 계획과 예루살렘 헌금을 전하고 뵈뵈를 비롯한 여러 동역자들에게 문안합니다.","고린도 교회가 바울파, 아볼로파, 게바파, 그리스도파로 나뉘어 다툰다는 소식에 바울은 그리스도께서 나뉘셨느냐고 묻습니다. 십자가의 도는 세상에는 미련해 보이나 구원받는 자에게는 하나님의 능력이며, 하나님은 세상의 약하고 천한 것을 택하셨습니다. 바울과 아볼로는 심고 물 주는 일꾼일 뿐 자라게 하시는 이는 하나님이시고, 교회의 유일한 터는 예수 그리스도라고 말합니다.","아버지의 아내를 취한 음행을 교회가 방치한 일을 꾸짖으며, 적은 누룩이 온 덩어리에 퍼지니 악한 자를 내쫓으라고 합니다. 성도끼리 세상 법정에 고발하는 일을 책망하고, 몸은 성령의 전이니 음행을 피하라고 권합니다. 이어 결혼과 독신, 이혼, 믿지 않는 배우자, 부르심 받은 자리에서 지내는 문제에 대해 구체적으로 답합니다.","우상의 제물 문제에 대해 지식은 교만하게 하나 사랑은 덕을 세운다며, 믿음이 약한 형제를 넘어지게 하지 말라고 합니다. 바울은 사도로서 받을 권리를 쓰지 않고 모든 사람에게 종이 되어 복음을 전한 자신의 본을 보여 줍니다. 광야 이스라엘이 우상 숭배와 음행, 원망으로 멸망한 일을 경고로 들며, 주의 잔과 귀신의 잔을 겸할 수 없으니 무엇을 하든 하나님의 영광을 위해 하라고 권합니다.","예배 때 머리에 쓰는 문제와 주의 만찬에서 가난한 자를 부끄럽게 한 일을 바로잡으며, 주께 받은 성찬의 말씀을 전합니다. 성령은 한 분이시지만 은사는 여러 가지이며, 교회는 많은 지체가 있는 한 몸이라고 가르칩니다. 사랑이 없으면 모든 은사가 아무것도 아니라고 사랑을 노래한 뒤, 방언보다 교회의 덕을 세우는 예언을 사모하고 모든 것을 품위 있게, 질서 있게 하라고 권합니다.","바울은 그리스도께서 성경대로 우리 죄를 위해 죽으시고 사흘 만에 다시 살아나 게바와 열두 제자, 오백여 형제, 마지막으로 자신에게 보이셨다는 복음을 전합니다. 그리스도의 부활이 없다면 믿음도 헛되지만, 그리스도는 잠자는 자들의 첫 열매가 되셨고 마지막 나팔에 우리도 썩지 않을 몸으로 변화될 것입니다. 끝으로 예루살렘 성도를 위해 매주 첫날 연보를 모아 두라고 하고, 여행 계획과 문안을 전합니다.","바울은 아시아에서 살 소망까지 끊어질 만한 환난을 겪었지만 모든 위로의 하나님께 위로받았다고 고백합니다. 고린도 방문 계획을 바꾼 것은 변덕이 아니라 그들을 아끼려는 마음 때문이었고, 많은 눈물로 편지를 썼다고 설명합니다. 근심하게 한 사람을 이제는 용서하고 위로하라고 권하며, 자신들은 각처에서 그리스도의 향기를 나타내는 자라고 말합니다."],["바울은 돌판이 아니라 마음판에 성령으로 쓰는 새 언약의 일꾼으로서, 수건을 벗은 얼굴로 주의 영광을 보며 변화된다고 말합니다. 질그릇 같은 몸에 보배를 가진 사도들은 사방으로 우겨쌈을 당해도 낙심하지 않고 하늘의 영원한 집을 바라봅니다. 그리스도 안에서 새로운 피조물이 된 자들에게 화목하게 하는 직분이 맡겨졌으며, 바울은 고린도 교인들에게 마음을 넓히라고 하고 디도를 통해 그들의 회개 소식을 듣고 기뻐합니다.","바울은 극심한 가난 속에서도 힘에 지나도록 자원하여 연보한 마게도냐 교회들을 소개하며, 고린도 교회도 시작한 가난한 성도를 돕는 일을 끝까지 이루라고 권합니다. 디도와 믿을 만한 형제들을 보내어 연보를 투명하게 관리하겠다고 말합니다. 적게 심는 자는 적게, 많이 심는 자는 많이 거두며, 하나님은 인색하거나 억지로가 아니라 즐겨 내는 자를 사랑하신다고 가르칩니다.","바울은 자신을 육신대로 행한다고 비난하며 다른 복음을 전하는 거짓 사도들에 맞서 어리석은 자처럼 자랑해 보겠다고 말합니다. 그가 자랑하는 것은 매 맞음, 파선, 굶주림, 위험 같은 고난과 모든 교회를 위한 염려, 그리고 자신의 약함입니다. 셋째 하늘에 이끌려 간 체험에도 육체의 가시를 받았는데, 세 번 간구하자 주님은 은혜가 족하다고 하셨고, 바울은 세 번째 방문을 앞두고 스스로를 살피라고 권합니다.","바울은 갈라디아 교회들이 그리스도의 은혜를 떠나 다른 복음을 따르는 것에 놀라며, 다른 복음을 전하는 자는 저주를 받으라고 말합니다. 자신의 복음은 사람에게서가 아니라 예수 그리스도의 계시로 받은 것임을 회심 이후의 행적으로 증언합니다. 예루살렘 사도들이 그의 이방인 사역을 인정했으며, 안디옥에서 이방인과 함께 먹다 물러난 게바를 책망하며 사람은 율법의 행위가 아니라 그리스도를 믿음으로 의롭게 된다고 선언합니다.","바울은 갈라디아 사람들이 성령을 받은 것이 율법의 행위가 아니라 듣고 믿음으로였다고 일깨우며, 믿는 자가 아브라함의 자손이라고 말합니다. 율법은 그리스도께 인도하는 초등교사였고, 때가 차매 오신 아들로 말미암아 우리는 종이 아니라 아들이 되었습니다. 하갈과 사라의 비유로 자유를 설명한 뒤, 그 자유를 사랑으로 서로 섬기는 데 쓰고 성령을 따라 행하여 성령의 열매를 맺으며 서로 짐을 지라고 권합니다.","하나님은 창세 전에 그리스도 안에서 우리를 택하시고 그의 피로 죄 사함을 주셨으며, 허물로 죽었던 우리를 은혜로 믿음을 통해 살리셨습니다. 그리스도는 유대인과 이방인 사이의 막힌 담을 허시고 둘을 한 새 사람으로 지으셨습니다. 바울은 부르심에 합당하게 성령이 하나 되게 하신 것을 지키고 옛 사람을 벗고 새 사람을 입으라고 권하며, 부부와 부모 자녀, 종과 상전의 관계를 가르친 뒤 하나님의 전신 갑주를 입으라고 말합니다.","감옥에 갇힌 바울은 자신의 매임이 오히려 복음 전파에 진전이 되었다며 기뻐하고, 사는 것도 죽는 것도 그리스도를 위한 것이라고 고백합니다. 자기를 비워 십자가에 죽기까지 복종하신 그리스도의 마음을 품으라고 권하며, 디모데와 에바브로디도를 소개합니다. 그리스도를 아는 지식 때문에 모든 것을 해로 여기고 푯대를 향해 달려간다며, 주 안에서 항상 기뻐하라고 권합니다."],["바울은 골로새 성도들의 믿음과 사랑에 감사하며, 그리스도는 보이지 않는 하나님의 형상이시고 만물이 그로 말미암아 창조되었으며 그가 교회의 머리시라고 찬양합니다. 철학과 사람의 전통, 음식과 절기 규례, 천사 숭배로 성도를 사로잡으려는 가르침을 경계하라고 합니다. 그리스도와 함께 살리심을 받았으니 위의 것을 찾고, 옛 사람을 벗고 새 사람을 입어 가정과 일터에서 주께 하듯 살라고 권한 뒤 동역자들의 문안을 전합니다.","바울은 데살로니가 교회가 많은 환난 중에도 성령의 기쁨으로 말씀을 받아 우상을 버리고 하나님께 돌아와 모든 믿는 자의 본이 된 것을 감사합니다. 유모처럼, 아버지처럼 그들을 돌본 자신의 사역을 돌아보고, 디모데를 통해 들은 그들의 믿음 소식에 위로를 받습니다. 거룩하게 살라고 권하며, 주께서 강림하실 때 그리스도 안에서 죽은 자들이 먼저 일어나고 살아 있는 자들도 함께 주를 영접할 것이니 깨어 있으라고 말합니다.","바울은 박해 속에서도 믿음과 사랑이 자라는 데살로니가 교회를 칭찬하며, 주 예수께서 나타나실 때 공의로 심판하실 것이라고 위로합니다. 주의 날이 이미 왔다는 말에 흔들리지 말라며, 먼저 배교하는 일과 불법의 사람이 나타난 뒤에야 그 날이 오고 주 예수께서 그를 멸하실 것이라고 가르칩니다. 끝으로 게으르게 행하는 자들에게 조용히 일하여 자기 양식을 먹으라고 명합니다.","바울은 에베소에 머문 디모데에게 다른 교훈을 막고, 죄인 중의 괴수였던 자신에게 베푸신 긍휼을 기억하며 선한 싸움을 싸우라고 합니다. 모든 사람을 위해 기도할 것과 예배 질서, 감독과 집사의 자격을 가르치고, 경건에 이르도록 자신을 연단하며 믿는 자에게 본이 되라고 권합니다. 과부와 장로를 대하는 법을 말한 뒤, 돈을 사랑함이 일만 악의 뿌리이니 자족하는 경건을 따르고 믿음의 선한 싸움을 싸우라고 당부합니다.","옥에 갇힌 바울은 디모데에게 두려워하는 마음이 아닌 능력과 사랑과 절제의 마음으로 복음과 함께 고난을 받으라고 권합니다. 좋은 병사와 경기자와 농부처럼 충성하고, 진리의 말씀을 옳게 분별하며 귀히 쓰는 그릇이 되라고 말합니다. 말세에 경건의 모양만 있는 자들이 나타나겠지만 하나님의 감동으로 된 성경에 거하고 말씀을 전파하라고 명하며, 자신은 선한 싸움을 싸우고 달려갈 길을 마쳤다고 고백합니다.","바울은 그레데에 남은 디도에게 각 성에 책망할 것이 없는 장로들을 세우고, 헛된 말로 가정을 무너뜨리는 자들을 엄히 꾸짖으라고 합니다. 늙은 남자와 여자, 젊은이와 종들에게 바른 교훈에 합당한 삶을 가르치라고 하며, 하나님의 은혜가 나타나 우리를 경건하게 살도록 양육한다고 말합니다. 하나님은 우리의 의로운 행위가 아니라 긍휼하심을 따라 중생의 씻음과 성령의 새롭게 하심으로 구원하셨으니 선한 일에 힘쓰라고 권합니다.","갇혀 있는 바울은 동역자 빌레몬에게 편지하여, 감옥에서 믿음으로 낳은 아들 오네시모를 위해 사랑으로 간구합니다. 전에는 무익했던 종 오네시모가 이제는 유익한 사람이 되었으니, 종 이상으로 사랑받는 형제로 영접해 달라고 부탁합니다. 그가 진 빚이 있다면 자기 앞으로 계산하라고 하며, 빌레몬이 말한 것보다 더 행할 줄 확신한다고 말합니다."],["하나님은 마지막 날에 아들을 통해 말씀하셨으며, 아들은 하나님의 영광의 광채요 본체의 형상으로서 천사보다 뛰어나십니다. 그는 혈과 육을 입고 죽음을 통해 마귀를 멸하셨고, 모세보다 더 큰 영광을 받으실 신실한 대제사장이십니다. 광야 세대처럼 마음을 완고하게 하지 말고 안식에 들어가기를 힘쓰며, 멜기세덱의 반차를 따르는 대제사장 예수를 굳게 붙들라고 권합니다.","아브라함에게 복을 빈 멜기세덱처럼, 예수님은 레위 계통이 아닌 불멸의 생명의 능력으로 맹세에 따라 영원한 제사장이 되셨습니다. 그는 더 좋은 언약의 중보자로서, 마음에 법을 기록하겠다는 새 언약을 이루셨습니다. 땅의 장막과 해마다 드리는 짐승의 피는 그림자에 불과하지만, 그리스도는 자기 피로 단번에 영원한 속죄를 이루셨으니, 그 피를 힘입어 하나님께 나아가고 모이기를 폐하지 말며 믿음으로 인내하라고 권합니다.","믿음은 바라는 것들의 실상이요 보이지 않는 것들의 증거라고 정의하며, 아벨과 에녹, 노아, 아브라함과 사라, 모세, 라합 등 믿음으로 살았던 선진들을 차례로 소개합니다. 이 구름 같은 증인들을 생각하며 믿음의 주이신 예수를 바라보고 인내로 경주하라고 권하고, 주의 징계는 아들로 대하시는 사랑이라고 말합니다. 끝으로 형제 사랑, 손님 대접, 결혼을 귀히 여김, 돈을 사랑하지 않음 등 삶의 권면을 하고 축복으로 맺습니다.","야고보는 흩어진 성도들에게 시험을 기쁘게 여기고 인내를 이루며, 말씀을 듣기만 하지 말고 행하는 자가 되라고 권합니다. 부자와 가난한 자를 차별하지 말라고 하며, 아브라함과 라합의 예를 들어 행함이 없는 믿음은 죽은 것이라고 말합니다. 혀를 길들이고 위로부터 난 지혜를 따르며, 세상과 벗하지 말고 하나님께 복종하라고 권한 뒤, 주의 강림까지 길이 참고 서로 위해 기도하라고 당부합니다.","베드로는 흩어진 나그네 성도들에게 예수 그리스도의 부활로 산 소망을 주신 하나님을 찬송하며, 그리스도의 보배로운 피로 대속받았으니 거룩하게 살라고 권합니다. 성도는 택하신 족속이요 왕 같은 제사장이니 선한 행실로 살고 부당한 고난도 참으라고 말합니다. 그리스도의 고난에 참여함을 기뻐하고, 장로들은 양 무리를 자원함으로 치며 모두 겸손히 염려를 주께 맡기라고 권합니다.","베드로는 믿음에 덕과 지식, 절제, 인내, 경건, 형제 우애, 사랑을 더하라고 권하며, 자신이 변화산에서 그리스도의 위엄을 직접 보았다고 증언합니다. 이어 자기들을 사신 주를 부인하고 탐심으로 성도를 미혹하는 거짓 선생들이 반드시 심판받을 것이라고 경고합니다. 주의 강림을 조롱하는 자들에게, 주께는 하루가 천 년 같으며 모두 회개하기를 오래 참고 기다리시는 것이라고 답하고, 의가 있는 새 하늘과 새 땅을 바라보라고 말합니다.","요한은 태초부터 있는 생명의 말씀을 직접 보고 듣고 만졌다고 증언하며, 하나님은 빛이시니 빛 가운데 행하고 죄를 자백하라고 말합니다. 그의 계명을 지키고 형제를 사랑하는 자가 빛 가운데 거하며, 세상과 세상의 정욕을 사랑하지 말고 예수가 그리스도이심을 부인하는 적그리스도를 경계하라고 합니다. 아버지께서 우리를 하나님의 자녀라 일컬어 주셨으니, 말과 혀로만이 아니라 행함과 진실함으로 서로 사랑하자고 권합니다."],["요한은 예수 그리스도께서 육체로 오신 것을 시인하는지로 영들을 분별하라고 말합니다. 하나님은 사랑이시며, 그 사랑은 우리 죄를 속하기 위해 독생자를 화목 제물로 보내신 데서 나타났으니, 하나님을 사랑하는 자는 형제도 사랑해야 합니다. 예수가 하나님의 아들이심을 믿는 믿음이 세상을 이기며, 하나님이 주신 영생이 그 아들 안에 있다고 증언하고 우상에게서 멀리하라고 맺습니다.","요한이서는 서로 사랑하며 진리 안에서 행하고, 그리스도께서 육체로 오심을 부인하는 자를 집에 들이지 말라고 합니다. 요한삼서는 나그네 된 형제들을 대접한 가이오를 칭찬하고 형제들을 내쫓는 디오드레베를 꾸짖습니다. 유다서는 하나님의 은혜를 방탕으로 바꾸는 자들을 경고하며, 단번에 주신 믿음의 도를 위해 힘써 싸우고 하나님의 사랑 안에서 자신을 지키라고 권합니다.","밧모 섬에 있던 요한은 주의 날에 성령에 감동되어, 일곱 금 촛대 사이에 계신 영광스러운 인자 같은 이를 봅니다. 처음이요 마지막이신 그분은 에베소, 서머나, 버가모, 두아디라, 사데, 빌라델비아, 라오디게아 일곱 교회에 각각 칭찬과 책망을 전하십니다. 처음 사랑을 회복하고 죽도록 충성하며 회개하라고 말씀하시고, 이기는 자에게 생명나무의 열매와 생명의 관, 흰 옷 등을 약속하십니다.","요한은 하늘에 열린 문을 통해 보좌에 앉으신 하나님과 그를 경배하는 이십사 장로와 네 생물을 봅니다. 일곱 인으로 봉한 두루마리를 펼 자가 없어 울 때, 유대 지파의 사자요 죽임을 당한 어린 양이 나아와 두루마리를 취하시고, 모든 피조물이 그를 찬양합니다. 어린 양이 인을 하나씩 떼실 때 흰 말, 붉은 말, 검은 말, 청황색 말이 나오고, 순교자들의 부르짖음과 큰 지진이 이어집니다.","심판에 앞서 하나님의 종들의 이마에 인을 치니, 이스라엘 각 지파에서 인침 받은 자가 십사만 사천입니다. 이어 각 나라에서 나온 셀 수 없는 큰 무리가 흰 옷을 입고 보좌와 어린 양 앞에서 구원을 찬양합니다. 일곱째 인을 떼시자 일곱 천사가 나팔을 받는데, 나팔이 울릴 때마다 땅과 바다와 물과 하늘에 재앙이 내리고 무저갱의 황충과 유브라데의 마병대가 나오지만, 남은 사람들은 회개하지 않습니다.","요한은 작은 두루마리를 받아 먹고 다시 예언하라는 명을 받으며, 두 증인은 짐승에게 죽임을 당했다가 다시 살아나 하늘로 올라갑니다. 일곱째 나팔이 울리자 세상 나라가 그리스도의 나라가 되었다는 찬양이 울리고, 붉은 용은 하늘에서 쫓겨납니다. 바다와 땅에서 올라온 두 짐승이 성도를 핍박하지만, 시온 산의 십사만 사천은 어린 양과 함께 새 노래를 부르고 땅을 거두는 심판이 이어집니다.","짐승을 이긴 자들이 유리 바다 가에서 모세의 노래, 어린 양의 노래를 부른 뒤, 일곱 천사가 하나님의 진노를 담은 일곱 대접을 땅과 바다, 강, 해, 짐승의 왕좌, 유브라데, 공중에 차례로 쏟습니다. 사람들은 재앙 속에서도 회개하지 않고 하나님을 비방하며, 왕들은 아마겟돈으로 모입니다. 붉은 짐승을 탄 큰 음녀 바벨론의 정체가 드러나고, 그 성이 한 시간에 무너지자 땅의 왕들과 상인들은 애곡하지만 하늘과 성도들은 즐거워합니다."],["하늘의 무리가 할렐루야로 음녀의 심판을 찬양하고 어린 양의 혼인 잔치를 선포하며, 백마를 탄 충신과 진실이신 분이 짐승과 거짓 선지자를 물리치십니다. 사탄은 천 년 동안 결박되었다가 잠깐 놓인 뒤 불과 유황 못에 던져지고, 크고 흰 보좌 앞에서 죽은 자들이 심판을 받습니다. 새 하늘과 새 땅, 하나님께로부터 내려오는 새 예루살렘에는 눈물과 사망이 없고 생명수 강과 생명나무가 있으며, 책은 \"아멘 주 예수여 오시옵소서\"라는 고백과 주 예수의 은혜를 비는 축복으로 끝납니다."]]);WEEKS.length=0;WEEKS.push(...[{"t":"창 1–23","story":"","christ":""},{"t":"창 24–39","story":"","christ":""},{"t":"창 40 – 출 6","story":"","christ":""},{"t":"출 7–24","story":"","christ":""},{"t":"출 25 – 레 6","story":"","christ":""},{"t":"레 7–24","story":"","christ":""},{"t":"레 25 – 민 14","story":"","christ":""},{"t":"민 15–36","story":"","christ":""},{"t":"신 1–21","story":"","chris
