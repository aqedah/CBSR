  const dn=document.getElementById("doneBtn"); if(dn) dn.onclick=()=>{const k=keyOf(view.w,view.d); if(mem.done[k]) delete mem.done[k]; else {mem.done[k]=new Date().toISOString().slice(0,10); view.justDone=true; if(window.SYNC&&SYNC.available) SYNC.markDone(k,todayStr());} const was=view.justDone; save(); render(); document.getElementById("doneSec")?.scrollIntoView({block:"center"}); if(was) confetti();};
  const tqt=document.getElementById("toQT"); if(tqt) tqt.onclick=()=>{view.tab="qt";render();window.scrollTo({top:0});};
  const pm=document.getElementById("pmini"); if(pm){const go2=()=>{view.tab="record";render();window.scrollTo({top:0});}; pm.onclick=go2; pm.onkeydown=e=>{if(e.key==="Enter")go2();};}
  m.querySelectorAll("[data-lw]").forEach(b=>b.onclick=()=>showLW(b.dataset.lw));
  m.querySelectorAll("[data-em]").forEach(b=>b.onclick=()=>showEM(b.dataset.em));
  m.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>showINC(+b.dataset.inc));
  m.querySelectorAll("[data-clue]").forEach(b=>b.onclick=()=>showClue(+b.dataset.clue));
  bindAccount(m); bindInstall(); if(view.tab==="read") churchCounts();
  bindQT(m);
  const fp=document.getElementById("fp"); if(fp){fp.onclick=()=>{mem.size=Math.min(24,(mem.size||17)+1);applySize();save();}; document.getElementById("fm").onclick=()=>{mem.size=Math.max(14,(mem.size||17)-1);applySize();save();};}
  if(view.tab==="guide"){
    document.getElementById("startSave").onclick=()=>{const v=document.getElementById("startIn").value; if(!v) return; mem.start=v; save(); Object.assign(here,posOfToday()); go(here.w,here.d);};
    document.getElementById("markPast").onclick=()=>{ for(let w=1;w<=here.w;w++) for(let d=0;d<6;d++){ if(w===here.w&&d>=here.d) break; const k=keyOf(w,d); if(!mem.done[k]) mem.done[k]="past"; } save(); view.tab="record"; render(); window.scrollTo({top:0}); };
    document.getElementById("resetAsk").onclick=()=>{
      document.getElementById("resetBox").innerHTML=`<div class="confirm"><span>퀴즈, 진행률, QT 기록을 모두 지울까요? 되돌릴 수 없습니다.</span><div class="row"><button class="btn small" id="resetYes">지우기</button><button class="btn ghost small" id="resetNo">취소</button></div></div>`;
      document.getElementById("resetYes").onclick=()=>{mem.q={};mem.wq={};mem.done={};mem.qt={};save();render();};
      document.getElementById("resetNo").onclick=()=>render();
    };
  }
}
function applySize(){document.documentElement.style.setProperty("--bible-size",(mem.size||17)+"px");}
document.getElementById("prevW").onclick=()=>{if(view.w>1){view.w--;view.quiz=null;view.wquiz=null;view.open=false;render();}};
document.getElementById("nextW").onclick=()=>{if(view.w<45){view.w++;view.quiz=null;view.wquiz=null;view.open=false;render();}};
document.getElementById("todayBtn").onclick=()=>{const t=view.tab; go(here.w,here.d); if(t!=="read"){view.tab=t;render();}};
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{view.tab=t.dataset.tab;render();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("sheetRoot").innerHTML="";});
applySize(); render(); loadBible();
if(window.SYNC&&SYNC.loggedIn()) SYNC.pull().then(remote=>{ if(remote){ mem=mergeMem(mem,remote); try{localStorage.setItem(KEY,JSON.stringify(mem));}catch(e){} Object.assign(here,posOfToday()); render(); } }).catch(()=>{});
if(window.SYNC) SYNC.onChange(()=>{ if(view.tab==="record"){ const a=document.activeElement; if(!(a&&a.tagName==="INPUT")) render(); } });
})();

(function(){const b=document.createElement("button");b.className="totop";b.type="button";b.setAttribute("aria-label","맨 위로");b.title="맨 위로";
b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
b.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});document.body.appendChild(b);
const upd=()=>b.classList.toggle("show",window.scrollY>window.innerHeight*0.8);window.addEventListener("scroll",upd,{passive:true});upd();})();
</script>
