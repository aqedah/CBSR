<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>CBSR v2 1차 UI 샘플 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* 레이아웃: 왼쪽 휴대폰 한 대(같은 회차 화면을 차례로 넘김) + 오른쪽(좁으면 아래) 바뀐 점·결정 칸. 색·서체는 지금 v2(짙은 초록, 명조 제목, 고딕 본문)를 그대로 씀 */
:root{
  --paper:#F3F5F1; --card:#FFFFFF; --ink:#1B2420; --muted:#56615B; --line:#DCE3DE;
  --accent:#2C5C52; --accent-ink:#FFFFFF; --soft:#E2ECE7; --gold:#7A4C0C; --warn:#B4652A; --warn-soft:#F6E7D8;
  --stage:#E7EBE8; --night:#16120E;
  --f-disp:"Noto Serif KR","Gowun Batang",serif; --f-text:"Noto Serif KR","Gowun Batang",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111714; --card:#18201C; --ink:#E4EAE6; --muted:#A9B6AF; --line:#2A3430;
  --accent:#8FC4B5; --accent-ink:#0E1513; --soft:#1C2A26; --gold:#EBC27A; --warn:#E3A26A; --warn-soft:#3A2A1C;
  --stage:#0B0F0D; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111714; --card:#18201C; --ink:#E4EAE6; --muted:#A9B6AF; --line:#2A3430;
  --accent:#8FC4B5; --accent-ink:#0E1513; --soft:#1C2A26; --gold:#EBC27A; --warn:#E3A26A; --warn-soft:#3A2A1C;
  --stage:#0B0F0D; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--stage);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:18px}
.head h1{margin:0;font:700 22px/1.35 var(--f-disp);text-wrap:balance}
.head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.nav button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nav button small{opacity:.7;margin-right:4px;font-weight:500}
.states{display:flex;gap:6px;flex-wrap:wrap;min-height:34px}
.states button{border:0;background:transparent;border-bottom:2px solid transparent;padding:5px 4px;font-size:13.5px;color:var(--muted)}
.states button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.stage{display:grid;grid-template-columns:minmax(0,390px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.stage{grid-template-columns:minmax(0,1fr)}}
.side{display:grid;gap:14px;min-width:0}
.box{background:var(--card);border-radius:16px;padding:16px 18px}
.box h2{margin:0 0 8px;font:700 16px var(--f-ui)}
.box ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ab>div{border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;background:var(--paper)}
.ab b{display:block;font-size:13px;margin-bottom:6px}
.ab p{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.sbtn{border:0;background:none;padding:0;color:inherit;display:grid}
.pbtn{display:block;width:100%;border:0;padding:0;text-align:left;cursor:pointer}
.plab{position:absolute;left:0;right:0;bottom:0;display:grid;gap:1px;padding:40px 16px 14px;background:linear-gradient(transparent,rgba(10,16,13,.78));color:#fff}
.plab b{display:flex;align-items:center;gap:6px;font-size:17px}
.plab b svg{width:20px;height:20px}
.plab small{font-size:12.5px;opacity:.85}
.photo.lift,.tip.lift{position:relative;z-index:6}
.photo.lift{box-shadow:0 0 0 4px rgba(255,255,255,.95)}
.tip.lift{background:var(--card);border-radius:16px;padding:14px 16px;font-size:14.5px;line-height:1.6;margin:-4px 0 14px}
.tip.lift b{display:block;font-size:16px;margin-bottom:2px}
.tip.lift button{margin-top:10px;border:0;background:none;color:var(--muted);font-size:13px;padding:0}
.coach{position:absolute;inset:0;background:rgba(10,16,13,.55);z-index:5;pointer-events:none}
.kvrow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px;scroll-snap-type:x mandatory}
.kvrow::-webkit-scrollbar{display:none}
.kvc{flex:none;width:76%;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:space-between;gap:10px;background:var(--paper);border-radius:16px;padding:14px}
.kvc q{quotes:none;font:500 15px/1.7 var(--f-text);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.kvc small{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.kvc small b{color:var(--accent)}
.libtop{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.libtop button{border:0;background:none;padding:4px;display:grid}
.libtop b{font:700 19px var(--f-disp)}
.libq{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:15px var(--f-ui);padding:11px 14px;margin-bottom:10px}
.libchips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.libchips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.libchips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.libgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.libc{border:0;background:none;padding:0;text-align:left;display:grid;gap:4px;min-width:0}
.libimg{position:relative;display:block;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:#222}
.libimg img{width:100%;height:100%;object-fit:cover;display:block}
.libimg em{position:absolute;left:8px;top:8px;font-style:normal;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.45);border-radius:6px;padding:1px 6px}
.libc b{font:700 14px/1.4 var(--f-disp)}
.libc small{font-size:11.5px;color:var(--muted)}
.cbar{display:flex;gap:2px;height:5px}
.cbar i{flex:1;border-radius:1.5px;background:var(--line)}
.cbar i.on,.clg i.on{background:var(--accent)}
.cbar i.miss{background:repeating-linear-gradient(135deg,var(--accent) 0 1.5px,transparent 1.5px 3px);opacity:.55}
.cbar i.now,.clg i.now{background:var(--gold)}
.cbar i.now{height:7px;margin-top:-1px}
.cbar i.fut,.clg i.fut{background:var(--line)}
.clg{display:flex;gap:12px;margin-top:6px;font-size:11.5px;color:var(--muted)}
.clg span{display:flex;align-items:center;gap:4px}
.clg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.wkhd{display:flex;align-items:baseline;gap:8px;margin:0 0 6px;font-size:12.5px}
.wkhd b{font-weight:700}
.wkhd span{color:var(--muted)}
.rg i{box-sizing:border-box}
.rg.read i{background:var(--accent)}
.rg.today i{background:var(--gold)}
.rg.today b{color:var(--gold);font-weight:700}
.rg.fut i{background:var(--line)}
.rg.sun2 i{background:var(--line)}
.rg.sel i{box-shadow:0 0 0 2px var(--paper),0 0 0 4.5px var(--ink)}
.rg.sel b{background:var(--ink);color:var(--paper);border-radius:999px;padding:0 7px;font-weight:700}
.rg.today.sel b{background:var(--gold);color:var(--card)}
.pickbar{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:8px 12px;margin:-2px 0 12px;font-size:13px}
.pickbar button{margin-left:auto;border:0;background:var(--soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-weight:700;font-size:12.5px}
.okbar{display:flex;align-items:center;gap:8px;background:var(--soft);color:var(--accent);border-radius:14px;padding:11px 14px;margin:0 0 12px}
.okbar svg{width:20px;height:20px;flex:none}
.okbar b{font-size:16px}
.okbar span{margin-left:auto;font-size:12px;color:var(--muted)}
.plab em{font-style:normal;font-size:11.5px;font-weight:700;letter-spacing:.02em;color:#E2B874}
.dchips{display:flex;gap:8px;margin:0 0 12px}
.dc{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;border-radius:12px;padding:8px 6px;font-size:12.5px;font-weight:600;background:var(--card);color:var(--muted)}
.dc i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line);display:inline-block}
.dc svg{width:15px;height:15px}
.dc em{font-style:normal;font-size:11px;font-weight:700;color:var(--accent);background:var(--soft);border-radius:6px;padding:0 5px}
.dc.on{color:var(--accent);background:var(--soft)}
.dc.mid{color:var(--ink)}
.story .mode{margin-left:auto;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:rgba(255,255,255,.16)}
.story .mode.man{background:#E2B874;color:#1B2420}
.story .top .mode+button{margin-left:0}
.story .bars i.man{background:rgba(226,184,116,.35)}
.story .nextcue{position:absolute;right:16px;bottom:44px;font-size:12.5px;font-weight:700;color:#E2B874}
.story .rulechip{position:relative;margin:10px 14px 0;align-self:flex-start;font-size:11.5px;font-weight:700;color:#1B2420;background:#fff;border-radius:6px;padding:2px 8px}
.story.plain{background:#F4EFE3;color:#1B2420}
.story.plain .bg{display:none}
.story.plain .bars i{background:rgba(0,0,0,.12)}.story.plain .bars i b{background:#2C5C52}
.story.plain .top,.story.plain .top button{color:#1B2420}
.story.plain .lab{color:#6b5a3a}
.story.plain h4{color:#1B2420;font-size:24px}
.story.plain p.tx{color:#2A2318}
.story.plain .vq2{background:#fff;border-left-color:#7A4C0C}
.story.plain .vq2 blockquote{color:#1B2420}
.story.plain .vq2 figcaption,.story.plain .vref{color:#7A4C0C}
.story.plain .tip2{color:rgba(0,0,0,.45)}
.story.plain .mode{background:rgba(0,0,0,.08)}
.vq2{margin:0;background:rgba(255,255,255,.1);border-left:3px solid #E2B874;border-radius:4px 12px 12px 4px;padding:10px 14px 10px}
.vq2 figcaption{font:700 11.5px var(--f-ui);color:#E2B874;margin-bottom:4px}
.vq2 blockquote{margin:0;font:600 16px/1.75 var(--f-text);color:#fff}
.vq2.big blockquote{font-size:19px;line-height:1.65}
.vref{margin-top:6px;border:0;background:none;padding:0;font:700 12px var(--f-ui);color:#E2B874;text-decoration:underline;text-underline-offset:3px}
.vs2{display:grid;gap:10px}
.vs2>div{border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.09)}
.vs2 blockquote{margin:4px 0 2px;font:600 16px/1.65 var(--f-text);color:#fff}
.vs2 u{text-decoration:none;color:#E2B874}
.vs2 small{font-size:11.5px;color:rgba(255,255,255,.65)}
.who{display:inline-block;font:700 11.5px var(--f-ui);border-radius:6px;padding:1px 8px}
.who.a{background:#cfd8e8;color:#1f2f47}.who.b{background:#E2B874;color:#3a2a10}
.vs2>div:first-child{margin-right:22px}.vs2>div:last-child{margin-left:22px}
.vsheet{position:absolute;left:0;right:0;bottom:0;max-height:62%;overflow:auto;background:#fff;color:#1B2420;border-radius:20px 20px 0 0;padding:14px 18px 18px;z-index:3}
.vsh{display:flex;align-items:center;font-size:15px}.vsh button{margin-left:auto;border:0;background:none;color:#1B2420}
.vsb p{margin:6px 0;font:400 15.5px/1.85 var(--f-text)}.vsb p.on{background:rgba(226,184,116,.35);border-radius:6px;padding:2px 6px}
.vsb sup{font:600 10px var(--f-ui);color:#6b7570;margin-right:3px}
.vnote{margin:10px 0 0;font-size:12.5px;color:#6b7570}
.story.vopen .bars b{transition:none}
.plan2{border:1px dashed var(--line);background:transparent}
.pager{display:flex;justify-content:space-between;gap:10px;max-width:390px}
.pager button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px;font-weight:600;font-size:14px}
.pager button:disabled{opacity:.4;cursor:default}

/* ===== 휴대폰 ===== */
.phone{position:relative;width:100%;max-width:390px;height:780px;max-height:calc(100dvh - 40px);min-height:620px;border-radius:34px;background:var(--paper);box-shadow:0 0 0 10px #1b201d,0 18px 40px -10px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;touch-action:pan-y}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 16px 20px;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 4px 10px}
.tabs span{display:grid;justify-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tabs span svg{width:23px;height:23px}
.tabs span.on{color:var(--accent)}
.appbar{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.appbar b{font:700 20px var(--f-disp)}
.appbar small{font-size:12px;color:var(--muted)}
.appbar .ic{margin-left:auto;display:flex;gap:14px;color:var(--ink)}
.appbar .ic svg{width:21px;height:21px}
/* 날짜 고리 */
.rings{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:2px 16px 4px}
.rings::-webkit-scrollbar{display:none}
.rg{flex:none;display:grid;justify-items:center;gap:4px;font-size:11.5px;color:var(--muted)}
.rg i{position:relative;width:60px;height:60px;border-radius:50%;padding:3px;display:block}
.rg i img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:2px solid var(--paper)}
.rg.read i{background:var(--accent)}
.rg.today i{background:var(--accent);box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--accent)}
.rg.today{color:var(--accent);font-weight:700}
.rg.fut i{background:var(--line)}
.rg.fut i img{opacity:.75}
.rg.sun i{background:var(--gold)}
.rg.miss i{background:var(--line)}
.ringA .rg.miss i{background:none;border:2px dashed #9AA6A0;padding:1px}
.ringB .rg.miss i{background:var(--warn)}
.ringB .rg.miss b{color:var(--warn)}
.rg em{position:absolute;right:-1px;bottom:-1px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;border:2px solid var(--paper)}
.rg b{font-weight:inherit}
/* 오늘 */
.th{display:grid;gap:2px;margin-bottom:12px}
.th small{font-size:12.5px;color:var(--muted)}
.th h2{margin:0;font:700 26px/1.3 var(--f-disp);text-wrap:balance}
.th p{margin:0;font:600 13.5px var(--f-ui);color:var(--gold)}
.cta{display:grid;gap:2px;width:100%;border:0;border-radius:16px;padding:15px 18px;background:var(--accent);color:var(--accent-ink);text-align:left;margin-bottom:12px}
.cta b{font-size:17px;display:flex;align-items:center;gap:8px}
.cta b svg{width:20px;height:20px;margin-left:auto}
.cta small{font-size:12.5px;opacity:.85}
.steps3{display:flex;gap:6px;margin:-4px 0 12px;font-size:12px;color:var(--muted)}
.steps3 span{flex:1;display:grid;gap:4px}
.steps3 span::before{content:"";height:4px;border-radius:4px;background:var(--line)}
.steps3 span.done::before{background:var(--accent)}
.steps3 span.now::before{background:linear-gradient(90deg,var(--accent) 45%,var(--line) 45%)}
.steps3 span.now{color:var(--ink);font-weight:700}
.photo{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/3;max-width:100%;margin-bottom:14px;background:#222}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.guide{font:500 16px/1.8 var(--f-text);margin:0 2px 12px}
.kept{background:var(--card);border-radius:18px;padding:16px 18px;margin-bottom:12px;display:grid;gap:8px}
.kept small{font-size:12.5px;color:var(--muted)}
.kept q{quotes:"“" "”";font:500 17px/1.75 var(--f-text)}
.kept span{font-size:12.5px;font-weight:700;color:var(--gold)}
.till{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:14px;padding:11px 14px;margin-bottom:12px;font-size:13.5px}
.till b{margin-left:auto;font-variant-numeric:tabular-nums;font-size:16px;color:var(--accent)}
.done-row{display:flex;gap:8px;margin-bottom:12px}
.done-row button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px;font-size:13.5px;font-weight:600}
.coach{position:absolute;inset:0;background:rgba(10,16,13,.55);display:flex;flex-direction:column;justify-content:flex-start;padding:236px 16px 0;z-index:5}
.coach .cta{box-shadow:0 0 0 4px rgba(255,255,255,.9)}
.coach .tip{background:var(--card);border-radius:16px;padding:14px 16px;font-size:14.5px;line-height:1.6}
.coach .tip b{display:block;font-size:16px;margin-bottom:2px}
.coach .tip button{margin-top:10px;border:0;background:none;color:var(--muted);font-size:13px;padding:0}
/* 접힌 고리 줄 */
.fold{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:9px 12px;margin:0 0 12px;font-size:13.5px}
.fold i{width:26px;height:26px;border-radius:50%;padding:2px;background:var(--accent);flex:none}
.fold i img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:1.5px solid var(--card)}
.fold b{font-weight:700}
.fold span{color:var(--muted)}
.fold svg{width:18px;height:18px;margin-left:auto;color:var(--muted)}
/* 본문 */
.rd{background:var(--card);border-radius:18px;padding:18px 18px 22px}
.rd h2{margin:0;font:700 24px/1.3 var(--f-disp)}
.flow{display:flex;align-items:center;gap:6px;margin:6px 0 12px;font-size:13px;color:var(--muted)}
.flow b{color:var(--ink);font-weight:700}
.flow svg{width:15px;height:15px}
.flowB{margin:8px 0 12px}
.flowB p{margin:0 0 6px;font-size:13px;color:var(--muted)}
.flowB p b{color:var(--ink)}
.chips{display:flex;gap:6px;margin-bottom:14px}
.chips span{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--soft);color:var(--accent)}
.rd h3{margin:4px 0 2px;font:700 19px var(--f-disp);color:var(--accent)}
.rd h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.vs{font:400 17px/1.95 var(--f-text);margin:0;word-break:keep-all}
.vs sup{font:600 10px var(--f-ui);color:var(--muted);margin-right:2px}
.resume{display:inline;background:linear-gradient(transparent 60%,rgba(226,184,116,.45) 60%)}
.fadeout{position:relative;height:60px;margin-top:-60px;background:linear-gradient(transparent,var(--card))}
.rd .cta{margin:16px 0 0}
.mark{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--warn);font-weight:700;margin:2px 0 8px}
/* 스토리 */
.story{position:absolute;inset:0;background:var(--night);color:#fff;z-index:4;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
.story .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.42) saturate(.9)}
.story .bars{position:relative;display:flex;gap:3px;padding:12px 12px 0}
.story .bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.story .bars i b{display:block;height:100%;width:0;background:#fff}

    <section class="sec"><button class="row"><i>${sv("church",18)}</i><b>우리 교회 함께 읽기<small>교회 일정으로는 오늘 사무엘상 24–26장</small></b>${sv("chev",18)}</button></section>`;
  }
  return `<div class="scr">${h}</div>${tabs("rec")}`;
}
/* 스토리 모음: 지도 단추 왼쪽 '스토리' 단추로 엶 */
const LIB=[[96,"4월 6일","사무엘상 24–26장","두 번의 기회, 한 번의 분노","g06_06"],[59,"2월 28일","신명기 9–11장","깨뜨린 판, 처음과 같은 판","g03_09"],[58,"2월 27일","신명기 5–8장","배부를 때 기억할 것","g05_02"],[57,"2월 26일","신명기 1–4장","죽게 된 세대, 살아 남은 너희","g19_15"],[56,"2월 25일","민수기 34–36장","두 번 들린 '말이 옳다'","g19_14"],[55,"2월 24일","민수기 31–33장","다시 땅을 본 사람들","g03_09"],[54,"2월 23일","민수기 26–30장","다시 센 회중, 남은 두 사람","g05_02"],[53,"2월 22일","민수기 22–25장","복을 받은 백성, 회막 문의 두 사람","g19_15"]];
function lib(){
  const q=(st.libq||"").trim(), L=LIB.filter(x=>!q||(x[2]+x[3]).includes(q));
  const h=`<div class="libtop"><button data-go="0" aria-label="닫기">${sv("x",22)}</button><b>스토리 모음</b></div><input id="libq" class="libq" type="search" placeholder="책 이름, 장, 낱말로 찾기 (예: 신명기, 다윗)" value="${q.replace(/"/g,"&quot;")}"><div class="libchips">${["전체","사무엘상","신명기","민수기"].map(x=>`<button data-libq="${x==="전체"?"":x}" class="${(q||"전체")===x?"on":""}">${x}</button>`).join("")}</div><div class="libgrid">${L.map(([n,d,r,t,im])=>`<button class="libc" data-go="2"><span class="libimg"><img alt="" src="${IMG[im]}"><em>${n}일째</em></span><b>${t}</b><small>${r} · ${d}</small></button>`).join("")||`<p style="color:var(--muted)">'${q}'가 들어간 스토리가 없습니다. 책 이름이나 다른 낱말로 찾아 보세요.</p>`}</div>`;
  return `<div class="scr">${h}</div>${tabs("qt")}`;
}
/* 결정이 필요한 곳: 두 안을 나란히 */
function decide(){ return ""; }
function mini(v){ return `<div class="rings ring${v}" style="margin:0;padding:0;gap:8px">${RINGS.slice(1,6).map(([d,w,c,im])=>`<div class="rg ${c}" style="font-size:10px"><i style="width:40px;height:40px;padding:2px"><img alt="" src="${IMG[im]}">${c==="read"&&v==="B"?`<em style="width:15px;height:15px;font-size:9px">✓</em>`:""}</i><b>${w}</b></div>`).join("")}</div>`; }

/* 그리기 */
let timer=null, clockT=null;
function draw(){
  clearInterval(timer); clearInterval(clockT);
  const s=S[cur];
  document.getElementById("nav").innerHTML=S.map((x,i)=>`<button role="tab" aria-selected="${i===cur}" data-i="${i}"><small>${i+1}</small>${x.t}</button>`).join("");
  document.getElementById("states").innerHTML=s.states.map(([k,t])=>`<button role="tab" aria-selected="${st[s.k]===k}" data-st="${k}">${t}</button>`).join("");
  const P=document.getElementById("phone");
  P.innerHTML=s.k==="today"?today():s.k==="read"?read():s.k==="story"?story():s.k==="note"?note():s.k==="lib"?lib():rec();
  document.getElementById("side").innerHTML=`<div class="box"><h2>${s.t} · 지금 v2와 달라진 점</h2><ul>${CH[s.k].map(x=>`<li>${x}</li>`).join("")}</ul></div>`+decide()+`<div class="box"><h2>넣지 않은 것</h2><ul><li>스토리 수동 넘김 기본값, 주간 일정표형 날짜, '이야기 따라 읽기' 같은 풀어 쓴 이름</li><li>카드 역할 유형 나누기, '본문에서 찾기'를 읽기 직후로 옮기기</li><li>안심시키는 문구</li><li>기록 탭의 지도 칸</li></ul></div>`+`<div class="box plan2"><h2>다음(2차) 예정</h2><ul><li>성격이 다른 회차 셋에 같은 규칙을 적용해 봅니다: 장면 전환이 많은 역사서, 대화·논쟁이 중심인 복음서, 긴 글을 읽는 서신서.</li><li>넘김 규칙(자동 / 눌러서 넘김)과 표현 규칙 (가)(나)(다)가 세 회차에서도 그대로 통하는지 봅니다.</li></ul></div>`;
  document.getElementById("prev").disabled=cur===0; document.getElementById("next").disabled=cur===S.length-1;
  try{ history.replaceState(null,"","#"+s.k); }catch(e){}
  if(s.k==="story") runStory();
  
  P.querySelectorAll("[data-go]").forEach(a=>a.onclick=e=>{ e.preventDefault(); cur=+a.dataset.go; draw(); });
  const li=document.getElementById("libq"); if(li){ li.oninput=()=>{ st.libq=li.value; const pos=li.selectionStart; draw(); const l2=document.getElementById("libq"); l2.focus(); try{ l2.setSelectionRange(pos,pos); }catch(e){} }; }
}
function runClock(){ const el=document.getElementById("clock"); const f=()=>{ const n=new Date(), m=new Date(n); m.setHours(24,0,0,0); let d=Math.max(0,Math.floor((m-n)/1000)); const p=x=>String(x).padStart(2,"0"); if(el) el.textContent=`${p(Math.floor(d/3600))}:${p(Math.floor(d%3600/60))}:${p(d%60)}`; }; f(); clockT=setInterval(f,1000); }
function runStory(){
  const root=document.getElementById("story"); ["gesturestart","gesturechange"].forEach(t=>root.addEventListener(t,e=>e.preventDefault()));
  root.addEventListener("touchmove",e=>{ if(e.touches.length>1) e.preventDefault(); },{passive:false});
  const body=document.getElementById("sbody"), bg=document.getElementById("sbg"), bars=[...root.querySelectorAll(".bars b")], mode=document.getElementById("smode"), cue=document.getElementById("scue"), rule=document.getElementById("srule"), vs=document.getElementById("vsheet");
  let i=st.story==="resume"?4:0, t=0, paused=false, sheet=false; const DUR=7000, step=100;
  const show=()=>{ const C=CARDS[i]; body.innerHTML=C.html; root.classList.toggle("plain",!!C.plain); bg.style.backgroundImage=C.plain?"none":`url(${IMG[C.img]})`; bars.forEach((b,k)=>b.style.width=k<i?"100%":"0%"); t=0;
    mode.textContent=C.m?"눌러서 넘김":"자동"; mode.className="mode"+(C.m?" man":""); cue.hidden=!C.m||i===CARDS.length-1;
    rule.hidden=!C.rule&&!C.other; rule.innerHTML=(C.rule?`표현 규칙 (${C.rule})`:"")+(C.other?` · ${C.other}`:"");
    const g=body.querySelector(".go"); if(g) g.onclick=e=>{ e.stopPropagation(); cur=3; draw(); };
    body.querySelectorAll("[data-verse]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); sheet=true; vs.hidden=false; root.classList.add("vopen"); }); };
  show();
  document.getElementById("vclose").onclick=e=>{ e.stopPropagation(); sheet=false; vs.hidden=true; root.classList.remove("vopen"); };
  vs.addEventListener("pointerdown",e=>e.stopPropagation()); vs.addEventListener("pointerup",e=>e.stopPropagation());
  timer=setInterval(()=>{ if(paused||sheet) return; const C=CARDS[i]; if(C.m){ bars[i].style.width="100%"; return; } t+=step; bars[i].style.width=Math.min(100,t/DUR*100)+"%"; if(t>=DUR&&i<CARDS.length-1){ i++; show(); } },step);
  let down=0, held=false, hT=null;
  root.addEventListener("pointerdown",e=>{ if(e.target.closest("button")||sheet) return; down=Date.now(); held=false; hT=setTimeout(()=>{ held=true; paused=true; root.classList.add("paused"); },260); });
  const up=e=>{ clearTimeout(hT); if(held){ paused=false; root.classList.remove("paused"); held=false; return; } if(!down||e.target.closest("button")||sheet) return; down=0; const r=root.getBoundingClientRect(); if(e.clientX-r.left<r.width*.3){ i=Math.max(0,i-1); } else { i=Math.min(CARDS.length-1,i+1); } show(); };
  root.addEventListener("pointerup",up); root.addEventListener("pointerleave",()=>{ clearTimeout(hT); if(held){ paused=false; root.classList.remove("paused"); held=false; } });
  const sp=document.getElementById("spause"); sp.onclick=()=>{ paused=!paused; root.classList.toggle("paused",paused); };
  const sf=document.getElementById("sfirst"); if(sf) sf.onclick=()=>{ i=0; show(); document.getElementById("stoast").remove(); };
  const ts=document.getElementById("stoast"); if(ts) setTimeout(()=>{ if(ts.isConnected) ts.remove(); },4500);
}
document.addEventListener("click",e=>{
  const n=e.target.closest("#nav [data-i]"); if(n){ cur=+n.dataset.i; draw(); return; }
  const sb=e.target.closest("#states [data-st]"); if(sb){ st[S[cur].k]=sb.dataset.st; draw(); return; }
  const rb=e.target.closest("[data-ring]"); if(rb){ ring=rb.dataset.ring; draw(); return; }
  const lb=e.target.closest("[data-lib]"); if(lb){ cur=S.findIndex(x=>x.k==="lib"); draw(); return; }
  const lq=e.target.closest("[data-libq]"); if(lq){ st.libq=lq.dataset.libq; draw(); return; }
  const ss=e.target.closest("[data-st-set]"); if(ss){ st.today=ss.dataset.stSet; draw(); return; }
  const nx=e.target.closest("[data-next]"); if(nx){ const m={start:1,first:1,read:1,readdone:2,story:2,note:3,done:1,pick:1}[st.today]; if(m===2) st.story="resume"; cur=m; draw(); return; }
});
document.getElementById("prev").onclick=()=>{ if(cur>0){ cur--; draw(); } };
document.getElementById("next").onclick=()=>{ if(cur<S.length-1){ cur++; draw(); } };
/* 휴대폰 안에서 좌우로 밀면 화면 넘김(스토리 화면은 카드 넘김이 따로 있음) */
(()=>{ const P=document.getElementById("phone"); let x0=null,y0=0;
  P.addEventListener("touchstart",e=>{ if(S[cur].k==="story"){ x0=null; return; } x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  P.addEventListener("touchend",e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){ if(dx<0&&cur<S.length-1) cur++; else if(dx>0&&cur>0) cur--; draw(); } x0=null; },{passive:true}); })();
window.addEventListener("hashchange",()=>{ const i=S.findIndex(s=>s.k===location.hash.slice(1)); if(i>=0&&i!==cur){ cur=i; draw(); } });
draw();
</script>
</body></html>
