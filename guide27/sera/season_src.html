<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세라핌 · 절기 작업대</title>
<!-- 2026-11-24 목사님: 통독표 작업대에 세라핌용·절기용 작업대를 더함. 한 회 = A4 한 장(앞뒤 4쪽). 원고는 season.json(공개), 기도제목은 이 기기에만 저장(공개 파일에 이름이 올라가지 않게). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Noto+Serif+KR:wght@300;400;700&display=swap">
<style>
/* ── 작업대 화면 ── */
:root{--bg:#F6F5F2;--panel:#fff;--ink:#1a1a1a;--mute:#6b6b6b;--line:#dcdad5;--acc:#5B3E8A}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body.ws{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;font-size:14px;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0 6px 0 0}
.tabs{display:flex;gap:2px;background:#eee;border-radius:8px;padding:2px}
.tabs a{font-size:13px;padding:4px 10px;border-radius:6px;color:#444;text-decoration:none;white-space:nowrap}
.tabs a.on{background:#fff;color:#000;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.15)}
header .sp{flex:1}
button,select,input,textarea{font:inherit}
button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff;max-width:340px}
#status{font-size:12px;color:var(--mute)}
main{flex:1;display:flex;min-height:0}
#form{width:470px;flex:none;overflow:auto;padding:12px 14px 60px;border-right:1px solid var(--line);background:var(--panel)}
#prev{flex:1;overflow:auto;padding:14px;background:#e4e2dd}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 12px;padding:8px 10px 10px}
legend{font-weight:700;font-size:13px;padding:0 4px;color:var(--acc)}
label.f{display:block;margin:6px 0}
label.f .k{display:block;font-size:12px;color:#333;margin-bottom:2px}
label.f .k small{color:var(--mute);font-weight:400}
input[type=text],input[type=number],input[type=date],textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:#fff}
textarea{min-height:56px;resize:vertical;line-height:1.5}
.row{display:flex;gap:8px}.row>*{flex:1}
.hint{font-size:11.5px;color:var(--mute);line-height:1.5;margin:2px 0 4px}
.tok{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0}
.tok button{font-size:11.5px;padding:1px 7px}
.weeks{display:flex;flex-direction:column;gap:3px;margin:6px 0}
.weeks button{text-align:left;font-size:12.5px;padding:4px 8px;display:flex;gap:8px}
.weeks button b{min-width:52px}
.weeks button.on{border-color:var(--acc);background:#f3effa}
.empty{padding:40px;text-align:center;color:#666;font-size:14px;line-height:1.8}
#warn{font-size:12px;line-height:1.5;margin:0 0 10px;padding:6px 9px;border-radius:6px;display:none}
#warn.bad{display:block;background:#fdecec;color:#a11}
#warn.ok{display:block;background:#eaf5ee;color:#25643c}
dialog{border:1px solid var(--line);border-radius:10px;max-width:520px;width:92%}
dialog h3{margin:0 0 8px}
.pv .pg{margin:0 auto 14px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.18)}
#printroot{position:fixed;left:-10000px;top:0;visibility:hidden}
.a5prev{display:grid;grid-template-columns:148mm 148mm;gap:0;justify-content:center;row-gap:14px}
.a5prev .p5{background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.18)}
.a5prev .gap{width:148mm;height:210mm}
.a5w .x2{display:flex;width:297mm;height:210mm;page-break-after:always;overflow:hidden;background:#fff}
.a5w .x2 .p5,.a5w .x2 .p5.r{padding:9mm 10mm 10mm 10mm;page-break-after:auto;flex:none}
.a5w .x2 .bx5{height:191mm}
.a5w .x2 .pn,.a5w .x2 .rn{bottom:4mm}
.a5w .x2 .p5 .pn{left:10mm}.a5w .x2 .p5.r .pn{left:auto;right:10mm}
.a5w .x2 .b1{display:block!important}
.x2prev .x2{margin:0 auto 14px;box-shadow:0 1px 6px rgba(0,0,0,.18)}
.fmt{display:flex;gap:6px;align-items:center;font-size:12px}
.fmt input{width:46px}
@media print{
 body.ws>header,body.ws>main,dialog{display:none!important}
 #printroot{position:static;visibility:visible}
 html,body{background:#fff;height:auto}
 body.ws{display:block}
}
/* ── 보기(청년부 나눔용) ── */
body.vw{background:#e9e9e9;margin:0}
.bar{position:sticky;top:0;z-index:9;background:#222;color:#fff;font-family:"Noto Sans KR",sans-serif;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bar button{font-size:13px;border:1px solid #666;background:#333;color:#fff;border-radius:6px;padding:4px 10px;line-height:1.3;text-align:left}
.bar button small{display:block;font-size:10px;opacity:.7}
.bar button.on{background:#fff;color:#222}
.bar .pr{margin-left:auto;background:#5B3E8A;border-color:#5B3E8A;font-weight:700}
.bar .tip{width:100%;font-size:12px;opacity:.8;margin-top:2px}
body.vw .wk .pg{margin:14px auto;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.2)}
.prow span:empty::before{content:"이름";color:#ccc}
@media print{body.vw{background:#fff}.bar{display:none}body.vw .wk .pg{margin:0;box-shadow:none}[contenteditable]:focus{background:none}.prow span:empty::before{content:none}}
</style><style id="pgsz">@page{size:A4;margin:0}</style><style>
/* ── 한 장(A4 앞뒤 4쪽) — guide27/sera/build.py와 같은 모양 ── */
.sheet{font-family:"Noto Serif CJK KR","Noto Serif KR",serif;color:#222;font-size:10.4pt;line-height:1.62;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet *{box-sizing:border-box;margin:0;padding:0}
/*SHEETCSS*/
/* ── 가이드북 A5(8쪽) — guide27/sera/a5.py와 같은 모양 ── */
.a5w{font-family:"Noto Serif CJK KR","Noto Serif KR",serif;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.a5w *{box-sizing:border-box;margin:0;padding:0}
/*A5CSS*/
</style>
</head>
<body>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const COLORS=[['대림절 · 사순절 보라','#5B3E8A','#EEE9F5'],['성탄절 · 성령강림 빨강','#9B2C2C','#F6E9E7'],['송구영신 · 부활절 금','#9A7419','#F6F0E0'],['평소 먹색','#3F3F3F','#EEEEEE'],['초록','#2E7D4F','#E6F2EA'],['파랑','#1F5FA8','#E6EEF8']];
const WD='일월화수목금토';
/* ── 글 꾸밈: **굵게** {형광펜} {동그라미} {물결 밑줄} {괄호} {네모} ── */
function inl(s){ s=esc(s);
  s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  s=s.replace(/\{(형광펜[^}]*)\}/g,'<span class="hl">$1</span>').replace(/\{(동그라미[^}]*)\}/g,'<span class="ci">$1</span>').replace(/\{(물결 밑줄[^}]*)\}/g,'<span class="wv">$1</span>').replace(/\{(괄호[^}]*)\}/g,'<span class="br">[$1]</span>').replace(/\{(네모[^}]*)\}/g,'<span style="border:.35mm solid #222;padding:0 1mm">$1</span>');
  return s; }
const lines=(n,c='ln')=>Array.from({length:n},()=>`<div class="${c}"></div>`).join('');
const L=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
function dateOf(w){ const d=new Date((w.ymd||'2026-01-01')+'T00:00:00'); return {m:d.getMonth()+1,d:d.getDate(),wd:WD[d.getDay()],str:`${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`}; }
function tl(s){ const m=s.match(/^(★|✓)?\s*([^|]+?)\s*\|\s*(.*)$/); return m?{star:!!m[1],tool:m[2],text:m[3]}:{star:false,tool:'',text:s}; }
const mapBlock=w=>String(w.map||'').trim()?`<div class="map"><img src="${esc(String(w.map).trim())}" alt="지도"><div class="mcap sans">${inl(w.mapcap||'')}</div></div>`:'';
const paras=w=>String(w.flow||'').split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);
const wordsOf=w=>L(w.words).map(x=>{const [a,...b]=x.split(/\s+—\s+|\s+-\s+/);return [a,b.join(' — ')]});
/* ── 네 쪽 그리기 ── */
function page1(w){ const D=dateOf(w);
  const hd=`<div class="hd sans"><div class="dt"><b><i>${D.m}/</i>${D.d}</b><small>${D.wd}요일</small></div><div class="tt"><b>${esc(w.title)}</b><span>${esc(w.sub)}</span></div><div class="lb"><b>${esc(w.label)}</b>${esc(w.season||'')}</div></div>
<div class="st sans"><span>성경 읽기 약 <b>${Math.max(1,Math.round((+w.vv||0)/7.5))}분</b></span><span></span></div>`;
  const flow=String(w.flow||'').split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean).map(p=>`<p>${inl(p)}</p>`).join('');
  const wds=L(w.words).map(x=>{const [a,...b]=x.split(/\s+—\s+|\s+-\s+/);return `<span><b>${inl(a)}</b> ${inl(b.join(' — '))}</span> `}).join('');
  const scn=L(w.scenes).map(s=>`<span class="sans">${esc(s)}</span>`).join('');
  const wdb=wds?`<div class="wd sans"><span class="k">말뜻</span>${wds}</div>`:'', mapb=mapBlock(w);
  const fm=mapb?`<div class="fm"><div>${flow}${wdb}</div>${mapb}</div>`:flow+wdb;
  const marks=L(w.marks).map(x=>{const k=tl(x);return `<div class="mk"><span class="chip sans">${esc(k.tool)}</span>${k.star?'<span class="rp sans">대표</span> ':''}${inl(k.text)}</div>`}).join('');
  const looks=L(w.looks).map(x=>{const k=tl(x);return `<p><span class="ck">${k.star?'✓':''}</span><span class="chip sans">${esc(k.tool)}</span><span>${inl(k.text)}</span></p>`}).join('');
  return `<section class="pg">${hd}
<div class="sec flow"><div class="sh sans"><span class="n">1</span>오늘의 흐름</div>${fm}</div>
<div class="sec"><div class="sh sans"><span class="n">2</span>성경 읽기<small>성경책을 펴고 읽으며 표시합니다</small></div><div class="scn">${scn}</div>${marks}</div>
<div class="sec"><div class="sh sans"><span class="n">3</span>눈여겨볼 것<small>✓ 표시한 것을 확인합니다</small></div><div class="lk">${looks}</div></div>
<div class="ft sans"><span>${esc(w.label)} · ${D.str}</span><span>1</span></div></section>`; }
/* 관찰 가/나, 성품 가/나(가는 말씀을 옮겨 적음), 적용 — 2027 가이드북 두 갈래와 같은 쓰임(11-24 목사님) */
const OG='<b>가와 나 가운데 하나를 골라</b> 바로 아래 칸에 적습니다. 시간이 남으면 다른 하나도 적어 봅니다.';
const GG='본문 관찰에서 <b>고른 쪽과 같은 쪽을 고르면</b> 관찰이 성품으로 이어집니다. 성품을 적은 뒤 적용으로 넘어갑니다.';
const josa=r=>/[2459]\s*$/.test(String(r))?'를':'을';
const obsOf=w=>(w.obs||[]).filter(x=>String(x||'').trim()).slice(0,2);
const godOf=w=>(w.god||[]).filter(g=>g&&(String(g.q||'').trim()||String(g.v||'').trim()||String(g.copy||'').trim())).slice(0,2);
const gBody=(g,nc)=>String(g.copy||'').trim()?`<div class="cp sans"><b>${esc(g.copy)}</b>${josa(g.copy)} 성경에서 찾아 옮겨 적어 보세요.</div><div class="cpl">${'<div class="ln"></div>'.repeat(nc)}</div><div class="gq">${inl(g.q)}</div>`:`<div class="v">${inl(g.v)}</div>${inl(g.q)}`;
const opB=(lab,body,n)=>`<div class="op"><div class="bx sans">${lab}</div><div>${body}</div></div><div class="ans">${'<div class="ln"></div>'.repeat(n)}</div>`;
const apB=(w,n)=>{ const a=w.apply||{}; return String(a.lead||'').trim()?`<div class="ap"><div class="apl sans">적용</div><div>${inl(a.lead)}${String(a.fu||'').trim()?`<div class="fu">→ ${inl(a.fu)}</div>`:''}</div></div><div class="ans">${'<div class="ln"></div>'.repeat(n)}</div>`:''; };
function page2(w){
  return `<section class="pg"><div class="sh sans"><span class="n">4</span>본문 관찰</div><div class="gd sans">${OG}</div>
<div class="qs">${obsOf(w).map((q,i)=>opB('가나'[i],inl(q),12)).join('')}</div><div class="ft sans"><span>${esc(w.title)}</span><span>2</span></div></section>`; }
function page3(w){
  return `<section class="pg"><div class="sh sans"><span class="n">5</span>하나님의 성품</div><div class="gd sans">${GG}</div>
<div class="qs">${godOf(w).map((g,i)=>opB('가나'[i],gBody(g,2),12)).join('')}${apB(w,12)}</div><div class="ft sans"><span>${esc(w.title)}</span><span>3</span></div></section>`; }
const wholeOf=w=>L(w.whole).map(x=>{const p=x.split('|').map(s=>s.trim());return {lab:p[0],ref:p[1]||'',text:p.slice(2).join(' | ')}});
function page4(w,edit,pray){ pray=pray||{};
  const wh=wholeOf(w), ce=edit?' contenteditable="true"':'';
  /* 성경 전체로는 큰 번호를 달지 않습니다. 오늘의 기도가 7번(11-24 목사님) */
  const whole=wh.length?`<div class="sec whole"><div class="sh sans">성경 전체로<small>${esc(w.whole_title||'오늘 본문이 성경의 다른 자리와 이어집니다')}</small></div>`+wh.map(x=>`<p><span class="chip sans">${esc(x.lab)}</span><span><b>${esc(x.ref)}</b>${inl(x.text)}</span></p>`).join('')+'</div>':'';
  const yv=L(pray.y).map(x=>x.replace(/\s*\|\s*/,' ').trim()), cv=L(pray.c);
  const yrows=Array.from({length:5},(_,i)=>`<div class="pln sans"${ce} data-k="y${i}">${esc(yv[i]||'')}</div>`).join('');
  const crows=Array.from({length:3},(_,i)=>`<div class="pln sans"${ce} data-k="c${i}">${esc(cv[i]||'')}</div>`).join('');
  return `<section class="pg"><div class="sh sans"><span class="n">6</span>해설<small>다 쓴 뒤에 읽고, 내 묵상과 비교해 봅니다</small></div><div class="note">${inl(w.note)}</div>${whole}
<div class="sec pr"><div class="sh sans"><span class="n">7</span>오늘의 기도</div>
<h4 class="sans">청년부 기도제목</h4>${yrows}<h4 class="sans">교회 기도제목</h4>${crows}</div><div class="ft sans"><span>${esc(w.title)}</span><span>4</span></div></section>`; }
const prayer4=pray=>{ const yv=L(pray&&pray.y).map(x=>x.replace(/\s*\|\s*/,' ').trim()), cv=L(pray&&pray.c);
  return `<div class="pr4"><div class="sh sans"><span class="n">7</span>오늘의 기도</div><h4 class="sans">청년부 기도제목</h4>`+Array.from({length:5},(_,i)=>`<div class="pln sans">${esc(yv[i]||'')}</div>`).join('')+'<h4 class="sans">교회 기도제목</h4>'+Array.from({length:3},(_,i)=>`<div class="pln sans">${esc(cv[i]||'')}</div>`).join('')+'</div>'; };
/* split: 8쪽용(관찰 2쪽, 성품 2쪽), 아니면 4쪽용(관찰 1쪽, 성품과 적용 1쪽) */
function qparts(w,nans,ncopy,split){
  const sh=(n,t,more)=>`<div class="sh sans" style="margin-top:0"><span class="n">${n}</span>${t}${more?'<small>이어서</small>':''}</div>`;
  const ob=obsOf(w).map((q,i)=>opB('가나'[i],inl(q),nans)), gb=godOf(w).map((g,i)=>opB('가나'[i],gBody(g,ncopy),nans)), ap=apB(w,nans);
  const o0=sh(4,'본문 관찰',0)+`<div class="gd sans">${OG}</div>`, g0=sh(5,'하나님의 성품',0)+`<div class="gd sans">${GG}</div>`;
  if(split) return {O:[o0+(ob[0]||''), sh(4,'본문 관찰',1)+ob.slice(1).join('')], G:[g0+(gb[0]||''), sh(5,'하나님의 성품',1)+gb.slice(1).join('')+ap]};
  return {O:[o0+ob.join('')], G:[g0+gb.join('')+ap]}; }
function sheet(w,edit,pray){ return `<div class="sheet wk" id="w${esc(w.key)}" style="--c:${w.color};--l:${w.light};--hl:#F3E6A0">${page1(w)}${page2(w)}${page3(w)}${page4(w,edit,pray)}</div>`; }
/* ── 가이드북 A5: 한 회 8쪽(읽기 2 · 관찰 2 · 성품 2 · 해설과 기도 2), 첫쪽이 짝수(왼쪽)면 관찰과 성품이 마주 봅니다 ── */
function a5parts(w,pray){ pray=pray||{}; const D=dateOf(w), A=[], Dn=[];
  A.push(`<div class="hd sans"><div class="dt"><b><i>${D.m}/</i>${D.d}</b><small>${D.wd}요일</small></div><div class="tt"><div class="lb">${esc(w.label)}${w.season?' · '+esc(w.season):''}</div><b>${esc(w.title)}</b><span>${esc(w.sub)}</span></div></div><div class="st sans">성경 읽기 약 <b>${Math.max(1,Math.round((+w.vv||0)/7.5))}분</b></div>`);
  A.push('<div class="sh sans"><span class="n">1</span>오늘의 흐름</div>');
  paras(w).forEach(p=>A.push(`<div class="blk"><p>${inl(p)}</p></div>`));
  const mb=mapBlock(w); if(mb) A.push(mb);
  const wd=wordsOf(w); if(wd.length) A.push('<div class="wd sans"><span class="k">말뜻</span>'+wd.map(([a,b])=>`<div><b>${inl(a)}</b> ${inl(b)}</div>`).join('')+'</div>');
  A.push('<div class="sh sans"><span class="n">2</span>성경 읽기<small>성경책을 펴고 읽으며 표시합니다</small></div>'); if(L(w.scenes).length) A.push('<div class="scn">'+L(w.scenes).map(s=>`<span class="sans">${esc(s)}</span>`).join('')+'</div>');
  L(w.marks).forEach(x=>{const k=tl(x);A.push(`<div class="mk"><span class="chip">${esc(k.tool)}</span>${k.star?'<span class="rp">대표</span>':''}${inl(k.text)}</div>`)});
  A.push('<div class="sh sans"><span class="n">3</span>눈여겨볼 것<small>✓ 표시한 것을 확인합니다</small></div>');
  L(w.looks).forEach(x=>{const k=tl(x);A.push(`<div class="lk"><span class="ck">${k.star?'✓':''}</span><span><span class="chip">${esc(k.tool)}</span>${inl(k.text)}</span></div>`)});
  Dn.push('<div class="sh sans" style="margin-top:0"><span class="n">6</span>해설<small>다 쓴 뒤에 읽고, 내 묵상과 비교해 봅니다</small></div>');
  Dn.push(`<div class="note">${inl(w.note)}</div>`);
  const wh=wholeOf(w);

/* ── 새 틀(11-25): 한 회 A5 4쪽. 체험판 하루 지면과 같은 쓰임 — guide27/sera/sera4.py와 같은 모양 ──

  <div class="weeks">${wl||'<div class="hint">아직 회가 없습니다.</div>'}</div>
  <div class="row"><button type="button" id="bAddW">＋ 새 회</button><button type="button" id="bDupW"${s.weeks.length?'':' disabled'}>이 회 복제</button><button type="button" id="bUpW"${WI>0?'':' disabled'}>↑</button><button type="button" id="bDelW"${s.weeks.length?'':' disabled'}>삭제</button></div></fieldset>`;
  const w=curW();
  if(w){ const ci=COLORS.findIndex(c=>c[1]===w.color);
    h+=`<div id="warn"></div>
  <fieldset><legend>머리</legend><div class="row">${F('ymd','날짜',w.ymd,{type:'date'})}${F('vv','절 수',w.vv,{type:'number',small:'읽기 시간'})}</div>
  <div class="row">${F('label','모임',w.label,{ph:'세라핌 청년 기도회'})}${F('season','절기 · 주제',w.season,{ph:'대림절 1 · 소망'})}</div>
  <div class="row">${F('title','본문',w.title,{ph:'이사야 7–12장'})}${F('sub','소제목',w.sub,{ph:'흑암에 비치는 큰 빛'})}</div>
  <label class="f"><span class="k"><b>색</b></span><select data-f="colorset">${COLORS.map((c,i)=>`<option value="${i}"${i===ci?' selected':''}>${c[0]}</option>`).join('')}${ci<0?'<option selected value="-1">지금 색 그대로</option>':''}</select></label></fieldset>
  <fieldset><legend>1쪽 · 읽기 전과 읽으며</legend>${F('flow','① 오늘의 흐름',w.flow,{area:1,rows:5,small:'빈 줄로 문단을 나눕니다'})}
  ${F('words','말뜻',w.words,{area:1,rows:3,small:'줄마다 「낱말 — 풀이」'})}
  <div class="row">${F('map','지도 그림',w.map||'',{small:'비우면 빠집니다',ph:'img/sera_1124_map.webp'})}${F('mapcap','지도 설명',w.mapcap||'',{ph:'**첫 선교여행**(13–14장) 실선은 가는 길, 점선은 돌아오는 길입니다.'})}</div>
  ${F('scenes','② 장면 단추',w.scenes,{area:1,rows:3,small:'줄마다 하나'})}
  ${F('marks','② 성경 읽기 — 표시',w.marks,{area:1,rows:5,small:'줄마다 「★ 도구 | 문장」, ★ = 대표',ph:'★ ◆ 반복 | 네 번 반복되는 말은 무엇입니까? 9:12, 17에서 찾아 {형광펜}으로 칠하세요.'})}${TOK}
  ${F('looks','③ 눈여겨볼 것',w.looks,{area:1,rows:6,small:'줄마다 「✓ 도구 | 문장」, ✓ = 표시 확인'})}</fieldset>
  ${F('struct','본문 구조(지도가 없을 때)',w.struct||'',{area:1,rows:5,small:'줄마다 「A | 이사야 7–8장 | 임마누엘의 징조」, 가운데는 X',ph:'A | 이사야 7–8장 | 임마누엘의 징조'})}
  <fieldset><legend>2–3쪽 · ④ 나의 묵상</legend><div class="hint">'마음에 남은 말씀'은 읽고 나서 바로 쓰는 칸이라 원고가 없습니다. 관찰은 본문의 사실을 끊어 쓰고 이유를 묻는 한 물음, 성품은 「장절 하나님은 ~분이십니다.」와 그 앞의 나를 묻는 물음, 적용은 "앞에서 떠올린 …"으로 이어받습니다.</div>
  <div class="row">${F('obs_ref','1 본문 관찰 · 장절',w.obs_ref||'',{ph:'14:22–23'})}</div>${F('obs','1 본문 관찰 · 물음',w.obs||'',{area:1,rows:3,small:'물음은 **굵게**',ph:'… 사도들은 제자들을 격려하고 장로들을 세웁니다. **왜 금식 기도 하며 그들을 주께 맡겼다고 생각합니까?**'})}
  ${F('god','2 하나님의 성품 · 장절과 성품',w.god||'',{area:1,rows:2,ph:'14:23, 27 하나님은 … 돌보시는 분이십니다.'})}${F('god_q','2 하나님의 성품 · 그 앞의 나(굵게 찍힘)',w.god_q||'',{area:1,rows:2,ph:'그 하나님 앞에서, …은 무엇입니까?'})}
  ${F('ap_lead','3 적용 · 이끄는 말과 물음',w.ap_lead||'',{area:1,rows:3,small:'물음은 **굵게**'})}${F('ap_fu','3 적용 · 이어 묻기(→)',w.ap_fu||'')}</fieldset>
  <fieldset><legend>4쪽 · ⑤ 쓴 뒤에 읽기</legend>${F('note','해설',w.note,{area:1,rows:8,small:'"하나님은 ~분입니다."로 맺습니다'})}
  ${F('whole_title','성경 전체로 — 머리글',w.whole_title,{ph:'오늘 본문이 성경의 다른 자리와 이어집니다'})}
  ${F('whole','성경 전체로',w.whole,{area:1,rows:6,small:'줄마다 「인용·약속·성취·주제·모형 | 참조 | 문장」, 번호 없이 찍힙니다. 4쪽에서 넘치면 행간을 줄이고, 그래도 넘치면 뒤에서부터 빠지니 중요한 것을 앞에 둡니다',ph:'성취 | 사 7:14 → 마 1:22–23 | …'})}</fieldset>
  <fieldset><legend>기도제목 — 이 기기에만 저장</legend><div class="hint">공개 원고(season.json)에는 올라가지 않습니다. 나눔 화면에서도 칸을 눌러 바로 쓸 수 있습니다.</div>
  <label class="f"><span class="k"><b>청년부</b> <small>줄마다 하나, 다섯 줄까지</small></span><textarea id="py" rows="4">${esc(prayOf(s.id,w.key).y)}</textarea></label>
  <label class="f"><span class="k"><b>교회</b> <small>줄마다 하나</small></span><textarea id="pc" rows="3">${esc(prayOf(s.id,w.key).c)}</textarea></label></fieldset>`; }
  f.innerHTML=h;
  f.querySelectorAll('[data-wi]').forEach(b=>b.onclick=()=>{WI=+b.dataset.wi;drawForm();drawPrev()});
  const A=$('bAddW'); if(A) A.onclick=()=>{ s.weeks.push(blankWeek(s.weeks[s.weeks.length-1])); WI=s.weeks.length-1; persist(); drawForm(); drawPrev(); };
  const Dp=$('bDupW'); if(Dp) Dp.onclick=()=>{ const c=JSON.parse(JSON.stringify(curW())); const n=blankWeek(curW()); c.ymd=n.ymd; c.key=n.key; s.weeks.splice(WI+1,0,c); WI++; persist(); drawForm(); drawPrev(); };
  const U=$('bUpW'); if(U) U.onclick=()=>{ const t=s.weeks[WI]; s.weeks[WI]=s.weeks[WI-1]; s.weeks[WI-1]=t; WI--; persist(); drawForm(); drawPrev(); };
  const X=$('bDelW'); if(X) X.onclick=()=>{ if(!confirm('이 회를 지울까요? GitHub에 저장하기 전까지는 공개 원고에 남아 있습니다.')) return; s.weeks.splice(WI,1); WI=Math.max(0,WI-1); persist(); drawForm(); drawPrev(); };
  f.querySelectorAll('[data-f]').forEach(el=>el.addEventListener('input',()=>{ const k=el.dataset.f, v=el.value, w=curW();
    if(k==='s:name'){ s.name=v; $('selSet').selectedOptions[0].textContent=v; }
    else if(k==='s:note') s.note=v;
    else if(k==='colorset'){ const c=COLORS[+v]; if(c){w.color=c[1];w.light=c[2]} }
    else if(k.startsWith('obs:')){ w.obs=w.obs||[]; w.obs[+k.slice(4)]=v; }
    else if(/^g[cvq]:/.test(k)){ w.god=w.god||[]; const i=+k.slice(3); w.god[i]=w.god[i]||{q:''}; w.god[i][({c:'copy',v:'v',q:'q'})[k[1]]]=v; }
    else if(k==='al'||k==='af'){ w.apply=w.apply||{lead:'',fu:''}; w.apply[k==='al'?'lead':'fu']=v; }
    else if(k==='ymd'){ w.ymd=v; w.key=v.slice(5).replace('-',''); }
    else w[k]=(k==='vv'||k==='youth'||k==='churchn')?+v:v;
    clearTimeout(saveT); saveT=setTimeout(()=>{persist();saveT=null},500); drawPrev(); }));
  ['py','pc'].forEach(id=>{ const el=$(id); if(el) el.addEventListener('input',()=>{ setPray(s.id,curW().key,{y:$('py').value,c:$('pc').value}); drawPrev(); }); });
  let last=null; f.addEventListener('focusin',e=>{ if(e.target.tagName==='TEXTAREA') last=e.target; });
  f.querySelectorAll('.tok button').forEach(b=>b.onclick=()=>{ const t=last; if(!t) return; const s0=t.selectionStart,e0=t.selectionEnd, tk=b.dataset.t; t.setRangeText(tk,s0,e0,'end'); t.focus(); t.dispatchEvent(new Event('input')); });
}
function drawPrev(){ const p=$('prev'), w=curW(), s=curSet();
  if(!w){ p.innerHTML='<div class="empty">왼쪽에서 회를 고르거나 ＋ 새 회를 누르세요.</div>'; return; }
  if(FMT.fmt==='a5'){ const st=FMT.start; p.innerHTML=`<div class="a5w a5prev">${st%2?'<div class="gap"></div>':''}</div>`; const box=p.firstElementChild;
    const bad=drawFour(box,w,prayOf(s.id,w.key),'one',st); box.querySelectorAll('.one').forEach(o=>{ while(o.firstChild) box.insertBefore(o.firstChild,o); o.remove(); }); box.style.zoom=Math.min(1,(p.clientWidth-30)/(2*559));
    const wn=$('warn'); if(wn){ wn.className=bad.length?'bad':'ok'; wn.textContent=bad.length?`넘치는 쪽: ${bad.join(', ')}쪽 — 글을 줄이세요.`:`A5 ${st}–${st+3}쪽에 맞습니다.`+fitMsg(bad)+(st%2?' 첫 쪽이 홀수라 1·2쪽이 마주 보지 않습니다.':''); }
    return; }
  p.innerHTML='<div class="a5w x2prev"></div>'; const box=p.firstElementChild; const bad=drawFour(box,w,prayOf(s.id,w.key),'x2',1);
  box.style.zoom=Math.min(1,(p.clientWidth-30)/1123);
  const wn=$('warn'); if(wn){ wn.className=bad.length?'bad':'ok'; wn.textContent=bad.length?`넘치는 쪽: ${bad.join(', ')}쪽 — 글을 줄이세요.`:'A5 4쪽(A4 가로 양면 한 장)에 맞습니다. 글자 크기는 가이드북 본문과 같습니다.'+fitMsg(bad); }
}
window.addEventListener('resize',()=>{ if(document.body.className==='ws') drawPrev() });
function doPrint(){ const s=curSet(); if(!s) return; const all=$('selPrint').value==='all'; const ws=all?s.weeks:[curW()].filter(Boolean);
  $('printroot').innerHTML='<div class="a5w"></div>'; const root=$('printroot').firstElementChild; const bad=[];
  ws.forEach((w,k)=>{ const b=drawFour(root,w,prayOf(s.id,w.key),FMT.fmt==='a5'?'one':'x2',FMT.start+4*k); if(b.length) bad.push(dateOf(w).m+'/'+dateOf(w).d+' '+b.join(',')+'쪽'); });
  if(FMT.fmt==='a5'){ $('pgsz').textContent='@page{size:148mm 210mm;margin:0}'; $('status').textContent=`${ws.length}회 · A5 ${ws.length*4}쪽(${FMT.start}쪽부터)${bad.length?' · 넘침 '+bad.join(' / '):''} — 용지 A5, 여백 없음, 배경 그래픽 켜기`; }
  else { $('pgsz').textContent='@page{size:297mm 210mm;margin:0}'; $('status').textContent=`${ws.length}회 · A4 가로 양면 ${ws.length}장${bad.length?' · 넘침 '+bad.join(' / '):''} — 용지 A4 가로, 여백 없음, 배경 그래픽 켜기, 양면은 짧은 쪽으로 넘기기`; }
  addEventListener('afterprint',()=>{$('pgsz').textContent='@page{size:A4;margin:0}'},{once:true});
  (document.fonts?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(()=>print(),200)); }
/* ── 인용 확인: 큰따옴표 속 말이 개역개정 어딘가에 그대로 있는지 ── */
let BIB=null;
async function bible(){ if(BIB) return BIB; if(!window.BIBLE_B64){ await new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='bible.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)}); }
  const bin=Uint8Array.from(atob(window.BIBLE_B64),c=>c.charCodeAt(0)); const B=JSON.parse(await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
  BIB=B.flat(2).join('').replace(/[\s,.?!·]/g,''); return BIB; }
async function checkQuotes(){ const w=curW(); if(!w) return; $('status').textContent='개역개정을 불러오는 중…';
  try{ const T=await bible(); const txt=JSON.stringify(w); const qs=[...txt.matchAll(/\\"([^"\\]+)\\"/g)].map(m=>m[1]);
    const bad=qs.filter(q=>!q.split('…').every(p=>T.includes(p.replace(/[\s,.?!·]/g,''))));
    const wn=$('warn'); wn.className=bad.length?'bad':'ok'; wn.innerHTML=bad.length?'개역개정에서 그대로 찾지 못한 따옴표 말 '+bad.length+'개 (이름 뜻풀이처럼 인용이 아닌 것은 그대로 두어도 됩니다):<br>'+bad.map(b=>'· '+esc(b)).join('<br>'):'따옴표 말 '+qs.length+'개가 모두 개역개정과 같습니다.'; $('status').textContent='인용 확인 끝';
  }catch(e){ $('status').textContent='개역개정을 불러오지 못했습니다'; } }
/* ── GitHub ── */
function wireGit(){ const tk=()=>{try{return localStorage.getItem('cbsr_git_token')||(JSON.parse(localStorage.getItem('cbsr_guide_git')||'{}').token)||''}catch(e){return ''}};
  const C={repo:'aqedah/CBSR',path:'app/site_src/season.json',branch:'source'};
  const api=`https://api.github.com/repos/${C.repo}/contents/${C.path}`;
  const b64=s=>btoa(unescape(encodeURIComponent(s))), unb64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
  const gm=(t,ok)=>{$('gMsg').textContent=t;$('gMsg').style.color=ok?'#2E7D4F':'#b00';$('status').textContent=t};
  $('bGit').onclick=()=>{ $('g_token').value=tk(); $('gMsg').textContent=''; $('dlgGit').showModal(); }; $('gClose').onclick=()=>$('dlgGit').close();
  const hdr=()=>{ const t=$('g_token').value.trim(); try{ if(t) localStorage.setItem('cbsr_git_token',t) }catch(e){} return {'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'} };
  $('gLoad').onclick=async()=>{ try{ const r=await fetch(api+'?ref='+C.branch,{headers:hdr()}); if(!r.ok) throw new Error(r.status); const j=await r.json(); DATA=JSON.parse(unb64(j.content)); LS.set(DK,DATA); const ss=sets(); if(!ss.find(s=>s.id===SID)) SID=(ss[0]||{}).id||null; WI=0; drawAll(); gm('GitHub에서 불러왔습니다.',true); }catch(e){ gm('불러오기 실패: '+e.message) } };
  $('gSave').onclick=async()=>{ if(!$('g_token').value.trim()){ gm('토큰 칸이 비어 있습니다. 가이드북 작업실의 GitHub 창에 넣은 토큰과 같은 것을 씁니다.'); return; }
    if(saveT){clearTimeout(saveT);persist();saveT=null}
    gm('저장하는 중…',true); try{ let sha, remote=null; const r0=await fetch(api+'?ref='+C.branch,{headers:hdr()}); if(r0.ok){ const j0=await r0.json(); sha=j0.sha; try{ remote=JSON.parse(unb64(j0.content)) }catch(e){} }
      /* 다른 기기에서 올린 묶음은 지우지 않고, 묶음마다 더 최근 것을 남김 */
      if(remote&&remote.sets){ for(const rs of remote.sets){ const ls=DATA.sets.find(s=>s.id===rs.id); if(!ls) DATA.sets.push(rs); else if((rs._u||0)>(ls._u||0)&&!confirm(`「${rs.name}」은 GitHub 쪽이 더 최근에 고쳐졌습니다. 이 기기의 것으로 덮을까요?`)) Object.assign(ls,rs); } }
      DATA.updated=new Date().toISOString().slice(0,10);
      const body={message:'세라핌·절기 작업대 원고 '+new Date().toISOString().slice(0,16),content:b64(JSON.stringify(DATA,null,1)),branch:C.branch}; if(sha) body.sha=sha;
      const r=await fetch(api,{method:'PUT',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify(body)}); if(!r.ok) throw new Error(r.status+' '+(await r.text()).slice(0,80));
      LS.set(DK,DATA); drawAll(); gm('GitHub에 저장됨 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' — 2~3분 뒤 사이트에 반영됩니다.',true);
    }catch(e){ gm('저장 실패: '+e.message) } };
}
(async()=>{ DATA=await loadData(); if(Q.get('view')!=null) viewer(Q.get('view')); else ws(); })();
